openapi: 3.1.0
info:
  title: 智慧物业后台 API
  version: 0.1.0
  summary: 原型 → 后台的接口契约（19 个域 142 个接口）
  description: |
    ## 这份契约是什么

    从原型（76 个可见路由、40 张数据表）里抽出的**可开工接口**，按业务域分批落地：

    - 第一批：业主（含房屋归属）→ 账单与缴费（含退款）→ 工单（含 SLA）
    - 第二批：租户（补充 / 核验 / 门禁 / 搬离）→ 巡检任务（执行 / 监督）→ 品质整改闭环
    - 第三批：报表快照（跑批产物）→ 月结（期间关账 / 反结）→ 合同 → 公告 → 员工档案 → 工资表 → 组织与权限
    - 第四批：**员工端专有**（移动端才有入口）—— 执行页聚合 / 开工打卡 / 巡检转工单 / 接单·转单·完工·回评 / 考勤本人确认与申诉 / 催收跟进
    - 第五批：**抢单与提成**—— 抢单（并发 409）/ 派单（三档）/ 到场 / 弃单 / 现场增项与业主确认 / 收款码与支付回调 / 我的提成（已结·在途）/ 维修价目 / 批量催缴 / 房屋在住人（租户·成员）
    - 第六批：**业主小程序（mp）**—— 微信授权与实名 / 绑定房产三态（0/1/N 套）/ 我的房产与账单（含不挂房的车位费）/ 报修下单（下单即见价）/ 待支付订单与模拟支付 / 工单详情与增项确认 / 评价。支付只到"待支付订单 + 模拟成功"，真回调在 `/mp/payments/{payId}/notify`（待补）

    共 129 个路径 / 142 个接口 / 207 个 schema。

    配套物：
    - `mock-server.mjs`：按本契约跑起来的假服务（`npm run mock`，端口 4010）
    - `contract-test.mjs`：契约测试（`npm test`），后端交付时用同一套断言验收
    - `enums.json`：枚举取值唯一来源（从 seed 数据生成）
    - `fixtures/*.json`：样例数据，可直接当初始化数据

    ## 三条通用约定（必须先对齐，否则联调天天对字段）

    1. **统一信封**：所有响应 `{ code, message, data }`，`code=0` 表示成功；
       失败时 `code` 用五位业务码（见「错误码」），HTTP 状态码同时给对（400/401/403/404/409/422/429/500）。
    2. **分页**：请求 `pageNo`（从 1 开始）+ `size`（1..100，超限 400）；响应 `data = { rows, total, pageNo, size }`。
       **列表默认按业务排序，不保证稳定**；需要稳定排序的接口在 description 里单独注明。
    3. **金额**：一律 `number`（单位元，两位小数），不用字符串、不用分。前端格式化由前端做。

    ## 权限与数据范围（最容易做成假隔离的地方）

    - 鉴权：`Authorization: Bearer <token>`，token 只带**身份**与角色，**不带数据范围**。
    - 数据范围在**查询时**由服务端计算（六档：全部项目 / 指定项目 / 本项目 / 本部门 / 责任范围 / 仅本人）。
    - 越权不是"返回空列表"，而是 **403 + code=40301**：拿别人 `communityId` 一传就能探测数据量，这是信息泄露。
    - 敏感字段（手机号 / 证件号 / 银行账号）：**列表接口只回掩码**（`138****8001`）并带 `*Redacted=true`；
      明文只能通过 `GET /owners/{id}` 这类"已授权看这一条"的接口拿，且需 `a.sensitive.view` 权限、写访问日志。

    ## 变更流程

    改契约 = 改这个文件 + 跑 `npm test` + 在 `CHANGELOG` 里记一行。后端已实现的接口不得静默改字段语义
    （加字段可以，改类型/改枚举值必须先通知前端）。
servers:
  - url: http://localhost:4010
    description: 本地假服务（npm run mock）
  - url: /api
    description: 联调环境前缀（生产由网关提供）
tags:
  - name: auth
    description: 登录与令牌
  - name: owners
    description: 业主（含房屋归属）
  - name: houses
    description: 房屋（只读引用）
  - name: bills
    description: 账单与批量操作
  - name: payments
    description: 缴费流水与退款
  - name: work-orders
    description: 工单与 SLA
  - name: tenants
    description: 在住人（业主维护、物业补充核验）
  - name: inspect
    description: 巡检任务（执行 / 监督）
  - name: rectify
    description: 品质整改闭环
  - name: quality
    description: 品质检查记录（结果台账）
  - name: mobile
    description: |
      员工端（App / H5）专用接口。

      这些接口的共同点：**PC 端没有对应入口**，只服务现场作业。
      为它们单独列一组，而不是塞进巡检 / 工单域，原因有两个：
      1. 权限模型不同 —— 一线角色没有 `f.inspect.view` 之外的任何后台权限，
         靠"把 PC 接口开给移动端"是开不出来的；
      2. 数据形态不同 —— 移动端要的是**一次请求拿全一屏**（任务 + 模板 + 责任人候选），
         而 PC 是分三次查，合并反而拖慢后台列表。

      新增能力位（PC 的 72 个权限码里没有）：
      `c.notices.read` / `c.attendance.self` / `c.payroll.self` /
      `f.approval.handle` / `f.wo.dispatch` / `f.rectify.recheck`。
  - name: mp
    description: |
      业主小程序（H5 / 微信小程序）专用接口。

      与 `mobile`（员工端）的区别不是端，而是**视角**：
      员工关心"这单派给谁、到没到场、提成多少"，业主只关心
      "我要交多少钱、我报的单到哪一步了、这单为什么多收了 80"。

      所以这一组刻意**不含**：工单池 / 抢单 / 派单 / 审批 / 催缴 / 收银台 / 日结 / 发票 / 退款。
      那些是物业侧与财务侧的能力，出现在业主端就是越权入口。

      三条与 `mobile` 共享的口径（不共享就会两端各说各话）：
      - 价目只有一份（`repairPrices.json`），业主下单页与员工现场增项读同一个源；
      - 增项的唯一形状是 `workOrders[].addons[]`，确认后**合并进本单总额**；
      - 支付只认「已支付」这一个结论，`/mp/payments/{payId}/simulate` 是演示替身。
  - name: neighbor
    description: |
      邻里运营（PC 第 68 批）。移动端只承接「离开手机做不了」的四件事：
      审闲置、处理举报、看活动、代客报名。发布类与投票一律留在 PC。
  - name: listings
    description: |
      租售信息（A 域 · PC 第 69 批）。**只做信息发布**，物业全程不参与撮合与成交。

      分水岭只有一条：是否参与撮合与成交。一旦出现"经纪人 / 带看 / 佣金 / 成交价"，
      性质就从物业服务变成房地产经纪，需要《房地产经纪机构备案表》，微信类目也要换。

      三组接口，边界写在路径上：
      - `/public/listings/*` **免登录**，只回公开字段（房号、业主信息、楼管手机号一律不出）；
      - `/listings/*` 后台，需 `a.listings.view` / `.audit` / `.viewing`；
      - 审核人是**该房的责任楼管**，不是"审核员"角色，超 24 小时升直属上级。

  - name: employees
    description: |
      员工档案（人事口径：组织、岗位、合同、证照、考勤汇总）。

      **三件事刻意不在这里**：
      - **薪资**（基本工资 / 月度应发 / 银行卡）属工资域，需 `c.payroll.view`。
        混进人事档案的结果是：能看到员工列表就能看到全公司工资。
      - **角色分配**不写员工表。角色由岗位反推，人工调整写一层覆盖（`PATCH /employees/{empId}/role`）。
        把角色存进员工表，岗位与权限就会各说各话，且改一次岗位要手工改一遍权限。
      - **组织增删改**属 E 域（`e.org.edit`），这里只做只读引用（组织树 + 组织路径）。

      敏感字段（手机 / 证件）与业主、租户同一套规矩：列表恒掩码，明文必须走揭示接口并记原因。
  - name: payroll
    description: |
      工资表（核算 → 锁定 → 审批发放 → 冲正）。

      **工资条是核算快照，不是查询结果**：每月生成一批、核算后冻结。实时算的结果是
      同一个人今天看 11,058.98、明天补录一条加班就变成 11,120.31，员工截图来问
      "为什么少了 62 块"时没人说得清。

      三条硬规矩：
      - **金额只能从服务端算**（`grossPay` / `deductionTotal` / `netPay`），前端不加总；
      - **已核算后金额不可变**，要改先反审（未发放）或冲正（已发放）；
      - **提交人不能审批自己的发放单**（409/40915）——一个人既能核算又能批准，
        "谁批的"这一栏写的就永远是同一个人。

      敏感：银行卡只回后四位，完整卡号走 `reveal`（双权限 + 留痕）。工资域不返回手机与证件——
      要员工姓名是必要的，但不该成为绕过员工域权限的后门。
  - name: system
    description: |
      系统参数。运营能在后台调、客户端只读的那类阈值。

      `park.plateChangeLimit` 这类值以前写死在客户端常量里，改一次要发一次版；
      下发之后客户端只负责展示与校验，**不再有第二个写入口**。

  - name: parking
    description: |
      车位换绑留痕（H2）。产权车位换车牌必须可追溯：谁改的、从什么改成什么、厂商同步到哪一步。

      一条硬规矩：**日志是唯一真源**，车位上的 `plateNo` 只是它的投影 ——
      只写日志不改车位，详情页就会出现"记录写着换成 A、车辆还是 B"。

  - name: faces
    description: |
      人脸核验（H4 / H5）。业主端提交走 `/mp/access/faces`，**受理侧在这组**。

      五态：未采集 → 待核验 → 已生效，另有已驳回（带原因）与已冻结（撤回 / 租约结束）。
      **业主端不允许自助生效**：生效只能由物业核验触发，否则谁都能给自己开门。

      业主本人、家庭成员、租客进同一张申请单，按 `subjectType` 分两段 ——
      同一件事开两个入口，客服第一句话一定是"到底在哪审"。

  - name: access
    description: |
      组织与权限（纯 RBAC）：权限只挂角色，人只挂角色——**没有「给某人加一个权限码」这种接口**。
      逐人授权的系统最后没人说得清"谁到底能干什么"。

      四条规矩：
      - **提权要批、降权即时**：新增命中高敏白名单才进审批；收回权限立刻生效——
        收回还要等审批，这段时间里他能做的事一点没少。
      - **双人原则**：提交人不能批自己提的申请（409/40917）。
      - **每次都记 diff**：记的是具体权限码，不是"改过权限"四个字。
      - **日志追加写 + 哈希链**：访问/导出日志每条带 `hash` / `prevHash`，
        任何一条被改，链上后面全对不上——否则「谁看过谁的证件号」这条记录本身就能被删掉。

      高敏白名单五类（拿到就等于能自己扩权或掩盖问题）：看证件明文 / 推翻封账 /
      改权限本身 / 改工资表 / 改楼栋责任范围。
  - name: contracts
    description: |
      合同台账（劳动 / 外包服务 / 物业服务 / 租赁 / 采购）。

      **合同变更是独立单据**：改金额、改期限、提前终止都不直接改合同，
      而是生成一条 `ContractChange` 进审批；审批通过才回写合同。
      直接改合同的结果是——谁在什么时候把 30 万改成 50 万，永远查不出来。
  - name: notices
    description: |
      公告通知。状态机是**单向**的：草稿 → 待审核 → 已发布 → 已过期；
      已发布可「撤回」（→ 已撤回），撤回后不能原地重新发布，必须重新提交审核。
      已过期的公告不能重推——过期还推，业主收到的是一句"明天停水"，第二天却没停。
  - name: close
    description: |
      期间关账（月结）。关账是**账面封存**，不是现金清点（现金清点是日结）：

      - 一个自然月只能结一次，结完该月流水与账单**只读**，改任何一笔都要先反结；
      - 月结要求**账面自洽**（收款 = 已收，退款已冲回，欠费可解释），不要求清零——
        欠费留着催，但必须写明处理去向；
      - 反结是**受控动作**：需更高权限 + 必填原因，且会作废该月报表批次（保留可查，不删除），
        报表随即回到 `provisional=true`。
  - name: reports
    description: |
      报表快照（跑批产物：欠费账龄 / 收缴率 / 部门达标率）。

      **期次**分两种口径：
      - 时点型（`arrears`）：`month` / `year` 只决定「看哪一天 24:00 的余额」，不做整期汇总；
      - 期间型（`collection-rate` / `dept-target`）：`periodType` + `period` 决定「重算哪一段时间」。
      未月结的期次照样能出数，但 `provisional=true`，`statDate` 落在今天而不是期末。

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录，拿令牌与权限
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: pm }
                password: { type: string, example: '123456' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- owners
  /owners:
    get:
      tags: [owners]
      operationId: queryOwners
      summary: 业主列表（分页）
      description: |
        数据范围：按服务端算出的范围过滤；范围外传 `communityId` 返回 403。
        **敏感字段只回掩码**：`phone` → `138****8001`，`idCard` → `5101**********1231`，并带 `*Redacted=true`。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: vf
          in: query
          description: 快捷视图（与范围可叠加）
          schema:
            type: string
            enum: ['', debt, unverified, noface, multi]
        - name: tagId
          in: query
          description: |
            按业主标签筛（如 `OT05` 长期欠费）。**必须服务端过滤**：标签是业主行上的属性，
            前端在分页结果里再筛，看到的永远是"本页 20 条里有这个标签的那几条"。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner-tags:
    get:
      tags: [owners]
      operationId: listOwnerTags
      summary: 业主标签字典（打标签的选项来源）
      description: |
        **只要求 `a.owners.view`，不要求字典维护权**——这是刻意的：
        楼栋管家要能给业主打标签，就必须先能读到"有哪些标签可选"。
        要求 `e.ownerTags.view` 的话，楼管打开选择弹层会是一个空列表。

        默认只回**启用中**的词条（`enabled=false` 的只有维护页要看）。
        `ownerCount` 是**全库**口径，不是分页口径——同一个词条在不同页面上必须显示同一个数。

        **员工端（管家）的标签选择器也走本接口**，权限同样是 `a.owners.view`。
        `e.ownerTags.view` 是 PC「业主标签」维护页的**页面级**权限码（能看停用词条与统计），
        不要拿它来校验本接口 —— 楼管没有这个码，按它校验会让管家端的选择器整个 403。
        2026-11-05 已与业主方确认，不再两说。
      parameters:
        - name: enabled
          in: query
          description: 不传 = 只看启用的；传 all = 全部（维护页用）；传 true/false = 精确过滤
          schema: { type: string, enum: [all, 'true', 'false'] }
        - name: category
          in: query
          schema: { type: string, enum: [关怀, 风险, 价值, 行为] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [owners]
      operationId: createOwnerTag
      summary: 新增标签词条
      description: |
        需要 `e.ownerTags.edit`（**不是** `a.owners.edit`）：
        改字典是全公司口径的事，楼管能选不能改。

        名称全库唯一——已停用的词条也算占用，否则会出现两个"重点关怀"，
        一个启用一个停用，打标签的人分不清该选哪个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string, minLength: 2, maxLength: 12 }
                category: { type: string, enum: [关怀, 风险, 价值, 行为] }
                color: { type: string, enum: [red, orange, green, blue, cyan, gray] }
                desc: { type: string, maxLength: 80 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 名称已存在（409/40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '标签「重点关怀」已存在（含已停用词条）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /owner-tags/stats:
    get:
      tags: [owners]
      operationId: ownerTagStats
      summary: 标签字典汇总
      description: |
        KPI 必须服务端算：字典只有 12 条还好说，但 `taggedOwners` 要扫全量业主，
        前端在分页结果里数出来的是「本页 20 条里有几个带标签」，比没有更糟。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagStatsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner-tags/{tagId}:
    patch:
      tags: [owners]
      operationId: updateOwnerTag
      summary: 改词条（改名 / 改色 / 排序 / 启停）
      description: |
        **`tagId` 不可改**：业主表引用的是它，改了等于把所有已打标签变成孤儿。

        停用（`enabled=false`）的效果是「不能再新打」，**已打上去的不受影响也不消失**：
        历史事实不该因为词条停用而被抹掉——"这户去年确实涉过诉"不因为现在不统计了就变假。
        停用前应先看 `ownerCount`，为 0 才能干净停用，否则要告知会影响多少人。
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, example: OT07 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 12 }
                category: { type: string, enum: [关怀, 风险, 价值, 行为] }
                color: { type: string, enum: [red, orange, green, blue, cyan, gray] }
                desc: { type: string, maxLength: 80 }
                sort: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 名称与其它词条冲突（409/40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /owners/{ownerId}/tags:
    post:
      tags: [owners]
      operationId: addOwnerTag
      summary: 给业主打标签
      description: |
        只要 `a.owners.edit`（楼管有，且受责任范围约束——范围外的业主直接 403）。

        三条拦截：
        · 词条已停用 → 409/40919（不能新打，已打过的不受影响）
        · 已经打过 → 409/40920（重复打不该静默成功，否则页面看不出到底有没有生效）
        · 词条不存在 → 404
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string, example: OW00001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tagId]
              properties:
                tagId: { type: string, example: OT05 }
      responses:
        '200':
          description: 已打上
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagIdsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 词条已停用（40919）/ 已经打过（40920）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40919, message: '标签「法律纠纷」已停用，不能再打；已打过的不受影响' }
  /owners/{ownerId}/tags/{tagId}:
    delete:
      tags: [owners]
      operationId: removeOwnerTag
      summary: 去掉业主的一个标签
      description: |
        停用的词条**也可以去掉**——不然挂错了就永远摘不掉（停用只拦"新打"，不拦"摘掉"）。
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string, example: OW00001 }
        - name: tagId
          in: path
          required: true
          schema: { type: string, example: OT02 }
      responses:
        '200':
          description: 已去掉
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTagIdsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 业主不存在，或该业主本来就没有这个标签（404/40409）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /owners/{ownerId}:
    get:
      tags: [owners]
      operationId: getOwnerDetail
      summary: 业主详情（含房屋、欠费汇总）
      description: 详情是"已授权看这一条"的语境，**手机号/证件号回明文**；需 `a.sensitive.view`，服务端记访问日志。
      parameters:
