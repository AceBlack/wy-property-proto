openapi: 3.1.0
info:
  title: 智慧物业后台 API
  version: 0.1.0
  summary: 原型 → 后台的接口契约（17 个域 104 个接口）
  description: |
    ## 这份契约是什么

    从原型（76 个可见路由、40 张数据表）里抽出的**可开工接口**，按业务域分批落地：

    - 第一批：业主（含房屋归属）→ 账单与缴费（含退款）→ 工单（含 SLA）
    - 第二批：租户（补充 / 核验 / 门禁 / 搬离）→ 巡检任务（执行 / 监督）→ 品质整改闭环
    - 第三批：报表快照（跑批产物）→ 月结（期间关账 / 反结）→ 合同 → 公告 → 员工档案 → 工资表 → 组织与权限

    共 91 个路径 / 104 个接口 / 178 个 schema。

    配套物：
    - `mock-server.mjs`：按本契约跑起来的假服务（`npm run mock`，端口 4010）
    - `contract-test.mjs`：契约测试（`npm test`），后端交付时用同一套断言验收
    - `enums.json`：枚举取值唯一来源（从 seed 数据生成）
    - `fixtures/*.json`：样例数据，可直接当初始化数据

    ## 三条通用约定（必须先对齐，否则联调天天对字段）

    1. **统一信封**：所有响应 `{ code, message, data }`，`code=0` 表示成功；
       失败时 `code` 用五位业务码（见「错误码」），HTTP 状态码同时给对（400/401/403/404/409/422/429/500）。
    2. **分页**：请求 `pageNo`（从 1 开始）+ `size`（1..100，超限 400）；响应 `data = { rows, total, pageNo, size }`。
       **列表默认按业务排序，不保证稳定**；需要稳定排序的接口在 description 里单独注明。
    3. **金额**：一律 `number`（单位元，两位小数），不用字符串、不用分。前端格式化由前端做。

    ## 权限与数据范围（最容易做成假隔离的地方）

    - 鉴权：`Authorization: Bearer <token>`，token 只带**身份**与角色，**不带数据范围**。
    - 数据范围在**查询时**由服务端计算（六档：全部项目 / 指定项目 / 本项目 / 本部门 / 责任范围 / 仅本人）。
    - 越权不是"返回空列表"，而是 **403 + code=40301**：拿别人 `communityId` 一传就能探测数据量，这是信息泄露。
    - 敏感字段（手机号 / 证件号 / 银行账号）：**列表接口只回掩码**（`138****8001`）并带 `*Redacted=true`；
      明文只能通过 `GET /owners/{id}` 这类"已授权看这一条"的接口拿，且需 `a.sensitive.view` 权限、写访问日志。

    ## 变更流程

    改契约 = 改这个文件 + 跑 `npm test` + 在 `CHANGELOG` 里记一行。后端已实现的接口不得静默改字段语义
    （加字段可以，改类型/改枚举值必须先通知前端）。
servers:
  - url: http://localhost:4010
    description: 本地假服务（npm run mock）
  - url: /api
    description: 联调环境前缀（生产由网关提供）
tags:
  - name: auth
    description: 登录与令牌
  - name: owners
    description: 业主（含房屋归属）
  - name: houses
    description: 房屋（只读引用）
  - name: bills
    description: 账单与批量操作
  - name: payments
    description: 缴费流水与退款
  - name: work-orders
    description: 工单与 SLA
  - name: tenants
    description: 在住人（业主维护、物业补充核验）
  - name: inspect
    description: 巡检任务（执行 / 监督）
  - name: rectify
    description: 品质整改闭环
  - name: quality
    description: 品质检查记录（结果台账）
  - name: employees
    description: |
      员工档案（人事口径：组织、岗位、合同、证照、考勤汇总）。

      **三件事刻意不在这里**：
      - **薪资**（基本工资 / 月度应发 / 银行卡）属工资域，需 `c.payroll.view`。
        混进人事档案的结果是：能看到员工列表就能看到全公司工资。
      - **角色分配**不写员工表。角色由岗位反推，人工调整写一层覆盖（`PATCH /employees/{empId}/role`）。
        把角色存进员工表，岗位与权限就会各说各话，且改一次岗位要手工改一遍权限。
      - **组织增删改**属 E 域（`e.org.edit`），这里只做只读引用（组织树 + 组织路径）。

      敏感字段（手机 / 证件）与业主、租户同一套规矩：列表恒掩码，明文必须走揭示接口并记原因。
  - name: payroll
    description: |
      工资表（核算 → 锁定 → 审批发放 → 冲正）。

      **工资条是核算快照，不是查询结果**：每月生成一批、核算后冻结。实时算的结果是
      同一个人今天看 11,058.98、明天补录一条加班就变成 11,120.31，员工截图来问
      "为什么少了 62 块"时没人说得清。

      三条硬规矩：
      - **金额只能从服务端算**（`grossPay` / `deductionTotal` / `netPay`），前端不加总；
      - **已核算后金额不可变**，要改先反审（未发放）或冲正（已发放）；
      - **提交人不能审批自己的发放单**（409/40915）——一个人既能核算又能批准，
        "谁批的"这一栏写的就永远是同一个人。

      敏感：银行卡只回后四位，完整卡号走 `reveal`（双权限 + 留痕）。工资域不返回手机与证件——
      要员工姓名是必要的，但不该成为绕过员工域权限的后门。
  - name: access
    description: |
      组织与权限（纯 RBAC）：权限只挂角色，人只挂角色——**没有「给某人加一个权限码」这种接口**。
      逐人授权的系统最后没人说得清"谁到底能干什么"。

      四条规矩：
      - **提权要批、降权即时**：新增命中高敏白名单才进审批；收回权限立刻生效——
        收回还要等审批，这段时间里他能做的事一点没少。
      - **双人原则**：提交人不能批自己提的申请（409/40917）。
      - **每次都记 diff**：记的是具体权限码，不是"改过权限"四个字。
      - **日志追加写 + 哈希链**：访问/导出日志每条带 `hash` / `prevHash`，
        任何一条被改，链上后面全对不上——否则「谁看过谁的证件号」这条记录本身就能被删掉。

      高敏白名单五类（拿到就等于能自己扩权或掩盖问题）：看证件明文 / 推翻封账 /
      改权限本身 / 改工资表 / 改楼栋责任范围。
  - name: contracts
    description: |
      合同台账（劳动 / 外包服务 / 物业服务 / 租赁 / 采购）。

      **合同变更是独立单据**：改金额、改期限、提前终止都不直接改合同，
      而是生成一条 `ContractChange` 进审批；审批通过才回写合同。
      直接改合同的结果是——谁在什么时候把 30 万改成 50 万，永远查不出来。
  - name: notices
    description: |
      公告通知。状态机是**单向**的：草稿 → 待审核 → 已发布 → 已过期；
      已发布可「撤回」（→ 已撤回），撤回后不能原地重新发布，必须重新提交审核。
      已过期的公告不能重推——过期还推，业主收到的是一句"明天停水"，第二天却没停。
  - name: close
    description: |
      期间关账（月结）。关账是**账面封存**，不是现金清点（现金清点是日结）：

      - 一个自然月只能结一次，结完该月流水与账单**只读**，改任何一笔都要先反结；
      - 月结要求**账面自洽**（收款 = 已收，退款已冲回，欠费可解释），不要求清零——
        欠费留着催，但必须写明处理去向；
      - 反结是**受控动作**：需更高权限 + 必填原因，且会作废该月报表批次（保留可查，不删除），
        报表随即回到 `provisional=true`。
  - name: reports
    description: |
      报表快照（跑批产物：欠费账龄 / 收缴率 / 部门达标率）。

      **期次**分两种口径：
      - 时点型（`arrears`）：`month` / `year` 只决定「看哪一天 24:00 的余额」，不做整期汇总；
      - 期间型（`collection-rate` / `dept-target`）：`periodType` + `period` 决定「重算哪一段时间」。
      未月结的期次照样能出数，但 `provisional=true`，`statDate` 落在今天而不是期末。

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录，拿令牌与权限
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: pm }
                password: { type: string, example: '123456' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- owners
  /owners:
    get:
      tags: [owners]
      operationId: queryOwners
      summary: 业主列表（分页）
      description: |
        数据范围：按服务端算出的范围过滤；范围外传 `communityId` 返回 403。
        **敏感字段只回掩码**：`phone` → `138****8001`，`idCard` → `5101**********1231`，并带 `*Redacted=true`。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: vf
          in: query
          description: 快捷视图（与范围可叠加）
          schema:
            type: string
            enum: ['', debt, unverified, noface, multi]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owners/{ownerId}:
    get:
      tags: [owners]
      operationId: getOwnerDetail
      summary: 业主详情（含房屋、欠费汇总）
      description: 详情是"已授权看这一条"的语境，**手机号/证件号回明文**；需 `a.sensitive.view`，服务端记访问日志。
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerDetailEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [owners]
      operationId: updateOwnerField
      summary: 修改业主单个字段（内联编辑）
      description: |
        乐观锁：请求需带 `ver`（列表/详情返回的 `_ver`）；与当前版本不一致返回 **409 / 40901**。
        唯一约束：`phone` 在业主档案内不允许重复，冲突返回 **409 / 40902**。
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value]
              properties:
                field:
                  type: string
                  enum: [name, phone, email, emergencyContact, emergencyPhone, creditLevel, remark]
                value: { type: string }
                ver: { type: integer, description: 期望版本号；不传表示不做并发校验（不建议） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /owners/{ownerId}/houses:
    get:
      tags: [owners]
      operationId: housesOfOwner
      summary: 业主名下房屋
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseListEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- houses
  /houses/{houseId}:
    get:
      tags: [houses]
      operationId: getHouse
      summary: 房屋详情（含责任楼管）
      parameters:
        - $ref: '#/components/parameters/houseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------- bills
  /bills:
    get:
      tags: [bills]
      operationId: queryBills
      summary: 账单列表（分页）
      description: |
        排序：按账期倒序（同账期内保持服务端稳定序，前端不应依赖）。
        `subjectType` 区分房屋账单与车位账单（车位账单没有 `houseId`）。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BillStatus' }
        - name: itemId
          in: query
          schema: { type: string, example: FI01 }
        - name: subjectType
          in: query
          description: 房屋账单 / 车位账单
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          description: 快捷视图
          schema: { type: string, enum: ['', debt, overdue, unpaid, part] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bills/summary:
    get:
      tags: [bills]
      operationId: billScopeSummary
      summary: 当前筛选范围的小计（不翻页）
      description: 与 `/bills` **同一套筛选条件**，只返回合计；用于列表顶部「本范围小计」。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: period
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BillStatus' }
        - name: subjectType
          in: query
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          schema: { type: string, enum: ['', debt, overdue, unpaid, part] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillSummaryEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bills/{billId}:
    get:
      tags: [bills]
      operationId: getBill
      summary: 账单详情
      parameters:
        - $ref: '#/components/parameters/billId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [bills]
      operationId: updateBillField
      summary: 修改账单字段（减免 / 备注）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value]
              properties:
                field: { type: string, enum: [remark, dueDate] }
                value: { type: string }
                ver: { type: integer }
      parameters:
        - $ref: '#/components/parameters/billId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bills/batch-remind:
    post:
      tags: [bills]
      operationId: batchRemindBills
      summary: 批量催缴
      description: |
        **部分成功必须按条回报**：`data.ok` 是成功数，`data.failed[]` 给每条失败原因（如「该账单没有欠费」）。
        不要整批失败——一张已缴单会让整批白做。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billIds]
              properties:
                billIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                method: { type: string, enum: [短信, 微信, 电话], default: 短信 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /bills/batch-reduce:
    post:
      tags: [bills]
      operationId: batchReduceBills
      summary: 批量减免
      description: 减免**必须填原因**（至少 4 字），否则 422；减免后未收清零、状态转「已减免」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billIds, reason]
              properties:
                billIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                reason: { type: string, minLength: 4, description: 减免原因（审计留痕必填） }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # -------------------------------------------------------------- payments
  /payments:
    get:
      tags: [payments]
      operationId: queryPayments
      summary: 缴费流水（分页）
      description: 按收款时间倒序。`startDate` / `endDate` 为闭区间。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PayMethod' }
        - name: channel
          in: query
          schema: { type: string }
        - name: invoiceStatus
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: subjectType
          in: query
          description: 承载对象（房屋 / 车位）；车位费没有 houseId，需要单列
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          description: 快捷视图（与左侧虚拟节点同源，服务端算，前端不自己 filter）
          schema: { type: string, enum: ['', parkonly, cash, uninvoiced, red, deposit] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payments/{payId}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: 流水详情（含对应账单与退款记录）
      parameters:
        - $ref: '#/components/parameters/payId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDetailEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/{payId}/refund:
    post:
      tags: [payments]
      operationId: refundPayment
      summary: 退款 / 冲红
      description: |
        **一次事务里做三件事**（只做第一件就是错的）：

        1. 写退款单，流水累计 `refundAmount`，状态转「部分退款 / 已全额退款」；
        2. **冲回账单**：`paidAmount` 减、`unpaid` 加、状态重算（已缴 → 部分缴 / 未缴）；
           不冲回账单，欠费报表会少一笔，且账单永远显示已缴；
        3. 已开票的流水把 `invoiceStatus` 转「已冲红」，财务据此红冲。

        约束：`amount` 为空 = 全额退；`amount > 可退金额` → 422；重复全额退 → 422；`reason` ≥ 4 字。

        **期间已月结的流水不能直接退** → 409 / 40903。退款会改上月已封存的收款与欠费，
        必须走「反结 → 退款 → 重结」，否则月结报表与明细对不上，且没人说得清是哪一步错的。
      parameters:
        - $ref: '#/components/parameters/payId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: number, description: 不传 = 全额退款 }
                reason: { type: string, minLength: 4 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ----------------------------------------------------------- work-orders
  /work-orders:
    get:
      tags: [work-orders]
      operationId: queryWorkOrders
      summary: 工单列表（分页）
      description: |
        `nohouse=true` 只返回无房屋归属的工单（公共区域 / 投诉 / 咨询），承接原左树的「公共 / 非入户」分支。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WoStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/WoType' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/WoPriority' }
        - name: nohouse
          in: query
          schema: { type: boolean }
        - name: vf
          in: query
          schema: { type: string, enum: ['', pending, overdue, urgent, open] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /work-orders/summary:
    get:
      tags: [work-orders]
      operationId: woSummary
      summary: 工单 KPI（与列表同一套筛选）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderSummaryEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /work-orders/{woId}:
    get:
      tags: [work-orders]
      operationId: getWorkOrder
      summary: 工单详情（含流转时间线）
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDetailEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [work-orders]
      operationId: updateWorkOrderField
      summary: 修改工单字段（优先级 / 处理人 / 备注）
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, value]
              properties:
                field: { type: string, enum: [priority, assignee, remark] }
                value: { type: string }
                ver: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /work-orders/batch:
    post:
      tags: [work-orders]
      operationId: batchUpdateWorkOrders
      summary: 批量改派 / 改优先级
      description: 已关闭 / 已取消的工单不参与批量修改，按条回报原因（同批量催缴口径）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [woIds, patch]
              properties:
                woIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                patch:
                  type: object
                  properties:
                    priority: { $ref: '#/components/schemas/WoPriority' }
                    assignee: { type: string }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # --------------------------------------------------------------- tenants
  /tenants:
    get:
      tags: [tenants]
      operationId: queryTenants
      summary: 在住租户列表（分页）
      description: |
        租户由**业主**出租产生、信息主要由业主维护；物业只做补充、核验与搬离。
        **租金不进后台**（不返回、不统计）；手机号与证件号在列表里只回掩码。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: verifyStatus
          in: query
          schema: { type: string, enum: [待核验, 已核验, 信息不全] }
        - name: source
          in: query
          schema: { type: string, enum: [业主自助, 物业补录] }
        - name: vf
          in: query
          description: 快捷视图（与范围可叠加）
          schema: { type: string, enum: ['', pending, incomplete, uncertified, noface, expiring, moved] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenantId}:
    get:
      tags: [tenants]
      operationId: getTenantDetail
      summary: 租户详情（含房屋、业主、完整度）
      description: 手机号/证件号回明文（详情是已授权语境）；`completeness.missingBasic` 是**核验门槛缺项**（5 项）。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenantId}/verify:
    post:
      tags: [tenants]
      operationId: verifyTenant
      summary: 物业核验
      description: |
        核验门槛是 **5 项基础信息**（姓名 / 手机 / 证件号 / 与业主关系 / 居住人数）。
        缺项时返回 **422/42202** 并在 `details` 里列出缺哪几项；通过后 `certified=true`（核验含实名）。
        实名与人脸属于核验结果，不作为核验门槛（否则永远验不过）。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass]
              properties:
                pass: { type: boolean, description: true 通过；false 标记为信息不全 }
                verifier: { type: string }
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/face:
    post:
      tags: [tenants]
      operationId: registerTenantFace
      summary: 录入人脸（门禁授权）
      description: 必须先核验通过（否则 422）；已录入再录也返回 422。门禁是安全边界，不能靠租户自己声明。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/move-out:
    post:
      tags: [tenants]
      operationId: moveOutTenant
      summary: 标记搬离
      description: 置「已搬离」+ 停用门禁人脸 + **释放房屋的 tenantId**（不释放的话那套房永远显示有人住）。记录保留可回溯。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, reason]
              properties:
                date: { type: string, format: date }
                reason: { type: string, minLength: 2 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/batch-verify:
    post:
      tags: [tenants]
      operationId: batchVerifyTenants
      summary: 批量核验
      description: 门槛不足的**按人回报原因**，不做整批失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantIds]
              properties:
                tenantIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- inspect
  /inspect-tasks:
    get:
      tags: [inspect]
      operationId: queryInspectTasks
      summary: 巡检任务列表（分页）
      description: |
        两类任务：`执行`（一线员工按模板自查）、`监督`（部门经理查下属计划落地情况）。
        监督任务看的是「被检班组」，`targetDept` / `targetPost` 才有值。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: taskType
          in: query
          schema: { type: string, enum: [执行, 监督] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InspectStatus' }
        - name: post
          in: query
          schema: { $ref: '#/components/schemas/InspectPost' }
        - name: executor
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspect-tasks/{taskId}:
    get:
      tags: [inspect]
      operationId: getInspectTask
      summary: 巡检任务详情（含已录问题项）
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inspect-tasks/{taskId}/submit:
    post:
      tags: [inspect]
      operationId: submitInspectResult
      summary: 提交巡检结果
      description: |
        **监督任务的不合格项必须指定责任员工**（否则考核归不到人），缺一个就 422。
        提交后：`normalCount` / `issueCount` 由服务端按 results 重算，状态转「已完成」；
        执行任务若当日无异常、同时段又有监督任务查出问题，服务端可置 `conflictFlag`（申报不实）。
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/InspectResult' }
                photos: { type: integer, minimum: 0 }
                checkedIn: { type: boolean }
                remark: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- rectify
  /rectify-orders:
    get:
      tags: [rectify]
      operationId: queryRectifyOrders
      summary: 整改单列表（分页）
      description: 未闭环的排前面（超期最前），已闭环按闭环时间倒序。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RectifyStatus' }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/RectifyLevel' }
        - name: deptName
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          description: 只看超期未整改
          schema: { type: boolean }
        - name: vf
          in: query
          schema: { type: string, enum: ['', todo, overdue, recheck, closed] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rectify-orders/{rectifyId}:
    get:
      tags: [rectify]
      operationId: getRectifyOrder
      summary: 整改单详情（含整改项与流程）
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rectify-orders/{rectifyId}/submit:
    post:
      tags: [rectify]
      operationId: submitRectify
      summary: 提交整改（部门侧）
      description: 整改项必须**全部完成**才能提交，否则 422 并告知还剩几项。
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemNos:
                  type: array
                  description: 本次完成的整改项序号；不传 = 全部完成
                  items: { type: integer }
                submitRemark: { type: string }
                photos: { type: integer }
                submitBy: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rectify-orders/{rectifyId}/recheck:
    post:
      tags: [rectify]
      operationId: recheckRectify
      summary: 复核（品质督导侧）
      description: |
        通过 → 「已闭环」；不通过 → 「已退回」，**整改项归零重做**（退回不是只改个状态）。
        提交人不得自己复核（否则等于自证清白），违反返回 422。
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass, recheckBy]
              properties:
                pass: { type: boolean }
                remark: { type: string }
                recheckBy: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- quality
  /quality-checks:
    get:
      tags: [quality]
      operationId: queryQualityChecks
      summary: 品质检查记录列表（分页）
      description: |
        本表是**结果台账**（查出什么、改没改完），现场评分卡是另一个入口，两者共用评分档位但页不合并。
        `sourceType` 区分「现场抽查」与「任务评价」——任务评价由品质经理对部门达标率打分后生成。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: area
          in: query
          description: 检查区域（保洁 / 安保 / 工程 / 客服），是业务条线不是空间层级
          schema: { type: string }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/QualityGrade' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QualityStatus' }
        - name: sourceType
          in: query
          schema: { type: string, enum: [现场抽查, 任务评价] }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: vf
          in: query
          schema: { type: string, enum: ['', unqualified, rectifying, recheck, overdue, veto] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /quality-checks/{checkId}:
    get:
      tags: [quality]
      operationId: getQualityCheck
      summary: 品质检查详情（含关联整改单）
      parameters:
        - $ref: '#/components/parameters/checkId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 列表页的「范围小计 / KPI」：不给前端自己 reduce 的机会，否则又是一个口径
  /payments/summary:
    get:
      tags: [payments]
      operationId: paymentSummary
      summary: 缴费汇总（筛选口径）
      description: |
        和列表**同一套筛选条件**，返回笔数、金额、现金、未开票与退款。
        所有字段都受筛选影响；「今日 / 本月」也受（不传 `startDate/endDate` 就是数据集当天/当月）。
        **KPI 卡要全局数就在空筛选下再取一次**——不要在一个响应里混两种口径，
        否则「本页合计」和「全部合计」永远对不上，对账时要吵起来。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PayMethod' }
        - name: channel
          in: query
          schema: { type: string }
        - name: invoiceStatus
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: subjectType
          in: query
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          schema: { type: string, enum: ['', parkonly, cash, uninvoiced, red, deposit] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSummaryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /quality-checks/summary:
    get:
      tags: [quality]
      operationId: qualityCheckSummary
      summary: 品质记录汇总（筛选口径）
      description: |
        同列表筛选。`avgScore` 按当前筛选集求平均（不含已作废记录——本表没有作废态）。
        `unqualified` 含**一票否决**：否决记录分数可能不低，只按 `<70` 判会漏。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: area
          in: query
          schema: { type: string }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/QualityGrade' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QualityStatus' }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: sourceType
          in: query
          schema: { type: string, enum: [现场抽查, 任务评价] }
        - name: vf
          in: query
          schema: { type: string, enum: ['', unqualified, rectifying, recheck, overdue, veto] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualitySummaryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------- reports
  # 报表是**跑批产物**，不是实时查询。三个接口都只读快照：
  #   ① 欠费账龄、收缴率、部门达标率都依赖「截至某一天」的口径，实时算两次刷新两个数；
  #   ② 审计要能回答「上个月的报表当时长什么样」，实时算答不了；
  #   ③ 部门达标率要扫全量巡检明细，实时算会把列表接口拖成秒级。
  # 所以口径是：`POST /reports/recalc` 生成批次 → 落库 → 查询接口按 `statDate` 读快照。
  /reports/snapshots:
    get:
      tags: [reports]
      operationId: listReportSnapshots
      summary: 统计批次列表（哪天跑过哪张表、成功没有）
      description: |
        报表查询接口的 `statDate` 从这里取。前端默认用 `latest`，
        但必须能选历史批次——审计、环比、复现「数字对不上」全靠它。
        排序：`statDate` 倒序，同一天按 `batchNo` 倒序（-02 在 -01 前面）。
      parameters:
        - name: reportCode
          in: query
          description: 不传则返回全部报表的批次
          schema: { $ref: '#/components/schemas/ReportCode' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportBatchStatus' }
        - name: periodType
          in: query
          schema: { $ref: '#/components/schemas/ReportPeriodType' }
        - name: limit
          in: query
          description: 返回条数（批次多，不做页码）
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/arrears:
    get:
      tags: [reports]
      operationId: queryArrearsReport
      summary: 欠费账龄报表（按「楼栋 × 账龄」聚合）
      description: |
        读快照，不实时算。统计口径：

        - 只算 `unpaid > 0` 的账单；`已作废` 不进表；
        - **账龄按 `statDate` 与 `dueDate` 的天数差**分档，所以同一批账单在不同
          `statDate` 下会落到不同档——这也是必须落快照的原因；
        - `未到期` = 账单到期日 ≥ 统计日（还没到期的应收不算欠费，但要看得出规模）；
        - `avgOverdueDays` 只对已逾期部分求平均，`未到期` 行固定为 0；
        - **排序固定**：账龄从最老到最新（`180天以上` → `未到期`），同档按欠费金额倒序。
          催缴先看欠最久的；顺序写死是为了前端翻页/导出与后台核对时能对上。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/year'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - name: aging
          in: query
          description: 只看某一档账龄
          schema: { $ref: '#/components/schemas/AgingBucket' }
        - name: kw
          in: query
          description: 楼栋名
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrearsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/collection-rate:
    get:
      tags: [reports]
      operationId: queryCollectionRateReport
      summary: 收缴率报表（按「账期 × 科目」聚合）
      description: |
        读快照。收缴率 = 已收 ÷ 应收，**分母剔除「已作废」与「已减免」**——
        减免是公司的决策不是业主欠费，算进分母会让收缴率永远达标不了。

        `rate` 在应收为 0 时返回 `null`（前端显示「—」），不要回 0：
        0 和「没有应收」是两件事，混了会让报表出现假的 0% 收缴率。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/periodType'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/communityId'
        - name: billPeriod
          in: query
          description: 行级筛选：只看某个账期（与报表期次 `period` 是两回事）
          schema: { type: string, example: '2026-10' }
        - name: itemId
          in: query
          schema: { type: string, example: FI01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/dept-target:
    get:
      tags: [reports]
      operationId: queryDeptTargetReport
      summary: 部门达标率报表（按「部门 × 周期」）
      description: |
        读快照。口径（与原型 `api.js` 的 `deptAchievement` 同一份）：

        - 完成率 = 已完成执行任务 ÷ 执行任务总数（**监督任务不进分母**，否则越查越低）；
        - 合格率 = 合格检查项 ÷ 检查项总数（只统计已完成任务的项）；
        - 加权达标率 = 合格率 × `weightPass` + 完成率 × `weightDone`，权重按岗位配（见
          `weightPass + weightDone = 1`）；
        - 得分 = 加权达标率 × 100 − 自查问题 × 2 × 0.5 − 抽查问题 × 2 × 1.5，下限 0；
        - 等级：≥90 优秀 / ≥80 良好 / ≥70 合格 / <70 不合格。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/periodType'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/communityId'
        - name: billPeriod
          in: query
          description: 行级筛选：只看某个评价周期（与报表期次 `period` 是两回事）
          schema: { type: string, example: '2026-10' }
        - name: post
          in: query
          schema: { $ref: '#/components/schemas/InspectPost' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptTargetEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/recalc:
    post:
      tags: [reports]
      operationId: recalcReport
      summary: 触发重算（异步任务）
      description: |
        **异步**，返回任务号，不同步等结果。幂等规则：

        - 同一 `reportCode + statDate` 已有「运行中」任务 → **不新建**，直接返回该任务（200 + `reused=true`）；
        - 已成功过的日期允许重算，生成同一天的下一个批次（`RPT-20261021-02`），
          旧批次保留可查——报表要能回答「当时是怎么算的」；
        - 重算只影响 `statDate ≥ 该日` 的批次，不动历史。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportCode]
              properties:
                reportCode: { $ref: '#/components/schemas/ReportCode' }
                periodType:
                  $ref: '#/components/schemas/ReportPeriodType'
                period:
                  type: string
                  description: 期次值（日=YYYY-MM-DD / 月=YYYY-MM / 年=YYYY）。按日也可继续用 statDate
                  example: '2026-10'
                statDate:
                  type: string
                  format: date
                  description: 按日重算时的统计日（数据截止到该日 24:00）；与 period 二选一
                  example: '2026-10-21'
                note: { type: string, description: 重算原因（会写进批次备注）' }
      responses:
        '202':
          description: 任务已受理（**不是 200**：报表不会同步算完）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '200':
          description: 已有同参数的运行中任务，直接复用（`reused=true`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/recalc/{taskId}:
    get:
      tags: [reports]
      operationId: getRecalcTask
      summary: 查重算任务进度
      description: |
        前端轮询这个接口（建议 2s 一次，最多 60 次）。`status=成功` 时 `batchNo` 才有值，
        页面据此跳到新批次——不要用「重算成功后自动刷新列表」这种写法，
        批量任务完成时间不可控，会把用户的选择冲掉。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, example: RCL-20261030-01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/retention:
    get:
      tags: [reports]
      operationId: getReportRetention
      summary: 批次保留现状（清理任务与运维页用）
      description: |
        **为什么报表要有保留策略**：日快照一天 3 张表，一年就是 1000+ 批次，
        下拉框和索引都会被拖垮。但也不能随便删——

        | 粒度 | 默认保留 | 理由 |
        |---|---|---|
        | 日 | 90 天 | 日常核对用，超过 90 天的日常没人看 |
        | 月 | 24 期（2 年） | 年度审计要看前两年月报 |
        | 年 | **永久** | 年报是最小粒度的历史凭证，删了等于抹账 |

        **已月结期间的批次一律受保护**，即使超过保留期也不清理：审计要能回答
        「那个月报表当时长什么样」，而月结正是"当时"被确认的时间点。
        受保护的数量在 `protectedClosed` 里单独给，别让它混进 `expired`（否则会看起来一直清理不干净）。
      parameters:
        - name: keepDays
          in: query
          description: 日快照保留天数（缺省 90）
          schema: { type: integer, minimum: 1, default: 90 }
        - name: keepMonths
          in: query
          description: 月快照保留期数（缺省 24）
          schema: { type: integer, minimum: 1, default: 24 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRetentionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/purge:
    post:
      tags: [reports]
      operationId: purgeReports
      summary: 清理过期批次（运维任务，幂等）
      description: |
        按保留策略删除过期批次，返回删了哪些。**幂等**：重复跑不会多删，
        第二次 `removed=0`——清理任务必须能无条件重试，否则失败一次就没人敢再跑。

        参数可覆盖保留策略（`keepDays` / `keepMonths`），供运维在存储吃紧时临时收紧；
        **不能通过参数删除受保护批次**——已月结期间的批次永远不删（`keptProtected` 会说明保住了几个）。

        删的是**批次**不是**期间**：某个期间的批次被清完，再查该期间应回 404 / 40402
        （"没有这个批次"），而不是空表——空表和没跑过必须能区分。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keepDays: { type: integer, minimum: 1, default: 90 }
                keepMonths: { type: integer, minimum: 1, default: 24 }
                dryRun:
                  type: boolean
                  default: false
                  description: 只算不删。第一次上线前先跑一次这个，看清会删什么
      responses:
        '200':
          description: 成功（dryRun 时 removed 为"将要删除"的数量）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPurgeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------ contracts
  /contracts:
    get:
      tags: [contracts]
      operationId: queryContracts
      summary: 合同列表（分页）
      description: |
        快捷视图 `vf` 由服务端算（与列表同一套谓词），别让前端自己 filter——
        前端过滤的话，翻页后的计数就错了。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          description: 合同类型
          schema: { type: string, example: 劳动 }
        - name: subtype
          in: query
          schema: { type: string, example: 劳务协议 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ContractStatus' }
        - name: vf
          in: query
          description: 快捷视图（服务端算）
          schema: { type: string, enum: ['', pending, expiring, expired, big, group, changePending] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [contracts]
      operationId: createContract
      summary: 新建合同（草稿）
      description: |
        `contractNo` 由服务端生成（`HT-YYYY-NNNN`），前端传了也忽略——
        让前端生成单号的结果是两个人同时新建拿到同一个号。
        新建后状态为「待审批」，不直接生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, partyB, amount, startDate, endDate]
              properties:
                name: { type: string }
                type: { type: string, example: 劳动 }
                subtype: { type: string }
                communityId: { type: string }
                partyB: { type: string, description: 相对方 }
                contact: { type: string }
                phone: { type: string }
                amount: { type: number }
                payCycle: { type: string, example: 月付 }
                signDate: { type: string, format: date }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                remark: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contracts/summary:
    get:
      tags: [contracts]
      operationId: contractSummary
      summary: 合同汇总（KPI）
      description: |
        与列表**同源**统计（同一套谓词），前端不要自己再 reduce 一遍。
        `expiring` 取状态「即将到期」——该状态由跑批按到期日刷新（样例阈值 90 天），
        前端**不要**自己按 30 天重算，否则列表与 KPI 会差几条，且没人说得清谁对。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contracts/{contractId}:
    get:
      tags: [contracts]
      operationId: getContract
      summary: 合同详情（含关联对象、时间线、变更记录）
      description: |
        `ref` 按 `refType` 带出关联对象（房屋 / 车位 / 员工）——合同相对方不是一句文本，
        要能点进去看。查不到时为 `null`，不要让详情页因此 500。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contracts/{contractId}/changes:
    post:
      tags: [contracts]
      operationId: submitContractChange
      summary: 发起合同变更（进审批，不直接改合同）
      description: |
        **变更不动合同本身**：先生成 `ContractChange`（before / after 快照）+ 审批单，
        审批通过才回写。`before` 是发起时的值，事后合同再变也不影响这张单子查得到"当时改了什么"。

        约束（错在哪说哪，别合成一句"参数错误"）：

        - 合同已「已到期 / 已终止」→ 422（终态不能变更）；
        - 该合同已有变更在审批中 → **409 / 40906**（不是 422：这不是参数错，是要先去处理那一单）；
        - 变更内容与原合同完全一致 → 422（空变更没有审批的意义）。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeType, reason]
              properties:
                changeType: { type: string, example: 金额调整 }
                reason: { type: string, minLength: 4 }
                patch:
                  type: object
                  description: 要改的字段（只传改动的）；提前终止可不传
                  properties:
                    name: { type: string }
                    amount: { type: number }
                    partyB: { type: string }
                    startDate: { type: string, format: date }
                    endDate: { type: string, format: date }
      responses:
        '201':
          description: 已提交审批
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractChangeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # -------------------------------------------------------------- notices
  /contracts/{contractId}/attachments:
    get:
      tags: [contracts]
      operationId: listContractAttachments
      summary: 合同附件列表（元数据）
      description: |
        只回元数据，**不回下载地址**：给地址的接口一旦被复制，链接就永远有效。
        下载要走下面的 `download`，它签发的是**临时链接**（默认 20 分钟）并记一条导出日志——
        合同是"谁在什么时候拿走了扫描件"最该查得到的一类文件。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractAttachmentListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contracts/{contractId}/attachments/{fileId}/download:
    post:
      tags: [contracts]
      operationId: downloadContractAttachment
      summary: 签发附件临时下载链接（记导出日志）
      description: |
        返回一次性签名链接 + 过期时间，同时写一条导出日志（文件外发属于数据出口）。

        契约不返回文件流：真实系统里附件在对象存储，业务服务只负责**鉴权 + 签名**；
        让业务服务转发文件流的结果是——大文件下载把 API 进程拖住，且日志里看不出"下了多少"。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
        - name: fileId
          in: path
          required: true
          schema: { type: string, example: CT0001-F1 }
      responses:
        '200':
          description: 已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentDownloadEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notices:
    get:
      tags: [notices]
      operationId: queryNotices
      summary: 公告列表（分页）
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          schema: { type: string, example: 停水停电 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NoticeStatus' }
        - name: vf
          in: query
          description: 快捷视图（服务端算）
          schema: { type: string, enum: ['', pending, published, expired, top, lowRead] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [notices]
      operationId: createNotice
      summary: 新建公告（草稿）
      description: |
        新建只会得到「草稿」，不会直接发布——发布是独立动作，要单独调 `/publish`。
        `channels` 至少一个：没有渠道的公告等于没发（前台看得见、业主收不到）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, content, channels]
              properties:
                title: { type: string, minLength: 4 }
                type: { type: string, example: 停水停电 }
                communityId: { type: string, description: 空 = 全部项目 }
                content: { type: string, minLength: 10 }
                channels:
                  type: array
                  minItems: 1
                  items: { type: string }
                top: { type: boolean }
                attachments: { type: integer }
      responses:
        '201':
          description: 已创建（草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/summary:
    get:
      tags: [notices]
      operationId: noticeSummary
      summary: 公告汇总（KPI）
      description: "`avgReadRate` 只统计**已发布**的公告；草稿与撤回的没有阅读率，混进去会把平均拉低。"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notices/{noticeId}:
    get:
      tags: [notices]
      operationId: getNotice
      summary: 公告详情（含时间线与触达）
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [notices]
      operationId: updateNotice
      summary: 修改公告（仅草稿/待审核可改）
      description: 已发布的公告不能改内容——业主已经看过了，改了等于篡改留痕。要改就先撤回。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                channels: { type: array, items: { type: string } }
                top: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已发布不能改（40907）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40907, message: '已发布的公告不能修改，请先撤回', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/submit-audit:
    post:
      tags: [notices]
      operationId: submitNoticeAudit
      summary: 提交审核（草稿 / 已撤回 → 待审核）
      description: |
        与「发布」拆成两个动作，因为它们**不是同一个人做的**：编辑提审、主管发布。
        合成一个接口的结果是——只要点了发布，就自动跳过审核，谁审的这栏永远是空的。

        `readCount` 在这里**不清零**：公告还没发出去，还没人看过；清了反而看不出"上一轮有多少人看过"。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 已提交审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不能提审（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '公告当前状态「已发布」，只有草稿与已撤回可以提交审核' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/publish:
    post:
      tags: [notices]
      operationId: publishNotice
      summary: 发布（待审核 → 已发布）
      description: |
        只处理**待审核**的公告：草稿与已撤回要先走 `/submit-audit`（提审与发布是两个角色的事）。
        **已发布与已过期不再接受发布**（409/40908）——重复点发布，业主会收到两条一模一样的推送，
        然后打客服电话问"到底停不停水"。

        发布时 `readCount` 归零：这是新一轮推送，上一轮的已读不能算进来（撤回时不清零，
        因为那批人确实看过）。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许发布（40908）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40908, message: '已发布的公告不能重复发布', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/repush:
    post:
      tags: [notices]
      operationId: repushNotice
      summary: 补推未读（只推没看过的人）
      description: |
        给**已读为 0 的那部分业主**再推一次，不是"再发一条公告"——
        公告本身没有新增内容，重复推给已读的人只会让人关掉通知。
        没有未读时返回 422（"没有未读业主，无需补推"），不要静默成功。
        补推次数记在 `repushCount` 里，便于判断这条公告是不是一直没人看。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/withdraw:
    post:
      tags: [notices]
      operationId: withdrawNotice
      summary: 撤回（仅已发布可撤）
      description: |
        撤回后状态转「已撤回」，已读数据保留（`readCount` 不清零）——业主确实看过，抹掉就是伪造。
        撤回不删除公告：撤了之后业主 App 上消失，但后台台账还在。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- close
  /month-closes:
    get:
      tags: [close]
      operationId: queryMonthCloses
      summary: 月结记录（分页，按期间倒序）
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - name: year
          in: query
          description: 只看某一年
          schema: { type: string, example: '2026' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MonthCloseStatus' }
        - name: scope
          in: query
          description: group = 只看全公司结账；community = 只看项目结账
          schema: { type: string, enum: [group, community] }
        - name: communityId
          in: query
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthClosePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [close]
      operationId: submitMonthClose
      summary: 提交月结（封账）
      description: |
        **幂等键是 `period`**：同一期间已结 → **409 / 40904**（不是 400，也不是覆盖写入）。
        因为「重复提交月结」和「参数写错」是两种完全不同的处置：前者要提示去看已有记录，后者要改参数。

        **支持按项目分别结账**（`communityId`）：物业公司按项目核算，一个项目账清了就能单独封。
        不传 `communityId` 就是全公司结账。

        校验顺序（错在哪一步就回哪一步，不要合成一句"参数错误"）：

        1. 期间不晚于当月（未来月份 → 422）；
        2. 该期间未结账（项目级看本项目，全公司级看全公司；已结 → 409/40904）；
        3. **全公司结账要求「有业务的项目」都已结**（→ 422，点名是哪几个项目）；
        4. 该期间有收款或有应收（全空 → 422，空月不必结）；
        5. 有未开票或欠费时 `memo` ≥ 4 字（→ 422，提示里点名具体笔数）。

        第 3 条是这条链的核心：汇总前明细没清，等于用总数掩盖某个项目的问题。
        「有业务」的判据是**当期有账单**——当期一笔账都没有的项目不参与，
        否则空项目永远结不掉，全公司就永远结不了。

        只有**全公司结账**才触发三张报表重算；项目级结账不动报表——
        报表是全公司口径，单个项目结完就宣布定稿是错的。

        **反结会级联**：全公司反结时，该期间的项目级结账一并置为已反结。
        只解汇总锁的话，项目明细还锁着，反结之后依然补录不了，等于白反。

        **权限**：`b.monthClose.edit`。项目经理**没有**这个权限：封账是财务动作，
        让项目经理封自己项目的账等于让他自己掩盖欠费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: '2026-10', description: 期间（YYYY-MM）}
                communityId:
                  type: string
                  description: 项目 ID；不传 = 全公司结账
                  example: P01
                memo: { type: string, description: 有未核销事项时必填，≥ 4 字 }
                operator: { type: string }
      responses:
        '201':
          description: 已结账
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该期间已结账（40904）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40904, message: '2026-09 已月结（YJ-202609-01），不能重复提交', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /month-closes/preview:
    get:
      tags: [close]
      operationId: previewMonthClose
      summary: 月结预览（结之前看这一屏就够，支持按项目）
      description: |
        **预览与提交必须用同一段计算**（同一函数），否则会出现"预览 1002 笔、结完记录写 998 笔"。
        返回 `closable` 让前端直接控制按钮，不要让前端自己再判一遍期间与状态。

        `prevNet` 是上个月净额，用来做环比；上月没结账就是 `null`——**不要给 0**，
        0 会被读成"上月净额为 0"。

        `unclosedCommunities` 只在**全公司预览**时非空：列出"有业务但还没结"的项目，
        前端据此提示"先去把这几个项目结了"。项目级预览返回空数组。
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, example: '2026-10' }
        - name: communityId
          in: query
          description: 项目 ID；不传 = 全公司口径
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthClosePreviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /month-closes/{closeId}:
    get:
      tags: [close]
      operationId: getMonthClose
      summary: 月结记录详情
      parameters:
        - name: closeId
          in: path
          required: true
          schema: { type: string, example: MC202609 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /month-closes/{closeId}/reopen:
    post:
      tags: [close]
      operationId: reopenMonthClose
      summary: 反结（红冲月结，恢复该期间可编辑）
      description: |
        **为什么允许反结**：月结后才发现上月漏了一笔收款是常态。不允许反结，
        结果是有人在数据库里改数——那才是真正的失控。允许，但要留痕。

        反结做四件事（同一事务）：

        1. 该记录置 `status=已反结`、`reopenedAt`、`reopenReason`，**记录不删**；
        2. 生成红冲凭证号 `reversalNo`（金额为该期净额的负数）。**不写进退款流水**：
           反结不是退款，塞进退款表会让「退款金额」统计失真；
        3. 该期间**报表批次标 `voided=true`**（保留可查，但不作为"最新成功批次"），
           报表立即回到 `provisional=true`；
        4. 该期间流水与账单恢复可写。

        约束：`reason` ≥ 10 字（要能说清为什么，不是"错了"两个字）；已反结的不能再反结（409 / 40905）。

        **权限**：`e.monthReopen.edit`——**刻意在 e 域而不是 b 域**。财务角色对 b 域是通配（`b.*`），
        反结是治理动作，不该被"管收费"这一个事实自动授予；放 b 域的结果是每个财务都静默获得推翻封账的能力。
        它是**按钮级**权限、不绑路由：绑了会抢走 `/b/month-close` 的页面守卫，两级授权就塌成一级。
        反结不限制次数，但每次都会出现在 `reopenCount` 里——反复反结本身就是要被看见的信号。
      parameters:
        - name: closeId
          in: path
          required: true
          schema: { type: string, example: MC202609 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
                operator: { type: string }
      responses:
        '200':
          description: 已反结
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该记录已反结（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40905, message: '2026-09 已于 2026-10-30 反结，不能重复反结', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ employees
  /employees:
    get:
      tags: [employees]
      operationId: listEmployees
      summary: 员工列表（手机 / 证件仅掩码，不含薪资）
      description: |
        排序：`empId` 升序稳定排序。人事翻档案时跳页位置会变，比"按更新时间"更烦人。

        `orgId` 筛选**含下级**：点「翡翠城项目部」要能看到四个班组的人，
        而不是只看到直接挂在项目部下面的 4 个主管。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/kw'
        - name: orgId
          in: query
          description: 组织 ID，含全部下级组织
          schema: { type: string, example: O-P01 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmploymentStatus' }
        - name: empType
          in: query
          schema: { $ref: '#/components/schemas/EmpType' }
        - name: position
          in: query
          schema: { type: string, example: 客服专员 }
        - name: roleId
          in: query
          schema: { type: string, example: R-CS }
        - name: dataScope
          in: query
          description: 按角色带来的数据范围筛（E 域「六档」视图用）
          schema:
            type: string
            enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
        - name: vf
          in: query
          description: |
            快捷视图。前五个与 `/employees/summary` 的分项同源；
            后三个是 E 域的"数据范围视图"（谁看得见全部项目 / 只看本部门 / 只看自己），
            这三个不能靠前端过滤——服务端分页时前端只能过滤当前页。
          schema:
            type: string
            enum: [onjob, probation, noRole, contractExpiring, contractExpired, selfOnly, deptOnly, groupAll]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [employees]
      operationId: createEmployee
      summary: 新增成员（工号服务端生成，默认不带角色）
      description: |
        工号**由服务端生成**，前端传了也忽略——两个人同时新增会拿到同一个号，
        而工号是考勤机、工资代发、社保申报的对账依据。

        新员工的角色**由岗位反推**（`roleSource=position`），不是建档案时手填的——
        岗位没配对应角色时才是「未分配」。岗位管人事、角色管权限，各管一段；
        建档案时顺手指定角色，改一次岗位就要手工改一遍权限。

        这里**不建系统账号**：档案是人事口径，账号开通是 E 域的另一条流程。
        建档案顺手把账号建出来，等于每次加人都在扩一次登录面。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, orgId, position]
              properties:
                name: { type: string, minLength: 2 }
                orgId: { type: string, description: 人事档案归属组织（项目部这一级） }
                position: { type: string }
                phone: { type: string, description: 手机号；给了就要唯一且格式正确 }
                email: { type: string }
                hireDate: { type: string, format: date }
                status: { $ref: '#/components/schemas/EmploymentStatus' }
                idCard: { type: string }
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 手机号已存在（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '手机号「13900001111」已被 EM0007 占用' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/summary:
    get:
      tags: [employees]
      operationId: getEmployeeSummary
      summary: 员工汇总（列表页 KPI）
      description: |
        与列表**同一套谓词**（带同样的筛选参数），否则会出现"总计 68、列表 12"这种对不上的首屏。
        `contractExpiring` 按 **30 天内到期**算：劳动合同到期不续签要提前一个月通知，
        等到过期才提醒，赔偿金已经产生了。
      parameters:
        - $ref: '#/components/parameters/kw'
        - name: orgId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmploymentStatus' }
        - name: empType
          in: query
          schema: { $ref: '#/components/schemas/EmpType' }
        - name: vf
          in: query
          schema:
            type: string
            enum: [onjob, probation, noRole, contractExpiring, contractExpired, selfOnly, deptOnly, groupAll]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/org-tree:
    get:
      tags: [employees]
      operationId: getEmployeeOrgTree
      summary: 组织树（含各节点人数，只读引用）
      description: |
        返回**根节点的下级**（集团下一层），不是单个集团节点——el-tree 默认折叠，
        只给一个根的结果是进页面看到一个"嘉合物业服务集团"，点开才是全部。

        `headcount` 含子树、`selfHeadcount` 只算直接挂在节点上的人。
        只给一个数的后果是：点「翡翠城项目部」显示 0 人（人都挂在班组），
        用户会以为这个项目部是空的。

        组织本身的增删改**不在本域**（见 `e.org.edit`），这里只做只读引用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgTreeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/options:
    get:
      tags: [employees]
      operationId: getEmployeeOptions
      summary: 员工下拉（选人池）
      description: |
        只回**可指派**的人（在职，`assignable=true`）。默认不回离职与试用？
        ——试用要回：试用期员工照样排班、照样能被指派巡检任务。
        离职不回：选了离职员工，任务派下去没人接，系统还得兜一个"执行人已离职"的异常状态。

        `teamId` 用于巡检监督任务的责任员工候选（只能选被检班组的人）。

        **不要求 `c.employees.view`**：这里只回姓名 / 岗位 / 班组，不含手机与证件。
        要求档案权限的后果是——班组长排不了班，因为他没有翻人事档案的权限。
      parameters:
        - name: teamId
          in: query
          description: 班组 / 部门 ID（`O-P01-T2` 这类）
          schema: { type: string, example: O-P01-T2 }
        - $ref: '#/components/parameters/kw'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeOptionsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/{empId}:
    get:
      tags: [employees]
      operationId: getEmployee
      summary: 员工档案详情（角色 / 组织路径 / 合同 / 出勤，不含薪资）
      description: |
        手机与证件**仍是掩码**。明文必须走 `POST /employees/{empId}/reveal`——
        详情页自动带明文的结果是：任何人打开一次员工档案，就批量拿走了个人信息，且没人知道是谁拿的。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      summary: 修改档案（一次提交多个字段）
      description: |
        **为什么是整包 `patch` 而不是单字段**：人事档案是一张表单一次改多项（转正 + 调级 + 续签同批发生）。
        逐字段提交会让版本号推进两次，第二次必冲突（40901），用户看到的是"我改了一次，系统说我被别人改了"。

        服务端**显式拒绝**（422）而不是静默忽略这三类字段：
        - `roleId` → 走 `PATCH /employees/{empId}/role`（要留"谁把谁提成了主管"的痕迹）；
        - `orgId` → 组织调动是**调岗单据**（带调出/调入确认、生效日），不是一个字段。本域暂不支持；
        - `baseSalary` / `monthlySalary` / `bankCard` → 工资域，改薪酬必须走审批。

        改 `phone` / `idCard` 必须带 `reason`（≥4 字）：这两个字段一改，
        考勤打卡、工资代发、门禁授权全部对不上，事后必须查得到为什么改。

        改 `position` 会**清除角色覆盖**并重算角色：调岗了还留着上一任的覆盖角色，
        等于人已经去工程组了，系统还让他批客服的假。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  description: 要改的字段；未出现的字段不动
                  additionalProperties: true
                ver:
                  type: integer
                  description: 乐观锁版本号（详情里的 `_ver`）；不一致 → 409/40901
                reason:
                  type: string
                  description: 改手机 / 证件时必填（≥4 字），写进访问日志
      responses:
        '200':
          description: 成功（返回改后的档案 + 角色重算结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突（40901）/ 手机号重复（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                version:
                  value: { code: 40901, message: '该员工档案已被他人修改，请刷新后重试' }
                unique:
                  value: { code: 40902, message: '手机号「17537157990」已被 EM0007 占用' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/{empId}/reveal:
    post:
      tags: [employees]
      operationId: revealEmployeeSensitive
      summary: 揭示手机 / 证件明文（必填原因，写访问日志）
      description: |
        **双权限**：`c.employees.view`（能看到这个人的档案）+ `a.sensitive.view`（能看敏感信息）。
        只校验后者是不够的——楼管为了联系业主本来就有 `a.sensitive.view`，
        只按能力位放行，他顺带就能批量导出员工身份证号。

        `reason` 必填（≥4 字）：不写原因就等于没有审计——日志里全是"查看详情"的揭示记录，
        出了事一样查不出谁在批量导出员工身份证号。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              properties:
                fields:
                  type: array
                  description: 要揭示的字段，只支持 phone / idCard
                  items: { type: string, enum: [phone, idCard] }
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitiveRevealEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/{empId}/role:
    patch:
      tags: [employees]
      operationId: updateEmployeeRole
      summary: 调整角色（写覆盖，不改岗位）
      description: |
        员工表**不存角色**：角色由岗位反推（岗位 → 角色的映射表在角色域维护）。
        这里的调整写一层**覆盖**，优先于岗位反推——岗位是人事口径，角色是权限口径，
        两者大多数时候一致，不一致时（例如财务主管临时兼管品质）需要一个不动机主档的做法。

        返回里带 `from` / `to` / `affected`：`affected` 是两个角色的最新人数，
        前端拿它刷新角色树，不用重新拉一遍列表。

        离职员工不能调角色（409/40910）：人已经走了，调角色要么是给错人提权，
        要么是把权限挂在离职账号上没回收。要调先把状态改回在职。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, example: R-SEC }
                reason: { type: string, description: 建议填写，用于权限变更留痕 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeRoleChangeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 离职员工不能调整角色（40910）/ 已是该角色（40911）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                left:
                  value: { code: 40910, message: 'EM0088 已于 2026-09-30 离职，不能调整角色；先恢复在职' }
                same:
                  value: { code: 40911, message: '该员工已是「部门经理」，无需调整' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ payrolls
  /payrolls:
    get:
      tags: [payroll]
      operationId: listPayrolls
      summary: 工资表（按账期）
      description: |
        **工资条是核算快照，不是查询结果**。每月生成一批、核算后冻结金额；
        实时算的结果是同一个人今天看 11,058.98、明天补录一条加班就变 11,120.31，
        员工截图来问"为什么少了 62 块"时，谁也说不清哪个对。

        不返回手机号与证件号——工资域要员工姓名是必要的，但**不该成为绕过员工域权限的后门**。
        银行卡只回 `**** **** **** 9381` 形态，完整卡号走 reveal 接口。

        **`dataScope=仅本人` 时只回自己那一条**（不是返回全表让前端藏）。
        工资表最容易被做错的就是这一步：列表下发全量、前端按权限隐藏——等于没做。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/kw'
        - name: period
          in: query
          description: 账期（YYYY-MM）。缺省取最新一期
          schema: { type: string, example: '2026-10' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayrollStatus' }
        - name: orgId
          in: query
          description: 组织 ID，含全部下级组织
          schema: { type: string, example: O-P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/summary:
    get:
      tags: [payroll]
      operationId: getPayrollSummary
      summary: 工资表汇总（列表页 KPI）
      description: |
        与列表同一套谓词。**已冲正的行不计入 `netTotal`**，单列在 `reversedCount` / `reversedAmount`——
        冲正的钱已经退回去了，还算在实发里就是账上凭空多出一笔。
      parameters:
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: orgId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/periods:
    get:
      tags: [payroll]
      operationId: listPayrollPeriods
      summary: 可选账期（月份下拉 + 状态徽标）
      description: |
        返回已生成过的账期及其状态。前端不需要自己推"哪几个月有工资表"——
        推出来的结果一定和实际生成的对不上（比如 8 月忘了生成，下拉里却有 8 月）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payrolls/generate:
    post:
      tags: [payroll]
      operationId: generatePayroll
      summary: 生成 / 重新核算某期工资表
      description: |
        `period` 不存在 → 生成一份草稿（201）。
        已存在且为草稿 → 只有 `overwrite=true` 才重算（200）；否则 409/40912。
        已核算 / 待审批 / 已发放 → 409/40913，**先反审或冲正**。
        已核算之后金额被改动，等于发过一次的钱和台账对不上。

        核算口径（`formulaVersion=v1`，与原型的 `payrollRows` 同一套）：
        应发 = 月度工资 + 加班费（基本工资 / 21.75 / 8 × 加班小时 × 1.5）；
        代扣 = 社保（基本工资 × 10.5%）+ 公积金（7%）+ 个税（应纳税所得额 × 3%，简化速算）+ 其他扣款。
        真接后台要把个税换成综合所得年度累计预扣，**税率表不能留在代码里**。

        离职当月工资不在本域：这类人要手工补录，自动生成会按"在职"过滤掉，发了就发错人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: '2026-10' }
                overwrite: { type: boolean, default: false, description: 草稿期重算时必填 true }
      responses:
        '201':
          description: 已生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollGenerateEnvelope' }
        '200':
          description: 已重算（草稿期 + overwrite）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollGenerateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该期已存在（40912）/ 已锁定不能重算（40913）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                exists:
                  value: { code: 40912, message: '2026-10 工资表已存在（80 人），重算需 overwrite=true' }
                locked:
                  value: { code: 40913, message: '2026-09 已核算（GZ-2026-09-01），不能重算；先冲正' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{period}/confirm:
    post:
      tags: [payroll]
      operationId: confirmPayroll
      summary: 核算锁定（草稿 → 已核算）
      description: |
        锁定的意义是"这批数字我看过了，可以发"。锁定后任何金额都不能再变，
        要改只能反审（未发放前）或冲正（已发放后）。

        返回里带 `employeeCount` / `netTotal`：核算前后必须一致，不一致说明算的时候数据又变了。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      responses:
        '200':
          description: 已核算
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是草稿（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '2026-09 当前状态「已发放」，只有草稿可以核算' }
  /payrolls/{period}/pay:
    post:
      tags: [payroll]
      operationId: submitPayrollPay
      summary: 提交发放（已核算 → 待发放审批）
      description: |
        提交发放 = 生成代发批次，进入审批。**不直接置为已发放**：
        工资发放是不可逆的资金流出，一个人点两下就发出去，事后只能靠冲正兜底。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payDate]
              properties:
                payDate: { type: string, format: date, example: '2026-11-10' }
                bankAccount: { type: string, description: 付款账户（可选，脱敏展示） }
                remark: { type: string }
      responses:
        '200':
          description: 已提交，等待审批
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是已核算（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '2026-10 当前状态「草稿」，需要先核算锁定' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{period}/approve:
    post:
      tags: [payroll]
      operationId: approvePayrollPay
      summary: 审批发放（通过 / 驳回）
      description: |
        **双人原则**：提交人不能审批自己提交的发放单（409/40915）。
        一个人既能核算又能批准自己的发放，等于没有审批——真出事时"谁批的"这一栏写的是同一个人。

        驳回要写原因（≥4 字），状态回到「已核算」，改完可重新提交。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, description: 驳回必填（≥4 字） }
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不是待审批（40914）/ 提交人不能审批自己的单（40915）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                state:
                  value: { code: 40914, message: '2026-10 当前状态「已核算」，没有待审批的发放单' }
                selfApprove:
                  value: { code: 40915, message: '发放单由 杜若曦 提交，不能由本人审批' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{payrollId}:
    get:
      tags: [payroll]
      operationId: getPayroll
      summary: 工资条详情（含计算过程）
      description: |
        `calc` 是**服务端算好的分解项**（应发几项、代扣几项、实发）。前端各拼一遍的结果是
        列表一个口径、工资条一个口径，员工对不上就来回问。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2610-0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/{payrollId}/reverse:
    post:
      tags: [payroll]
      operationId: reversePayroll
      summary: 单笔冲正（已发放 → 已冲正）
      description: |
        用于个别退票（银行卡失效、账户注销）。整批冲正按行逐条调用。

        冲正**不删除原记录**：它保留可查（`reversedAt` / `reverseReason`），但不计入汇总的
        `netTotal`。删掉的话，"这个月到底发出去多少钱"就永远差一笔说不清。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2609-0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, example: '银行卡已注销，代发退票，需重新收款' }
      responses:
        '200':
          description: 已冲正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是已发放（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: 'PR2610-0001 当前状态「草稿」，只有已发放的工资条可以冲正' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{payrollId}/reveal:
    post:
      tags: [payroll]
      operationId: revealPayrollBankCard
      summary: 揭示银行卡完整卡号（必填原因，写访问日志）
      description: |
        **双权限**：`c.payroll.view` + `a.sensitive.view`。只有敏感字段权限不够——
        能看业主手机的人不该顺带能把全公司银行卡号导出去。

        代发文件需要完整卡号，所以这个口子必须开；但也必须留下"谁在什么时候、为什么、
        看了谁的卡号"——银行卡泄露的后果比手机号严重得多。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2610-0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4, example: '制作 10 月代发文件' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankCardRevealEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ access
  /roles:
    get:
      tags: [access]
      operationId: listRoles
      summary: 角色列表（含实际使用人数与权限覆盖度）
      description: |
        `userCount` 不是角色表里的字段，是**按员工岗位反推出来的实际人数**（+ 人工覆盖）。
        角色表存一个数字、员工表存一份归属，两者迟早对不上——最后没人知道该信哪个。

        `coverage` = 已授权 / 全部权限位，用来横向比较"这个角色到底有多大"。
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [集团, 项目] }
        - name: dataScope
          in: query
          schema: { type: string, enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人] }
        - $ref: '#/components/parameters/kw'
        - name: vf
          in: query
          description: 快捷视图
          schema: { type: string, enum: [crossDomain, bigPerm, readonly, wideScope] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createRole
      summary: 新增角色（权限默认为空）
      description: |
        新建角色**不接受 `perms`**（传了 422）：新角色一次带一堆权限，没人会逐条看；
        而矩阵保存那条路有 diff、有日志、命中高敏还要审批。
        「先建空角色 → 再去矩阵里授权」看起来多一步，但那一步是被审计的。

        `dataScope` 默认 `仅本人`（最小可见范围）。默认给「全部项目」是很多系统出事的起点：
        建角色的人只想着"先能用"，没想"这等于能看到所有业主的证件号"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, minLength: 2 }
                scope: { type: string, enum: [集团, 项目] }
                dataScope:
                  type: string
                  enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
                communities:
                  type: array
                  items: { type: string }
                positions:
                  type: array
                  items: { type: string }
                desc: { type: string }
      responses:
        '201':
          description: 已新增（权限位为 0）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 角色名已存在（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '角色名称「客服专员」已存在' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{roleId}:
    get:
      tags: [access]
      operationId: getRole
      summary: 角色详情（权限矩阵 + 成员样本 + 可见范围 + 高敏持有）
      description: |
        `matrix` 按「域 → 功能 → 操作」三层展开，`on` 是该角色是否已授权。
        前端拿一份矩阵就能画权限树，不需要再拼一次。

        `posture.sensitive` 列出该角色持有的**高敏权限**——治理视图上第一眼要看的就是这个：
        「谁能看证件明文、谁能推翻封账、谁能改权限本身」。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [access]
      operationId: updateRole
      summary: 改角色基本信息（数据范围变更要审批）
      description: |
        **改 `dataScope` 也是扩权**，所以它和权限码一样要过审——只是方向不同：

        | 变化方向 | 处理 |
        |---|---|
        | 变窄（全部项目 → 本项目） | 200，立即生效 |
        | 变宽（本项目 → 全部项目） | **202，待审批**，权限/可见范围都不变 |
        | 同档但 `communities` 变了（指定项目换项目） | **202，待审批**——换项目就是换一批能看到的数据 |

        档位由窄到宽：
        `仅本人 < 本部门 < 责任范围 < 本项目 < 指定项目 < 全部项目`。
        「指定项目」排在「本项目」之上是保守取法：指定 3 个项目的人通常比只看得见 1 个项目部的人看得多。

        改名 / 备注不需要审批（不影响谁能看到什么）。

        不能改 `roleId` 与 `scope`：改 scope（集团 ↔ 项目级）会改变这个角色的适用面，
        那是新建角色的事。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                dataScope:
                  type: string
                  enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
                communities:
                  type: array
                  items: { type: string }
                desc: { type: string }
                reason: { type: string, description: 放宽时必填（≥4 字） }
      responses:
        '200':
          description: 已生效（改名 / 收紧范围）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '202':
          description: 已提交审批（放宽范围），**尚未生效**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容的申请在审批中（40916）/ 角色名重复（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条数据范围变更在审批中（REQ0005）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{roleId}/perms:
    put:
      tags: [access]
      operationId: saveRolePerms
      summary: 保存权限矩阵（提权要批、降权即时）
      description: |
        **全量替换**语义：请求体是保存后的完整权限码集合，服务端自己算 diff。
        让前端算 added/removed 的结果是两个人同时改一个角色时，第二个人把第一个人的改动覆盖掉还看不出来。

        三条规则（按顺序判）：

        1. **没有变化** → 200 `noChange=true`，不写日志。「原样保存」也记一条的结果是日志里全是噪声，
           真出事时翻不到那一条。
        2. **只有新增命中高敏白名单** → **202，不生效**，生成一条待审批的 `PermRequest`。
           五类高敏：能看证件明文 / 能推翻封账 / 能改权限本身 / 能改工资表 / 能改楼栋责任范围。
           这五个的共同点是「拿到就等于能自己扩权或掩盖问题」。
        3. **其余情况（纯降权，或新增的都是普通权限）** → **200，立即生效**并写日志。
           降权即时生效：一个人被收回权限还要等审批，这段时间里他能做的事一点没少。

        同一角色已有内容相同的待审批申请 → 409/40916（不要重复提，审批人会看到两条一样的）。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perms]
              properties:
                perms:
                  type: array
                  description: 保存后的完整权限码集合
                  items: { type: string }
                reason: { type: string, description: 提交审批时必填（≥4 字） }
      responses:
        '200':
          description: 已生效（纯降权 / 普通新增）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '202':
          description: 已提交审批，**权限尚未生效**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容在审批中（40916）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条相同内容的提权申请在审批中（REQ0003）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests:
    get:
      tags: [access]
      operationId: listPermRequests
      summary: 权限变更申请列表
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PermRequestStatus' }
        - name: roleId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createPermRequest
      summary: 单独提交提权申请（不经矩阵保存）
      description: |
        矩阵保存已在内部处理"要不要审批"，这个口子是给**批量/脚本场景**用的，
        比如一次给三个角色各加一个高敏权限时，先把申请提完再统一审。

        只接受**新增**做判断：`removed` 出现也一并记入单据，但不影响"要不要审批"——
        降权不需要谁批准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, added, reason]
              properties:
                roleId: { type: string, example: R-PM }
                added:
                  type: array
                  items: { type: string }
                removed:
                  type: array
                  items: { type: string }
                reason: { type: string, minLength: 4 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容在审批中（40916）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条相同内容的提权申请在审批中（REQ0003）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests/{reqId}/approve:
    post:
      tags: [access]
      operationId: approvePermRequest
      summary: 审批通过（权限此时才生效）
      description: |
        **双人原则**：提交人不能审批自己提交的申请（409/40917）。
        「一个人提、一个人批」是这条链路唯一的意义——自己提自己批，等于没有审批，
        而且日志里还会留下一次"审批通过"的假象。

        通过后：权限写入角色 → 写一条 `PermLog`（action=审批通过）→ 该角色下所有在线会话
        的菜单在下次刷新时按新权限重算。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: 已通过并生效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）/ 提交人不能审批自己的申请（40917）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                state:
                  value: { code: 40918, message: 'REQ0001 当前状态「已通过」，不能重复审批' }
                selfApprove:
                  value: { code: 40917, message: '该申请由「人事专员」提交，不能由同一个人审批' }
  /perm-requests/{reqId}/reject:
    post:
      tags: [access]
      operationId: rejectPermRequest
      summary: 驳回（权限不生效）
      description: 驳回要写原因（≥4 字）：申请人的下一步动作取决于"为什么不行"。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 已驳回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40918, message: 'REQ0001 当前状态「已驳回」，不能重复处理' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests/{reqId}/withdraw:
    post:
      tags: [access]
      operationId: withdrawPermRequest
      summary: 撤回（仅提交人、仅待审批）
      description: 撤回后单据留档（状态=已撤回），可以重新提交——重新提交会产生新单据，不复用旧号。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）/ 不是提交人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40918, message: 'REQ0001 当前状态「已通过」，不能撤回' }
  /perm-logs:
    get:
      tags: [access]
      operationId: listPermLogs
      summary: 权限变更留痕（每次改都记 diff）
      description: |
        记的是 **added / removed 的权限码**，不是"改过权限"四个字。
        只记后者的话，事后要回答"他到底被加了什么"还得去翻快照，而快照早被下一次覆盖了。
      parameters:
        - name: roleId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string, enum: [直接保存, 提交审批, 审批通过, 审批驳回] }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /access-logs:
    get:
      tags: [access]
      operationId: listAccessLogs
      summary: 敏感字段访问日志（只能是追加写 + 哈希链）
      description: |
        每条带 `hash` / `prevHash`：任何一条被改动，链上后面的 hash 都对不上。
        没有这个，「谁在什么时候看了谁的证件号」这条日志本身就可以被删掉。

        `result` 三态：`成功`（拿到明文）/ `脱敏`（无权限，只给掩码）/ `拦截`（导出超上限）。
        只记成功的话，看不出"有人在反复尝试"这件事。
      parameters:
        - name: action
          in: query
          schema: { type: string, enum: [查看明文, 导出] }
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/kw'
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /access-logs/summary:
    get:
      tags: [access]
      operationId: getAccessLogSummary
      summary: 访问日志汇总（列表页 KPI）
      description: |
        与列表同一套谓词。**不要前端 reduce**：日志是分页的，前端只能算当前页，
        出来的"揭示 20 次"其实是"本页 20 次"，这类数字比没有更糟。

        `blocked` 单独统计被拦截的次数——被拦的那些最值得看：有人在反复尝试拿不该拿的数据。
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /export-logs:
    get:
      tags: [access]
      operationId: listExportLogs
      summary: 导出日志（批量外发的唯一凭证）
      description: |
        导出是数据外流的主要通道，"谁在什么时候导了多少行出去"必须查得到。
        超过单次上限被拦的也要记——被拦的那些才最值得看。
      parameters:
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
        - name: days
          in: query
          description: 近 N 天（默认 7）；与 `/access-logs` 同口径，审计习惯是先看最近一周
          schema: { type: integer, default: 7 }
        - $ref: '#/components/parameters/kw'
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /data-scopes:
    get:
      tags: [access]
      operationId: listDataScopes
      summary: 数据范围六档（每档多少角色、多少人）
      description: |
        这张表就是"为什么这个账号只看得到自己那几栋"的答案。
        前端左树用它，不需要自己按角色分组再数一遍。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataScopeListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs:
    get:
      tags: [access]
      operationId: listOrgs
      summary: 组织列表（扁平，含人数）
      description: |
        扁平列表而不是树：建树是前端的事，服务端给「每个节点 + 它的上级 + 人数」就够。
        返回树的结果是——想按"某部门下所有班组"筛人时，还得把树再摊平一次。

        `headcount` 含子树、`selfHeadcount` 只算直接挂在节点上的人。
        这两列分开的理由见 `/employees/org-tree`：只给一个数，点项目部会显示 0 人（人都挂在班组）。
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [集团, 部门, 项目, 班组] }
        - name: parentId
          in: query
          description: 只看某个节点的直接下级
          schema: { type: string, example: O-P01 }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createOrg
      summary: 新增组织（部门 / 班组）
      description: |
        只允许新增 **部门** 与 **班组**：集团与项目要伴随「项目立项 / 公司设立」一整套动作
        （建楼栋、建科目、配人手），不是一个接口能建的。

        `orgId` 由服务端生成（`O-P01-T5` 这种），前端传了也忽略——
        组织 ID 会被员工、角色、合同反复引用，两个人同时新增撞号后无法修。

        同级重名拒绝（409/40902）：两个「工程组」挂在同一个项目部下，排班表上分不清谁是谁。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentId, type]
              properties:
                name: { type: string, minLength: 2 }
                parentId: { type: string, example: O-P01 }
                type: { type: string, enum: [部门, 班组] }
                leader: { type: string }
                sort: { type: integer, description: 同级排序，小的在前 }
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 同级重名（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '「翡翠城项目部」下已有「工程组」，同级不能重名' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orgs/{orgId}:
    patch:
      tags: [access]
      operationId: updateOrg
      summary: 修改组织（名称 / 负责人 / 排序 / 上级）
      description: |
        **不能改 `type`**：把「班组」改成「部门」会让挂在它下面的员工归属语义整体变化
        （班组成员走排班，部门成员走职能），改类型等于重挂一批人，那是组织调整单据，不是一个字段。

        **改上级要防环**（422）：把「工程组」的上级设成它自己的下级，组织树会变成孤岛——
        这些人在树上点不到，但列表里还在，最后没人解释得清"为什么这个人不在组织架构里"。

        改上级会让子树内所有人的组织路径变化，`orgPath` 是查询时算的，不需要回写。
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, example: O-P01-T2 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                leader: { type: string }
                sort: { type: integer }
                parentId: { type: string, description: 新上级；改它会移动整棵子树 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同级重名（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '同级已有「工程组」' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 只带身份与角色，**不带数据范围**；范围在查询时算。

  parameters:
    pageNo:
      name: pageNo
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    size:
      name: size
      in: query
      description: 每页条数，1..100（超限 400）
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    kw:
      name: kw
      in: query
      description: 关键字（各域命中的字段见接口说明）
      schema: { type: string }
    communityId:
      name: communityId
      in: query
      description: 项目 ID；不在数据范围内 → 403
      schema: { type: string, example: P01 }
    buildingId:
      name: buildingId
      in: query
      schema: { type: string, example: B0101 }
    unitId:
      name: unitId
      in: query
      schema: { type: string, example: U01101 }
    ownerId:
      name: ownerId
      in: path
      required: true
      schema: { type: string, example: OW00001 }
    houseId:
      name: houseId
      in: path
      required: true
      schema: { type: string, example: H010110101 }
    billId:
      name: billId
      in: path
      required: true
      schema: { type: string, example: BL000001 }
    payId:
      name: payId
      in: path
      required: true
      schema: { type: string, example: PM000001 }
    woId:
      name: woId
      in: path
      required: true
      schema: { type: string, example: WO000001 }
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, example: TN00001 }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, example: IT00001 }
    rectifyId:
      name: rectifyId
      in: path
      required: true
      schema: { type: string, example: RC0001 }
    checkId:
      name: checkId
      in: path
      required: true
      schema: { type: string, example: QC0001 }
    month:
      name: month
      in: query
      description: |
        按月看时点（仅时点型报表）：取该月最后一天 24:00 的余额。
        未月结的月份 `statDate` 落在今天并标 `provisional`。
      schema: { type: string, example: '2026-09' }
    year:
      name: year
      in: query
      description: 按年看时点（仅时点型报表）：取该年 12-31 的余额；当年未结束则算到今天并标 `provisional`。
      schema: { type: string, example: '2026' }
    periodType:
      name: periodType
      in: query
      description: 期次粒度（期间型报表）。缺省按日——向后兼容老的 `statDate` 调用。
      schema: { $ref: '#/components/schemas/ReportPeriodType' }
    period:
      name: period
      in: query
      description: 期次值。日=2026-10-21 / 月=2026-10 / 年=2026。与 `statDate` 互斥。
      schema: { type: string, example: '2026-10' }
    statDate:
      name: statDate
      in: query
      description: |
        报表统计日（YYYY-MM-DD）。缺省取**最新成功批次**；
        指定日期但该日没有成功批次 → 404 / 40402（不是回空表：空表和「没跑过」必须能区分）。
      schema: { type: string, format: date, example: '2026-10-21' }

  responses:
    BadRequest:
      description: 参数错误（分页越界、枚举非法、必填缺失）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40001, message: 'size 必须在 1..100 之间' }
    Unauthorized:
      description: 未登录 / 令牌过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40101, message: '登录已过期，请重新登录' }
    Forbidden:
      description: 无权限 / 超出数据范围（**不是空列表**）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40301, message: '无权查看「星光天地」的数据：超出当前数据范围' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40401, message: '业主不存在' }
    Conflict:
      description: |
        状态冲突。十七类，靠业务码区分——**处置方式完全不同，不能合并成一种提示**：

        | 码 | 含义 | 处置 |
        |---|---|---|
        | 40901 | 版本冲突（乐观锁） | 刷新重取 |
        | 40902 | 唯一约束冲突 | 改值 |
        | 40903 | 该期间已月结，数据只读 | 先反结（需更高权限） |
        | 40904 | 该期间已月结，不能重复提交 | 去看已有记录 |
        | 40905 | 该记录已反结，不能重复反结 | 无需处理 |
        | 40906 | 该合同已有变更在审批中 | 先处理那一单 |
        | 40907 | 已发布的公告不能修改 | 先撤回 |
        | 40908 | 当前状态不允许发布 | 看状态机 |
        | 40909 | 当前状态不允许撤回 | 看状态机 |
        | 40910 | 离职员工不能调角色 | 先恢复在职 |
        | 40911 | 该员工已是这个角色 | 无需处理 |
        | 40912 | 该期工资表已存在 | 重算需 overwrite=true |
        | 40913 | 已锁定（已核算 / 已发放），不能重算 | 先冲正 |
        | 40914 | 当前状态不允许该动作 | 看状态机 |
        | 40915 | 提交人不能审批自己提交的发放单 | 换人审批 |
        | 40916 | 同一角色已有相同内容的提权申请在审批中 | 等那条 |
        | 40917 | 提交人不能审批自己提交的权限申请 | 换人审批 |
        | 40918 | 申请状态不允许该动作 | 看状态 |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            version:
              value: { code: 40901, message: '该记录已被他人修改，请刷新后重试' }
            unique:
              value: { code: 40902, message: '手机号「13800138001」已存在，不能重复录入' }
            closedPeriod:
              value: { code: 40903, message: '2026-09 已月结（YJ-202609-01），该期间数据只读，请先反结' }
            alreadyClosed:
              value: { code: 40904, message: '2026-09 已月结（YJ-202609-01），不能重复提交' }
            alreadyReopened:
              value: { code: 40905, message: '2026-09 已于 2026-10-30 反结，不能重复反结' }
    Unprocessable:
      description: 业务校验失败（原因必填、金额超限、状态不允许等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 42201, message: '退款金额不能超过可退金额 120' }

  schemas:
    # ---------------- 通用 ----------------
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 五位业务码，见 info.description 的错误码表
        message: { type: string }
        details:
          type: array
          description: 逐条失败明细（批量操作）
          items:
            type: object
            properties:
              id: { type: string }
              reason: { type: string }
        traceId: { type: string }
    Page:
      type: object
      required: [rows, total, pageNo, size]
      properties:
        rows: { type: array, items: {} }
        total: { type: integer }
        pageNo: { type: integer }
        size: { type: integer }
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, description: 0 = 成功 }
        message: { type: string }
        data: {}
    BatchResult:
      type: object
      required: [ok, failed, total]
      properties:
        ok: { type: integer, description: 成功条数 }
        failed:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string, example: '该账单没有欠费，无需催缴' }
        total: { type: integer }
        batchNo: { type: string, example: CJ2610187 }

    # ---------------- 枚举（与 enums.json 同源） ----------------
    BillStatus:
      type: string
      enum: [未缴, 部分缴, 已缴, 逾期, 已减免, 已作废]
    PayMethod:
      type: string
      enum: [现金, 微信支付, 支付宝, POS刷卡, 银行代扣, 预存抵扣]
    InvoiceStatus:
      type: string
      enum: [未开票, 已开票, 已冲红]
    WoStatus:
      type: string
      enum: [待派单, 已派单, 处理中, 待确认, 已完工, 已关闭, 已评价, 已取消]
    WoType:
      type: string
      enum: [入户维修, 公共区域维修, 报事, 投诉建议, 咨询, 其他]
    WoPriority:
      type: string
      enum: [特急, 紧急, 普通, 低]
      description: 缺省 SLA：特急 2h / 紧急 4h / 普通 24h / 低 48h（按工作日历，非自然小时）

    TenantVerifyStatus:
      type: string
      enum: [待核验, 已核验, 信息不全]
    TenantSource:
      type: string
      enum: [业主自助, 物业补录]
    InspectStatus:
      type: string
      enum: [待执行, 执行中, 已完成, 逾期, 已转工单]
    InspectPost:
      type: string
      enum: [环境, 安保, 工程, 客服, 保洁, 保安]
      description: 环境/安保/工程/客服为新称；保洁/保安为历史数据里的旧称，仅兼容
    RectifyStatus:
      type: string
      enum: [待整改, 待复核, 已闭环, 已退回]
    RectifyLevel:
      type: string
      enum: [轻微, 一般, 重大]

    # ---------------- 鉴权 ----------------
    LoginResult:
      type: object
      required: [token, refreshToken, expiresIn, user]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 秒 }
        user:
          type: object
          required: [empId, name, roleId, roleName, permissions, dataScope]
          properties:
            empId: { type: string, example: EM0001 }
            name: { type: string, example: 雷志强 }
            roleId: { type: string, example: R-PM }
            roleName: { type: string, example: 项目经理 }
            permissions:
              type: array
              items: { type: string }
              description: 权限码，如 ['a.owners.view','b.bills.edit']
            dataScope:
              type: string
              enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
            communities:
              type: array
              items: { type: string }
              description: 数据范围为「指定项目 / 本项目」时的项目清单

    # ---------------- 业主 ----------------
    Owner:
      type: object
      required: [ownerId, name, phone, houseCount]
      properties:
        ownerId: { type: string }
        name: { type: string }
        phone: { type: string, description: 列表接口回掩码，详情接口回明文 }
        idCard: { type: string }
        gender: { type: string, enum: [男, 女] }
        ownerType: { type: string, example: 个人 }
        certified: { type: boolean, description: 实名认证 }
        faceRegistered: { type: boolean, description: 人脸录入 }
        appRegistered: { type: boolean }
        creditLevel: { type: string, example: 'A' }
        registerDate: { type: string, format: date }
        houseCount: { type: integer }
        houseNames:
          type: array
          items: { type: string }
        debtAmount: { type: number, description: 名下房屋未收合计 }
        phoneRedacted: { type: boolean, description: true 表示 phone 是掩码 }
        idCardRedacted: { type: boolean }
        _ver: { type: integer, description: 乐观锁版本，PATCH 时回传 }

    # ---------------- 房屋 ----------------
    House:
      type: object
      required: [houseId, communityId, buildingId, fullName]
      properties:
        houseId: { type: string }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        room: { type: string }
        floor: { type: integer }
        fullName: { type: string, example: '翡翠城 1栋1单元0101' }
        shortName: { type: string }
        usage: { type: string, example: 住宅 }
        houseType: { type: string, example: 两室一厅 }
        area: { type: number }
        innerArea: { type: number }
        deliverStatus: { type: string }
        useStatus: { type: string, example: 自住 }
        propertyStatus: { type: string }
        ownerId: { type: [string, 'null'] }
        tenantId:
          type: [string, 'null']
          description: 在住租户；null / 空串 = 无
        stewardEmpId: { type: string, description: 责任楼管（数据范围的依据） }
        stewardName: { type: string }

    # ---------------- 账单 ----------------
    Bill:
      type: object
      required: [billId, period, status, payable, paidAmount, unpaid]
      properties:
        billId: { type: string }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        houseId: { type: string, description: 车位账单为空 }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        period: { type: string, example: '2026-10' }
        status: { $ref: '#/components/schemas/BillStatus' }
        itemId: { type: string }
        itemName: { type: string }
        unit: { type: string }
        quantity: { type: number }
        price: { type: number }
        amount: { type: number, description: 应收金额（未计减免） }
        discount: { type: number }
        lateFee: { type: number }
        payable: { type: number, description: 应收 = 已收 + 未收 }
        paidAmount: { type: number }
        unpaid: { type: number }
        overdueDays: { type: integer }
        dueDate: { type: string, format: date }
        payTime: { type: string }
        createTime: { type: string }
        subjectType: { type: string, enum: [house, park] }
        _ver: { type: integer }
    BillSummary:
      type: object
      required: [count, payable, unpaid, debtCount, overdueCount]
      properties:
        count: { type: integer, description: 账单张数 }
        payable: { type: number }
        unpaid: { type: number }
        debtCount: { type: integer, description: 有欠费的张数 }
        overdueCount: { type: integer }

    # ---------------- 缴费 ----------------
    Payment:
      type: object
      required: [payId, billId, amount, method, payTime]
      properties:
        payId: { type: string }
        billId: { type: string }
        houseId: { type: string }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        subjectType:
          type: string
          enum: [house, park]
          description: 承载对象类型；车位费没有 houseId，列表要能区分
        communityName: { type: string }
        communityId: { type: string }
        amount: { type: number }
        method: { $ref: '#/components/schemas/PayMethod' }
        channel: { type: string }
        transNo: { type: string }
        operator: { type: string }
        payTime: { type: string, example: '2026-10-21 10:20' }
        invoiceStatus: { $ref: '#/components/schemas/InvoiceStatus' }
        invoiceNo: { type: string }
        subject: { type: string, description: 承载对象（房屋全名 / 车位编号） }
        itemName: { type: string }
        period: { type: string }
        refundAmount: { type: number, description: 已退款合计 }
        refundStatus: { type: string, enum: ['', 部分退款, 已全额退款] }
      example:
        payId: PM000001
        billId: BL000001
        amount: 322.39
        method: 支付宝
        payTime: '2026-08-30'
        invoiceStatus: 已开票
    Refund:
      type: object
      required: [refundId, refundNo, payId, amount, kind, reason, at]
      properties:
        refundId: { type: string, example: RF00001 }
        refundNo: { type: string, example: TK-2026-10-30-001 }
        payId: { type: string }
        billId: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        houseName: { type: string }
        amount: { type: number }
        kind: { type: string, enum: [全额, 部分] }
        reason: { type: string }
        operator: { type: string }
        at: { type: string }
        invoiceRedFlushed: { type: boolean, description: 是否同时红冲了发票 }

    # ---------------- 工单 ----------------
    WorkOrder:
      type: object
      required: [woId, woNo, communityId, type, priority, status, title, createTime, slaDueAt, slaBreached]
      properties:
        woId: { type: string }
        woNo: { type: string, example: BX202600001 }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        houseId: { type: string }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        type: { $ref: '#/components/schemas/WoType' }
        category: { type: string, example: 水管漏水 }
        source: { type: string, enum: [小程序, 前台, 电话, 巡检转单] }
        priority: { $ref: '#/components/schemas/WoPriority' }
        status: { $ref: '#/components/schemas/WoStatus' }
        title: { type: string }
        description: { type: string }
        dispatchMode: { type: string, example: 自动派单 }
        assignee: { type: string }
        createTime: { type: string }
        acceptTime: { type: string }
        arriveTime: { type: string }
        finishTime: { type: string }
        slaHours: { type: integer }
        slaDueAt:
          type: string
          description: SLA 到期时间，**由服务端按工作日历算好下发**（前端不算，避免两边算法不一致）
        slaUsedHours: { type: number }
        slaBreached: { type: boolean, description: 停表（待确认）期间不计超时 }
        feeType: { type: string, enum: [收费, 免费] }
        materialFee: { type: number }
        laborFee: { type: number }
        totalFee: { type: number }
        payStatus: { type: string, enum: [未支付, 已支付, 已挂账, 无需支付] }
        score: { type: integer, description: 满意度评分 0..5 }
        isPublic: { type: boolean, description: 是否公共区域工单（无房屋归属） }
        _ver: { type: integer }
    WorkOrderSummary:
      type: object
      required: [total, open, overdue, pending]
      properties:
        total: { type: integer }
        open: { type: integer, description: 未闭环（不含已取消） }
        overdue: { type: integer, description: 未闭环且 SLA 已超时（停表不计） }
        pending: { type: integer, description: 待派单 }
        urgent: { type: integer, description: 剩余不足 SLA 20% }
        paused: { type: integer, description: 停表（待确认） }

    QualityGrade:
      type: string
      enum: [优秀, 良好, 合格, 不合格]
      description: ≥90 优秀 / ≥80 良好 / ≥70 合格 / <70 不合格
    QualityStatus:
      type: string
      enum: [已闭环, 整改中, 待复核, 已超时]

    # ---------------- 品质 ----------------
    QualityCheck:
      type: object
      required: [checkId, checkNo, communityId, area, checkDate, score, grade, status]
      properties:
        checkId: { type: string }
        checkNo: { type: string, example: QZ-2026-10-0001 }
        communityName: { type: string, description: 服务端带出项目名，列表直接显示（别让前端拿 id 猜） }
        communityId: { type: string }
        area: { type: string, example: 安保 }
        type: { type: string, description: 检查类型（日常巡检 / 专项检查 / 交叉检查） }
        checker: { type: string }
        checkDate: { type: string, format: date }
        period: { type: string, example: '2026-10' }
        score: { type: number }
        grade: { $ref: '#/components/schemas/QualityGrade' }
        deductCount: { type: integer, description: 扣分项数 }
        veto: { type: boolean, description: 一票否决 }
        rectifyCount: { type: integer, description: 应整改项数 }
        rectifyDone: { type: integer, description: 已整改项数 }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/QualityStatus' }
        recheck: { type: boolean, description: 是否已复查 }
        sourceType: { type: string, enum: [现场抽查, 任务评价] }
        _ver: { type: integer }

    # ---------------- 租户 ----------------
    TenantCompleteness:
      type: object
      required: [total, filled, missing, rate, basicTotal, basicFilled, missingBasic]
      properties:
        total: { type: integer, description: 完整度总项数（8 项） }
        filled: { type: integer }
        missing:
          type: array
          items: { type: string }
        rate: { type: number, description: 完整度百分比 }
        basicTotal: { type: integer, description: 核验门槛项数（5 项） }
        basicFilled: { type: integer }
        missingBasic:
          type: array
          items: { type: string }
          description: 核验门槛缺项；非空时 verify 会 422
    Tenant:
      type: object
      required: [tenantId, name, phone, status, verifyStatus, source]
      properties:
        tenantId: { type: string }
        name: { type: string }
        phone: { type: string, description: 列表回掩码，详情回明文 }
        idCard: { type: string }
        houseId: { type: string }
        houseName: { type: string }
        communityId: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        ownerPhone: { type: string }
        leaseStart: { type: string, format: date }
        leaseEnd: { type: string, format: date }
        relation: { type: string, example: 承租人 }
        residents: { type: integer }
        source: { $ref: '#/components/schemas/TenantSource' }
        verifyStatus: { $ref: '#/components/schemas/TenantVerifyStatus' }
        certified: { type: boolean }
        faceRegistered: { type: boolean }
        status: { type: string, enum: [在住, 已搬离] }
        emergencyContact: { type: string }
        verifiedBy: { type: string }
        verifiedAt: { type: string }
        moveOutAt: { type: string }
        moveOutReason: { type: string }
        completeness: { $ref: '#/components/schemas/TenantCompleteness' }
        phoneRedacted: { type: boolean }
        idCardRedacted: { type: boolean }
        _ver: { type: integer }

    # ---------------- 巡检 ----------------
    InspectIssueItem:
      type: object
      required: [item]
      properties:
        item: { type: string, description: 问题项名称 }
        deduct: { type: number }
        responsibleName: { type: string }
        responsibleEmpId: { type: string, description: 监督任务的 NG 项必须有人，否则考核归不到人 }
    InspectResult:
      type: object
      required: [item, result]
      properties:
        item: { type: string }
        result: { type: string, enum: [合格, 不合格] }
        deduct: { type: number }
        responsibleEmpId: { type: string }
        responsibleName: { type: string }
        memo: { type: string }
    InspectTask:
      type: object
      required: [taskId, planName, taskType, status, scheduledDate, executor]
      properties:
        taskId: { type: string }
        planId: { type: string }
        planName: { type: string }
        post: { $ref: '#/components/schemas/InspectPost' }
        communityId: { type: string }
        executor: { type: string }
        executorOrgId: { type: string }
        templateId: { type: string }
        taskType: { type: string, enum: [执行, 监督] }
        targetPost: { type: string }
        targetDept: { type: string }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string }
        status: { $ref: '#/components/schemas/InspectStatus' }
        doneTime: { type: string }
        duration: { type: integer }
        itemCount: { type: integer }
        normalCount: { type: integer }
        issueCount: { type: integer }
        photos: { type: integer }
        checkinType: { type: string, example: GPS围栏 }
        checkedIn: { type: boolean }
        score: { type: number }
        refWoId: { type: string }
        conflictFlag: { type: boolean, description: 下属当日报零异常却被查出问题（申报不实） }
        issueItems:
          type: array
          items: { $ref: '#/components/schemas/InspectIssueItem' }
        _ver: { type: integer }

    # ---------------- 整改 ----------------
    RectifyItem:
      type: object
      required: [no, desc, done]
      properties:
        no: { type: integer }
        desc: { type: string }
        done: { type: boolean }
    RectifyOrder:
      type: object
      required: [rectifyId, rectifyNo, status, level, items, dueDate]
      properties:
        rectifyId: { type: string }
        rectifyNo: { type: string, example: ZG-2026-10-0001 }
        checkId: { type: string }
        checkNo: { type: string }
        communityId: { type: string }
        deptName: { type: string }
        area: { type: string }
        level: { $ref: '#/components/schemas/RectifyLevel' }
        status: { $ref: '#/components/schemas/RectifyStatus' }
        sourceType: { type: string, example: 现场抽查 }
        items:
          type: array
          items: { $ref: '#/components/schemas/RectifyItem' }
        issueDesc: { type: string }
        createdAt: { type: string }
        dueDate: { type: string, format: date }
        submitAt: { type: string }
        recheckAt: { type: string }
        recheckResult: { type: string }
        overdue: { type: boolean, description: 超期未整改（派生字段） }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
        _ver: { type: integer }

    QualityEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/QualityCheck' }
    QualityPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/QualityCheck' }
    QualityDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [check]
              properties:
                check: { $ref: '#/components/schemas/QualityCheck' }
                rectifies:
                  type: array
                  description: 由这次检查开出的整改单（可能为空）
                  items: { $ref: '#/components/schemas/RectifyOrder' }

    # ---------------- 汇总（列表页 KPI / 范围小计） ----------------
    PaymentSummary:
      type: object
      required: [count, amount]
      properties:
        count: { type: integer, description: 筛选后的流水笔数 }
        amount: { type: number, description: 筛选后的收款合计 }
        cashCount: { type: integer }
        cashAmount: { type: number, description: 现金实点要跟这个数对 }
        uninvoicedCount: { type: integer }
        refundAmount: { type: number, description: 已退金额（含部分退） }
        todayCount: { type: integer }
        todayAmount: { type: number }
        monthCount: { type: integer }
        monthAmount: { type: number }
        invoiced: { type: integer }
        byMethod:
          type: array
          description: 按收款方式分组（日结对账用）
          items:
            type: object
            required: [method, count, amount]
            properties:
              method: { type: string }
              count: { type: integer }
              amount: { type: number }
        byChannel:
          type: array
          description: 按渠道分组
          items:
            type: object
            required: [channel, count, amount]
            properties:
              channel: { type: string }
              count: { type: integer }
              amount: { type: number }
    QualitySummary:
      type: object
      required: [count, avgScore]
      properties:
        count: { type: integer }
        avgScore: { type: number, description: 筛选集平均分（一位小数） }
        qualified: { type: integer }
        unqualified: { type: integer, description: 不合格数，**含一票否决** }
        rectifying: { type: integer }
        overdue: { type: integer }
        recheck: { type: integer }
        veto: { type: integer }

    # ---------------- 保留与清理 ----------------
    ReportRetentionType:
      type: object
      required: [periodType, total, expired, protectedClosed]
      properties:
        periodType: { $ref: '#/components/schemas/ReportPeriodType' }
        keep:
          type: string
          description: 保留策略的人话说明（日 90 天 / 月 24 期 / 年永久）
        total: { type: integer, description: 当前该粒度的成功批次总数（含作废） }
        oldest: { type: string, description: 最早期间 }
        newest: { type: string, description: 最新期间 }
        expired: { type: integer, description: 已过期、下次清理会删的批次数 }
        protectedClosed:
          type: integer
          description: 已过期但**受保护**（该期间已月结）的批次数。这部分不会删，别让它混进 expired
    ReportRetention:
      type: object
      required: [keepDays, keepMonths, byType]
      properties:
        keepDays: { type: integer, example: 90 }
        keepMonths: { type: integer, example: 24 }
        byType:
          type: array
          items: { $ref: '#/components/schemas/ReportRetentionType' }
    ReportPurge:
      type: object
      required: [removed, keptProtected, dryRun]
      properties:
        removed: { type: integer, description: 删除的批次数（dryRun 时为"将删除"） }
        keptProtected: { type: integer, description: 因已月结而保住的批次数 }
        dryRun: { type: boolean }
        batches:
          type: array
          description: 被清理（或将要清理）的批次号，最多回 50 条，便于核对
          items: { type: string }

    # ---------------- 员工 ----------------
    EmploymentStatus:
      type: string
      enum: [在职, 试用, 离职]
      description: |
        `离职` 是**终态**：不可指派、不可调角色、不再计入任何"在岗"口径。
        转正只是 `试用 → 在职`，走档案修改，不产生新记录。
    EmpType:
      type: string
      enum: [正式, 试用, 劳务, 实习]
      description: 用工形式。与 `status` 正交——劳务也可以是「在职」，实习也可以已经「离职」
    RoleSource:
      type: string
      enum: [position, override]
      description: |
        角色从哪来：`position` = 由岗位反推；`override` = 人工调整过。
        前端凭它能决定要不要显示「恢复按岗位」——没有来源标记，用户不知道该恢复成什么。
    Employee:
      type: object
      required: [empId, empNo, name, orgId, position, status, assignable]
      properties:
        empId: { type: string, example: EM0001 }
        empNo:
          type: string
          description: 工号，服务端生成且**不可改**（考勤机、工资代发、社保申报都按工号对账）
          example: J240001
        name: { type: string }
        gender: { type: string, enum: [男, 女] }
        phone:
          type: string
          description: 手机号，**列表恒为掩码**（`195****7588`）；明文走 reveal 接口
        phoneRedacted: { type: boolean, description: true = 当前是掩码值 }
        idCard:
          type: string
          description: 证件号，**列表恒为掩码**（前 4 后 4）；明文走 reveal 接口
        idCardRedacted: { type: boolean }
        homeOrgId:
          type: string
          description: |
            人事档案上的组织（员工表里存的那个，人挂到项目部这一级）。
            与 `orgId` 分开是因为「档案归属」和「实际排班归属」不是一回事：
            合并成一个字段的结果是——班组调整会把人事档案的归属也改掉，人力对不上花名册。
        orgId:
          type: string
          description: 实际归属（岗位反推出的班组 / 职能部门）。筛选、树计数都用这个
        orgName: { type: string }
        orgPath:
          type: string
          description: 组织全路径，服务端拼（`集团 / 翡翠城项目部 / 工程组`）
        teamId:
          type: string
          description: 班组 / 部门 ID（`O-P01-T2`）；总部职能岗为空
        projName: { type: string, description: 所属项目名；总部员工为「总部职能」 }
        position: { type: string, example: 客服专员 }
        level: { type: string, description: 职级，如 P5 / M2 }
        empType: { $ref: '#/components/schemas/EmpType' }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        entryDate: { type: string, format: date }
        regularDate:
          type: [string, 'null']
          description: 转正日期；试用期员工为空
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        contractDaysLeft:
          type: [integer, 'null']
          description: |
            距合同到期天数；**已过期为负数**（不给 0——0 天和"今天到期"分不清）。
            未签合同（刚入职）为 null。
        contractExpired: { type: boolean }
        contractExpiring:
          type: boolean
          description: 30 天内到期且未离职。续签提醒按这个字段筛，不按天数现算
        managerName: { type: string, description: 上级姓名（样例数据里只存姓名） }
        managerEmpId:
          type: [string, 'null']
          description: 上级的工号，服务端按姓名解析；解析不到给 null（不猜）
        roleId:
          type: [string, 'null']
          description: 角色 ID；离职或未匹配到岗位时为空
        roleName: { type: string, description: 未分配时为「未分配」 }
        roleSource:
          oneOf:
            - { $ref: '#/components/schemas/RoleSource' }
            - { type: 'null' }
        dataScope: { type: [string, 'null'], description: 角色带来的数据范围（六档） }
        permCount: { type: integer, description: 角色的权限位数 }
        socialSecurity: { type: boolean, description: 社保是否已缴 }
        attendance:
          type: object
          description: 本月考勤汇总（明细在考勤域）
          properties:
            late: { type: integer }
            leaveDays: { type: number }
            overtimeHours: { type: number }
        score: { type: integer, description: 绩效分（0–100） }
        assignable:
          type: boolean
          description: 是否可被指派（在职 = true）。任务派给离职员工的后果是没人接单
        roleRecalculated:
          type: object
          description: 本次修改导致的角色重算结果（只有 PATCH 出现；没发生变化则不返回）
          properties:
            from: { type: string }
            to: { type: string }
            reason: { type: string, example: '岗位变更，已清除角色覆盖并按新岗位重算' }
        _ver: { type: integer, description: 乐观锁版本号，修改时回传 }
    EmployeeSummary:
      type: object
      required: [total, onjob, probation, left, noRole, contractExpiring, contractExpired]
      properties:
        total: { type: integer }
        onjob: { type: integer }
        probation: { type: integer }
        left: { type: integer }
        noRole: { type: integer, description: 没有角色的员工数——权限治理要先看这个数 }
        contractExpiring: { type: integer, description: 30 天内到期（在职） }
        contractExpired: { type: integer, description: 合同已过期仍在职（该续签了） }
        orgCount: { type: integer }
        teamCount: { type: integer }
        roleCount: { type: integer }
        permCount: { type: integer, description: 权限位总数（分母） }
        selfOnly: { type: integer, description: 数据范围为「仅本人」的员工数 }
        deptOnly: { type: integer }
        groupAll: { type: integer, description: 可见全部项目的员工数——越小越安全 }
    OrgNode:
      type: object
      required: [orgId, name, type, headcount, selfHeadcount]
      properties:
        orgId: { type: string, example: O-P01 }
        name: { type: string }
        parentId: { type: string, description: 上级组织；集团节点为空串（建树要用） }
        sort: { type: integer, description: 同级排序，小的在前 }
        type: { type: string, enum: [集团, 部门, 项目, 班组] }
        leader: { type: string }
        headcount: { type: integer, description: 含全部下级的人数（树上的数字） }
        selfHeadcount: { type: integer, description: 只算直接挂在本节点上的人 }
        children:
          type: array
          items: { $ref: '#/components/schemas/OrgNode' }
    EmployeeOptionsItem:
      type: object
      required: [empId, name, assignable]
      properties:
        empId: { type: string }
        name: { type: string }
        label: { type: string, description: '姓名 · 岗位，前端直接渲染' }
        position: { type: string }
        teamId: { type: string }
        orgName: { type: string }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        assignable: { type: boolean }
    EmployeeDetail:
      type: object
      required: [employee, org, contract]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        role:
          type: object
          description: 角色的权限摘要；未分配角色时为空对象
          properties:
            roleId: { type: string }
            name: { type: string }
            scope: { type: string }
            dataScope: { type: string }
            permCount: { type: integer }
            domains:
              type: array
              items: { type: string }
              description: 覆盖的业务域名称（「主要管哪几块」）
        org:
          type: object
          required: [name, path]
          properties:
            name: { type: string }
            path: { type: string }
            leader: { type: string }
            teamId: { type: string }
        contract:
          type: object
          required: [start, end, daysLeft, expired]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
            daysLeft: { type: integer, description: 负数为已过期 }
            expired: { type: boolean }
        attendance: { type: object }
        certificates:
          type: array
          items: { type: string }
        related:
          type: object
          description: |
            关联单据概览。薪酬只给「有几条」，不给「多少钱」——
            给了金额，员工域就成了绕过工资域权限的后门。
          properties:
            contracts: { type: integer, description: 劳动合同份数 }
            payrollRecords:
              type: [integer, 'null']
              description: |
                工资条条数。**员工域恒为 null**——这个数属工资域统计。
                不返回 0：0 会被读成「有工资条但一条都没生成」，与「本域不管这事」是两码事。
        roleRecalculated:
          type: object
          description: 本次改岗位导致的角色重算结果（只有 PATCH 时出现）
          properties:
            from: { type: string }
            to: { type: string }
            reason: { type: string, example: '岗位变更，已清除角色覆盖并按新岗位重算' }
    EmployeeRoleChange:
      type: object
      required: [employee, from, to, affected]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        from:
          type: object
          properties:
            roleId: { type: [string, 'null'] }
            roleName: { type: string }
        to:
          type: object
          properties:
            roleId: { type: string }
            roleName: { type: string }
            permCount: { type: integer }
            dataScope: { type: string }
        affected:
          type: array
          description: 受影响角色的最新人数（两个角色），前端据此刷新角色树
          items:
            type: object
            properties:
              roleId: { type: string }
              roleName: { type: string }
              userCount: { type: integer }
    SensitiveReveal:
      type: object
      required: [empId, fields, reason, accessLogId]
      properties:
        empId: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [phone, idCard] }
              label: { type: string }
              value: { type: string, description: 明文 }
        reason: { type: string }
        operator: { type: string }
        shownAt: { type: string }
        accessLogId:
          type: string
          description: 访问日志 ID。**没有它这次揭示就是没留痕**，等于没发生

    # ---------------- 工资 ----------------
    PayrollStatus:
      type: string
      enum: [草稿, 已核算, 待发放审批, 已发放, 已冲正]
      description: |
        单向状态机，冲正是终态：

        草稿 →（核算锁定）已核算 →（提交发放）待发放审批 →（审批通过）已发放 →（冲正）已冲正
        驳回：待发放审批 → 已核算

        任何一步都不能跳。没核算就发，等于按草稿数字打钱；已核算还能改金额，
        等于发一次钱记两本账。
    Payroll:
      type: object
      required: [payrollId, period, empId, empName, grossPay, netPay, status]
      properties:
        payrollId: { type: string, example: PR2610-0001 }
        period: { type: string, description: 账期 YYYY-MM, example: '2026-10' }
        batchNo:
          type: string
          description: 代发批次号；未提交发放时为空
          example: GZ-2026-10-01
        empId: { type: string }
        empNo: { type: string }
        empName: { type: string }
        orgId: { type: string }
        orgName: { type: string }
        position: { type: string }
        level: { type: string }
        empType: { $ref: '#/components/schemas/EmpType' }
        base: { type: number, description: 基本工资 }
        performance: { type: number, description: 绩效（月度应发 - 基本工资） }
        overtime: { type: number, description: 加班费 }
        allowance: { type: number, description: 补贴 }
        grossPay:
          type: number
          description: 应发 = base + performance + overtime + allowance（服务端算，别前端加）
        socialInsurance: { type: number, description: 社保个人部分 }
        housingFund: { type: number, description: 公积金个人部分 }
        tax: { type: number, description: 个税 }
        otherDeduction: { type: number, description: 其他扣款（宿舍费 / 工装等） }
        deductionTotal: { type: number, description: 代扣合计 }
        netPay: { type: number, description: 实发 = grossPay - deductionTotal }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        paidAt: { type: string, description: 发放时间；未发放为空 }
        paidBy: { type: string }
        submittedBy: { type: string, description: 提交发放的人（审批时用来判双人原则） }
        reversedAt: { type: string }
        reverseReason: { type: string }
        bankCardMasked:
          type: string
          description: 银行卡掩码（只到后四位）。完整卡号走 reveal 接口
          example: '**** **** **** 9381'
        bankCardTail: { type: string, example: '9381' }
        formulaVersion:
          type: string
          description: 核算公式版本。税率表换了版本要能说清"这批是按哪版算的"
        _ver: { type: integer }
    PayrollSummary:
      type: object
      required: [period, employeeCount, grossTotal, deductionTotal, netTotal]
      properties:
        period: { type: string }
        batchNo: { type: string }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        employeeCount: { type: integer, description: 核算人数（含已冲正，人数不因冲正减少） }
        grossTotal: { type: number }
        deductionTotal: { type: number }
        netTotal:
          type: number
          description: 实发合计，**不含已冲正**（钱已经退回去了）
        reversedCount: { type: integer }
        reversedAmount: { type: number, description: 已冲正的实发金额（单列，不混进 netTotal） }
        byStatus:
          type: object
          description: '各状态人数，如 { 草稿: 80 }'
          additionalProperties: { type: integer }
    PayrollPeriod:
      type: object
      required: [period, status, employeeCount, netTotal]
      properties:
        period: { type: string, example: '2026-10' }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        employeeCount: { type: integer }
        netTotal: { type: number }
        batchNo: { type: string }
        generatedAt: { type: string }
        paidAt: { type: string }
    PayrollCalcItem:
      type: object
      required: [label, amount]
      properties:
        label: { type: string, example: 基本工资 }
        amount: { type: number }
        note: { type: string, description: 口径说明（如「基本工资 × 10.5%」） }
    PayrollDetail:
      type: object
      required: [payroll, calc]
      properties:
        payroll: { $ref: '#/components/schemas/Payroll' }
        calc:
          type: object
          description: 服务端算好的分解项。前端各拼一遍 = 列表一个口径、工资条一个口径
          required: [gross, deductions, netPay]
          properties:
            gross:
              type: array
              items: { $ref: '#/components/schemas/PayrollCalcItem' }
            deductions:
              type: array
              items: { $ref: '#/components/schemas/PayrollCalcItem' }
            netPay: { type: number }
        bankCard:
          type: object
          properties:
            masked: { type: string }
            tail: { type: string }
            revealable: { type: boolean, description: 当前角色是否具备揭示权限 }
        timeline:
          type: array
          description: 生成 / 核算 / 提交 / 审批 / 发放 / 冲正 的时间线，用来回答「这个月为什么晚发三天」
          items:
            type: object
            properties:
              at: { type: string }
              action: { type: string, example: 核算锁定 }
              operator: { type: string }
              note: { type: string }
    BankCardReveal:
      type: object
      required: [payrollId, empName, bankCard, reason, accessLogId]
      properties:
        payrollId: { type: string }
        empName: { type: string }
        bankCard: { type: string, description: 完整卡号（仅本次返回） }
        reason: { type: string }
        operator: { type: string }
        shownAt: { type: string }
        accessLogId: { type: string }

    # ---------------- 组织与权限 ----------------
    PermRequestStatus:
      type: string
      enum: [待审批, 已通过, 已驳回, 已撤回]
      description: 撤回后单据留档；重新提交会产生新单据，不复用旧号（否则审批史会串）
    RoleSummary:
      type: object
      required: [roleId, name, scope, dataScope, userCount, permCount]
      properties:
        roleId: { type: string, example: R-PM }
        name: { type: string }
        scope: { type: string, enum: [集团, 项目] }
        dataScope:
          type: string
          enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
        communities:
          type: array
          description: 「指定项目」档下具体授权的项目
          items: { type: string }
        positions:
          type: array
          description: 适用的岗位（员工按岗位反推角色，见员工域）
          items: { type: string }
        userCount: { type: integer, description: 实际使用人数（按员工岗位反推，不是角色表里的数） }
        permCount: { type: integer }
        coverage: { type: number, description: 已授权 / 全部权限位，百分比取整 }
        domains:
          type: array
          items: { type: string }
        builtin: { type: boolean, description: 内置角色不可删除 }
    PermOp:
      type: object
      required: [code, opName, on]
      properties:
        code: { type: string, example: a.owners.view }
        opName: { type: string, example: 查看 }
        on: { type: boolean, description: 该角色是否已授权 }
    PermFunc:
      type: object
      required: [func, funcName, ops]
      properties:
        func: { type: string, example: owners }
        funcName: { type: string, example: 业主档案 }
        route: { type: string, example: /a/owners }
        ops:
          type: array
          items: { $ref: '#/components/schemas/PermOp' }
    PermGroup:
      type: object
      required: [domain, domainName, funcs]
      properties:
        domain: { type: string, example: a }
        domainName: { type: string, example: A 房产与业主 }
        funcs:
          type: array
          items: { $ref: '#/components/schemas/PermFunc' }
    PermMatrix:
      type: object
      required: [groups, total, granted, coverage]
      properties:
        groups:
          type: array
          description: 域 → 功能 → 操作 三层，前端拿一份就能画权限树
          items: { $ref: '#/components/schemas/PermGroup' }
        total: { type: integer, description: 权限位总数（分母） }
        granted: { type: integer }
        coverage: { type: number }
    RoleDetail:
      type: object
      required: [role, matrix]
      properties:
        role: { $ref: '#/components/schemas/RoleSummary' }
        matrix: { $ref: '#/components/schemas/PermMatrix' }
        members:
          type: array
          description: 成员样本（最多 6 个），列全部成员去员工域按 roleId 筛
          items:
            type: object
            properties:
              empId: { type: string }
              name: { type: string }
              position: { type: string }
              orgName: { type: string }
        visible:
          type: string
          description: 可见范围的文字说明（「指定项目」会列出具体项目名）
          example: 全部 3 个项目
        byDomain:
          type: array
          description: 按域统计已授权数，一眼看出这个角色主要管哪几块
          items:
            type: object
            properties:
              domainName: { type: string }
              granted: { type: integer }
              total: { type: integer }
        posture:
          type: object
          description: 治理视图：这个角色手里有哪些"一旦拿到就能自己扩权或掩盖问题"的权限
          properties:
            sensitive:
              type: array
              description: 持有的高敏权限码
              items: { type: string }
            wideScope: { type: boolean, description: 是否可跨项目查看 }
    PermRequest:
      type: object
      required: [reqId, roleId, added, status, submitBy, submitAt]
      properties:
        reqId: { type: string, example: REQ0001 }
        roleId: { type: string }
        roleName: { type: string }
        added:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        addedCount: { type: integer }
        removedCount: { type: integer }
        risks:
          type: array
          description: 新增项里命中的高敏规则（这是它需要审批的原因）
          items:
            type: object
            properties:
              code: { type: string }
              why: { type: string }
        reason: { type: string }
        submitBy: { type: string }
        submitRoleId: { type: string, description: 用来判双人原则 }
        submitAt: { type: string }
        status: { $ref: '#/components/schemas/PermRequestStatus' }
        approver: { type: string }
        approvedAt: { type: string }
        approveNote: { type: string }
        changeId: { type: string, description: 通过后落库的权限变更记录 ID }
        kind:
          type: string
          enum: [perm, scope]
          description: |
            申请类型。`perm` = 权限码变更；`scope` = 数据范围变更
            （改「全部项目」也是扩权，只是扩的是"能看多少行"而不是"能点哪个按钮"）。
        scope:
          type: object
          description: kind=scope 时的前后值
          properties:
            from: { type: string }
            to: { type: string }
            communities:
              type: array
              items: { type: string }
    PermLog:
      type: object
      required: [logId, at, roleId, action, added, removed]
      properties:
        logId: { type: string, example: PL0001 }
        at: { type: string }
        operator: { type: string }
        operatorRole: { type: string }
        roleId: { type: string }
        roleName: { type: string }
        action: { type: string, enum: [直接保存, 提交审批, 审批通过, 审批驳回] }
        added:
          type: array
          description: 记的是具体权限码，不是"改过权限"四个字
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        reason: { type: string }
        source: { type: string, description: 来源页面，便于回溯 }
    AccessLog:
      type: object
      required: [logId, at, action, result]
      properties:
        logId: { type: string }
        at: { type: string }
        operator: { type: string }
        roleName: { type: string }
        orgName: { type: string }
        scopeMode: { type: string }
        action: { type: string, enum: [查看明文, 导出数据] }
        entityType: { type: string, example: 业主 }
        entityId: { type: string }
        entityName: { type: string }
        field: { type: string, example: idCard }
        fieldLabel: { type: string, example: 证件号 }
        source: { type: string, description: 来源页面 }
        rows: { type: integer }
        result: { type: string, enum: [成功, 脱敏, 拦截] }
        memo: { type: string, description: 揭示原因 / 拦截原因 }
        hash: { type: string, description: 本条记录的哈希 }
        prevHash: { type: string, description: 上一条的哈希——任何一条被改，链上后面全对不上 }
    ExportLog:
      type: object
      required: [logId, at, name, rows, result]
      properties:
        logId: { type: string }
        at: { type: string }
        operator: { type: string }
        roleName: { type: string }
        orgName: { type: string }
        scopeMode: { type: string }
        name: { type: string, description: 导出文件名 }
        format: { type: string, example: xlsx }
        rows: { type: integer }
        result: { type: string, enum: [成功, 脱敏, 拦截] }
        memo: { type: string }
        hash: { type: string }
        prevHash: { type: string }
    AccessLogSummary:
      type: object
      required: [reveals, operators, exports, masked, blocked, rows]
      properties:
        reveals: { type: integer, description: 查看明文次数 }
        owners:
          type: integer
          description: 被查看过的不同对象数（不是次数——同一个人看 20 次同一条只算 1）
        operators: { type: integer, description: 涉及的操作人数 }
        exports: { type: integer, description: 导出次数 }
        masked: { type: integer, description: 因无权限被脱敏的次数 }
        blocked: { type: integer, description: 被拦截次数——被拦的才最值得看 }
        rows: { type: integer, description: 总记录数 }
    DataScopeStat:
      type: object
      required: [dataScope, roleCount, userCount, roles]
      properties:
        dataScope: { type: string, enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人] }
        roleCount: { type: integer }
        userCount: { type: integer }
        roles:
          type: array
          items:
            type: object
            properties:
              roleId: { type: string }
              name: { type: string }
              userCount: { type: integer }
    PermSaveResult:
      type: object
      required: [roleId, applied, diff]
      properties:
        roleId: { type: string }
        applied: { type: boolean, description: false = 已提交审批，权限还没生效 }
        noChange: { type: boolean, description: true = 与保存前一致，没写日志 }
        diff:
          type: object
          properties:
            added:
              type: array
              items: { type: string }
            removed:
              type: array
              items: { type: string }
        log: { $ref: '#/components/schemas/PermLog' }
        request:
          oneOf:
            - { $ref: '#/components/schemas/PermRequest' }
            - { type: 'null' }
        effectiveAt:
          type: string
          description: 生效时间；未生效时为空（审批通过才有）

    # ---------------- 合同 ----------------
    ContractStatus:
      type: string
      enum: [待审批, 待生效, 履行中, 即将到期, 已到期, 已终止]
      description: |
        `即将到期` 是**派生态**（30 天内到期且仍在履行中），由跑批或查询时计算，不是人工设的。
        台账里不该出现"人工标成即将到期"这种数据——那会让续签提醒变成玄学。
    Contract:
      type: object
      required: [contractId, contractNo, name, type, partyB, amount, status]
      properties:
        contractId: { type: string, example: CT0001 }
        contractNo: { type: string, description: 服务端生成，前端传了也忽略, example: HT-2026-0001 }
        name: { type: string }
        type: { type: string, example: 劳动 }
        subtype: { type: string }
        communityId: { type: string, description: 空 = 集团层面（不挂项目） }
        communityName: { type: string, description: 服务端带出，别让前端拿 id 猜 }
        orgId: { type: string }
        partyB: { type: string, description: 相对方（供应商 / 业主 / 员工姓名） }
        contact: { type: string }
        phone:
          type: string
          description: |
            联系电话。**列表与详情都掩码**（`175****1790`）——合同相对方是个人时就是个人信息；
            要看明文走 `a.sensitive.view` 的揭示接口，并写访问日志。
        amount: { type: number }
        payCycle: { type: string, example: 月付 }
        signDate: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        restDays: { type: integer, description: 距到期天数；已到期为负数 }
        status: { $ref: '#/components/schemas/ContractStatus' }
        owner: { type: string, description: 合同负责人 }
        ownerEmpId: { type: string }
        attachments: { type: integer }
        refType: { type: string, enum: [house, parking, employee] }
        refId: { type: string }
        remark: { type: string }
        changePending: { type: boolean, description: 有变更在审批中——此时不能再发起变更 }
    ContractSummary:
      type: object
      required: [total, amount, running, expiring, expired, pending]
      properties:
        total: { type: integer }
        amount: { type: number, description: 合同总金额（含已到期，用于规模口径） }
        running: { type: integer }
        expiring: { type: integer, description: 状态为「即将到期」的合同数（派生态，由跑批刷新） }
        expired: { type: integer }
        pending: { type: integer, description: 待审批 + 待生效 }
    ContractChange:
      type: object
      required: [changeId, changeNo, contractId, changeType, before, after, status]
      properties:
        changeId: { type: string, example: CH0001 }
        changeNo: { type: string, example: BG-2026-001 }
        contractId: { type: string }
        contractName: { type: string }
        changeType: { type: string, example: 金额调整 }
        before:
          type: object
          description: 发起时的快照；事后合同再变也不影响这张单子查得到"当时改了什么"
        after: { type: object }
        reason: { type: string }
        applicant: { type: string }
        applyTime: { type: string }
        status: { type: string, enum: [待审批, 已通过, 已驳回, 已撤销] }
        approvalId: { type: string }

    ContractAttachment:
      type: object
      required: [fileId, name, size]
      properties:
        fileId: { type: string, example: CT0001-F1 }
        name: { type: string, example: 物业服务合同_2026_扫描件.pdf }
        size: { type: integer, description: 字节数 }
        mime: { type: string, example: application/pdf }
        uploadedAt: { type: string }
        uploader: { type: string }
    AttachmentDownload:
      type: object
      required: [fileId, url, expiresAt]
      properties:
        fileId: { type: string }
        url:
          type: string
          description: 临时签名链接；过期后必须重新申请，不要缓存
        expiresAt: { type: string }
        size: { type: integer }
        accessLogId: { type: string, description: 导出日志号（文件外发要查得到） }

    # ---------------- 公告 ----------------
    NoticeStatus:
      type: string
      enum: [草稿, 待审核, 已发布, 已撤回, 已过期]
      description: 单向状态机：草稿 → 待审核 → 已发布 → 已过期；已发布可撤回，撤回后要重新提交审核
    Notice:
      type: object
      required: [noticeId, title, type, status, channels]
      properties:
        noticeId: { type: string, example: NT0001 }
        title: { type: string }
        type: { type: string, example: 停水停电 }
        communityId: { type: string, description: 空 = 全部项目 }
        communityName: { type: string, description: 服务端带出，空值渲染为「全部项目」 }
        channels:
          type: array
          description: 推送渠道，至少一个——没有渠道的公告等于没发
          items: { type: string }
        channelText:
          type: string
          description: |
            渠道的展示串（`App 推送 / 公告栏 / 短信`）。服务端带出，避免每个页面各拼一遍——
            前端各拼的结果是列表用「/」、详情用「、」，看着像两个功能。
          example: App 推送 / 公告栏 / 短信
        publisher: { type: string }
        publisherEmpId: { type: string }
        publishTime: { type: string }
        status: { $ref: '#/components/schemas/NoticeStatus' }
        targetHouses: { type: integer, description: 覆盖户数 }
        readCount: { type: integer, description: 已读户数；撤回后不清零（业主确实看过） }
        readRate:
          type: number
          description: 阅读率（百分比，一位小数）。分母为 0 时为 0，不返回 null——列表要能排序
        top: { type: boolean, description: 置顶 }
        auditBy: { type: string }
        auditTime: { type: string }
        attachments: { type: integer }
        content: { type: string }
    NoticeSummary:
      type: object
      required: [total, published, pending, expired, avgReadRate]
      properties:
        total: { type: integer }
        published: { type: integer }
        pending: { type: integer, description: 待审核 + 草稿 }
        expired: { type: integer }
        avgReadRate: { type: number, description: 只统计已发布；草稿与撤回没有阅读率，混进去会把平均拉低 }
        lowRead: { type: integer, description: 阅读率低于 60% 的已发布公告数（阈值与列表同一份定义） }

    # ---------------- 月结（期间关账） ----------------
    MonthCloseStatus:
      type: string
      enum: [已结账, 已反结]
      description: |
        关账状态只有两态。**反结不是删除**：记录留着、`status` 转「已反结」，
        该期间恢复可写，报表回到试算。
    MonthCloseMethodRow:
      type: object
      description: 按收款方式的当月汇总（现金要实点，非现金对流水）
      required: [method, count, amount, refund, net]
      properties:
        method: { type: string, example: 现金 }
        count: { type: integer, description: 收款笔数 }
        amount: { type: number, description: 收款金额 }
        refundCount: { type: integer }
        refund: { type: number }
        net: { type: number, description: 净额 = 收款 − 退款 }
        mode:
          type: string
          enum: [实点, 对流水]
          description: 现金要实点（点钞数与系统数必须对上）；非现金对流水
    MonthClose:
      type: object
      required: [closeId, closeNo, period, status, count, net, operator, at]
      properties:
        closeId: { type: string, example: MC202610 }
        closeNo: { type: string, description: 结账单号；同期间第 N 次结账序号递增（-01/-02），反结重结不覆盖旧号, example: YJ-202610-01 }
        period: { type: string, example: '2026-10' }
        scope:
          type: string
          enum: [group, community]
          description: group = 全公司结账；community = 单个项目结账
        communityId: { type: string, description: scope=community 时的项目 ID；全公司为空 }
        communityName: { type: string, description: 服务端带出，省得前端拿 id 猜 }
        status: { $ref: '#/components/schemas/MonthCloseStatus' }
        count: { type: integer, description: 当月收款笔数 }
        income: { type: number }
        refund: { type: number }
        net: { type: number, description: 净额 = 收款 − 退款 }
        receivable: { type: number, description: 当月账期应收 }
        received: { type: number, description: 当月账期已收 }
        debt: { type: number, description: 当月账期欠费（结账不清零，但要能解释） }
        uninvoiced: { type: integer, description: 未开票笔数 }
        debtBills: { type: integer, description: 有欠费的账单数 }
        memo:
          type: string
          description: 处理说明。有未开票或欠费时必填——写「留到下月催」还是「已确认坏账」，决定后续怎么跟
        operator: { type: string }
        at: { type: string, example: '2026-11-02 09:30' }
        locked: { type: boolean, description: 锁账后该期间只读 }
        reopenedAt: { type: string, description: 反结时间；未反结为空 }
        reopenReason: { type: string }
        reopenCount: { type: integer, description: 被反结次数。反复反结本身就是要被看见的信号 }
        reversalNo:
          type: string
          description: |
            反结的红冲凭证号（如 `HC-202609-01`）。**反结不进退款流水**——
            反结不是退款，混进退款表会让「退款金额」统计失真；凭证挂在月结记录上，对账时以它为准
    MonthClosePreview:
      type: object
      description: |
        结账前一屏看全。**预览与提交必须同源**（同一段计算），否则会出现
        「预览 1002 笔、结完记录写 998 笔」这种说不清的差。
      required: [period, closable, count, income, net, receivable, received, debt]
      properties:
        period: { type: string, example: '2026-10' }
        scope: { type: string, enum: [group, community] }
        communityId: { type: string }
        communityName: { type: string }
        unclosedCommunities:
          type: array
          description: |
            全公司口径下"有业务但还没结"的项目；项目级预览为空数组。
            前端据此提示"先去把这几个项目结了"，不要自己再算一遍。
          items:
            type: object
            properties:
              communityId: { type: string }
              name: { type: string }
        closable:
          type: boolean
          description: 能不能结（未来期间 / 已结账都是 false）。前端直接用这个控制按钮，不要自己再判一遍
        rows:
          type: array
          items: { $ref: '#/components/schemas/MonthCloseMethodRow' }
        count: { type: integer }
        income: { type: number }
        refund: { type: number }
        net: { type: number }
        receivable: { type: number }
        received: { type: number }
        debt: { type: number }
        uninvoiced: { type: integer }
        debtBills: { type: integer }
        prevPeriod: { type: string, description: 上一个月（用于环比）, example: '2026-09' }
        prevNet:
          type: [number, 'null']
          description: 上月净额。上月没结账就是 null——**不要给 0**，0 会被读成"上月净额为 0"
        closed:
          allOf:
            - $ref: '#/components/schemas/MonthClose'
          description: 该期间已有的结账记录（未结账时不返回）

    # ---------------- 报表快照 ----------------
    ReportCode:
      type: string
      enum: [arrears, collection-rate, dept-target]
      description: |
        `arrears` 欠费账龄 / `collection-rate` 收缴率 / `dept-target` 部门达标率。
        用英文短代码做路由与批次号，业务名称由前端字典渲染——中文名改一次要动数据类型，不值。
    ReportBatchStatus:
      type: string
      enum: [成功, 运行中, 失败]
      description: 失败批次保留（能查失败原因），但不参与「最新成功批次」的选取
    AgingBucket:
      type: string
      enum: [未到期, 0-30天, 31-90天, 91-180天, 180天以上]
    ReportPeriodType:
      type: string
      enum: [日, 月, 年]
      description: 期次粒度。日=按天快照；月/年=整期快照（时点型则是期末那一天）
    ReportCompare:
      type: object
      description: 环比 / 同比（只对期间型有值；时点型与日粒度返回 null）
      properties:
        prevPeriod: { type: string, example: '2026-09' }
        prevValue: { type: [number, 'null'], description: 上一期的主指标（收缴率 / 平均达标率） }
        yoyPeriod: { type: string, example: '2025-10' }
        yoyValue: { type: [number, 'null'], description: 去年同期；没有同比意义时为空 }
    ReportMeta:
      type: object
      required: [reportCode, statDate, periodType, period, batchNo, calcAt, formulaVersion, rowCount]
      description: |
        每次响应都带 `meta`：这一份数字是**哪个批次、什么时候算的、按哪版公式**。
        没有 meta 的报表接口不算交付——出了数说不清来源，等于没数。
      properties:
        reportCode: { $ref: '#/components/schemas/ReportCode' }
        reportName: { type: string, example: 欠费账龄报表 }
        statDate:
          type: string
          format: date
          description: 数据时点。未结账的期次这里落在今天，而不是期末——页头要显示「试算 · 截至 X 日」
          example: '2026-10-21'
        periodType: { $ref: '#/components/schemas/ReportPeriodType' }
        period:
          type: string
          description: 期次值（日=YYYY-MM-DD / 月=YYYY-MM / 年=YYYY）
          example: '2026-10'
        provisional:
          type: boolean
          description: 试算值（该期未月结）。为 true 时页面必须打标，否则下个月数字变了会被当成 bug
        voided:
          type: boolean
          description: 该批次已被反结作废。**作废不删除**——审计要能查到「当时出过什么数」，只是不再作为最新批次
        compare: { $ref: '#/components/schemas/ReportCompare' }
        periodValue:
          type: [number, 'null']
          description: |
            本期主指标（收缴率 / 平均达标率 / 欠费余额），环比同比比的就是这一个数。
            **失败批次为 null**——它没有数，给 0 会被读成"这一期收缴率为 0"。
          example: 91.27
        batchNo:
          type: string
          description: 日 RPT-20261021-01 / 月 RPT-202610-M01 / 年 RPT-2026-Y01
          example: RPT-20261021-01
        calcAt: { type: string, description: 批次生成时间, example: '2026-10-21 02:12' }
        dataCutoff: { type: string, description: 数据截止时间, example: '2026-10-21 23:59' }
        durationMs: { type: integer, description: 跑批耗时（毫秒） }
        formulaVersion: { type: string, description: 口径版本；口径改了必须升版本，否则历史批次无法复现, example: v1.0 }
        rowCount: { type: integer }
        partial:
          type: boolean
          description: 部分成功（个别项目跑批失败）。为 true 时前端必须在页头提示，不能当全量
        stale:
          type: boolean
          description: 快照落后最新成功批次超过 1 天
    ReportSnapshot:
      allOf:
        - $ref: '#/components/schemas/ReportMeta'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/ReportBatchStatus' }
            message: { type: string, description: 失败原因 / 备注 }
    ArrearsRow:
      type: object
      required: [communityId, buildingId, aging, billCount, houseCount, payable, unpaid]
      properties:
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        buildingId: { type: string, example: B0101 }
        buildingName: { type: string, example: 1栋 }
        aging: { $ref: '#/components/schemas/AgingBucket' }
        billCount: { type: integer, description: 欠费账单数 }
        houseCount: { type: integer, description: 涉及房屋数 }
        ownerCount: { type: integer, description: 涉及业主数 }
        payable: { type: number, description: 涉及应收 }
        unpaid: { type: number, description: 欠费金额（= 应收 − 已收） }
        avgOverdueDays: { type: number, description: 平均逾期天数（未到期行固定 0） }
        topItem: { type: string, description: 该档里金额最大的科目, example: 物业服务费 }
    ArrearsSummary:
      type: object
      required: [billCount, payable, unpaid]
      description: |
        合计行**只做行级加总**，不提供 `houseCount`：房屋在「楼栋 × 账龄」粒度上会重复计数
        （同一套房可能既有未到期又有逾期），给一个错数比不给更糟。
      properties:
        billCount: { type: integer }
        payable: { type: number }
        unpaid: { type: number }
        overdueUnpaid: { type: number, description: 其中已逾期部分的欠费（不含未到期） }
    CollectionRateRow:
      type: object
      required: [communityId, period, itemId, payable, paid, rate]
      properties:
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        period: { type: string, example: '2026-10' }
        itemId: { type: string, example: FI01 }
        itemName: { type: string, example: 物业服务费 }
        billCount: { type: integer }
        payable: { type: number, description: 应收（已剔除作废与减免） }
        paid: { type: number }
        unpaid: { type: number }
        reduction: { type: number, description: 本期减免金额（不计入分母，但要露面） }
        voided: { type: number, description: 本期作废金额 }
        rate:
          type: [number, 'null']
          description: 收缴率百分比（两位小数）；应收为 0 时为 null，不要回 0
          example: 91.27
    CollectionRateSummary:
      type: object
      required: [payable, paid, rate]
      properties:
        payable: { type: number }
        paid: { type: number }
        unpaid: { type: number }
        reduction: { type: number }
        rate: { type: [number, 'null'], description: 合计口径的收缴率 }
    DeptTargetRow:
      type: object
      required: [orgId, deptName, post, period, planned, finished, doneRate, passRate, weighted, score, grade]
      properties:
        orgId: { type: string, example: O-P01-T2 }
        deptName: { type: string, example: 工程班 }
        post: { $ref: '#/components/schemas/InspectPost' }
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        period: { type: string, example: '2026-10' }
        planned: { type: integer, description: 执行任务总数（不含监督任务） }
        finished: { type: integer }
        doneRate: { type: number, description: 完成率百分比（两位小数） }
        itemTotal: { type: integer, description: 检查项总数（仅已完成任务） }
        itemOk: { type: integer }
        passRate: { type: number, description: 合格率百分比（两位小数） }
        weightPass: { type: number, description: 合格率权重, example: 0.8 }
        weightDone: { type: number, description: 完成率权重, example: 0.2 }
        weighted: { type: number, description: 加权达标率百分比（两位小数） }
        selfIssues: { type: integer, description: 自查发现问题（监督任务查出） }
        crossIssues: { type: integer, description: 抽查发现问题（品质抽查） }
        score: { type: number, description: 得分（一位小数） }
        grade: { $ref: '#/components/schemas/QualityGrade' }
        evaluated: { type: boolean, description: 本期是否已生成任务评价记录 }
    DeptTargetSummary:
      type: object
      required: [deptCount, planned, avgWeighted, selfIssues]
      properties:
        deptCount: { type: integer }
        planned: { type: integer }
        avgWeighted: { type: number, description: 平均加权达标率（按部门简单平均，不按任务量加权） }
        selfIssues: { type: integer }
        crossIssues: { type: integer }
        unqualified: { type: integer, description: 不合格部门数 }
    ReportTask:
      type: object
      required: [taskId, reportCode, statDate, status, progress]
      properties:
        taskId: { type: string, example: RCL-20261030-01 }
        reportCode: { $ref: '#/components/schemas/ReportCode' }
        periodType: { $ref: '#/components/schemas/ReportPeriodType' }
        period: { type: string, description: 期次值；按日重算时与 statDate 相同 }
        statDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/ReportBatchStatus' }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 0..100；「成功」时为 100
        startedAt: { type: string, example: '2026-10-30 09:12' }
        finishedAt: { type: string }
        batchNo: { type: string, description: 成功后有值 }
        rowCount: { type: integer }
        message: { type: string }
        reused:
          type: boolean
          description: true = 复用了已存在的运行中任务（幂等命中），没有新建批次
    SnapshotList:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/ReportSnapshot' }
        latest:
          $ref: '#/components/schemas/ReportSnapshot'
          description: 最新成功批次（缺省 statDate 就取它；没有成功批次时为 null）

