  # --------------------------------------------------------------- tenants
  /tenants:
    get:
      tags: [tenants]
      operationId: queryTenants
      summary: 在住租户列表（分页）
      description: |
        租户由**业主**出租产生、信息主要由业主维护；物业只做补充、核验与搬离。
        **租金不进后台**（不返回、不统计）；手机号与证件号在列表里只回掩码。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: verifyStatus
          in: query
          schema: { type: string, enum: [待核验, 已核验, 信息不全] }
        - name: source
          in: query
          schema: { type: string, enum: [业主自助, 物业补录] }
        - name: vf
          in: query
          description: 快捷视图（与范围可叠加）
          schema: { type: string, enum: ['', pending, incomplete, uncertified, noface, expiring, moved] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tenants/{tenantId}:
    get:
      tags: [tenants]
      operationId: getTenantDetail
      summary: 租户详情（含房屋、业主、完整度）
      description: 手机号/证件号回明文（详情是已授权语境）；`completeness.missingBasic` 是**核验门槛缺项**（5 项）。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenants/{tenantId}/verify:
    post:
      tags: [tenants]
      operationId: verifyTenant
      summary: 物业核验
      description: |
        核验门槛是 **5 项基础信息**（姓名 / 手机 / 证件号 / 与业主关系 / 居住人数）。
        缺项时返回 **422/42202** 并在 `details` 里列出缺哪几项；通过后 `certified=true`（核验含实名）。
        实名与人脸属于核验结果，不作为核验门槛（否则永远验不过）。

        公司租户另有一道**核验前置**：营业执照影像件至少 1 张，没有则 422/42203。
        公司核的是执照原件，不是人脸——没看过原件就盖"已核验"，核验等于没发生。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass]
              properties:
                pass: { type: boolean, description: true 通过；false 标记为信息不全 }
                verifier: { type: string }
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/face:
    post:
      tags: [tenants]
      operationId: registerTenantFace
      summary: 录入人脸（门禁授权）
      description: 必须先核验通过（否则 422）；已录入再录也返回 422。门禁是安全边界，不能靠租户自己声明。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/move-out:
    post:
      tags: [tenants]
      operationId: moveOutTenant
      summary: 标记搬离
      description: 置「已搬离」+ 停用门禁人脸 + **释放房屋的 tenantId**（不释放的话那套房永远显示有人住）。记录保留可回溯。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, reason]
              properties:
                date: { type: string, format: date }
                reason: { type: string, minLength: 2 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/license-files:
    post:
      tags: [tenants]
      operationId: addTenantLicenseFile
      summary: 上传营业执照影像件（公司租户）
      description: |
        公司核验核的是**营业执照原件**，所以影像件是核验的前置条件，不是装饰：
        没有影像件时 `POST /tenants/{tenantId}/verify` 直接 422/42203。

        约束：只收 JPG / PNG / WEBP / PDF；单张 ≤ 5 MB；最多 3 张（正本 / 副本 / 变更页）；
        同名同大小视为重复上传（409/40922）——同一张图传三次不会让"有据可查"更成立。

        原型没有对象存储：这里只登记元数据，文件本身不落库（刷新即失效）。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, type]
              properties:
                name: { type: string, description: 原始文件名（含扩展名） }
                size: { type: integer, description: 字节数 }
                type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
                operator: { type: string }
      responses:
        '200':
          description: 成功（回最新的完整清单，页面不用自己拼）
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/TenantFile' }
                  file: { $ref: '#/components/schemas/TenantFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/license-files/{fileId}:
    delete:
      tags: [tenants]
      operationId: removeTenantLicenseFile
      summary: 删除营业执照影像件
      description: 删到 0 张后该公司回到"核验依据缺失"，核验会被 422/42203 拦住（不是静默降级）。
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - name: operator
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/TenantFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/{tenantId}/change-type:
    post:
      tags: [tenants]
      operationId: changeTenantType
      summary: 换承租主体（个人 ↔ 公司）
      description: |
        承租主体从个人变成公司（或反过来）是真会发生的：个体户注册成公司、
        公司注销后由经办人个人续租。原来的做法是"搬离后重新登记"，
        但那样会把同一段租约、同一条核验记录劈成两条，追溯时对不上。

        变更的**代价**必须说清楚，服务端一次性做完，不留半截状态：
        - `faceRegistered` 置 false：人脸属于自然人，主体变了就要重新采；
        - `certified` / `verifyStatus` 复位为 false / 待核验：换主体等于换证件，核验要重做；
        - 另一套字段清空（个人→公司清姓名/证件；公司→个人清公司资质），旧值写进操作记录；
        - 联系人迁移：个人→公司把证件号带进 `agentIdCard`；公司→个人把经办人的姓名/手机/证件
          带成承租人的姓名/手机/证件（经办人通常就是续租的那个人，省一次重复录入）。

        目标类型的必备信息不齐时 422/42203 拒绝，不做"先换类型再补"。
      parameters:
        - $ref: '#/components/parameters/tenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantTypeChange' }
      responses:
        '200':
          description: 成功（回变更后的租户，含复位后的核验与人脸状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /tenants/batch-verify:
    post:
      tags: [tenants]
      operationId: batchVerifyTenants
      summary: 批量核验
      description: 门槛不足的**按人回报原因**，不做整批失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantIds]
              properties:
                tenantIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResultEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- inspect
  /inspect-tasks:
    get:
      tags: [inspect]
      operationId: queryInspectTasks
      summary: 巡检任务列表（分页）
      description: |
        两类任务：`执行`（一线员工按模板自查）、`监督`（部门经理查下属计划落地情况）。
        监督任务看的是「被检班组」，`targetDept` / `targetPost` 才有值。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: taskType
          in: query
          schema: { type: string, enum: [执行, 监督] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InspectStatus' }
        - name: post
          in: query
          schema: { $ref: '#/components/schemas/InspectPost' }
        - name: executor
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /inspect-tasks/{taskId}:
    get:
      tags: [inspect]
      operationId: getInspectTask
      summary: 巡检任务详情（含已录问题项）
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inspect-tasks/{taskId}/submit:
    post:
      tags: [inspect]
      operationId: submitInspectResult
      summary: 提交巡检结果
      description: |
        **监督任务的不合格项必须指定责任员工**（否则考核归不到人），缺一个就 422。
        提交后：`normalCount` / `issueCount` 由服务端按 results 重算，状态转「已完成」；
        执行任务若当日无异常、同时段又有监督任务查出问题，服务端可置 `conflictFlag`（申报不实）。
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/InspectResult' }
                photos: { type: integer, minimum: 0 }
                checkedIn: { type: boolean }
                remark: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------- mobile（员工端）
  /mobile/tasks/{taskId}/exec:
    get:
      tags: [mobile]
      operationId: mobileInspectExec
      summary: 员工端执行页聚合数据（任务 + 模板 + 责任员工候选）
      description: |
        一屏一请求：任务、模板字段、项目名、监督任务的责任员工候选一次返回。
        PC 侧对应三次查询（任务详情 / 模板 / 员工列表），合并只为省移动端的往返。

        **责任员工候选**只对监督任务有意义：按被检班组的在职员工来，排除组长本人。
      x-permission: f.inspect.view
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileExecEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mobile/tasks/{taskId}/checkin:
    post:
      tags: [mobile]
      operationId: mobileCheckin
      summary: 开工打卡（定位 / NFC / 扫码 / 人工）
      description: |
        打卡把任务从「待执行」推进到「执行中」。

        **降级是正式能力，不是异常分支**：地下室、屏蔽房、老年机都会定位失败。
        拿不到定位时前端置 `manual=true` 并允许提交，服务端必须把 `checkinType` 记为「人工打卡」、
        打上 `needReview=true`，进入主管复核队列 —— 静默算作正常打卡，等于把这道防线取消。

        H5 没有摄像头扫码能力（`uni.scanCode` 无实现），`type=扫码` 时用 `point` 手填点位编号。
      x-permission: f.inspect.exec
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [GPS围栏, NFC, 扫码, 人工打卡]
                gps: { type: string, description: '经度,纬度；人工打卡可为空' }
                accuracy: { type: number, description: 定位精度（米） }
                point: { type: string, description: '扫码降级时手填的点位编号' }
                manual: { type: boolean, default: false, description: 'true = 无法定位，按人工打卡记并需复核' }
                reason: { type: string, description: '降级原因，写进记录供复核' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /inspect-tasks/{taskId}/work-orders:
    post:
      tags: [inspect, mobile]
      operationId: inspectCreateWorkOrder
      summary: 巡检异常转工单
      description: |
        现场发现需要专业处理的问题（设备损坏、安全隐患），就地开单，免二次录入。

        两条口径：
        1. `source` 固定为「巡检转单」，来源任务号写进描述与 `remark`，工单详情能回连；
        2. **不改巡检任务状态** —— 任务仍要提交执行结果，否则完成率与异常数会漏统计。
           服务端只回写 `refWoId`。
      x-permission: f.inspect.exec + f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectWorkOrderRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /work-orders/{woId}/accept:
    post:
      tags: [work-orders, mobile]
      operationId: acceptWorkOrder
      summary: 接单（待派单 / 已派单 → 处理中）
      description: |
        接单人写 `assignee` 与 `acceptTime`，状态转「处理中」，SLA 从受理时间开始算。

        已派给别人的单不能抢：非本人且无 `f.wo.dispatch` 权限 → 409。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /work-orders/{woId}/transfer:
    post:
      tags: [work-orders, mobile]
      operationId: transferWorkOrder
      summary: 转单（换处理人，回到已派单）
      description: |
        转单只换人，不改变流程节点：状态回到「已派单」，`acceptTime` 清空，等对方接。
        转单原因写进 `remark`，便于追责与统计（谁转给谁、为什么）。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: '被转单人姓名' }
                note: { type: string, description: 转单原因 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /work-orders/{woId}/finish:
    post:
      tags: [work-orders, mobile]
      operationId: finishWorkOrder
      summary: 完工登记（处理中 → 已完工）
      description: |
        `remark` 必填（业主会看到"做了什么"），照片数累加进 `images`。
        「待确认」是等业主确认的停表态，由业主端触发，不在本接口里。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remark]
              properties:
                remark: { type: string, description: 处理结果，业主可见 }
                photos: { type: integer, minimum: 0 }
                arrivedAt: { type: string, description: 到场时间（可选，用于时长统计） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /work-orders/{woId}/staff-eval:
    post:
      tags: [work-orders, mobile]
      operationId: staffEvalWorkOrder
      summary: 员工侧回评（业主配合度，内部参考）
      description: |
        **不是互评**。员工侧只记三件事：配合度打分、标签（家中无人 / 需二次上门…）、一句备注。

        为什么不做成双向公开评价：一线被差评绑架的代价太高（一个 1 分要跑十单补回来），
        而业主对服务的评价已经由 `score` / `evalTags` 承担。这条数据只进内部参考，
        不进业主考核、不在业主端展示，也**不参与**员工绩效考核。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffEvalRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attendance/{attId}/confirm:
    post:
      tags: [mobile]
      operationId: confirmAttendance
      summary: 本人确认考勤（待确认 → 正常）
      description: |
        月度考勤的本人确认。移动端**只做月度查询 + 确认/申诉**，不做逐日打卡 ——
        现场到岗留证已经由巡检打卡承担，再造一套日常打卡只会让两处时间对不上。
      x-permission: c.attendance.self
      parameters:
        - name: attId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      attId: { type: string }
                      status: { type: string, enum: [正常, 待确认, 异常] }
                      confirmedAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attendance/{attId}/appeal:
    post:
      tags: [mobile]
      operationId: appealAttendance
      summary: 本人考勤申诉（不改结果，进人事待办）
      description: |
        申诉**不自动修改考勤结果**：让员工自己改考勤，等于把考勤作废。
        服务端只累加 `appealCount`、写 `appealResult=待处理`，由人事核实后处理。
      x-permission: c.attendance.self
      parameters:
        - name: attId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      attId: { type: string }
                      appealCount: { type: integer }
                      appealResult: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mobile/work-orders:
    get:
      tags: [mobile]
      operationId: mobileWorkOrderList
      summary: 员工端工单列表（按 tab 分组，页签与计数一次给全）
      description: |
        员工端不按「全量分页 + 前端筛选」取工单，而是**按身份能做的事分组**：
        可抢（一线维修）/ 待派（项目经理、客服主管）/ 我的（处理中）/ 已完成。

        为什么一次给全 tabs 与 rows：四个 tab 各请求一次不但慢，
        四次响应之间还会互相矛盾 —— 抢单池刚少一张、"我的"还没更新，
        用户看到"抢了但我的里没有"。所以页签计数与当前 tab 的行来自**同一次快照**。

        页签只列当前身份真有的：一线没有"待派"，客服主管的"待派"只有公区单。
      x-permission: f.workorders.view
      parameters:
        - name: tab
          in: query
          description: 缺省 mine
          schema: { type: string, enum: [grab, dispatch, mine, done], default: mine }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileWorkOrderListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mobile/work-orders/{woId}:
    get:
      tags: [mobile]
      operationId: mobileWorkOrderDetail
      summary: 员工端工单详情聚合（费用 / 增项 / 提成 / 时间线）
      description: |
        一屏一请求：管理端详情只回工单行与时间线，而移动端详情页还要
        **费用构成、增项清单、提成、评价**。

        两条金额口径必须分清：

        - `fee.total` = 单额 + **已确认**的增项。未确认的增项不能算进应收 ——
          否则师傅会去要一笔业主根本没认的钱。
        - `addonSum.pending` 却要数**全部**未确认的：它是"还有几笔等业主点头"，
          不是金额。

        `settled` = 已收款才结提成。完工未收款是**在途**，不能算进当月收入。
      x-permission: f.workorders.view
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileWorkOrderDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mobile/debts:
    get:
      tags: [mobile]
      operationId: mobileDebts
      summary: 员工端欠费户与催收工作集
      description: |
        一个接口同时服务「楼栋首页的欠费户列表」和「催收页的工作集」——
        两者是同一个东西（欠费户），差别只在筛选条件。拆成两条会出现
        "首页显示 12 户、催收页显示 9 户"，用户会怀疑哪边算错了。

        **按房屋聚合，不是按账单**：一户一行。楼管打电话是打给"这户"，
        而不是打过期的水费和物业费各一次。

        `skipRecent` 默认 **true**：跳过近 7 天已催过的户。
        一屏全是"刚催过"的，等于把今天该打的电话淹掉。

        `summary` 永远按**全范围**算，不随 `aging` / `item` 筛选变小 ——
        否则"欠费合计"会跟着筛选条件跳动。
      x-permission: a.stewards.view
      parameters:
        - name: buildingId
          in: query
          schema: { type: string }
        - name: aging
          in: query
          description: 账龄下限（天），30 / 60
          schema: { type: string }
        - name: item
          in: query
          description: 费项，如 物业服务费 / 水费 / 电费
          schema: { type: string }
        - name: skipRecent
          in: query
          description: 是否跳过近 7 天已催的户，缺省 true
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileDebtsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mobile/collections:
    post:
      tags: [mobile]
      operationId: createCollectionRecord
      summary: 催收跟进记录（楼栋管家）
      description: |
        管家按门牌跟进欠费，一次一条：方式（电话 / 上门 / 短信 / 微信）、结果（承诺还款 / 家中无人 / 拒缴）、
        备注、下次跟进时间。

        **只管催、不管收**：没有收款动作。谈成了引导业主到小程序缴费或到收银台，
        移动端出现收款入口就等于绕过了日结与票据。
      x-permission: a.stewards.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseId, method, result]
              properties:
                houseId: { type: string }
                method: { type: string, enum: [电话, 上门, 短信, 微信] }
                result: { type: string, enum: [承诺还款, 家中无人, 拒缴, 已说明情况] }
                note: { type: string, maxLength: 100 }
                nextAt: { type: string, description: '下次跟进，如「3 天后」或具体日期' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      collectionId: { type: string }
                      houseId: { type: string }
                      at: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================ 抢单 / 派单 / 增项 / 收款
  /work-orders/{woId}/claim:
    post:
      tags: [work-orders, mobile]
      operationId: claimWorkOrder
      summary: 抢单（付费入户维修，先到先得）
      description: |
        **只有付费的入户维修进抢单池**。公区维修没有提成，一律由后台指派，不进池 ——
        否则师傅会把公区单也抢走，然后发现没钱可拿。

        并发是这里的关键：两个师傅同时点，只能一个人抢到。服务端必须做条件更新
        （`WHERE status='待派单' AND assignee IS NULL`）；抢不到返回 **409**，
        并带上已抢到的人 —— 前端不能"点完就当成功"。

        抢到之后要在项目参数 `grabArriveMinutes`（P01 = 15 分钟）内到场，超时记迟到；
        不去了要走 `/abandon`，会计一次弃单。
      x-permission: f.workorders.edit（且岗位为维修工 / 工程主管）
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 抢单成功，工单转「处理中」
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 已被别人抢走 / 状态已变（响应体带 assignee 供前端提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 40901 }
                  message: { type: string, example: '手慢了，已被 孙德海 抢走' }
                  data:
                    type: object
                    properties:
                      woId: { type: string }
                      assignee: { type: string }
        '422':
          description: 该单不是付费入户单，不能抢
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /work-orders/{woId}/dispatch:
    post:
      tags: [work-orders, mobile]
      operationId: dispatchWorkOrder
      summary: 派单（指派给某个维修工）
      description: |
        谁能派（三档，叠加 `f.wo.dispatch`）：
        - 客服专员：本项目受理单的常规派工；
        - 班组长（工程 / 客服主管）：本班组的公区单；
        - 项目经理：跨班组调配、特急单升级、业主点名的付费单。

        **付费单只有项目经理能指派** —— 客服或班组长随手一派就会吃掉师傅的提成，
        一线会有情绪；付费单的默认路径是进抢单池。

        只能派给有该工种的维修岗（维修工 / 工程主管），且不能跨项目。
      x-permission: f.wo.dispatch
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: 处理人姓名（需为本项目维修岗） }
                note: { type: string, maxLength: 80 }
      responses:
        '200':
          description: 已派单（等对方接）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /work-orders/{woId}/arrive:
    post:
      tags: [work-orders, mobile]
      operationId: arriveWorkOrder
      summary: 到场打卡（抢单倒计时的终点）
      description: |
        写 `arriveTime`。超过项目配置的 `grabArriveMinutes` 不阻断，但回 `late=true`，
        服务端记迟到 —— 抢单模式下"抢了不到场"比"不抢"更糟，必须留痕。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功（data.late 表示是否迟到）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /work-orders/{woId}/abandon:
    post:
      tags: [work-orders, mobile]
      operationId: abandonWorkOrder
      summary: 放弃已抢到的单（记一次弃单）
      description: |
        退回「待派单」并累计弃单次数；超过项目 `abandonLimit`（P01 = 3）当日不能再抢。
        这是抢单模式必需的刹车：没有它，手快的人会把池子清空然后干不完。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功（data.used / data.limit 为当日弃单计数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /work-orders/{woId}/addons:
    post:
      tags: [work-orders, mobile]
      operationId: addWorkOrderAddon
      summary: 现场增项（待业主确认）
      description: |
        业主下单时已看到价目并预付，所以没有"报价"环节；现场发现额外工作（拆旧清运、高空作业、
        二次上门）时走这里加项。**加项本身不改单金额**，要等业主确认后才合并 ——
        否则就是师傅自己给自己加钱。

        金额按价目表的 `code` 取值，服务端不能信客户端传来的金额。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: AD-D01, description: 价目表里的增项编码 }
                qty: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 未接单 / 未到场时不能加项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /work-orders/{woId}/addons/confirm:
    post:
      tags: [work-orders, mobile]
      operationId: confirmWorkOrderAddons
      summary: 业主确认增项（合并进本单）
      description: |
        业主侧动作。**不能由师傅自己确认**（代他人操作已在交接单里否掉）。
        业主端上线前，移动端用「业主当面确认」桥接一次，服务端必须记 `confirmedBy`
        （业主 / 当面确认）与时间戳，便于事后追。

        确认后 `totalFee += 增项合计`，材料费与人工费同步累加，提成基数随人工费变化。
        有未确认增项时不允许完工 —— 否则会出现"单子结了、钱多了一截没人认"。
      x-permission: 业主身份（业主端）；员工端只用「当面确认」并在 confirmedBy 里标来源
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /work-orders/{woId}/payment-qr:
    post:
      tags: [work-orders, mobile]
      operationId: createWorkOrderPaymentQr
      summary: 生成收款码（移动端唯一的收款方式）
      description: |
        移动端**不出收银台**：只出示带工单号的收款码，钱直接进项目账户，经手人不碰现金。

        为什么不做现金：现金要配交班、日结、实点与差异说明，等于把收银台搬上手机，
        风险全压一线。现金仍在 PC 收银台走（`b.cashier.edit` 只给收银 / 财务）。
      x-permission: f.workorders.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      woId: { type: string }
                      amount: { type: number }
                      qrUrl: { type: string, description: 聚合支付二维码内容 }
                      expireAt: { type: string }
                      channels:
                        type: array
                        items: { type: string, enum: [微信支付, 支付宝] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /work-orders/{woId}/payments:
    post:
      tags: [work-orders, mobile]
      operationId: registerWorkOrderPayment
      summary: 登记工单收款（支付回调）
      description: |
        由支付渠道回调或收银台登记，**不是员工手动标"已收"**。写入后 `payStatus=已支付`，
        对应提成从「在途」转「已结」。

        挂账（业主不在家、企业月结）走同一接口但 `method=挂账` 且 `reason` 必填 ——
        挂账的单不计提成，避免"账面收了、实际没到"。
      x-permission: 系统回调 / b.cashier.edit
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number }
                method: { type: string, enum: [微信支付, 支付宝, POS刷卡, 现金, 挂账] }
                transNo: { type: string }
                reason: { type: string, description: method=挂账 时必填 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mobile/commission:
    get:
      tags: [mobile]
      operationId: myCommission
      summary: 我的提成（已结 / 在途）
      description: |
        提成只按**人工费**计提（材料费是成本，按总额提成等于把成本分给个人），
        比例与保底来自项目参数 `repairPrices.projects[]`。

        必须把「在途」单独返回：完工但没收到钱的单不结提成，这个数既解释
        "为什么这单干了钱没到"，也在反向督促师傅盯回款（数据里 39 张收费单有 9 张未付、10 张挂账）。
      x-permission: c.payroll.self
      parameters:
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      settleNo: { type: string, description: 结算单号，如 TC202610-01（次月随工资并入） }
                      settleDay: { type: string, description: 发放时点，如「次月 10 日随工资发放」 }
                      period: { type: string }
                      rate: { type: number, description: 人工费计提比例 }
                      count: { type: integer, description: 本月完成的收费单数 }
                      settledCount: { type: integer }
                      pendingCount: { type: integer }
                      settled: { type: number, description: 已收款 → 已结 }
                      pending: { type: number, description: 完工未收款 → 在途 }
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/WorkOrderCommission' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mobile/pricing:
    get:
      tags: [mobile]
      operationId: repairPricing
      summary: 维修服务价目与项目参数（业主端下单页也用这一份）
      description: |
        业主下单看到的价、师傅现场加项、提成核算必须是**同一份数据**，
        否则会出现"业主看到 120、师傅加了 80、财务算出 240"。所以只留一个源。

        后台在「收费项目 → 维修服务价目」维护；提成比例按项目配，不写死在代码里。
      x-permission: 公开（业主端需登录）
      parameters:
        - name: communityId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      communityId: { type: string }
                      commissionRate: { type: number }
                      minCommission: { type: number }
                      grabArriveMinutes: { type: integer }
                      abandonLimit: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RepairPriceItem' }
                      addons:
                        type: array
                        items: { $ref: '#/components/schemas/RepairPriceItem' }

  /mobile/collections/batch:
    post:
      tags: [mobile]
      operationId: createCollectionBatch
      summary: 批量催缴（按房屋聚合，生成批次）
      description: |
        口径与 PC 催缴工作台一致：按**房屋**聚合（不按账单逐条催）→ 勾选 → 生成一个批次。
        批次号形如 `CJ20261020-01`，可按批次追溯谁在什么时候催了哪些户。

        两条硬规则：
        1. 同一户 7 天内催过默认跳过（客户端不给勾，服务端也要拦）—— 否则一天三条短信；
        2. 只发提醒不收款，收银仍在收银台 / 小程序。
      x-permission: a.stewards.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseIds, method]
              properties:
                houseIds:
                  type: array
                  items: { type: string }
                method: { type: string, enum: [短信, 微信, 电话] }
                note: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      batchNo: { type: string, example: CJ20261020-01 }
                      count: { type: integer }
                      amount: { type: number }
                      skipped:
                        type: array
                        description: 因 7 天内已催而跳过的户
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mobile/houses/{houseId}/residents:
    get:
      tags: [mobile]
      operationId: houseResidents
      summary: 房屋在住的人（租户 + 共住成员）
      description: |
        楼管现场最高频的动作不是改业主手机号，而是**核实现在住的是谁**。
        数据现实：160 个租户里 57 户「信息不全」、55 户「待核验」。

        脱敏口径（已确认）：**不返回租金**（合同价属财务 / 项目经理）、**不返回身份证号**，
        人脸与认证只给布尔值。
      x-permission: a.owners.view
      parameters:
        - name: houseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      tenants:
                        type: array
                        items: { $ref: '#/components/schemas/TenantBrief' }
                      members:
                        type: array
                        items: { $ref: '#/components/schemas/MemberBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================ 邻里（移动端作业，PC 第 68 批）
  /neighbor/summary:
    get:
      tags: [neighbor, mobile]
      operationId: neighborTodoSummary
      summary: 邻里待办计数（工作台卡片）
      description: |
        只回两个数：本项目**待审核**的闲置、本项目**待处理**的举报。
        两个数刻意不合并：一个是「能不能发」，一个是「发了之后怎么办」，判断依据与留痕要求都不同。

        口径：**按登录人所属项目过滤**。手机上是 3 + 2，PC 全公司是 8 + 4，差的是数据范围 ——
        为了数字一致去掉过滤，会让客服看到别的项目的业主。
      x-permission: n.workbench.view
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborTodoEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/items:
    get:
      tags: [neighbor, mobile]
      operationId: queryNeighborItems
      summary: 闲置内容列表（待审核队列）
      description: |
        待审永远排最前 —— 队列页要的就是「下一步做什么」。
        默认返回里 `sellerHouse` 带房号，**移动端只展示到楼栋**，门牌由前端截断（审核不需要知道具体门牌）。
      x-permission: n.items.view
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: 待审核 / 已上架 / 已驳回 / 已下架 / 已售出 / 已过期
          schema: { type: string }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/items/stats:
    get:
      tags: [neighbor, mobile]
      operationId: neighborItemStats
      summary: 闲置看板（六状态计数 + 待处理举报）
      description: |
        六状态**分开数**：`待审核`是能不能发，`已驳回`是发过被拒，`已过期`是挂了 60 天没人要 ——
        运营对这三类的动作完全不同（审核 / 回访原因 / 提醒续挂），合并成一个"非在架"就没法派活。

        `reportPending` 从举报表取，不从闲置上的 `reportCount` 累加：后者是历史累计，
        被处理过的举报仍然留在计数里，拿它当待办会一直显示红色角标。
      x-permission: n.items.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/items/categories:
    get:
      tags: [neighbor, mobile]
      operationId: neighborItemCategories
      summary: 闲置分类字典（含各分类在架数）
      description: |
        业主端发布表单的分类下拉、列表页的分类筛选，都读这一份 ——
        三处各写一套的结果是"发布时能选母婴、筛选里没有母婴"。

        `count` 只统计**已上架**：筛选按钮上的数字应当等于点进去后的条数。
      x-permission: n.items.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemCategoriesEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/items/{itemId}:
    get:
      tags: [neighbor, mobile]
      operationId: getNeighborItem
      summary: 闲置详情
      x-permission: n.items.view
      parameters:
        - $ref: '#/components/parameters/neighborItemId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /neighbor/items/{itemId}/audit:
    post:
      tags: [neighbor, mobile]
      operationId: auditNeighborItem
      summary: 闲置审核（通过 / 驳回）
      description: |
        **驳回必须写理由** —— 业主会拿着驳回通知来问「为什么」，没有理由的通知等于没通知。

        通过后立刻对业主端可见；驳回后发布人可修改重提。
      x-permission: n.items.audit
      parameters:
        - $ref: '#/components/parameters/neighborItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass]
              properties:
                pass: { type: boolean, description: 'true=通过并上架，false=驳回' }
                reason: { type: string, maxLength: 80, description: 'pass=false 时必填' }
                operator: { type: string, description: '经办人（移动端传登录人姓名，便于 PC 追溯）' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemEnvelope' }
        '409':
          description: 已审核过（40960）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/items/{itemId}/offline:
    post:
      tags: [neighbor, mobile]
      operationId: offlineNeighborItem
      summary: 下架闲置（举报核实后顺手做）
      description: 只有「已上架」能下架；下架必须写理由。
      x-permission: n.items.audit
      parameters:
        - $ref: '#/components/parameters/neighborItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 80 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborItemEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/reports:
    get:
      tags: [neighbor, mobile]
      operationId: queryNeighborReports
      summary: 举报列表（待处理队列）
      description: |
        返回 `communityId`（取被举报内容的项目）—— 举报记录本身没有项目字段，
        移动端要按登录人项目过滤就必须由服务端带出来，否则只能看到全公司的单。
      x-permission: n.reports.view
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [待处理, 已处理] }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborReportListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/reports/stats:
    get:
      tags: [neighbor, mobile]
      operationId: neighborReportStats
      summary: 举报看板（待处理 / 已处理 / 按原因分布）
      description: |
        `byReason` 用来回答"最近是不是有人在刷同一个号" —— 只看总数看不出来。
        按登录人数据范围过滤（举报记录本身没有项目字段，要从被举报内容带出来）。

        与工作台卡片的 `reports` 数**必须同源**：卡片写 2、点进去 3，是最容易被
        业主截图对比的错误。
      x-permission: n.reports.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [pending, handled, total]
                        properties:
                          pending: { type: integer }
                          handled: { type: integer }
                          total: { type: integer }
                          byReason:
                            type: array
                            items:
                              type: object
                              properties:
                                reason: { type: string }
                                count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/reports/{reportId}:
    get:
      tags: [neighbor, mobile]
      operationId: getNeighborReport
      summary: 举报详情
      x-permission: n.reports.view
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, example: RP0101 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborReportEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /neighbor/reports/{reportId}/handle:
    post:
      tags: [neighbor, mobile]
      operationId: handleNeighborReport
      summary: 处理举报（四动作）
      description: |
        四选一：忽略 / 仅警告 / 下架并警告 / 封禁 7 天。
        **说明必填** —— 事后要能解释为什么这么判。
        「下架并警告」会同时把闲置置为已下架。

        封禁在原型里只记处置状态，**不做登录拦截**：上线后由业主端校验封禁位。
      x-permission: n.reports.handle
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action: { type: string, enum: [忽略, 仅警告, 下架并警告, 封禁 7 天] }
                note: { type: string, maxLength: 100 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborReportEnvelope' }
        '409':
          description: 已处理过（40970）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- 投票（意见征询）
  # 三条总口径（写在这里，别再往各接口里各写一遍）：
  #   ① 这是**意见征询**，不是业主大会表决 —— 任何响应里都不出现「通过 / 未通过」，
  #      连 `conclusion` 这种空壳字段也不留（留了就会有人往里填）；
  #   ② `totalVotes` = 选项票数之和，不读种子里的同名字段（两者能差出上百票）；
  #   ③ `target` 是**分母**，取 `max(应投户数, 票数)`，所以 `partRate` 永远 ≤100%。
  #
  # 主键叫 `voteId`（值就是问卷表的 `surveyId`）。不做双主键：同一个东西两个编号，
  # 对账时永远差一条。
  /neighbor/votes:
    get:
      tags: [neighbor, mobile]
      operationId: queryNeighborVotes
      summary: 投票列表（意见征询）
      description: |
        排序：进行中 → 草稿 → 已结束，同组内按截止日**倒序**（新的在前）。
        运营每天要看的是"还在跑的几个"，草稿排在已结束之前是因为草稿还能改、还要发。

        三态都返回：业主端要「已结束」看历史，运营要「草稿」接着编辑。
        `target` **由服务端按项目去重业主数现算**（租户不计，征询的是产权人意见），
        不接受客户端传值 —— 传进来的分母一定对不上名单。
      x-permission: n.votes.view
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          schema: { type: string, enum: [满意度调查, 意见征询, 方案征询] }
        - name: status
          in: query
          schema: { type: string, enum: [草稿, 进行中, 已结束] }
        - $ref: '#/components/parameters/kw'
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [neighbor, mobile]
      operationId: createNeighborVote
      summary: 新建投票（草稿）
      description: |
        建出来是**草稿**，不直接对业主可见 —— 题目写错一个字的成本是全员重投。

        选项 2~10 项、**不许重复**、单项 ≤30 字；`key` 由服务端生成（`A1`/`A2`…），
        不接受客户端指定：客户端生成会撞 key，而票是按 key 记的。

        `type` 只能是三种之一。它决定页面上的分组，不决定能不能投票 ——
        别为了"能发出去"随手塞一个新类型，前端分组会直接漏掉它。
      x-permission: n.votes.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeighborVoteRequest' }
      responses:
        '200':
          description: 已创建（草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteEnvelope' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/votes/stats:
    get:
      tags: [neighbor, mobile]
      operationId: neighborVoteStats
      summary: 投票看板（四态计数 + 两组平均参与率）
      description: |
        `runningPartRate` / `endedPartRate` 分开给：进行中的参与率还在爬，
        和已结束的放一起取平均没有意义（一个 32%、一个 47%，平均出来 39% 谁也解释不了）。

        `votesTotal` 是**票数合计**（多选一票勾两项算两票），不是户数。
        要"参与户数"必须从投票记录表按 `ownerId` 去重，那是另一张表的事。
      x-permission: n.votes.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/votes/{voteId}:
    get:
      tags: [neighbor, mobile]
      operationId: getNeighborVote
      summary: 投票详情（含选项）
      description: |
        详情页是给运营改题、发公告用的，所以选项票数**照实给**。
        "投完才看结果"是**业主端**的约束，在 `/mp` 侧判，不在这一层 ——
        在这里藏票数只会让运营看不见自己发的东西跑成什么样。

        员工侧没有"我的票"：不返回 `myVote` 之类的字段。员工是来看进度的，不是来投票的。
      x-permission: n.votes.view
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [neighbor, mobile]
      operationId: updateNeighborVote
      summary: 编辑投票（仅草稿）
      description: |
        **只有草稿能改。** 一旦发布（已有票投出），题目与选项都不可变：
        改完的选项会让已投出的票指向不存在的位置，合计直接对不上。

        要拦在服务端，不能只靠前端灰按钮 —— 灰按钮挡不住直接调接口。
        真要改，正确做法是结束这一场、复制一份新的并说明变更。

        草稿期改选项时，**key 相同的选项保留已累积的票数**（草稿正常没票，
        但复制来的草稿可能有），被删掉的选项连票一起丢。
      x-permission: n.votes.edit
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeighborVoteRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已开始，题目与选项不可改（40930）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [neighbor, mobile]
      operationId: deleteNeighborVote
      summary: 删除投票（仅草稿）
      description: |
        只有草稿能删。**进行中 / 已结束的不许删**：票已经投出去了，
        删掉等于抹掉参与记录 —— 要下架就结束它，历史留着。

        要删已结束的，走数据管理而不是这个接口。
      x-permission: n.votes.edit
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: boolean, description: 恒为 true }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 非草稿不可删（40934）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /neighbor/votes/{voteId}/result:
    get:
      tags: [neighbor, mobile]
      operationId: neighborVoteResult
      summary: 结果聚合（分布 + 参与率 + 可信度，**不给结论**）
      description: |
        返回分布、参与率，以及一个 `confidence` 提示（≥50% 有效 / ≥30% 可参考 / 否则偏低）。
        `confidence` 是给运营看的**样本提示**，不是结论 —— 它的作用是让人在群里转发前
        先看一眼"只有 12% 的人投了"。

        **刻意不返回「是否通过」**：一旦给出结论，它就会被当成《民法典》278 条的
        业主大会决议来主张 —— 而真表决要人数 + 专有部分面积双过半、要公示期、要纸质票，
        小程序替代不了票箱。这条不是没做完，是不做；也不留 `conclusion` 空字段，
        留了迟早有人往里填"通过"。

        三个数各有各的算法，别混：
        - 选项 `pct` 按**票数**算，按票数降序，合计 100%；
        - `partRate` = 票数 / `target`；
        - `notVoted` = `target` − 票数（分母已经兜过底，不会是负数）。
      x-permission: n.votes.view
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteResultEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /neighbor/votes/{voteId}/publish:
    post:
      tags: [neighbor, mobile]
      operationId: publishNeighborVote
      summary: 发布投票（草稿 → 进行中）
      description: |
        发布即对项目内业主可见。两条前置校验：
        1. `endAt` 不能已经过去（发一场已经截止的投票，业主点进去就是"已结束"）；
        2. 选项至少 2 项 —— 一项的投票没有意义。

        发布时把 `startAt` 置为当天（草稿的 `startAt` 是空的，用"创建日"当开始日
        会让统计口径对不上）。

        重复发布返回 409（40931），**不做幂等成功**：重复点击意味着有人以为没发出去，
        要让他看到"已经在进行中"，而不是再发一场。已结束的不能重发（40932），
        要再来一次请复制一份 —— 重发会让上一场的票凭空消失。
      x-permission: n.votes.edit
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      responses:
        '200':
          description: 成功（`status=进行中`，`startAt` 为当天）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已在进行中（40931）/ 已结束不能重发（40932）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/votes/{voteId}/end:
    post:
      tags: [neighbor, mobile]
      operationId: endNeighborVote
      summary: 提前结束投票
      description: |
        只有「进行中」能结束（40933）—— 草稿没有"结束"这回事，删掉即可。
        结束只改状态，**不产出任何结论**（见 `/result` 的说明）。

        结束后结果对全体可见 —— 业主端"已结束"tab 就是靠这个状态。
      x-permission: n.votes.edit
      parameters:
        - $ref: '#/components/parameters/neighborVoteId'
      responses:
        '200':
          description: 成功（`status=已结束`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborVoteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 不是进行中（40933）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /neighbor/activities:
    get:
      tags: [neighbor, mobile]
      operationId: queryNeighborActivities
      summary: 活动列表（仅本项目、未结束）
      description: |
        只列「报名中 / 待成行 / 已成行」。草稿、已流团、已结束不出现 ——
        已结束的留在 PC 做导出与归档。

        **待成行是独立状态**：报名截止后人数没到下限，既不是「报名中」也不是「已结束」。
        列表上必须显示「待成行 / 还差 N 人」，不要统一写"报名中"。
      x-permission: n.activities.view
      parameters:
        - name: communityId
          in: query
          required: true
          schema: { type: string }
        - name: phase
          in: query
          schema: { type: string, enum: [报名中, 待成行, 已成行] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [neighbor, mobile]
      operationId: createNeighborActivity
      summary: 新建活动（草稿）
      description: |
        建出来是**草稿**，发布后才对业主可见（`POST /{activityId}/publish`）。

        校验比表单显示的多，都是踩过的：
        1. `type` 只能是**公益 / 收费**。注意：种子里的历史活动存的是类别
           （敬老 / 亲子 / 文体 / 出游），那是历史数据；新建一律走「收费与否」这个口径，
           类别留给 `desc` 或后续的 `category` 字段。两种口径混在一个字段里，
           是这批数据最该修的一处（见 `NeighborActivity.type` 的说明）。
        2. **地点必填** —— 业主报名后要知道去哪，事后再补等于通知不到位；
        3. `enrollDeadline` 必填，且**不能晚于开始时间**：活动开始了还在收人，
           车已经走了；
        4. 收费活动（`type=收费`）必须同时有：`fee > 0`、`minCapacity ≥ 1`、
           `refundPolicy` 非空；分档比例要**随提前天数减少而降低**
           （提前越久退得越多，反过来就是在惩罚早取消的人）；
        5. `capacity` 不能小于已报名人数（编辑时）。

        `phase` 不落库，按 `status` + `enrollDeadline` + 已报人数**现算**
        （草稿 / 报名中 / 待成行 / 已成行 / 已流团 / 已结束）。
      x-permission: n.activities.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeighborActivityRequest' }
      responses:
        '200':
          description: 已创建（草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityEnvelope' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/activities/stats:
    get:
      tags: [neighbor, mobile]
      operationId: neighborActivityStats
      summary: 活动看板（四阶段计数 + 收款 + 缺口）
      description: |
        五个数，各有各的用处，不能合并：
        - `running` 报名中 / `waiting` 待成行 / `odd` 已成行 / `flowed` 已流团；
        - `gapTotal` 是**待成行场次一共还差多少人成团** —— 决定今天要不要发推送拉一把。
          这个数比"待成行 3 场"有用得多：差 2 人的和三场各差 20 人的，动作完全不同。

        `paidAmount` 只统计收费活动的**已收**金额（含同行人）。
        `enrollPeople` 是有效报名人次（不含已取消 / 已退款）。

        按登录人数据范围过滤，与列表同源 —— 看板 12、列表 3 是最容易被截图对比的错误。
        注意 `ended` 不在返回值里：已结束的场次在 PC 的归档页看，看板只看"还要不要管"。
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/activities/options:
    get:
      tags: [neighbor, mobile]
      operationId: neighborActivityOptions
      summary: 活动下拉（代报名、举报跳转用）
      description: |
        只回**未结束、非草稿**的活动，形如 `{ value, label }`，label 里带日期
        （「秋日露营 · 亲子两天一夜 · 2026-11-01」）—— 同名活动一年办两次是常事，
        只给标题的选择框一定会选错。

        这不是"活动类别字典"。类别与收费口径的枚举在契约 schema 里固定，
        不需要再走一次接口。
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [value, label]
                          properties:
                            value: { type: string, example: AC0016 }
                            label: { type: string, example: 冬日温泉一日游 · 含往返与午餐 · 2026-11-22 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/activities/{activityId}:
    get:
      tags: [neighbor, mobile]
      operationId: getNeighborActivity
      summary: 活动详情（含退款规则）
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [neighbor, mobile]
      operationId: updateNeighborActivity
      summary: 编辑活动（已结束 / 已流团不可改）
      description: |
        两条硬规则，都是钱与承诺的问题：

        1. **已结束或已流团的不能改**（40940）。已经成团办完的活动改内容，
           等于事后修改宣传口径；已流团的改了，退款依据就没了。要改请复制一份新的。
        2. **已有人报名，不能改单价**。已报名的人按旧价付过钱，改完金额就对不上，
           退款也没依据。要调价请另开一场并说明。

        `capacity` 不能小于已报名人数 —— 否则列表上出现「42/20」，进度条画到 210%。
        活动开始后人数还在涨的现实里，这条比"名额已满就拒"更重要：
        允许超，但要看得见超了多少（`over` 字段）。

        其余字段（标题 / 地点 / 时间 / 名额 / 退款档位）在活动结束前都可以改：
        换集结点是运营每天都会遇到的事，不给改的后果是让业主看到错的信息。
      x-permission: n.activities.edit
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeighborActivityRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已结束 / 已流团不可改（40940）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/activities/{activityId}/enrolls:
    get:
      tags: [neighbor, mobile]
      operationId: queryNeighborEnrolls
      summary: 报名名单
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
        - name: status
          in: query
          schema: { type: string, enum: [已报名, 已签到, 已取消, 已退款] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborEnrollListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /neighbor/activities/{activityId}/enroll:
    post:
      tags: [neighbor, mobile]
      operationId: enrollNeighborActivity
      summary: 代报名（可现场代收）
      description: |
        现场最常见：阿姨不会用小程序，前台帮她报、顺手收现金。

        四条硬校验（服务端为准，客户端只做提前提示）：
        1. **只有「报名中」能报名** —— 「待成行」报名已截止，直接 409；
        2. 人数 ≤ `attendeeLimit`，且不超剩余名额；
        3. `needInsurance=true` 时，**每位出行人都要姓名 + 证件号** —— 只有联系人买不了保险；
        4. 同一手机号重复报名要拦（现场两个人同时办会重复），返回 409 并带上已有记录。

        `paid=true` 记「已支付」并写 `paymentMethod`（现金 / 扫码），日结能看到这笔；
        `paid=false` 记「待支付」，业主端会看到待付。
      x-permission: n.activities.enroll
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NeighborEnrollRequest' }
      responses:
        '200':
          description: 报名成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborEnrollEnvelope' }
        '409':
          description: 不在报名期 / 重复报名 / 名额不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/activities/{activityId}/publish:
    post:
      tags: [neighbor, mobile]
      operationId: publishNeighborActivity
      summary: 发布 / 重新发布活动（草稿或已流团 → 报名中）
      description: |
        两种入口共用：首次发布（草稿 → 报名中），以及流团后重新发（已流团 → 报名中，
        清掉 `flowedAt`）。已结束的不能重发（40941）—— 办完的活动再发一次，
        上一场的报名与收款记录会被新一场盖住。

        三条前置校验：
        1. 报名截止日不能已经过去（40943 之外另给 422）：已经截止的活动发出去，
           业主点进去就是"不能报名"；
        2. 开始时间不能已经过去 —— 发一场已经过去的活动没有意义；
        3. 当前状态必须是草稿或已流团（40943），已在报名中的重复发布 40942。

        发布即对项目内业主可见，并开始接受报名。
      x-permission: n.activities.edit
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      responses:
        '200':
          description: 成功（`phase=报名中`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已结束不能重发（40941）/ 已在报名中（40942）/ 状态不允许（40943）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /neighbor/activities/{activityId}/end:
    post:
      tags: [neighbor, mobile]
      operationId: endNeighborActivity
      summary: 结束活动（归档，不退款）
      description: |
        只改状态为「已结束」，**不动钱**。已经报名的、已经付款的保持原样 ——
        活动办完了要归档，和"没办成要退钱"是两件事。

        要退钱走 `/{activityId}/flow`（流团）或逐单 `/enrolls/{id}/refund`。
        已经结束的再调一次 40944。
      x-permission: n.activities.edit
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      responses:
        '200':
          description: 成功（`phase=已结束`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborActivityEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已经结束（40944）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /neighbor/activities/{activityId}/flow:
    post:
      tags: [neighbor, mobile]
      operationId: confirmNeighborActivityFlow
      summary: 确认流团（未达下限 → 收费全额退、公益只取消）
      description: |
        **这是「待成行」唯一的出口**，所以门槛写得死一些：

        1. 只有 `phase=待成行` 能确认（40945）—— 还在报名期就退款，等于把活动掐死在半路；
        2. **必须写原因**：业主会拿着通知来问"为什么没成行"，没有原因的通知等于没通知；
        3. 收费活动逐单**全额**退款（`refundAmount = fee × 人数`），比例恒 100%
           —— 没成团是物业的问题，不是业主的；
        4. 公益活动「只置取消」这条分支**业务上不可达**：公益没有成团下限
           （`minCapacity = 0`），报名截止后直接判「已成行」，进不了「待成行」。
           代码里保留该分支只是防御，别据此认为公益也能流团；
        5. 已签到 / 已取消 / 已退款的不重复处理，逐单幂等。

        活动置 `flowedAt` + `已结束`，`flowReason` 落库。
        `phase` 的判定顺序里「已流团」必须在「已结束」之前 —— 否则确认流团后
        这件事就再也看不见了，事后查"为什么这场没办成"没有任何痕迹。
      x-permission: n.activities.edit
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 80, description: 流团原因，会发通知给报名人 }
      responses:
        '200':
          description: 成功（返回活动与退款汇总）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [activity, count, refunded]
                        properties:
                          activity: { $ref: '#/components/schemas/NeighborActivity' }
                          count: { type: integer, description: 本次处理的报名笔数（含公益的取消） }
                          refunded: { type: number, description: 本次退款金额合计；公益活动为 0 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 不是「待成行」（40945）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 没写原因
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /neighbor/activities/{activityId}/refund-ratio:
    get:
      tags: [neighbor, mobile]
      operationId: neighborRefundRatio
      summary: 按天算退款比例（取消前的预览）
      description: |
        业主点「取消报名」之前要知道能退多少，所以这个接口必须存在，
        而且**算法只有一份**：服务端按活动自己的 `refundPolicy` **从天数大的往小找**
        第一个命中的档位（提前 7 天 100% / 3 天 50% / 当天 0%）。

        从大到小这一步不能省：升序排第一个命中 `gap >= days` 的永远是 `days=0` 那档，
        提前一个月取消也只退 0%。（2026-11-06 修过一次这个问题，退款一直按最低档算，
        页面只显示"已退款"没暴露。）

        返回的是**一个数字**（百分比），不是对象。要"再等两天少退多少"，用
        `atDay` 传两个日期各算一次 —— 档位表本身在活动详情里（`refundPolicy`）。

        `atDay` 是**日期**（默认今天），不是"距开始天数"。
        没有退款档位的活动（公益）恒返回 100。
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
        - name: atDay
          in: query
          description: 按哪天算（YYYY-MM-DD），默认今天
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功（data 就是百分比数字）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: number, example: 50, description: 退款百分比 0~100 }
        '404': { $ref: '#/components/responses/NotFound' }

  /neighbor/activities/{activityId}/enrolls/stats:
    get:
      tags: [neighbor, mobile]
      operationId: neighborEnrollStats
      summary: 报名统计（人数 / 收款 / 缺口 / 阶段）
      description: |
        与名单列表**同源**：`people` 含同行人、不含已取消与已退款。
        名单页显示 12 人、统计显示 15 人，会让人现场重新点一遍人头。

        `paidAmount` 只算收费活动；`refundAmount` 是已退出去的合计。
        `gap` 是距成团还差几人（已成行为 0）—— 现场推活动时最有用的一个数。
        `phase` 一起带上，省得前端再查一次详情才知道能不能报名。
      x-permission: n.activities.view
      parameters:
        - $ref: '#/components/parameters/neighborActivityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborEnrollStatsEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /neighbor/enrolls/{enrollId}/cancel:
    post:
      tags: [neighbor, mobile]
      operationId: cancelNeighborEnroll
      summary: 取消报名（收费活动走退款）
      x-permission: n.activities.enroll
      parameters:
        - $ref: '#/components/parameters/neighborEnrollId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 60 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborEnrollEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }

  /neighbor/enrolls/{enrollId}/refund:
    post:
      tags: [neighbor, mobile]
      operationId: refundNeighborEnroll
      summary: 按分档退款（金额服务端算，不接受前端传值）
      description: |
        退款比例来自活动配置的分档（如提前 7 天 100% / 提前 3 天 50% / 当天 0%），
        **客户端不许自己算金额**。单笔超过 ¥2000 引导到 PC —— 移动端不做大额退款。
      x-permission: n.activities.enroll
      parameters:
        - $ref: '#/components/parameters/neighborEnrollId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 60 }
                operator: { type: string }
      responses:
        '200':
          description: 成功（回 refundAmount 与命中的 ratio）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      enroll: { $ref: '#/components/schemas/NeighborEnroll' }
                      ratio: { type: number, description: 命中档位百分比 }
                      amount: { type: number, description: 实退金额 }
        '409': { $ref: '#/components/responses/Conflict' }

  /neighbor/enrolls/{enrollId}/checkin:
    post:
      tags: [neighbor, mobile]
      operationId: checkinNeighborEnroll
      summary: 签到（活动当天）
      description: |
        只有「已报名」能签到；**「待成行」的活动不能签到** —— 人可能根本不成行。
        签到记 `checkinBy` / `checkinAt`，回 PC 名单页能追溯是谁办的。
      x-permission: n.activities.enroll
      parameters:
        - $ref: '#/components/parameters/neighborEnrollId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeighborEnrollEnvelope' }
        '409':
          description: 已签到 / 状态不可签到 / 活动待成行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --------------------------------------------------------------- rectify
  /rectify-orders:
    get:
      tags: [rectify]
      operationId: queryRectifyOrders
      summary: 整改单列表（分页）
      description: 未闭环的排前面（超期最前），已闭环按闭环时间倒序。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RectifyStatus' }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/RectifyLevel' }
        - name: deptName
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          description: 只看超期未整改
          schema: { type: boolean }
        - name: vf
          in: query
          schema: { type: string, enum: ['', todo, overdue, recheck, closed] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rectify-orders/{rectifyId}:
    get:
      tags: [rectify]
      operationId: getRectifyOrder
      summary: 整改单详情（含整改项与流程）
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rectify-orders/{rectifyId}/submit:
    post:
      tags: [rectify]
      operationId: submitRectify
      summary: 提交整改（部门侧）
      description: 整改项必须**全部完成**才能提交，否则 422 并告知还剩几项。
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemNos:
                  type: array
                  description: 本次完成的整改项序号；不传 = 全部完成
                  items: { type: integer }
                submitRemark: { type: string }
                photos: { type: integer }
                submitBy: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /rectify-orders/{rectifyId}/recheck:
    post:
      tags: [rectify]
      operationId: recheckRectify
      summary: 复核（品质督导侧）
      description: |
        通过 → 「已闭环」；不通过 → 「已退回」，**整改项归零重做**（退回不是只改个状态）。
        提交人不得自己复核（否则等于自证清白），违反返回 422。
      parameters:
        - $ref: '#/components/parameters/rectifyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass, recheckBy]
              properties:
                pass: { type: boolean }
                remark: { type: string }
                recheckBy: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectifyEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- quality
  /quality-checks:
    get:
      tags: [quality]
      operationId: queryQualityChecks
      summary: 品质检查记录列表（分页）
      description: |
        本表是**结果台账**（查出什么、改没改完），现场评分卡是另一个入口，两者共用评分档位但页不合并。
        `sourceType` 区分「现场抽查」与「任务评价」——任务评价由品质经理对部门达标率打分后生成。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/kw'
        - name: area
          in: query
          description: 检查区域（保洁 / 安保 / 工程 / 客服），是业务条线不是空间层级
          schema: { type: string }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/QualityGrade' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QualityStatus' }
        - name: sourceType
          in: query
          schema: { type: string, enum: [现场抽查, 任务评价] }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: vf
          in: query
          schema: { type: string, enum: ['', unqualified, rectifying, recheck, overdue, veto] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /quality-checks/{checkId}:
    get:
      tags: [quality]
      operationId: getQualityCheck
      summary: 品质检查详情（含关联整改单）
      parameters:
        - $ref: '#/components/parameters/checkId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 列表页的「范围小计 / KPI」：不给前端自己 reduce 的机会，否则又是一个口径
  /payments/summary:
    get:
      tags: [payments]
      operationId: paymentSummary
      summary: 缴费汇总（筛选口径）
      description: |
        和列表**同一套筛选条件**，返回笔数、金额、现金、未开票与退款。
        所有字段都受筛选影响；「今日 / 本月」也受（不传 `startDate/endDate` 就是数据集当天/当月）。
        **KPI 卡要全局数就在空筛选下再取一次**——不要在一个响应里混两种口径，
        否则「本页合计」和「全部合计」永远对不上，对账时要吵起来。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PayMethodLegacy' }
        - name: channel
          in: query
          schema: { type: string }
        - name: invoiceStatus
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: subjectType
          in: query
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          schema: { type: string, enum: ['', parkonly, cash, uninvoiced, red, deposit] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSummaryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /quality-checks/summary:
    get:
      tags: [quality]
      operationId: qualityCheckSummary
      summary: 品质记录汇总（筛选口径）
      description: |
        同列表筛选。`avgScore` 按当前筛选集求平均（不含已作废记录——本表没有作废态）。
        `unqualified` 含**一票否决**：否决记录分数可能不低，只按 `<70` 判会漏。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: area
          in: query
          schema: { type: string }
        - name: grade
          in: query
          schema: { $ref: '#/components/schemas/QualityGrade' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QualityStatus' }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: sourceType
          in: query
          schema: { type: string, enum: [现场抽查, 任务评价] }
        - name: vf
          in: query
          schema: { type: string, enum: ['', unqualified, rectifying, recheck, overdue, veto] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualitySummaryEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------- reports
  # 报表是**跑批产物**，不是实时查询。三个接口都只读快照：
  #   ① 欠费账龄、收缴率、部门达标率都依赖「截至某一天」的口径，实时算两次刷新两个数；
  #   ② 审计要能回答「上个月的报表当时长什么样」，实时算答不了；
  #   ③ 部门达标率要扫全量巡检明细，实时算会把列表接口拖成秒级。
  # 所以口径是：`POST /reports/recalc` 生成批次 → 落库 → 查询接口按 `statDate` 读快照。
  /reports/snapshots:
    get:
      tags: [reports]
      operationId: listReportSnapshots
      summary: 统计批次列表（哪天跑过哪张表、成功没有）
      description: |
        报表查询接口的 `statDate` 从这里取。前端默认用 `latest`，
        但必须能选历史批次——审计、环比、复现「数字对不上」全靠它。
        排序：`statDate` 倒序，同一天按 `batchNo` 倒序（-02 在 -01 前面）。
      parameters:
        - name: reportCode
          in: query
          description: 不传则返回全部报表的批次
          schema: { $ref: '#/components/schemas/ReportCode' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportBatchStatus' }
        - name: periodType
          in: query
          schema: { $ref: '#/components/schemas/ReportPeriodType' }
        - name: limit
          in: query
          description: 返回条数（批次多，不做页码）
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/arrears:
    get:
      tags: [reports]
      operationId: queryArrearsReport
      summary: 欠费账龄报表（按「楼栋 × 账龄」聚合）
      description: |
        读快照，不实时算。统计口径：

        - 只算 `unpaid > 0` 的账单；`已作废` 不进表；
        - **账龄按 `statDate` 与 `dueDate` 的天数差**分档，所以同一批账单在不同
          `statDate` 下会落到不同档——这也是必须落快照的原因；
        - `未到期` = 账单到期日 ≥ 统计日（还没到期的应收不算欠费，但要看得出规模）；
        - `avgOverdueDays` 只对已逾期部分求平均，`未到期` 行固定为 0；
        - **排序固定**：账龄从最老到最新（`180天以上` → `未到期`），同档按欠费金额倒序。
          催缴先看欠最久的；顺序写死是为了前端翻页/导出与后台核对时能对上。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/year'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - name: aging
          in: query
          description: 只看某一档账龄
          schema: { $ref: '#/components/schemas/AgingBucket' }
        - name: kw
          in: query
          description: 楼栋名
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArrearsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/collection-rate:
    get:
      tags: [reports]
      operationId: queryCollectionRateReport
      summary: 收缴率报表（按「账期 × 科目」聚合）
      description: |
        读快照。收缴率 = 已收 ÷ 应收，**分母剔除「已作废」与「已减免」**——
        减免是公司的决策不是业主欠费，算进分母会让收缴率永远达标不了。

        `rate` 在应收为 0 时返回 `null`（前端显示「—」），不要回 0：
        0 和「没有应收」是两件事，混了会让报表出现假的 0% 收缴率。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/periodType'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/communityId'
        - name: billPeriod
          in: query
          description: 行级筛选：只看某个账期（与报表期次 `period` 是两回事）
          schema: { type: string, example: '2026-10' }
        - name: itemId
          in: query
          schema: { type: string, example: FI01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionRateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/dept-target:
    get:
      tags: [reports]
      operationId: queryDeptTargetReport
      summary: 部门达标率报表（按「部门 × 周期」）
      description: |
        读快照。口径（与原型 `api.js` 的 `deptAchievement` 同一份）：

        - 完成率 = 已完成执行任务 ÷ 执行任务总数（**监督任务不进分母**，否则越查越低）；
        - 合格率 = 合格检查项 ÷ 检查项总数（只统计已完成任务的项）；
        - 加权达标率 = 合格率 × `weightPass` + 完成率 × `weightDone`，权重按岗位配（见
          `weightPass + weightDone = 1`）；
        - 得分 = 加权达标率 × 100 − 自查问题 × 2 × 0.5 − 抽查问题 × 2 × 1.5，下限 0；
        - 等级：≥90 优秀 / ≥80 良好 / ≥70 合格 / <70 不合格。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/statDate'
        - $ref: '#/components/parameters/periodType'
        - $ref: '#/components/parameters/period'
        - $ref: '#/components/parameters/communityId'
        - name: billPeriod
          in: query
          description: 行级筛选：只看某个评价周期（与报表期次 `period` 是两回事）
          schema: { type: string, example: '2026-10' }
        - name: post
          in: query
          schema: { $ref: '#/components/schemas/InspectPost' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptTargetEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/recalc:
    post:
      tags: [reports]
      operationId: recalcReport
      summary: 触发重算（异步任务）
      description: |
        **异步**，返回任务号，不同步等结果。幂等规则：

        - 同一 `reportCode + statDate` 已有「运行中」任务 → **不新建**，直接返回该任务（200 + `reused=true`）；
        - 已成功过的日期允许重算，生成同一天的下一个批次（`RPT-20261021-02`），
          旧批次保留可查——报表要能回答「当时是怎么算的」；
        - 重算只影响 `statDate ≥ 该日` 的批次，不动历史。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportCode]
              properties:
                reportCode: { $ref: '#/components/schemas/ReportCode' }
                periodType:
                  $ref: '#/components/schemas/ReportPeriodType'
                period:
                  type: string
                  description: 期次值（日=YYYY-MM-DD / 月=YYYY-MM / 年=YYYY）。按日也可继续用 statDate
                  example: '2026-10'
                statDate:
                  type: string
                  format: date
                  description: 按日重算时的统计日（数据截止到该日 24:00）；与 period 二选一
                  example: '2026-10-21'
                note: { type: string, description: 重算原因（会写进批次备注）' }
      responses:
        '202':
          description: 任务已受理（**不是 200**：报表不会同步算完）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '200':
          description: 已有同参数的运行中任务，直接复用（`reused=true`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/recalc/{taskId}:
    get:
      tags: [reports]
      operationId: getRecalcTask
      summary: 查重算任务进度
      description: |
        前端轮询这个接口（建议 2s 一次，最多 60 次）。`status=成功` 时 `batchNo` 才有值，
        页面据此跳到新批次——不要用「重算成功后自动刷新列表」这种写法，
        批量任务完成时间不可控，会把用户的选择冲掉。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, example: RCL-20261030-01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportTaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/retention:
    get:
      tags: [reports]
      operationId: getReportRetention
      summary: 批次保留现状（清理任务与运维页用）
      description: |
        **为什么报表要有保留策略**：日快照一天 3 张表，一年就是 1000+ 批次，
        下拉框和索引都会被拖垮。但也不能随便删——

        | 粒度 | 默认保留 | 理由 |
        |---|---|---|
        | 日 | 90 天 | 日常核对用，超过 90 天的日常没人看 |
        | 月 | 24 期（2 年） | 年度审计要看前两年月报 |
        | 年 | **永久** | 年报是最小粒度的历史凭证，删了等于抹账 |

        **已月结期间的批次一律受保护**，即使超过保留期也不清理：审计要能回答
        「那个月报表当时长什么样」，而月结正是"当时"被确认的时间点。
        受保护的数量在 `protectedClosed` 里单独给，别让它混进 `expired`（否则会看起来一直清理不干净）。
      parameters:
        - name: keepDays
          in: query
          description: 日快照保留天数（缺省 90）
          schema: { type: integer, minimum: 1, default: 90 }
        - name: keepMonths
          in: query
          description: 月快照保留期数（缺省 24）
          schema: { type: integer, minimum: 1, default: 24 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRetentionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/purge:
    post:
      tags: [reports]
      operationId: purgeReports
      summary: 清理过期批次（运维任务，幂等）
      description: |
        按保留策略删除过期批次，返回删了哪些。**幂等**：重复跑不会多删，
        第二次 `removed=0`——清理任务必须能无条件重试，否则失败一次就没人敢再跑。

        参数可覆盖保留策略（`keepDays` / `keepMonths`），供运维在存储吃紧时临时收紧；
        **不能通过参数删除受保护批次**——已月结期间的批次永远不删（`keptProtected` 会说明保住了几个）。

        删的是**批次**不是**期间**：某个期间的批次被清完，再查该期间应回 404 / 40402
        （"没有这个批次"），而不是空表——空表和没跑过必须能区分。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keepDays: { type: integer, minimum: 1, default: 90 }
                keepMonths: { type: integer, minimum: 1, default: 24 }
                dryRun:
                  type: boolean
                  default: false
                  description: 只算不删。第一次上线前先跑一次这个，看清会删什么
      responses:
        '200':
          description: 成功（dryRun 时 removed 为"将要删除"的数量）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPurgeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------ contracts
  /contracts:
    get:
      tags: [contracts]
      operationId: queryContracts
      summary: 合同列表（分页）
      description: |
        快捷视图 `vf` 由服务端算（与列表同一套谓词），别让前端自己 filter——
        前端过滤的话，翻页后的计数就错了。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          description: 合同类型
          schema:
              type: string
              enum: [劳动合同, 物业服务协议, 运维服务, 多种经营, 租赁协议, 采购协议]
              example: 运维服务
        - name: subtype
          in: query
          schema: { type: string, example: 劳务协议 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ContractStatus' }
        - name: vf
          in: query
          description: 快捷视图（服务端算）
          schema: { type: string, enum: ['', pending, expiring, expired, big, group, changePending] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [contracts]
      operationId: createContract
      summary: 新建合同（草稿）
      description: |
        `contractNo` 由服务端生成（`HT-YYYY-NNNN`），前端传了也忽略——
        让前端生成单号的结果是两个人同时新建拿到同一个号。
        新建后状态为「待审批」，不直接生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, partyB, amount, startDate, endDate]
              properties:
                name: { type: string }
                type:
                  type: string
                  enum: [劳动合同, 物业服务协议, 运维服务, 多种经营, 租赁协议, 采购协议]
                  example: 运维服务
                subtype: { type: string, example: 电梯维保 }
                communityId: { type: string }
                partyB: { type: string, description: 相对方 }
                contact: { type: string }
                phone: { type: string }
                amount: { type: number }
                incomeCategory:
                  $ref: '#/components/schemas/ContractIncomeCategory'
                publicRevenue:
                  type: number
                  description: 归业主的公共收益；仅 incomeCategory=多种经营 可填，且不得大于 amount
                payCycle: { type: string, example: 月付 }
                signDate: { type: string, format: date }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                remark: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contracts/summary:
    get:
      tags: [contracts]
      operationId: contractSummary
      summary: 合同汇总（KPI）
      description: |
        与列表**同源**统计（同一套谓词），前端不要自己再 reduce 一遍。
        `expiring` 取状态「即将到期」——该状态由跑批按到期日刷新（样例阈值 90 天），
        前端**不要**自己按 30 天重算，否则列表与 KPI 会差几条，且没人说得清谁对。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contracts/{contractId}:
    get:
      tags: [contracts]
      operationId: getContract
      summary: 合同详情（含关联对象、时间线、变更记录）
      description: |
        `ref` 按 `refType` 带出关联对象（房屋 / 车位 / 员工）——合同相对方不是一句文本，
        要能点进去看。查不到时为 `null`，不要让详情页因此 500。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contracts/{contractId}/changes:
    post:
      tags: [contracts]
      operationId: submitContractChange
      summary: 发起合同变更（进审批，不直接改合同）
      description: |
        **变更不动合同本身**：先生成 `ContractChange`（before / after 快照）+ 审批单，
        审批通过才回写。`before` 是发起时的值，事后合同再变也不影响这张单子查得到"当时改了什么"。

        约束（错在哪说哪，别合成一句"参数错误"）：

        - 合同已「已到期 / 已终止」→ 422（终态不能变更）；
        - 该合同已有变更在审批中 → **409 / 40906**（不是 422：这不是参数错，是要先去处理那一单）；
        - 变更内容与原合同完全一致 → 422（空变更没有审批的意义）。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeType, reason]
              properties:
                changeType: { type: string, example: 金额调整 }
                reason: { type: string, minLength: 4 }
                patch:
                  type: object
                  description: 要改的字段（只传改动的）；提前终止可不传
                  properties:
                    name: { type: string }
                    amount: { type: number }
                    partyB: { type: string }
                    startDate: { type: string, format: date }
                    endDate: { type: string, format: date }
      responses:
        '201':
          description: 已提交审批
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractChangeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # -------------------------------------------------------------- notices
  /contracts/{contractId}/attachments:
    get:
      tags: [contracts]
      operationId: listContractAttachments
      summary: 合同附件列表（元数据）
      description: |
        只回元数据，**不回下载地址**：给地址的接口一旦被复制，链接就永远有效。
        下载要走下面的 `download`，它签发的是**临时链接**（默认 20 分钟）并记一条导出日志——
        合同是"谁在什么时候拿走了扫描件"最该查得到的一类文件。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractAttachmentListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contracts/{contractId}/attachments/{fileId}/download:
    post:
      tags: [contracts]
      operationId: downloadContractAttachment
      summary: 签发附件临时下载链接（记导出日志）
      description: |
        返回一次性签名链接 + 过期时间，同时写一条导出日志（文件外发属于数据出口）。

        契约不返回文件流：真实系统里附件在对象存储，业务服务只负责**鉴权 + 签名**；
        让业务服务转发文件流的结果是——大文件下载把 API 进程拖住，且日志里看不出"下了多少"。
      parameters:
        - name: contractId
          in: path
          required: true
          schema: { type: string, example: CT0001 }
        - name: fileId
          in: path
          required: true
          schema: { type: string, example: CT0001-F1 }
      responses:
        '200':
          description: 已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentDownloadEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notices:
    get:
      tags: [notices]
      operationId: queryNotices
      summary: 公告列表（分页）
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          schema: { type: string, example: 停水停电 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NoticeStatus' }
        - name: vf
          in: query
          description: 快捷视图（服务端算）
          schema: { type: string, enum: ['', pending, published, expired, top, lowRead] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [notices]
      operationId: createNotice
      summary: 新建公告（草稿）
      description: |
        新建只会得到「草稿」，不会直接发布——发布是独立动作，要单独调 `/publish`。
        `channels` 至少一个：没有渠道的公告等于没发（前台看得见、业主收不到）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, content, channels]
              properties:
                title: { type: string, minLength: 4 }
                type: { type: string, example: 停水停电 }
                communityId: { type: string, description: 空 = 全部项目 }
                content: { type: string, minLength: 10 }
                channels:
                  type: array
                  minItems: 1
                  items: { type: string }
                top: { type: boolean }
                attachments: { type: integer }
      responses:
        '201':
          description: 已创建（草稿）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/summary:
    get:
      tags: [notices]
      operationId: noticeSummary
      summary: 公告汇总（KPI）
      description: "`avgReadRate` 只统计**已发布**的公告；草稿与撤回的没有阅读率，混进去会把平均拉低。"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notices/{noticeId}:
    get:
      tags: [notices]
      operationId: getNotice
      summary: 公告详情（含时间线与触达）
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [notices]
      operationId: updateNotice
      summary: 修改公告（仅草稿/待审核可改）
      description: 已发布的公告不能改内容——业主已经看过了，改了等于篡改留痕。要改就先撤回。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                channels: { type: array, items: { type: string } }
                top: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已发布不能改（40907）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40907, message: '已发布的公告不能修改，请先撤回', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/submit-audit:
    post:
      tags: [notices]
      operationId: submitNoticeAudit
      summary: 提交审核（草稿 / 已撤回 → 待审核）
      description: |
        与「发布」拆成两个动作，因为它们**不是同一个人做的**：编辑提审、主管发布。
        合成一个接口的结果是——只要点了发布，就自动跳过审核，谁审的这栏永远是空的。

        `readCount` 在这里**不清零**：公告还没发出去，还没人看过；清了反而看不出"上一轮有多少人看过"。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 已提交审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不能提审（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '公告当前状态「已发布」，只有草稿与已撤回可以提交审核' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/publish:
    post:
      tags: [notices]
      operationId: publishNotice
      summary: 发布（待审核 → 已发布）
      description: |
        只处理**待审核**的公告：草稿与已撤回要先走 `/submit-audit`（提审与发布是两个角色的事）。
        **已发布与已过期不再接受发布**（409/40908）——重复点发布，业主会收到两条一模一样的推送，
        然后打客服电话问"到底停不停水"。

        发布时 `readCount` 归零：这是新一轮推送，上一轮的已读不能算进来（撤回时不清零，
        因为那批人确实看过）。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许发布（40908）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40908, message: '已发布的公告不能重复发布', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/repush:
    post:
      tags: [notices]
      operationId: repushNotice
      summary: 补推未读（只推没看过的人）
      description: |
        给**已读为 0 的那部分业主**再推一次，不是"再发一条公告"——
        公告本身没有新增内容，重复推给已读的人只会让人关掉通知。
        没有未读时返回 422（"没有未读业主，无需补推"），不要静默成功。
        补推次数记在 `repushCount` 里，便于判断这条公告是不是一直没人看。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /notices/{noticeId}/withdraw:
    post:
      tags: [notices]
      operationId: withdrawNotice
      summary: 撤回（仅已发布可撤）
      description: |
        撤回后状态转「已撤回」，已读数据保留（`readCount` 不清零）——业主确实看过，抹掉就是伪造。
        撤回不删除公告：撤了之后业主 App 上消失，但后台台账还在。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- close
  /month-closes:
    get:
      tags: [close]
      operationId: queryMonthCloses
      summary: 月结记录（分页，按期间倒序）
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - name: year
          in: query
          description: 只看某一年
          schema: { type: string, example: '2026' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MonthCloseStatus' }
        - name: scope
          in: query
          description: group = 只看全公司结账；community = 只看项目结账
          schema: { type: string, enum: [group, community] }
        - name: communityId
          in: query
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthClosePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [close]
      operationId: submitMonthClose
      summary: 提交月结（封账）
      description: |
        **幂等键是 `period`**：同一期间已结 → **409 / 40904**（不是 400，也不是覆盖写入）。
        因为「重复提交月结」和「参数写错」是两种完全不同的处置：前者要提示去看已有记录，后者要改参数。

        **支持按项目分别结账**（`communityId`）：物业公司按项目核算，一个项目账清了就能单独封。
        不传 `communityId` 就是全公司结账。

        校验顺序（错在哪一步就回哪一步，不要合成一句"参数错误"）：

        1. 期间不晚于当月（未来月份 → 422）；
        2. 该期间未结账（项目级看本项目，全公司级看全公司；已结 → 409/40904）；
        3. **全公司结账要求「有业务的项目」都已结**（→ 422，点名是哪几个项目）；
        4. 该期间有收款或有应收（全空 → 422，空月不必结）；
        5. 有未开票或欠费时 `memo` ≥ 4 字（→ 422，提示里点名具体笔数）。

        第 3 条是这条链的核心：汇总前明细没清，等于用总数掩盖某个项目的问题。
        「有业务」的判据是**当期有账单**——当期一笔账都没有的项目不参与，
        否则空项目永远结不掉，全公司就永远结不了。

        只有**全公司结账**才触发三张报表重算；项目级结账不动报表——
        报表是全公司口径，单个项目结完就宣布定稿是错的。

        **反结会级联**：全公司反结时，该期间的项目级结账一并置为已反结。
        只解汇总锁的话，项目明细还锁着，反结之后依然补录不了，等于白反。

        **权限**：`b.monthClose.edit`。项目经理**没有**这个权限：封账是财务动作，
        让项目经理封自己项目的账等于让他自己掩盖欠费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: '2026-10', description: 期间（YYYY-MM）}
                communityId:
                  type: string
                  description: 项目 ID；不传 = 全公司结账
                  example: P01
                memo: { type: string, description: 有未核销事项时必填，≥ 4 字 }
                operator: { type: string }
      responses:
        '201':
          description: 已结账
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该期间已结账（40904）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40904, message: '2026-09 已月结（YJ-202609-01），不能重复提交', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /month-closes/preview:
    get:
      tags: [close]
      operationId: previewMonthClose
      summary: 月结预览（结之前看这一屏就够，支持按项目）
      description: |
        **预览与提交必须用同一段计算**（同一函数），否则会出现"预览 1002 笔、结完记录写 998 笔"。
        返回 `closable` 让前端直接控制按钮，不要让前端自己再判一遍期间与状态。

        `prevNet` 是上个月净额，用来做环比；上月没结账就是 `null`——**不要给 0**，
        0 会被读成"上月净额为 0"。

        `unclosedCommunities` 只在**全公司预览**时非空：列出"有业务但还没结"的项目，
        前端据此提示"先去把这几个项目结了"。项目级预览返回空数组。
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, example: '2026-10' }
        - name: communityId
          in: query
          description: 项目 ID；不传 = 全公司口径
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthClosePreviewEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /month-closes/{closeId}:
    get:
      tags: [close]
      operationId: getMonthClose
      summary: 月结记录详情
      parameters:
        - name: closeId
          in: path
          required: true
          schema: { type: string, example: MC202609 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /month-closes/{closeId}/reopen:
    post:
      tags: [close]
      operationId: reopenMonthClose
      summary: 反结（红冲月结，恢复该期间可编辑）
      description: |
        **为什么允许反结**：月结后才发现上月漏了一笔收款是常态。不允许反结，
        结果是有人在数据库里改数——那才是真正的失控。允许，但要留痕。

        反结做四件事（同一事务）：

        1. 该记录置 `status=已反结`、`reopenedAt`、`reopenReason`，**记录不删**；
        2. 生成红冲凭证号 `reversalNo`（金额为该期净额的负数）。**不写进退款流水**：
           反结不是退款，塞进退款表会让「退款金额」统计失真；
        3. 该期间**报表批次标 `voided=true`**（保留可查，但不作为"最新成功批次"），
           报表立即回到 `provisional=true`；
        4. 该期间流水与账单恢复可写。

        约束：`reason` ≥ 10 字（要能说清为什么，不是"错了"两个字）；已反结的不能再反结（409 / 40905）。

        **权限**：`e.monthReopen.edit`——**刻意在 e 域而不是 b 域**。财务角色对 b 域是通配（`b.*`），
        反结是治理动作，不该被"管收费"这一个事实自动授予；放 b 域的结果是每个财务都静默获得推翻封账的能力。
        它是**按钮级**权限、不绑路由：绑了会抢走 `/b/month-close` 的页面守卫，两级授权就塌成一级。
        反结不限制次数，但每次都会出现在 `reopenCount` 里——反复反结本身就是要被看见的信号。
      parameters:
        - name: closeId
          in: path
          required: true
          schema: { type: string, example: MC202609 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
                operator: { type: string }
      responses:
        '200':
          description: 已反结
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthCloseEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该记录已反结（40905）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40905, message: '2026-09 已于 2026-10-30 反结，不能重复反结', data: null }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ employees
  /employees:
    get:
      tags: [employees]
      operationId: listEmployees
      summary: 员工列表（手机 / 证件仅掩码，不含薪资）
      description: |
        排序：`empId` 升序稳定排序。人事翻档案时跳页位置会变，比"按更新时间"更烦人。

        `orgId` 筛选**含下级**：点「翡翠城项目部」要能看到四个班组的人，
        而不是只看到直接挂在项目部下面的 4 个主管。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/kw'
        - name: orgId
          in: query
          description: 组织 ID，含全部下级组织
          schema: { type: string, example: O-P01 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmploymentStatus' }
        - name: empType
          in: query
          schema: { $ref: '#/components/schemas/EmpType' }
        - name: position
          in: query
          schema: { type: string, example: 客服专员 }
        - name: roleId
          in: query
          schema: { type: string, example: R-CS }
        - name: dataScope
          in: query
          description: 按角色带来的数据范围筛（E 域「六档」视图用）
          schema:
            type: string
            enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
        - name: vf
          in: query
          description: |
            快捷视图。前五个与 `/employees/summary` 的分项同源；
            后三个是 E 域的"数据范围视图"（谁看得见全部项目 / 只看本部门 / 只看自己），
            这三个不能靠前端过滤——服务端分页时前端只能过滤当前页。
          schema:
            type: string
            enum: [onjob, probation, noRole, contractExpiring, contractExpired, selfOnly, deptOnly, groupAll]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [employees]
      operationId: createEmployee
      summary: 新增成员（工号服务端生成，默认不带角色）
      description: |
        工号**由服务端生成**，前端传了也忽略——两个人同时新增会拿到同一个号，
        而工号是考勤机、工资代发、社保申报的对账依据。

        新员工的角色**由岗位反推**（`roleSource=position`），不是建档案时手填的——
        岗位没配对应角色时才是「未分配」。岗位管人事、角色管权限，各管一段；
        建档案时顺手指定角色，改一次岗位就要手工改一遍权限。

        这里**不建系统账号**：档案是人事口径，账号开通是 E 域的另一条流程。
        建档案顺手把账号建出来，等于每次加人都在扩一次登录面。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, orgId, position]
              properties:
                name: { type: string, minLength: 2 }
                orgId: { type: string, description: 人事档案归属组织（项目部这一级） }
                position: { type: string }
                phone: { type: string, description: 手机号；给了就要唯一且格式正确 }
                email: { type: string }
                hireDate: { type: string, format: date }
                status: { $ref: '#/components/schemas/EmploymentStatus' }
                idCard: { type: string }
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 手机号已存在（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '手机号「13900001111」已被 EM0007 占用' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/summary:
    get:
      tags: [employees]
      operationId: getEmployeeSummary
      summary: 员工汇总（列表页 KPI）
      description: |
        与列表**同一套谓词**（带同样的筛选参数），否则会出现"总计 68、列表 12"这种对不上的首屏。
        `contractExpiring` 按 **30 天内到期**算：劳动合同到期不续签要提前一个月通知，
        等到过期才提醒，赔偿金已经产生了。
      parameters:
        - $ref: '#/components/parameters/kw'
        - name: orgId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmploymentStatus' }
        - name: empType
          in: query
          schema: { $ref: '#/components/schemas/EmpType' }
        - name: vf
          in: query
          schema:
            type: string
            enum: [onjob, probation, noRole, contractExpiring, contractExpired, selfOnly, deptOnly, groupAll]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/org-tree:
    get:
      tags: [employees]
      operationId: getEmployeeOrgTree
      summary: 组织树（含各节点人数，只读引用）
      description: |
        返回**根节点的下级**（集团下一层），不是单个集团节点——el-tree 默认折叠，
        只给一个根的结果是进页面看到一个"嘉合物业服务集团"，点开才是全部。

        `headcount` 含子树、`selfHeadcount` 只算直接挂在节点上的人。
        只给一个数的后果是：点「翡翠城项目部」显示 0 人（人都挂在班组），
        用户会以为这个项目部是空的。

        组织本身的增删改**不在本域**（见 `e.org.edit`），这里只做只读引用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgTreeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/options:
    get:
      tags: [employees]
      operationId: getEmployeeOptions
      summary: 员工下拉（选人池）
      description: |
        只回**可指派**的人（在职，`assignable=true`）。默认不回离职与试用？
        ——试用要回：试用期员工照样排班、照样能被指派巡检任务。
        离职不回：选了离职员工，任务派下去没人接，系统还得兜一个"执行人已离职"的异常状态。

        `teamId` 用于巡检监督任务的责任员工候选（只能选被检班组的人）。

        **不要求 `c.employees.view`**：这里只回姓名 / 岗位 / 班组，不含手机与证件。
        要求档案权限的后果是——班组长排不了班，因为他没有翻人事档案的权限。
      parameters:
        - name: teamId
          in: query
          description: 班组 / 部门 ID（`O-P01-T2` 这类）
          schema: { type: string, example: O-P01-T2 }
        - $ref: '#/components/parameters/kw'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeOptionsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/{empId}:
    get:
      tags: [employees]
      operationId: getEmployee
      summary: 员工档案详情（角色 / 组织路径 / 合同 / 出勤，不含薪资）
      description: |
        手机与证件**仍是掩码**。明文必须走 `POST /employees/{empId}/reveal`——
        详情页自动带明文的结果是：任何人打开一次员工档案，就批量拿走了个人信息，且没人知道是谁拿的。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [employees]
      operationId: updateEmployee
      summary: 修改档案（一次提交多个字段）
      description: |
        **为什么是整包 `patch` 而不是单字段**：人事档案是一张表单一次改多项（转正 + 调级 + 续签同批发生）。
        逐字段提交会让版本号推进两次，第二次必冲突（40901），用户看到的是"我改了一次，系统说我被别人改了"。

        服务端**显式拒绝**（422）而不是静默忽略这三类字段：
        - `roleId` → 走 `PATCH /employees/{empId}/role`（要留"谁把谁提成了主管"的痕迹）；
        - `orgId` → 组织调动是**调岗单据**（带调出/调入确认、生效日），不是一个字段。本域暂不支持；
        - `baseSalary` / `monthlySalary` / `bankCard` → 工资域，改薪酬必须走审批。

        改 `phone` / `idCard` 必须带 `reason`（≥4 字）：这两个字段一改，
        考勤打卡、工资代发、门禁授权全部对不上，事后必须查得到为什么改。

        改 `position` 会**清除角色覆盖**并重算角色：调岗了还留着上一任的覆盖角色，
        等于人已经去工程组了，系统还让他批客服的假。

        紧急联系人（`emergencyContact` / `emergencyRelation` / `emergencyPhone`）单独一组规则：
        - 三项**要么都填、要么都空**（422/42215）—— 只填号码不给姓名，出事时不知道该找谁；
          只填姓名不给号码，等于没留联系方式；
        - `emergencyPhone` 必须是 11 位手机号；
        - `emergencyRelation` 只接受枚举值。

        这一栏存在的唯一目的就是应急，所以**不完整的值不落库**，而不是存下来等以后再补。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  description: 要改的字段；未出现的字段不动
                  additionalProperties: true
                ver:
                  type: integer
                  description: 乐观锁版本号（详情里的 `_ver`）；不一致 → 409/40901
                reason:
                  type: string
                  description: 改手机 / 证件时必填（≥4 字），写进访问日志
      responses:
        '200':
          description: 成功（返回改后的档案 + 角色重算结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本冲突（40901）/ 手机号重复（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                version:
                  value: { code: 40901, message: '该员工档案已被他人修改，请刷新后重试' }
                unique:
                  value: { code: 40902, message: '手机号「17537157990」已被 EM0007 占用' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/{empId}/reveal:
    post:
      tags: [employees]
      operationId: revealEmployeeSensitive
      summary: 揭示手机 / 证件明文（必填原因，写访问日志）
      description: |
        **双权限**：`c.employees.view`（能看到这个人的档案）+ `a.sensitive.view`（能看敏感信息）。
        只校验后者是不够的——楼管为了联系业主本来就有 `a.sensitive.view`，
        只按能力位放行，他顺带就能批量导出员工身份证号。

        `reason` 必填（≥4 字）：不写原因就等于没有审计——日志里全是"查看详情"的揭示记录，
        出了事一样查不出谁在批量导出员工身份证号。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              properties:
                fields:
                  type: array
                  description: 要揭示的字段，只支持 phone / idCard
                  items: { type: string, enum: [phone, idCard] }
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitiveRevealEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/{empId}/role:
    patch:
      tags: [employees]
      operationId: updateEmployeeRole
      summary: 调整角色（写覆盖，不改岗位）
      description: |
        员工表**不存角色**：角色由岗位反推（岗位 → 角色的映射表在角色域维护）。
        这里的调整写一层**覆盖**，优先于岗位反推——岗位是人事口径，角色是权限口径，
        两者大多数时候一致，不一致时（例如财务主管临时兼管品质）需要一个不动机主档的做法。

        返回里带 `from` / `to` / `affected`：`affected` 是两个角色的最新人数，
        前端拿它刷新角色树，不用重新拉一遍列表。

        离职员工不能调角色（409/40910）：人已经走了，调角色要么是给错人提权，
        要么是把权限挂在离职账号上没回收。要调先把状态改回在职。
      parameters:
        - name: empId
          in: path
          required: true
          schema: { type: string, example: EM0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, example: R-SEC }
                reason: { type: string, description: 建议填写，用于权限变更留痕 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeRoleChangeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 离职员工不能调整角色（40910）/ 已是该角色（40911）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                left:
                  value: { code: 40910, message: 'EM0088 已于 2026-09-30 离职，不能调整角色；先恢复在职' }
                same:
                  value: { code: 40911, message: '该员工已是「部门经理」，无需调整' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ payrolls
  /payrolls:
    get:
      tags: [payroll]
      operationId: listPayrolls
      summary: 工资表（按账期）
      description: |
        **工资条是核算快照，不是查询结果**。每月生成一批、核算后冻结金额；
        实时算的结果是同一个人今天看 11,058.98、明天补录一条加班就变 11,120.31，
        员工截图来问"为什么少了 62 块"时，谁也说不清哪个对。

        不返回手机号与证件号——工资域要员工姓名是必要的，但**不该成为绕过员工域权限的后门**。
        银行卡只回 `**** **** **** 9381` 形态，完整卡号走 reveal 接口。

        **`dataScope=仅本人` 时只回自己那一条**（不是返回全表让前端藏）。
        工资表最容易被做错的就是这一步：列表下发全量、前端按权限隐藏——等于没做。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/kw'
        - name: period
          in: query
          description: 账期（YYYY-MM）。缺省取最新一期
          schema: { type: string, example: '2026-10' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PayrollStatus' }
        - name: orgId
          in: query
          description: 组织 ID，含全部下级组织
          schema: { type: string, example: O-P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/summary:
    get:
      tags: [payroll]
      operationId: getPayrollSummary
      summary: 工资表汇总（列表页 KPI）
      description: |
        与列表同一套谓词。**已冲正的行不计入 `netTotal`**，单列在 `reversedCount` / `reversedAmount`——
        冲正的钱已经退回去了，还算在实发里就是账上凭空多出一笔。
      parameters:
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: orgId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/periods:
    get:
      tags: [payroll]
      operationId: listPayrollPeriods
      summary: 可选账期（月份下拉 + 状态徽标）
      description: |
        返回已生成过的账期及其状态。前端不需要自己推"哪几个月有工资表"——
        推出来的结果一定和实际生成的对不上（比如 8 月忘了生成，下拉里却有 8 月）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payrolls/generate:
    post:
      tags: [payroll]
      operationId: generatePayroll
      summary: 生成 / 重新核算某期工资表
      description: |
        `period` 不存在 → 生成一份草稿（201）。
        已存在且为草稿 → 只有 `overwrite=true` 才重算（200）；否则 409/40912。
        已核算 / 待审批 / 已发放 → 409/40913，**先反审或冲正**。
        已核算之后金额被改动，等于发过一次的钱和台账对不上。

        核算口径（`formulaVersion=v1`，与原型的 `payrollRows` 同一套）：
        应发 = 月度工资 + 加班费（基本工资 / 21.75 / 8 × 加班小时 × 1.5）；
        代扣 = 社保（基本工资 × 10.5%）+ 公积金（7%）+ 个税（应纳税所得额 × 3%，简化速算）+ 其他扣款。
        真接后台要把个税换成综合所得年度累计预扣，**税率表不能留在代码里**。

        离职当月工资不在本域：这类人要手工补录，自动生成会按"在职"过滤掉，发了就发错人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: '2026-10' }
                overwrite: { type: boolean, default: false, description: 草稿期重算时必填 true }
      responses:
        '201':
          description: 已生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollGenerateEnvelope' }
        '200':
          description: 已重算（草稿期 + overwrite）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollGenerateEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该期已存在（40912）/ 已锁定不能重算（40913）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                exists:
                  value: { code: 40912, message: '2026-10 工资表已存在（80 人），重算需 overwrite=true' }
                locked:
                  value: { code: 40913, message: '2026-09 已核算（GZ-2026-09-01），不能重算；先冲正' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{period}/confirm:
    post:
      tags: [payroll]
      operationId: confirmPayroll
      summary: 核算锁定（草稿 → 已核算）
      description: |
        锁定的意义是"这批数字我看过了，可以发"。锁定后任何金额都不能再变，
        要改只能反审（未发放前）或冲正（已发放后）。

        返回里带 `employeeCount` / `netTotal`：核算前后必须一致，不一致说明算的时候数据又变了。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      responses:
        '200':
          description: 已核算
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是草稿（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '2026-09 当前状态「已发放」，只有草稿可以核算' }
  /payrolls/{period}/pay:
    post:
      tags: [payroll]
      operationId: submitPayrollPay
      summary: 提交发放（已核算 → 待发放审批）
      description: |
        提交发放 = 生成代发批次，进入审批。**不直接置为已发放**：
        工资发放是不可逆的资金流出，一个人点两下就发出去，事后只能靠冲正兜底。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payDate]
              properties:
                payDate: { type: string, format: date, example: '2026-11-10' }
                bankAccount: { type: string, description: 付款账户（可选，脱敏展示） }
                remark: { type: string }
      responses:
        '200':
          description: 已提交，等待审批
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是已核算（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: '2026-10 当前状态「草稿」，需要先核算锁定' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{period}/approve:
    post:
      tags: [payroll]
      operationId: approvePayrollPay
      summary: 审批发放（通过 / 驳回）
      description: |
        **双人原则**：提交人不能审批自己提交的发放单（409/40915）。
        一个人既能核算又能批准自己的发放，等于没有审批——真出事时"谁批的"这一栏写的是同一个人。

        驳回要写原因（≥4 字），状态回到「已核算」，改完可重新提交。
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: '2026-10' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, description: 驳回必填（≥4 字） }
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriodEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不是待审批（40914）/ 提交人不能审批自己的单（40915）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                state:
                  value: { code: 40914, message: '2026-10 当前状态「已核算」，没有待审批的发放单' }
                selfApprove:
                  value: { code: 40915, message: '发放单由 杜若曦 提交，不能由本人审批' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{payrollId}:
    get:
      tags: [payroll]
      operationId: getPayroll
      summary: 工资条详情（含计算过程）
      description: |
        `calc` 是**服务端算好的分解项**（应发几项、代扣几项、实发）。前端各拼一遍的结果是
        列表一个口径、工资条一个口径，员工对不上就来回问。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2610-0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payrolls/{payrollId}/reverse:
    post:
      tags: [payroll]
      operationId: reversePayroll
      summary: 单笔冲正（已发放 → 已冲正）
      description: |
        用于个别退票（银行卡失效、账户注销）。整批冲正按行逐条调用。

        冲正**不删除原记录**：它保留可查（`reversedAt` / `reverseReason`），但不计入汇总的
        `netTotal`。删掉的话，"这个月到底发出去多少钱"就永远差一笔说不清。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2609-0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, example: '银行卡已注销，代发退票，需重新收款' }
      responses:
        '200':
          description: 已冲正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不是已发放（40914）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40914, message: 'PR2610-0001 当前状态「草稿」，只有已发放的工资条可以冲正' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /payrolls/{payrollId}/reveal:
    post:
      tags: [payroll]
      operationId: revealPayrollBankCard
      summary: 揭示银行卡完整卡号（必填原因，写访问日志）
      description: |
        **双权限**：`c.payroll.view` + `a.sensitive.view`。只有敏感字段权限不够——
        能看业主手机的人不该顺带能把全公司银行卡号导出去。

        代发文件需要完整卡号，所以这个口子必须开；但也必须留下"谁在什么时候、为什么、
        看了谁的卡号"——银行卡泄露的后果比手机号严重得多。
      parameters:
        - name: payrollId
          in: path
          required: true
          schema: { type: string, example: PR2610-0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4, example: '制作 10 月代发文件' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankCardRevealEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ access
  /roles:
    get:
      tags: [access]
      operationId: listRoles
      summary: 角色列表（含实际使用人数与权限覆盖度）
      description: |
        `userCount` 不是角色表里的字段，是**按员工岗位反推出来的实际人数**（+ 人工覆盖）。
        角色表存一个数字、员工表存一份归属，两者迟早对不上——最后没人知道该信哪个。

        `coverage` = 已授权 / 全部权限位，用来横向比较"这个角色到底有多大"。
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [集团, 项目] }
        - name: dataScope
          in: query
          schema: { type: string, enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人] }
        - $ref: '#/components/parameters/kw'
        - name: vf
          in: query
          description: 快捷视图
          schema: { type: string, enum: [crossDomain, bigPerm, readonly, wideScope] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createRole
      summary: 新增角色（权限默认为空）
      description: |
        新建角色**不接受 `perms`**（传了 422）：新角色一次带一堆权限，没人会逐条看；
        而矩阵保存那条路有 diff、有日志、命中高敏还要审批。
        「先建空角色 → 再去矩阵里授权」看起来多一步，但那一步是被审计的。

        `dataScope` 默认 `仅本人`（最小可见范围）。默认给「全部项目」是很多系统出事的起点：
        建角色的人只想着"先能用"，没想"这等于能看到所有业主的证件号"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, minLength: 2 }
                scope: { type: string, enum: [集团, 项目] }
                dataScope:
                  type: string
                  enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
                communities:
                  type: array
                  items: { type: string }
                positions:
                  type: array
                  items: { type: string }
                desc: { type: string }
      responses:
        '201':
          description: 已新增（权限位为 0）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 角色名已存在（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '角色名称「客服专员」已存在' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{roleId}:
    get:
      tags: [access]
      operationId: getRole
      summary: 角色详情（权限矩阵 + 成员样本 + 可见范围 + 高敏持有）
      description: |
        `matrix` 按「域 → 功能 → 操作」三层展开，`on` 是该角色是否已授权。
        前端拿一份矩阵就能画权限树，不需要再拼一次。

        `posture.sensitive` 列出该角色持有的**高敏权限**——治理视图上第一眼要看的就是这个：
        「谁能看证件明文、谁能推翻封账、谁能改权限本身」。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [access]
      operationId: updateRole
      summary: 改角色基本信息（数据范围变更要审批）
      description: |
        **改 `dataScope` 也是扩权**，所以它和权限码一样要过审——只是方向不同：

        | 变化方向 | 处理 |
        |---|---|
        | 变窄（全部项目 → 本项目） | 200，立即生效 |
        | 变宽（本项目 → 全部项目） | **202，待审批**，权限/可见范围都不变 |
        | 同档但 `communities` 变了（指定项目换项目） | **202，待审批**——换项目就是换一批能看到的数据 |

        档位由窄到宽：
        `仅本人 < 本部门 < 责任范围 < 本项目 < 指定项目 < 全部项目`。
        「指定项目」排在「本项目」之上是保守取法：指定 3 个项目的人通常比只看得见 1 个项目部的人看得多。

        改名 / 备注不需要审批（不影响谁能看到什么）。

        不能改 `roleId` 与 `scope`：改 scope（集团 ↔ 项目级）会改变这个角色的适用面，
        那是新建角色的事。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                dataScope:
                  type: string
                  enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
                communities:
                  type: array
                  items: { type: string }
                desc: { type: string }
                reason: { type: string, description: 放宽时必填（≥4 字） }
      responses:
        '200':
          description: 已生效（改名 / 收紧范围）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '202':
          description: 已提交审批（放宽范围），**尚未生效**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容的申请在审批中（40916）/ 角色名重复（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条数据范围变更在审批中（REQ0005）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{roleId}/perms:
    put:
      tags: [access]
      operationId: saveRolePerms
      summary: 保存权限矩阵（提权要批、降权即时）
      description: |
        **全量替换**语义：请求体是保存后的完整权限码集合，服务端自己算 diff。
        让前端算 added/removed 的结果是两个人同时改一个角色时，第二个人把第一个人的改动覆盖掉还看不出来。

        三条规则（按顺序判）：

        1. **没有变化** → 200 `noChange=true`，不写日志。「原样保存」也记一条的结果是日志里全是噪声，
           真出事时翻不到那一条。
        2. **只有新增命中高敏白名单** → **202，不生效**，生成一条待审批的 `PermRequest`。
           五类高敏：能看证件明文 / 能推翻封账 / 能改权限本身 / 能改工资表 / 能改楼栋责任范围。
           这五个的共同点是「拿到就等于能自己扩权或掩盖问题」。
        3. **其余情况（纯降权，或新增的都是普通权限）** → **200，立即生效**并写日志。
           降权即时生效：一个人被收回权限还要等审批，这段时间里他能做的事一点没少。

        同一角色已有内容相同的待审批申请 → 409/40916（不要重复提，审批人会看到两条一样的）。
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, example: R-PM }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perms]
              properties:
                perms:
                  type: array
                  description: 保存后的完整权限码集合
                  items: { type: string }
                reason: { type: string, description: 提交审批时必填（≥4 字） }
      responses:
        '200':
          description: 已生效（纯降权 / 普通新增）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '202':
          description: 已提交审批，**权限尚未生效**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermSaveEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容在审批中（40916）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条相同内容的提权申请在审批中（REQ0003）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests:
    get:
      tags: [access]
      operationId: listPermRequests
      summary: 权限变更申请列表
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PermRequestStatus' }
        - name: roleId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createPermRequest
      summary: 单独提交提权申请（不经矩阵保存）
      description: |
        矩阵保存已在内部处理"要不要审批"，这个口子是给**批量/脚本场景**用的，
        比如一次给三个角色各加一个高敏权限时，先把申请提完再统一审。

        只接受**新增**做判断：`removed` 出现也一并记入单据，但不影响"要不要审批"——
        降权不需要谁批准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, added, reason]
              properties:
                roleId: { type: string, example: R-PM }
                added:
                  type: array
                  items: { type: string }
                removed:
                  type: array
                  items: { type: string }
                reason: { type: string, minLength: 4 }
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已有相同内容在审批中（40916）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40916, message: '「项目经理」已有一条相同内容的提权申请在审批中（REQ0003）' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests/{reqId}/approve:
    post:
      tags: [access]
      operationId: approvePermRequest
      summary: 审批通过（权限此时才生效）
      description: |
        **双人原则**：提交人不能审批自己提交的申请（409/40917）。
        「一个人提、一个人批」是这条链路唯一的意义——自己提自己批，等于没有审批，
        而且日志里还会留下一次"审批通过"的假象。

        通过后：权限写入角色 → 写一条 `PermLog`（action=审批通过）→ 该角色下所有在线会话
        的菜单在下次刷新时按新权限重算。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: 已通过并生效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）/ 提交人不能审批自己的申请（40917）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                state:
                  value: { code: 40918, message: 'REQ0001 当前状态「已通过」，不能重复审批' }
                selfApprove:
                  value: { code: 40917, message: '该申请由「人事专员」提交，不能由同一个人审批' }
  /perm-requests/{reqId}/reject:
    post:
      tags: [access]
      operationId: rejectPermRequest
      summary: 驳回（权限不生效）
      description: 驳回要写原因（≥4 字）：申请人的下一步动作取决于"为什么不行"。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4 }
      responses:
        '200':
          description: 已驳回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40918, message: 'REQ0001 当前状态「已驳回」，不能重复处理' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /perm-requests/{reqId}/withdraw:
    post:
      tags: [access]
      operationId: withdrawPermRequest
      summary: 撤回（仅提交人、仅待审批）
      description: 撤回后单据留档（状态=已撤回），可以重新提交——重新提交会产生新单据，不复用旧号。
      parameters:
        - name: reqId
          in: path
          required: true
          schema: { type: string, example: REQ0001 }
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许（40918）/ 不是提交人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40918, message: 'REQ0001 当前状态「已通过」，不能撤回' }
  /perm-logs:
    get:
      tags: [access]
      operationId: listPermLogs
      summary: 权限变更留痕（每次改都记 diff）
      description: |
        记的是 **added / removed 的权限码**，不是"改过权限"四个字。
        只记后者的话，事后要回答"他到底被加了什么"还得去翻快照，而快照早被下一次覆盖了。
      parameters:
        - name: roleId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string, enum: [直接保存, 提交审批, 审批通过, 审批驳回] }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /access-logs:
    get:
      tags: [access]
      operationId: listAccessLogs
      summary: 敏感字段访问日志（只能是追加写 + 哈希链）
      description: |
        每条带 `hash` / `prevHash`：任何一条被改动，链上后面的 hash 都对不上。
        没有这个，「谁在什么时候看了谁的证件号」这条日志本身就可以被删掉。

        `result` 三态：`成功`（拿到明文）/ `脱敏`（无权限，只给掩码）/ `拦截`（导出超上限）。
        只记成功的话，看不出"有人在反复尝试"这件事。
      parameters:
        - name: action
          in: query
          schema: { type: string, enum: [查看明文, 导出] }
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/kw'
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /access-logs/summary:
    get:
      tags: [access]
      operationId: getAccessLogSummary
      summary: 访问日志汇总（列表页 KPI）
      description: |
        与列表同一套谓词。**不要前端 reduce**：日志是分页的，前端只能算当前页，
        出来的"揭示 20 次"其实是"本页 20 次"，这类数字比没有更糟。

        `blocked` 单独统计被拦截的次数——被拦的那些最值得看：有人在反复尝试拿不该拿的数据。
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogSummaryEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /export-logs:
    get:
      tags: [access]
      operationId: listExportLogs
      summary: 导出日志（批量外发的唯一凭证）
      description: |
        导出是数据外流的主要通道，"谁在什么时候导了多少行出去"必须查得到。
        超过单次上限被拦的也要记——被拦的那些才最值得看。
      parameters:
        - name: result
          in: query
          schema: { type: string, enum: [成功, 脱敏, 拦截] }
        - name: operator
          in: query
          schema: { type: string }
        - name: days
          in: query
          description: 近 N 天（默认 7）；与 `/access-logs` 同口径，审计习惯是先看最近一周
          schema: { type: integer, default: 7 }
        - $ref: '#/components/parameters/kw'
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportLogPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /data-scopes:
    get:
      tags: [access]
      operationId: listDataScopes
      summary: 数据范围六档（每档多少角色、多少人）
      description: |
        这张表就是"为什么这个账号只看得到自己那几栋"的答案。
        前端左树用它，不需要自己按角色分组再数一遍。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataScopeListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs:
    get:
      tags: [access]
      operationId: listOrgs
      summary: 组织列表（扁平，含人数）
      description: |
        扁平列表而不是树：建树是前端的事，服务端给「每个节点 + 它的上级 + 人数」就够。
        返回树的结果是——想按"某部门下所有班组"筛人时，还得把树再摊平一次。

        `headcount` 含子树、`selfHeadcount` 只算直接挂在节点上的人。
        这两列分开的理由见 `/employees/org-tree`：只给一个数，点项目部会显示 0 人（人都挂在班组）。
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [集团, 部门, 项目, 班组] }
        - name: parentId
          in: query
          description: 只看某个节点的直接下级
          schema: { type: string, example: O-P01 }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [access]
      operationId: createOrg
      summary: 新增组织（部门 / 班组）
      description: |
        只允许新增 **部门** 与 **班组**：集团与项目要伴随「项目立项 / 公司设立」一整套动作
        （建楼栋、建科目、配人手），不是一个接口能建的。

        `orgId` 由服务端生成（`O-P01-T5` 这种），前端传了也忽略——
        组织 ID 会被员工、角色、合同反复引用，两个人同时新增撞号后无法修。

        同级重名拒绝（409/40902）：两个「工程组」挂在同一个项目部下，排班表上分不清谁是谁。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, parentId, type]
              properties:
                name: { type: string, minLength: 2 }
                parentId: { type: string, example: O-P01 }
                type: { type: string, enum: [部门, 班组] }
                leader: { type: string }
                sort: { type: integer, description: 同级排序，小的在前 }
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 同级重名（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '「翡翠城项目部」下已有「工程组」，同级不能重名' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orgs/{orgId}:
    patch:
      tags: [access]
      operationId: updateOrg
      summary: 修改组织（名称 / 负责人 / 排序 / 上级）
      description: |
        **不能改 `type`**：把「班组」改成「部门」会让挂在它下面的员工归属语义整体变化
        （班组成员走排班，部门成员走职能），改类型等于重挂一批人，那是组织调整单据，不是一个字段。

        **改上级要防环**（422）：把「工程组」的上级设成它自己的下级，组织树会变成孤岛——
        这些人在树上点不到，但列表里还在，最后没人解释得清"为什么这个人不在组织架构里"。

        改上级会让子树内所有人的组织路径变化，`orgPath` 是查询时算的，不需要回写。
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, example: O-P01-T2 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                leader: { type: string }
                sort: { type: integer }
                parentId: { type: string, description: 新上级；改它会移动整棵子树 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgNodeEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同级重名（40902）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: 40902, message: '同级已有「工程组」' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ============================================================
  # 业主小程序（mp）
  # ------------------------------------------------------------
  # `/mp/*` 是业主侧入口，内部复用同一套服务与同一套状态机：
  #   · 建单走 `POST /mp/orders`，最终落的就是 work-orders 那张表（source=小程序）
  #   · 增项确认 `POST /mp/orders/{woId}/addons/confirm` 与员工端
  #     `POST /work-orders/{woId}/addons/confirm` 是**同一个动作**，只是发起人不同
  #   · 缴费落 `payments`，支付状态只有「已支付」一个结论，不区分前端怎么发起
  # 不为业主端另建业务规则 —— 否则后台报表和业主看到的数一定对不上。
  # ============================================================
  /mp/auth/wechat-login:
    post:
      tags: [mp]
      operationId: mpWechatLogin
      summary: 微信授权登录（code → 手机号 → 会话）
      description: |
        真实流程：`wx.login` 拿 code → 服务端 `code2Session` 换 openid/unionid →
        手机号授权（`getPhoneNumber`）把 `encryptedData` / `iv` 交给服务端解出手机号。

        **手机号只在服务端解，前端不落明文**；响应里只回脱敏号（`138****8001`）。

        演示环境没有 AppID / 后端，`phone` 字段用于直传（必须同时带 `mock=true`）：
        生产配置收到 `mock=true` 应直接 422，别让这条分支活到线上。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: wx.login 的 code；真实环境必填 }
                encryptedData: { type: string, description: 手机号授权的加密串 }
                iv: { type: string }
                phone: { type: string, description: 演示直传手机号（真实环境忽略） }
                mock: { type: boolean, description: 演示标记，生产环境传 true → 422 }
              required: [mock]
      responses:
        '200':
          description: 成功（返回会话，尚未实名）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpSessionEnvelope' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/auth/realname:
    post:
      tags: [mp]
      operationId: mpRealname
      summary: 实名认证（姓名 + 证件后四位）
      description: |
        只收「姓名 + 证件后四位」，**不收也不存完整证件号**：完整号在物业档案里，
        由后台维护；业主端只需要够比对的最小信息（少存一点，泄露风险就小一点）。

        这一步只判"信息是否完整、格式是否合法"，**不判"这房是不是你的"** ——
        房与人的关系在绑定接口里判（实名 = 我是谁，绑定 = 这房是不是我的）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, idCard4]
              properties:
                name: { type: string, minLength: 2, maxLength: 12, description: 与房产证一致的姓名 }
                idCard4: { type: string, pattern: '^\\d{4}$', description: 证件号后四位 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpSessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/auth/bindings/candidates:
    get:
      tags: [mp]
      operationId: mpBindingCandidates
      summary: 匹配可绑定房产（命中 0 / 1 / N 套）
      description: |
        用会话里的「手机号 + 姓名 + 证件后四位」去比后台预导入的业主档案，**三项全中**才算一致。

        三态是刻意的，不是没做完：
        - `level=one`：唯一命中，直接确认绑定；
        - `level=many`：名下多套，逐套绑（绑定的是"我能看哪些房"，不改变产权归属）；
        - `level=none`：**必须说清哪一项对不上**（`mismatch.phone/name/cert` 三个布尔位），
          并返回 `steward`（该房楼栋管家）—— "我买了房但绑不上"是业主端最高频的真实问题，
          藏起来等于把电话全压给一线管家。

        业主端不允许自建房产：房与人的关系由后台档案决定，否则填个房号就能看别人家账。
      parameters:
        - name: houseId
          in: query
          required: false
          description: |
            可选的"只看这一套"。业主端目前是**先选房再比对**的交互（选社区 → 楼栋 → 房号），
            传了这个参数就只校这一套：三项都对但房不符 → `level=none` 且 `mismatch.house=true`。
            不传则返回该人名下全部房产（`level=one|many`）。
            两种用法都不允许自建房产 —— 传了房号也得三项对得上。
          schema: { type: string, example: H010110501 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpBindingCandidatesEnvelope' }
        '422':
          description: 还没实名（先调 /mp/auth/realname）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/auth/bindings:
    post:
      tags: [mp]
      operationId: mpBindHouses
      summary: 确认绑定房产（可多套，逐套绑）
      description: |
        只能绑定 `candidates` 返回过的房号：传一个没匹配上的 houseId 要 403，
        **不能"绑上了再看"，那是越权探测**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseIds]
              properties:
                houseIds:
                  type: array
                  minItems: 1
                  items: { type: string, example: H010110501 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpBindingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/me:
    get:
      tags: [mp]
      operationId: mpMe
      summary: 当前业主 + 已绑房产 + 首页三个数
      description: |
        首页一次拿全：身份、已绑房产、"待缴 / 进行中 / 待确认增项"三个数。
        移动端串三个请求的代价是首屏闪三次，所以这里做聚合读接口（与员工端 `/mobile/tasks/*/exec` 同一思路）。

        **口径**：待缴是「已绑房产 + 本人名下不挂房的车位费」；
        进行中 = 待派单 / 已派单 / 处理中 / 待确认；待确认增项 = `workOrders[].addons` 里 `confirmed=false` 的条数。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpMeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/houses/{houseId}:
    get:
      tags: [mp]
      operationId: mpHouseDetail
      summary: 房屋信息（只读）
      description: |
        面积 / 户型 / 交付状态 / 车位，只读。业主端不提供修改入口：
        房屋基础信息来自产权与交付资料，改它要走后台并留痕。
      parameters:
        - $ref: '#/components/parameters/houseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpHouseEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人已绑的房 }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/houses/{houseId}/residents:
    get:
      tags: [mp]
      operationId: mpHouseResidents
      summary: 本房租户与家庭成员（**业主可见租金**）
      description: |
        与楼管口径**相反**：楼管不能看租金（他是代收方，看租金等于知道邻居收入），
        业主是出租方，**能看自己房的租约金额与租期**。

        身份证一律只回后四位；手机号回掩码。

        三条要留意的：
        1. 只返回 `status=在住` 的租客 —— 已搬离的留着是历史，业主看住户名单时不需要；
        2. 家庭成员**不给 `faceRegistered` / `appUser`** 的时候是真的没有这份数据
           （样例里就没有），不要在前端渲染成"未录入人脸"——那是另一个结论；
        3. 只有已绑定的房能查（403），候选列表里的房不算：能看见 ≠ 能查住户。
      parameters:
        - $ref: '#/components/parameters/houseId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpResidentsEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mp/houses/{houseId}/tenants:
    post:
      tags: [mp]
      operationId: mpRegisterTenant
      summary: 业主自助登记租户
      description: |
        写入 `source=业主自助`、`verifyStatus=待核验`：业主登记不等于核验通过，
        门禁授权、人脸录入这些还要物业核验后才生效（否则谁都能给自己开一张门禁卡）。
      parameters:
        - $ref: '#/components/parameters/houseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, leaseStart, leaseEnd]
              properties:
                name: { type: string }
                phone: { type: string }
                idCard4: { type: string, description: 只收后四位 }
                leaseStart: { type: string, format: date }
                leaseEnd: { type: string, format: date }
                rent: { type: number, description: 月租金（业主可见，楼管不可见） }
                residents: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/communities:
    get:
      tags: [mp]
      operationId: mpCommunityList
      summary: 选房 1/3 · 可认证的小区
      description: |
        认证第一步。**只给在管项目**：已退管的小区点进去也绑不了房，
        列出来只是让人白点一次。

        `houseCount` 按 `houses` 实算，不取项目表里那个手写数字 ——
        项目表是"合同上写着多少户"，房号表是"系统里到底建了多少间"，
        选房页要的是后者（否则会出现「352 户」但楼栋加起来只有 300 间）。

        需要登录但**不需要实名**：选房在实名之前，此时还没有 L2。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpCommunityListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/communities/{communityId}/buildings:
    get:
      tags: [mp]
      operationId: mpBuildingList
      summary: 选房 2/3 · 小区下的楼栋
      description: |
        `unitCount` / `houseCount` 都按单元表与房号表实算；
        `hasElevator` 给的是"这栋有没有电梯"，页面上不用，留给后续（无梯楼栋的搬运费）。
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpBuildingListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/buildings/{buildingId}/rooms:
    get:
      tags: [mp]
      operationId: mpRoomList
      summary: 选房 3/3 · 楼栋下的房号（按单元分组）
      description: |
        按单元分组返回，组内按「楼层 → 房号」排序 —— 与业主站在楼下看门牌的顺序一致。

        **这一层只回答"这是哪一间"**：给 `houseId / 房号 / 楼层 / 面积 / 户型 / 全名`。
        业主、家属、租客、门牌人一概不下发；也不要在这里按"是否本人名下"过滤 ——
        选房时系统还不知道你是谁，校验发生在下一步 `POST /mp/auth/bindings`。

        取到的 `houseId` 必须能在绑定候选里被认出来，否则就是"页面上点得到、服务端不认"。
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, example: B0101 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpRoomGroupListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/utility:
    get:
      tags: [mp]
      operationId: mpUtility
      summary: 本房水电（按项目模式返回：抄表出账 / 插卡买量 / 业主自缴）
      description: |
        **能不能在端上缴费，由「项目模式」决定，不由「有没有账单」决定。**

        | mode | 含义 | `canPay` | 端上怎么说 |
        |---|---|---|---|
        | `meter` | 抄表出账：物业抄表 → 出账单 → 业主缴 | `true` | 本期用量 / 单价 / 应缴 / 账期 / 账单号 + 去缴费 |
        | `card` | 插卡买量：到物业服务中心买量后插表，系统不记余额 | `false` | 「插卡表 · 到物业服务中心买量」 |
        | `none` | 业主自缴：国网 / 水司直接收 | `false` | 「由国家电网 / 自来水公司直接收取」 |

        `card` / `none` 即使库里有历史账单也**不给支付入口** —— 那笔钱不是物业能收的。
        P03（星光天地）就有一张电费逾期单，而它的电是 `card`，正好是这个情形：
        数据里的矛盾由后台清理，端上不能替插卡表代收。

        这里**没有**「预存 / 余额 / 充值」：钱和账期一一对应，交多少、交哪一期，
        在 `bills` 里就是一条记录。预存账户体系已于 2026-11-13 下线（`/mp/prepay*` 一并删除）。

        只返回水、电两块表：燃气在数据里没有表具，端上如实显示"未开通"，不编一个燃气表出来。
      parameters:
        - name: houseId
          in: query
          description: 不传取当前激活房屋
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpUtilityEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人已绑定的房 / 还没有绑定房产 }

  /mp/commerce/account:
    get:
      tags: [mp]
      operationId: mpCommerceAccount
      summary: 商业平台账户（积分 / 优惠券，只读镜像）
      description: |
        **只读镜像**，不是物业的账：

        - **不给余额**：商业平台储值与物业预存是两笔钱（两个法律主体、两套对账），
          放在一起业主一定会问"能不能交物业费"。本期不展示、也不支持抵扣。
        - `syncedAt` 必给：物业只保证"这个时间点的样子"，下拉刷新就是重新拉。
        - 券带 `claimUrl`：**领取与核销都在商业平台**，这里只做展示与引导 ——
          物业端写它的库就等于替另一家公司记账。

        反向给商业平台输出业主身份（哪个小区、是不是业主）本期不做，
        要等两边把数据用途与粒度谈定。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpCommerceAccountEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound', description: 该业主尚未在商业平台注册 }

  /mp/parkings:
    get:
      tags: [mp]
      operationId: mpParkingList
      summary: 我的车位（含本月可换绑次数）
      description: |
        只返回 **`ownerId` = 当前业主** 的车位。车位归属来自产权 / 租赁档案，
        **业主端没有"认领车位"这个动作** —— 认领等于"我说这车位是我的"，必然要物业核验，
        又把客服时间花回去。没有车位时提示联系管家登记，不给自助入口。

        **额度按「车位 + 自然月」，不是按业主**：有两个车位的人换两个车位是两件事，
        按业主算会误伤他（样例里王浩然就是两个车位）。阈值来自系统参数
        `park.plateChangeLimit`（默认 1），不写死在客户端 —— 客服要能按项目调、能人工重置。

        **到期日只有一份真相**：`expireDate` = 该车位管理费已缴至的账期末。
        它由账单派生 / 回写，不允许手工填 —— 手填的那天起，续费、可换绑条件、
        逾期提醒三处就会各说各话。

        `usedThisMonth` 按**该车位**统计，以「最后一次物业重置」为界：
        重置之前的记录不计入（业主把车牌填错，客服重置一次，不该占掉下个月的名额）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpParkingListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/parkings/{parkId}:
    get:
      tags: [mp]
      operationId: mpParkingDetail
      summary: 车位详情 + 绑定的车辆
      description: |
        一个车位可以绑多辆车（`vehicles.parkId` 一对多），所以车辆是数组，不是单个字段。

        **`cardNoTail` 只给后四位**：业主端本来就只显示 `****2192`，
        而完整 IC 卡号是可以复制去开闸的凭证 —— 敏感字段不因为是"我的卡"就全量下发。

        管理费账单不在这个接口里：走 `GET /mp/bills?parkId=`，
        与"家庭账单"同一份数据、同一套欠费口径，不另开一份金额真相。
      parameters:
        - $ref: '#/components/parameters/parkId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpParkingDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人名下的车位 }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/parkings/{parkId}/plate:
    post:
      tags: [mp]
      operationId: mpParkingChangePlate
      summary: 换绑主车牌（业主自助，不动物业审核）
      description: |
        **换绑 = 替换主车牌**，不是"再加一辆"。第二辆车起走物业，不占次数也不自动生效 ——
        否则这条"减少客服重复劳动"的功能会变成新的重复劳动来源。

        四条前置条件缺一不可，**服务端判，客户端只用来提前置灰**：

        | 条件 | 不满足时 |
        |---|---|
        | 业主身份（不是家属 / 租客） | 403 |
        | 已实名（L2） | 403 |
        | 车位在本人名下 | 403 |
        | 管理费未到期（`expireDate >= 今天`） | 409 / 40930 |
        | 本月该车位额度还有 | 409 / 40929 |

        **不动物业审核，但必须留痕**：每次换绑写一条 `parking-change-logs`，
        `source` = 业主自助、`operatorName` = 业主本人、`vendorStatus` 一律「待同步」。
        车牌识别系统（第三方）尚未对接，**不要在原型里假装有回执**：
        假一个「已同步」只会在联调时多一轮排查。

        客户端算出的"还能换 1 次"只是体验，服务端按 `(parkId, 自然月)` 计数才是权威 ——
        前端拦不住改包的人。
      parameters:
        - $ref: '#/components/parameters/parkId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpPlateChangeRequest' }
      responses:
        '200':
          description: 换绑成功（已写入记录，尚未下发道闸）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpPlateChangeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是业主本人 / 未实名 / 车位不在名下 }
        '409': { $ref: '#/components/responses/Conflict', description: 额度用尽（40929）/ 管理费已到期（40930）/ 车牌已在该业主其他车位（40931） }
        '422': { $ref: '#/components/responses/ValidationError', description: 车牌格式非法 }

  /mp/parkings/{parkId}/logs:
    get:
      tags: [mp]
      operationId: mpParkingChangeLogs
      summary: 换绑记录（业主自己看）
      description: |
        业主端要能回答"我什么时候换过、从哪个车牌换到哪个、生效了没有" ——
        客服接到"我的车牌明明换了，闸机不认"这类电话时，第一句就是问这个。

        `vendorStatus` 三态：待同步 / 已同步 / 失败。**原型阶段只会出现「待同步」**
        （外加两条 9 月之前的历史记录是「已同步」，用来示范对接后的样子）。

        只返回本车位的记录，且只返回本人名下的车位 —— 不做"跨车位汇总"，
        两个车位的记录混在一起，业主会以为换错了。
      parameters:
        - $ref: '#/components/parameters/parkId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpParkingChangeLogListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人名下的车位 }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/access/faces:
    get:
      tags: [mp]
      operationId: mpAccessFaces
      summary: 我的人脸通行状态（本人 + 本房成员）
      description: |
        小区没有人脸以外的通行设施（没有二维码闸机），所以这个接口回答的是
        **"我能不能刷脸、为什么不能、下一步做什么"**，不是"要不要开门"。

        **谁能录谁，按"谁对谁负责"分**：

        | 身份 | 能做什么 | 为什么 |
        |---|---|---|
        | 业主 | 本人 + 本房**已核验**成员 | 老人孩子不会自己传照片，这是主要场景 |
        | 家属（扫码绑定） | **只能录本人** | 走 me 语义，不下发也不需要 `memberId` |
        | 租客 | 只读 | 租客的人脸在租约核验时由物业录（`POST /tenants/{id}/face`） |

        家属那条不是权限高低，是**责任边界**：家属之间是平级关系，
        谁也代表不了谁，让他替配偶录脸等于给了他一把能开门、也能给别人开门的钥匙。

        五态：未采集 → 待核验 → 已生效，另有已驳回（带原因）与已冻结（租约结束 / 主动撤回）。
        **业主端不允许自助生效** —— 生效只能由物业核验触发，否则谁都能给自己开门。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpAccessFaceListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [mp]
      operationId: mpAccessFaceSubmit
      summary: 提交本人人脸（进入待核验）
      description: |
        提交后状态恒为「待核验」，接口**没有"直接生效"的参数** ——
        留一个 `autoApprove` 之类的开关，第一天就会被前端打开。

        三条限制：

        1. **待核验期间不能重复提交**：审核的人正在看那张照片，这时换一张，
           他看到的和系统里的就不是同一张（这是人脸录入最常扯皮的一类）；
        2. 同一主体 24 小时内最多 3 次：够改两次照片，不够刷接口；
        3. 重新采集时**原人脸继续有效**，直到新照片被核验 —— 否则业主会以为
           自己这会儿刷不了门，赶不上上班。

        合规：人脸属于敏感个人信息，页面必须单独同意（不与其他条款捆绑）、
        明示用途与存储期、可随时撤回。原型不存真图，`images` 只记张数。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpFaceSubmitRequest' }
      responses:
        '200':
          description: 已提交，等物业核验
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpFaceSelfEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 租客只读，人脸由物业录 }
        '409': { $ref: '#/components/responses/Conflict', description: 待核验期间重复提交（40932）/ 24 小时超限（40933） }

  /mp/access/faces/members/{memberId}:
    post:
      tags: [mp]
      operationId: mpAccessFaceSubmitMember
      summary: 帮家庭成员提交人脸（进待核验）
      description: |
        只有**业主**能调，且成员必须**已核验**：没核验就录脸，等于任何人填个名字
        就能给别人开一张门禁卡 —— 成员登记页的"待核验"就是为了卡这一步。

        代录必须勾选**监护人代同意**（`guardian=true`）：老人孩子不会自己读条款，
        出事时这条留痕是唯一的依据。`guardian` 不通过就是不传，不存在默认同意。

        家属不能调这个接口（403）—— 家属之间是平级关系，谁也代表不了谁。
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, example: MB00001 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpFaceSubmitRequest' }
      responses:
        '200':
          description: 已提交，等物业核验
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpFaceMemberEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 非业主 / 成员不属于本房 / 未勾选监护人同意 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 成员未核验（40934）/ 待核验期间重复提交（40932）/ 24 小时超限（40933） }
        '422': { $ref: '#/components/responses/ValidationError', description: 缺少监护人同意 }

  /mp/access/faces/{faceId}/withdraw:
    post:
      tags: [mp]
      operationId: mpAccessFaceWithdraw
      summary: 撤回人脸（停用并删影像件）
      description: |
        撤回后状态置「已冻结」，**不删除记录** —— 撤回是权利，但"曾经录过、什么时候撤的"
        要留痕（合规要求可追溯）。影像件在 30 天内删除，删完记录仍在。

        撤回的后果页面上要写清：**撤回后门禁停用、影像件 30 天内删除**，不是"下次生效"。
        但别承诺"立刻"—— 闸机同步有时间差，页面按"最迟 24 小时内停用"表述才站得住。
        所以前端必须先确认一次，不能一点就走。
      parameters:
        - name: faceId
          in: path
          required: true
          schema: { type: string, example: FC00001 }
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpFaceSubjectEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人的申请 / 家属试图撤回成员的 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 当前状态不能撤回（40935，例如已冻结） }

  /mp/bills:
    get:
      tags: [mp]
      operationId: mpBills
      summary: 我的账单（按房 / 账期 / 状态）
      description: |
        **返回口径**：已绑房产的账单 + 本人名下不挂房的车位费（`houseId` 为空的账单）。

        为什么必须带车位费：车位是独立资产，账单不挂房。只按 houseId 过滤会让业主
        少看一笔钱（演示数据里李秀兰就漏了 ¥362.52），然后来电话说"我明明交了"。

        欠费口径与 PC 一致：状态为 未缴 / 部分缴 / 逾期 且 `unpaid > 0`；
        金额取 `unpaid`（部分缴过的只补差额），不是 `amount`。

        **`summary.unpaid` 是"欠费合计"（只算上面三态），不是"所有未收之和"** ——
        与后台 `GET /bills/summary` 的口径有意不同：业主关心"我要交多少"，
        后台关心"账面还有多少没收到"。差异只在「已减免 / 已作废」这类不该再收的单上
        （样例里 BL000130 状态=已减免 但 unpaid 仍有值，是种子数据的已知问题，
        见 04-README §11.9；接口按状态判，不按金额判）。
      parameters:
        - name: houseId
          in: query
          schema: { type: string }
        - name: parkId
          in: query
          description: |
            只看某个车位的管理费（车位详情页用）。与 `houseId` 互斥：
            车位账单不挂房，两个一起传按「房源账单」处理，车位费不会混进来。
          schema: { type: string, example: PK00115 }
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BillStatus' }
        - name: onlyDebt
          in: query
          description: 只看欠费
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpBillListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/pricing:
    get:
      tags: [mp]
      operationId: mpPricing
      summary: 报修价目（下单页的价格来源）
      description: |
        与 `GET /mobile/pricing` 返回**同一份数据**（`repairPrices.json`）：
        业主端下单页、员工端现场增项、提成核算三处共用一个源，各写一份必然对不上。

        业主端会把它直接展示成"材料 / 人工 / 合计"，所以 `material` 与 `labor` 必须分列，
        不能只给一个总价 —— 业主最常问的就是"为什么人工比材料贵"。

        **不要下发 `materialCost` / `laborCost` / `cost` / `commissionRate`**：
        那是采购成本与提成规则，业主看到等于看到毛利。样例数据在
        `fixtures/repair-prices.json` 里已经剥掉了（生成器 `gen-pricing-fixture.mjs` 会自检）。

        价目是**全项目共用的一份**，`communityId` 只决定"这个项目开不开线上报修"
        与"多久上门"，不改变单价 —— 按项目裁价目会出现"同一项 A 项目 125、B 项目没有"，
        而员工端现场增项用的是全量表，两边报价就对不上。
      parameters:
        - name: communityId
          in: query
          schema: { type: string, example: P01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpPricingEnvelope' }

  /mp/orders:
    get:
      tags: [mp]
      operationId: mpOrders
      summary: 我的报修（个人单按已绑房，公共单按项目）
      description: |
        业主端的「我的报修」列表。**这张表在契约里一直缺着**：06 有列表页，
        而契约只有「下单」和「单条详情」，等于客户端得先知道所有 woId 才能看列表。

        `scope=personal`（默认）只返回**已绑房产**上的单；
        `scope=public` 返回公共区域报修（`isPublic=true`），跟产权无关 ——
        楼道灯泡坏了，租客也该能看见。

        排序固定为「在做的在前，其次按提交时间倒序」：业主进来是看"我这单到哪了"。
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [personal, public], default: personal }
        - name: houseId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, example: 处理中 }
        - name: onlyDoing
          in: query
          description: 只看在做的（待派单 / 已派单 / 处理中 / 待确认）
          schema: { type: boolean, default: false }
        - name: communityId
          in: query
          description: scope=public 时限定项目
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpOrderListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [mp]
      operationId: mpCreateOrder
      summary: 报修下单（下单即见价，下单即预付）
      description: |
        业主**下单时就按价目看到总价，没有现场报价环节**（已与业主方确认）。
        所以 `amount` 由服务端按 `priceCode × qty` 算出来并随响应返回，
        前端只负责展示 —— 页面自己算钱是"三处金额不一致"的根源。

        提交成功即生成一张待支付订单（项目配置 `prepayWhenOrder=true`），
        付掉才进派单池；现场若加项，走增项确认后**后付差额**。

        **两条线要的东西不一样**（2026-11-11 调整）：

        | | 个人报修 | 公共区域报修 |
        |---|---|---|
        | 必填 | `houseId` + `priceCode` + `appointDate` + `appointSlot` + `description` | `place` + `description` |
        | 不要 | —— | `priceCode`（公共维修没有价目项）、预约时段（物业按派单排） |
        | 分类 | 由 `priceCode` 派生（水管漏水 / 电路故障…） | `category` = **业主填写的问题类型原文**（可不填） |

        公共单的 `category` 怎么定（2026-11-12 两轮调整后的最终口径）：
        **端上是下拉**（7 个固定项 + 「其他」手写），因为固定项与后台
        `LABOR_POINT_RULE.weights` 的键一一对应，点一下就能对上派单口径；
        列不进去的用「其他」写原文，不逼业主硬塞进某个格子。
        **服务端仍按自由文本收**（≤20 字、不查白名单）——
        后台代下单、老版本客户端都可能传别的值，而拒掉它只会让一笔真实报修进不来。

        代价要说清：`category` 不是标准部位时，工时积分权重取不到，落默认 1.0
        （见 `LABOR_POINT_RULE`）。这是有意的取舍 —— 宁可权重偏低，也不要一个假分类。
        样例里 75 张公共单全部带部位、全部**没有** `appointAt`，
        所以"公共报修不选项目、不选时间"不是新规则，是契约此前比数据收得更紧。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                scope:
                  type: string
                  enum: [personal, public]
                  default: personal
                  description: |
                    `public` = 公共区域报修（大堂灯泡、电梯异响）。这类单**没有房屋**，
                    要传 `place`，且不再做产权校验 —— 楼道坏了跟谁是业主没关系。
                houseId:
                  type: string
                  description: '`scope=personal` 时必填，且必须是已绑定的房'
                place:
                  type: string
                  maxLength: 40
                  description: |
                    `scope=public` 时必填，如「1栋大堂」。
                    **自由文本，不做白名单**：小区里的角落远不止物业能列出的那几个
                    （消防通道、屋面、某个架空层），业主端就是一个空输入框。
                category:
                  type: string
                  maxLength: 20
                  description: |
                    仅 `scope=public` 使用：问题类型。端上给的是**下拉**——
                    电梯 / 配电 / 给排水 / 道闸门禁 / 公区照明 / 门窗五金 / 土建，
                    外加一项「其他」由业主自己写（那时传的就是他写的原文）。
                    不传（或空串）按「公共设备」处理。

                    **服务端不查白名单**，只限长度：老版本客户端、后台代下单都可能传任意文本，
                    拒掉它只会让一笔真实报修进不来。非标准值的影响是
                    `laborPointWeight()` 取不到 → 落默认 1.0，这是可接受的。

                    个人单不要传 —— 它由 `priceCode` 派生，避免两处不一致。
                priceCode:
                  type: string
                  example: RP-W01
                  description: |
                    `scope=personal` 时必填。`scope=public` **不要传**：
                    公共区域维修由物业出人出料，没有价目项；传了也会被忽略。
                qty: { type: integer, minimum: 1, maximum: 5, default: 1 }
                appointDate:
                  type: string
                  format: date
                  description: '`scope=personal` 时必填；公共单不传（物业按派单排期）'
                appointSlot:
                  type: string
                  pattern: '^\d{2}:\d{2}-\d{2}:\d{2}$'
                  example: 09:00-10:00
                  description: |
                    `scope=personal` 时必填，上门时段**1 小时粒度**：09:00-10:00 / 10:00-11:00 /
                    11:00-12:00 / 14:00-15:00 / 15:00-16:00 / 16:00-17:00 / 19:00-20:00。

                    契约原先写的是三个两小时时段（09:00-11:00 等），与业主端下单页的
                    7 个一小时时段对不上 —— 按页面对齐：业主说的是"9 点到 10 点在家"，
                    两小时一段等于把"我上午都在"和"我 9 点在家"混成一件事。
                    上午 / 下午 / 晚上是**排班维度**，不进接口。

                    `scope=public` 不传：样例里 75 张公共单没有一张有预约时间。
                description: { type: string, maxLength: 120 }
                photos:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      kind: { type: string, enum: [photo, placeholder], description: placeholder=设备无相机，记为缺证 }
                      note: { type: string }
                mock: { type: boolean, description: 演示标记 }
      responses:
        '200':
          description: 成功（返回工单 + 待支付订单）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpOrderCreatedEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: houseId 不在已绑列表 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/orders/{woId}:
    get:
      tags: [mp]
      operationId: mpOrderDetail
      summary: 我的订单详情（进度 / 师傅 / 费用 / 增项 / 支付）
      description: |
        一次返回业主在详情页要看的全部：时间线、师傅、费用三段、增项、支付状态。

        **三段金额**是这一屏的重点：`originFee`（材料+人工）、`addonFee`（已确认增项）、
        `totalFee`（合计）。业主说"怎么就多收了 80"时，页面上要能直接指出来。
        `paidAmount` 是已预付，`dueFee = totalFee - paidAmount` 是"还要付多少"
        （增项确认后就是那笔差额，不是重新付一次总额）。
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpOrderDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是本人房上的单 }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/orders/{woId}/addons/confirm:
    post:
      tags: [mp]
      operationId: mpConfirmAddons
      summary: 业主确认增项（与员工端同一动作）
      description: |
        与 `POST /work-orders/{woId}/addons/confirm` 是**同一个动作**，区别只在发起人：
        员工端是师傅当面确认，业主端是业主自己点确认。

        影响三条：
        1. 增项金额**合并进本单总额**（不新开一单）；
        2. 确认后员工端才允许完工（员工端已有拦截，这里不重复实现，只保证状态一致）；
        3. `payStatus` 若还有差额则回到「未支付」，业主再付的是 `dueFee`。

        幂等：重复确认返回 200 且 `addons` 不变（已确认的保持原 `confirmedAt`）。
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                addonCodes:
                  type: array
                  description: 只确认指定的几项；不传表示全部待确认项
                  items: { type: string, example: AD-D01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpOrderDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict', description: 已评价 / 已关闭的单不能再确认 }
        '422': { $ref: '#/components/responses/Unprocessable', description: 没有待确认的增项 }

  /mp/payments:
    post:
      tags: [mp]
      operationId: mpCreatePayment
      summary: 生成待支付订单（账单缴费 / 报修预付 / 增项补付 / 活动报名费）
      description: |
        四类都走这一个接口，靠 `type` 区分：`bill`（账单，可多张合并）、
        `wo`（报修预付或增项补付）、`activity`（收费活动报名费，2026-11-07 新增）。

        `amount` **由服务端算**：账单合计 = 所选账单 `unpaid` 之和；
        报修 = `totalFee - paidAmount`（已预付的不重复收）；
        活动 = 报名时算好的 `amount`（单价 × 人数）—— 活动改价不影响已提交的报名。
        前端传金额一律忽略。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [bill, wo, activity] }
                billIds:
                  type: array
                  description: type=bill 时必填
                  items: { type: string }
                woId: { type: string, description: type=wo 时必填 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpPayOrderEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict', description: 已有待确认增项 / 已结清 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/payments/{payId}/simulate:
    post:
      tags: [mp]
      operationId: mpSimulatePayment
      summary: 模拟支付成功（**仅演示，真接入必须替换**）
      description: |
        ⚠️ **这是假回调，不是支付能力。**

        真实接入时整条链要换成：
        1. 服务端调微信「JSAPI 下单」拿 `prepay_id`；
        2. 前端 `wx.requestPayment` 唤起收银台（前端**不判断成功**，只等回调）；
        3. 微信异步回调落到 `POST /mp/payments/{payId}/notify`：
           验签 → 校验金额与订单号 → **幂等**置「已支付」→ 冲账 / 转提成；
        4. 前端轮询或订阅「订单状态」，只认 `已支付` 这一个结果。

        本接口保留在契约里，是为了让演示能闭环，并在后端实现时明确标记
        「这个口子在生产环境必须 404」。
      parameters:
        - $ref: '#/components/parameters/payId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpSimulateEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 已支付（幂等返回 200 亦可，但不能重复冲账） }

  /mp/orders/{woId}/evaluate:
    post:
      tags: [mp]
      operationId: mpEvaluateOrder
      summary: 评价工单（评分 + 标签 + 文字）
      description: |
        写回 `workOrders` 的 `score` / `evalTags` / `evaluate` / `evaluateAt`，状态转「已评价」。
        与 PC、员工端的字段是同一组 —— 员工端"我的评价"读的就是这三列。

        只有「已完工」的单能评价；有未确认增项时不允许评价（先把账算清，再谈感受）。
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  items: { type: string, enum: [准时上门, 穿着规范, 讲解清楚, 收拾干净, 收费透明, 态度好] }
                text: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpOrderDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict', description: 未完工 / 已有待确认增项 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # --------------------------------------------------------------- 业主侧内容（mp 组 · 第 73 批）
  # 为什么另开一套而不是复用 `/neighbor/*`：那是**运营侧**（`n.*` 权限码 + 数据范围），
  # 业主侧只做"我自己的动作"（我读过、我投了、我报名、我发布）。
  # 两者混用会导致"客服能看的内容，业主用同一个接口也能看"。
  # --------------------------------------------------------------- 业主侧公共列表（读）
  # 与 `/neighbor/*`（运营侧）的区别不是"少几个字段"，而是**边界不同**：
  # 运营侧按数据范围（我管哪些项目），业主侧按"我住哪个小区"（已绑房产所在项目）。
  # 混用的结果就是"客服能看的内容，业主也能看到"。
  /mp/neighbor/notices:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborNotices
      summary: 公告列表（业主视角）
      description: |
        只回「已发布」。草稿 / 待审核 / 已撤回对业主不存在 —— 不是"权限不够"，
        是这条内容还没打算让人看见。

        **一次返回全部可见，频道切换在客户端做**（分类 / 项目）。四个列表加起来
        不到 150 条，每点一次分类打一个请求，等于把"切频道"变成网络操作。

        可见范围：已绑房产所在项目 + 全公司公告（`communityId` 为空）。
        **未绑房（游客）不过滤** —— 这是对业主端原行为的让步，只修
        "已绑 P01 的业主还能看到 P02 公告"这个真问题。正式版应按项目收敛。

        `unread` 按**全部可见公告**算，不跟 `type` 筛选走：否则切到「停水停电」
        未读数就变 0，用户会以为读完了。
      parameters:
        - name: type
          in: query
          description: 公告类型；`全部` 或不传 = 不过滤
          schema: { type: string, example: 停水停电 }
        - name: communityId
          in: query
          description: 只看某个项目（业主端目前不传，默认按会话范围）
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborNoticeListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/notices/{noticeId}:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborNotice
      summary: 公告详情
      description: |
        `signRequired` 决定客户端显不显示「我已阅读并签收」：只有停水停电与安全提示
        这两类要签收。全都能签，就等于全都不用认真读。

        `readCount` **已含自己这一次**，客户端不要再加 1 —— 两处各加一次，
        数字会比实际多一条。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0090 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborNoticeEnvelope' }
        '403':
          description: 公告不在你的项目范围内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/votes:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborVotes
      summary: 投票列表（意见征询）
      description: |
        不含草稿。进行中在前，同状态按开始日倒序 —— 业主进来是看"现在能投什么"。

        **未到 `canSeeResult` 时 `options[].votes` 一律置 0**，`totalVotes` 也置 0。
        返回真值再靠前端不显示，等于把结果发给了每个人。

        `target`（应投户数）取 `max(项目内业主数, 票数)`：样例的 `houses` 是裁剪版，
        种子票数会出现「282 票 / 16 户」。取 max 保证参与率不超 100%；
        真实环境两边同源，这个兜底不会生效。
      parameters:
        - name: status
          in: query
          description: 进行中 / 已结束
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborVoteListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/votes/{voteId}:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborVote
      summary: 投票详情
      description: |
        口径同列表。`myVote` 是**自己的**选择（对自己不是秘密），别人投了谁都不给；
        `anonymous` 为 true 时连"谁投过"都不出现。
      parameters:
        - name: voteId
          in: path
          required: true
          schema: { type: string, example: SV0003 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborVoteEnvelope' }
        '403':
          description: 投票不在你的项目范围内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/activities:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborActivities
      summary: 活动列表
      description: |
        不含草稿，按开始日正序。

        **只给数据，不给阶段（phase）**。阶段依赖"今天"，而演示时钟在客户端
        （06/05 都是 2026-10-20，服务端数据日是 10-21）。服务端算一份、客户端再算一份，
        必然在临界那天打架 —— 样例里 AC0015 的报名截止日正好是 10-20。
        客户端用 `activity-rule.mjs` 现算；`enrolled` 由服务端给，那才是真数。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborActivityListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/activities/{activityId}:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborActivity
      summary: 活动详情
      description: |
        `myEnroll` 是本人的报名记录（含出行人姓名手机号 —— 那是自己的数据）。
        别人的报名信息一条都不给：活动名单属运营侧（`n.activities.view`）。
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string, example: AC0009 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborActivityEnvelope' }
        '403':
          description: 活动不在你的项目范围内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/items/{itemId}:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborItem
      summary: 闲置详情
      description: |
        **自己的待审 / 已驳回 / 已下架内容自己能看**（要知道为什么没过）；
        别人的非上架内容一律 404 —— 403 等于告诉探测者"这条存在"。

        响应里**永远没有** `sellerHouse` / `sellerPhone` / `wechat`：
        门牌与手机号一旦下发，前端一句 console.log 就全泄了。展示只到楼栋。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, example: SH0019 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborItemEnvelope' }
        '403':
          description: 内容不在你的项目范围内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/mine:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborMine
      summary: 我的邻里内容（已读 / 签收 / 投票 / 报名 / 闲置 / 想要）
      description: |
        一次拉齐六块"我的"数据，客户端一个请求就够了 —— 拆成六个接口的话，
        邻里首页要打六次（正是这份设计最初想避免的"闪六下"）。

        这里只回"我的状态"。公共列表另有四个读接口
        （`/mp/neighbor/{notices,votes,activities,items}`），
        两边分开是因为它们的刷新时机不同：列表跟着"物业发了新内容"变，
        状态跟着"我刚做了什么"变。合成一个接口，每次投票都要重拉整列表。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborMineEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /mp/neighbor/notices/{noticeId}/read:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborNoticeRead
      summary: 标记公告已读（幂等）
      description: |
        重复调用返回**第一次**的阅读时间。刷一次就改一次的话，"这条公告读了多久"永远算不出来。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0012 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      noticeId: { type: string }
                      readAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/neighbor/notices/{noticeId}/sign:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborNoticeSign
      summary: 签收公告（**责任动作**，只对需要签收的公告开放）
      description: |
        只有「停水停电」「安全提示」这两类需要签收 —— 签收是留痕，是"我知道了"的证据。

        不给所有公告开放：全都能签，就等于全都不用认真读。
        不需要签收的公告返回 **422**，不是静默成功 —— 静默成功会让业主以为签过了。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string, example: NT0012 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      noticeId: { type: string }
                      signedAt: { type: string }
                      readAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 该公告不需要签收
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/neighbor/votes/{voteId}/submit:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborVoteSubmit
      summary: 提交投票（允许改票）
      description: |
        单选最多 1 项、多选最多 `maxPick` 项；只有「进行中」能投。

        **改票按差额调整票数**：先扣掉旧票再记新票。只加不减的话，
        同一个人多投几次就能把一个选项刷到全票。
      parameters:
        - name: voteId
          in: path
          required: true
          schema: { type: string, example: SV0003 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  description: 选项 key（不是 label，也不是序号）
                  items: { type: string, example: A1 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      voteId: { type: string }
                      picks:
                        type: array
                        items: { type: string }
                      changed: { type: boolean, description: true = 这次是改票，不是首投 }
                      totalVotes: { type: integer }
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string }
                            label: { type: string }
                            votes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 这个投票不在你所在的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已结束 / 未开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 选项为空 / 超上限 / 选项不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/neighbor/activities/{activityId}/enroll:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborEnroll
      summary: 活动报名
      description: |
        只有「报名中」能报；重复报名 409；名额按 `capacity - 已报人数` 判。

        证件号**只在需要投保时收**（不投保的活动收了就是白担风险）；
        条款必勾；需要投保时还要单独同意投保。
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string, example: AC0016 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendees, agreeTerms]
              properties:
                attendees:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, phone]
                    properties:
                      name: { type: string, description: 2~12 个汉字 }
                      phone: { type: string }
                      idNo: { type: string, description: 需要投保时必填（18 位） }
                      ageType: { type: string, enum: [成人, 儿童, 老人] }
                      emergencyName: { type: string }
                      emergencyPhone: { type: string }
                agreeTerms: { type: boolean, description: 必须为 true }
                agreeInsurance: { type: boolean, description: 需要投保时必须为 true }
      responses:
        '200':
          description: 成功（返回报名记录，含应缴金额）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpEnrollEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已报过 / 名额已满 / 不在报名中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 出行人信息或条款不合规
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/neighbor/enrolls/{enrollId}/cancel:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborEnrollCancel
      summary: 取消报名（收费活动按档退）
      description: |
        已签到的不能自助取消（现场已核销）。退款比例按活动开始日与今天的天数差取档，
        与 `GET /neighbor/activities/{id}/refund-ratio` 同一套算法。
      parameters:
        - name: enrollId
          in: path
          required: true
          schema: { type: string, example: AE9001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      enrollId: { type: string }
                      status: { type: string, enum: [已取消, 已退款] }
                      ratio: { type: integer, description: 退款比例 % }
                      refundAmount: { type: number }
                      refunded: { type: boolean, description: false = 免费活动，没有退款 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是自己的报名 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已签到 / 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/neighbor/items:
    get:
      tags: [mp, neighbor]
      operationId: mpNeighborItems
      summary: 闲置列表（只给「已上架」）
      description: |
        待审核 / 已驳回 / 已下架 / 已过期都不该被邻居看到 —— 先审后发是这条业务的前提。

        每条只给到**楼栋**（`buildingName`，如「7栋」）。`sellerHouse` 是完整房号串，
        `sellerPhone` / `wechat` 是联系方式，**这三样都不在响应里**：下发了就等于公开。

        `wantCount` 已含自己那一次（服务端在 `want` 时增减），客户端不要再加 1。
      parameters:
        - name: cat
          in: query
          description: 分类；`全部` 或不传 = 不过滤
          schema: { type: string, example: 家具 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpNeighborItemListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborPublishItem
      summary: 发布闲置（先审后发）
      description: |
        状态一律「待审核」：审核在员工端做，业主端只提交与看状态。

        楼栋**只能选自己名下的**：选别人的楼栋，等于把"我住那栋"这张牌打给全小区。
        标题少于 4 字拒收（"转让"两个字，邻居没法判断是什么东西）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, price, buildingId]
              properties:
                title: { type: string, minLength: 4 }
                category: { type: string, example: 母婴 }
                price: { type: number, minimum: 0, description: 送人可以填 0 }
                originPrice: { type: number }
                condition: { type: string, example: 九成新 }
                images: { type: integer, maximum: 9 }
                buildingId: { type: string, description: 必须是本人已绑房产所在楼栋 }
                desc: { type: string, maxLength: 300 }
                contactMode: { type: string, enum: [站内私信, 公开] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 标题过短 / 含禁售词 / 价格非法 / 楼栋不属于本人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/neighbor/items/{itemId}/want:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborItemWant
      summary: 想要 / 取消想要（切换）
      description: |
        同一个接口来回切。返回 `want` 表示切换后的状态。

        **只回人数，不回名单**：邻居要的是"有多少人也想要"，
        公开名单等于把每个人的兴趣挂出来；要联系卖家走站内私信。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, example: SH0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      itemId: { type: string }
                      want: { type: boolean, description: 切换后的状态 }
                      wants: { type: integer, description: 当前想要人数 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/neighbor/items/{itemId}/messages:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborItemMessage
      summary: 站内私信（只记"发过"，不做 IM）
      description: |
        物业类目不允许做即时通讯，运维也不该扛聊天记录。这里只落一条"谁给哪件闲置发过话"，
        真正的沟通走电话（卖家联系方式在帖子详情里）。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, example: SH0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      msgId: { type: string }
                      itemId: { type: string }
                      at: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/neighbor/items/{itemId}/offline:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborItemOffline
      summary: 下架自己的闲置
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, example: SH9001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden', description: 不是自己发布的 }
        '404': { $ref: '#/components/responses/NotFound' }

  /mp/neighbor/items/{itemId}/renew:
    post:
      tags: [mp, neighbor]
      operationId: mpNeighborItemRenew
      summary: 重新上架（回到待审核）
      description: |
        只有「已下架 / 已过期 / 已驳回」需要续挂，其余状态 409。

        **内容没改也要再审**：挂了三个月的帖子，图片和描述可能早就不合当前规矩了。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, example: SH9001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- 业主自助挂牌（mp 组）
  # 为什么不复用 `/listings`：那个前缀是**后台**用的（`a.listings.view`），带数据范围。
  # 业主发自己的房，权限模型是"这套房是不是我的"，不是"我能看哪些房"。
  # 硬蹭后台接口的结果是业主能查全小区挂牌 —— 这是产权边界的漏洞，不是参数问题。
  /mp/listings:
    get:
      tags: [mp]
      operationId: mpMyListings
      summary: 我的挂牌（含驳回理由与浏览/看房数）
      description: |
        只回**当前登录人名下房屋**的挂牌。与后台 `/listings` 的差别不只是权限：
        这里是"我的房"，所以能给房号；后台列表反而要脱敏 `ownerPhone`。

        三条业主最关心的信息必须原样给：
        1. `rejectReason` —— 驳回理由原样返回，不做"已驳回，请联系管家"的概括。
           业主拿着概括来问，管家还得再查一遍；
        2. `viewCount` / `leadCount` —— 挂了三天没人看，是文案问题还是价格问题，
           没有这两个数就只能靠猜；
        3. `expireAt` —— 60 天到期，提前 7 天要提醒续挂，到期后才续要重新审核。

        `canOffline` / `canRenew` / `canDeal` 由服务端算，不让前端按状态自己推 ——
        前端推导的结果是按钮灰了却说不清为什么。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [mp]
      operationId: mpPublishListing
      summary: 发布挂牌（需业主本人 + 产权校验）
      description: |
        四道校验，缺一不可，**都在服务端**：

        1. 登录且已实名（L1 → L2）；
        2. 身份是**业主**。家属与租客都不行 —— 家属在 `bindings` 里也有一条记录，
           靠"有没有绑定"判断会把家属放进来（这是最容易踩的一处）；
        3. `houseId` 的产权人 = 会话里的业主人。租客能住不能租出去；
        4. 同一套房**在架唯一**：已有「待审核」或「已发布」的挂牌 → 409。

        面积 / 户型 / 朝向 / 楼层**不接收**：从房屋档案派生。接收了就会出现
        "业主把 89㎡ 写成 120㎡"的纠纷，而物业没能力逐条核。

        创建即「待审核」，审核人是**该房的责任楼管**（`house.stewardEmpId`），
        不是某个"审核员"角色。24 小时未审升直属上级。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpListingRequest' }
      responses:
        '200':
          description: 已提交（`status=待审核`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 非业主本人 / 该房不在名下（40390）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 该房已有在架挂牌（40990）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/listings/{listingId}:
    get:
      tags: [mp]
      operationId: mpMyListingDetail
      summary: 我的挂牌详情
      description: |
        非本人的挂牌一律 **404**，不是 403：403 等于告诉探测者"这条存在但不是你的"，
        而房源挂牌是否存在于外人无所谓，对探测者却是有用的信息。
      parameters:
        - $ref: '#/components/parameters/listingId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [mp]
      operationId: mpUpdateListing
      summary: 编辑挂牌（内容版本 +1，重新进审核）
      description: |
        改内容 = 换了一份要审核的东西，所以 `contentVersion + 1`、`status` 回「待审核」。
        这就是"原样续挂免审、改了就要再审"的判定依据：
        **`contentVersion === auditedVersion` 才免审**，不靠时间戳。

        「已成交」不可改：成交后改价格会让历史记录与成交价对不上。

        只允许改 5 项内容字段（`price` / `deposit` / `payTerm` / `decorate` /
        `facilities` / `availableFrom` / `desc` / `images`），`houseId` 与 `type` 不可改 ——
        换房等于换一条挂牌，改类型（出租 → 出售）等于换一个业务流程。
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpListingRequest' }
      responses:
        '200':
          description: 成功（回到待审核）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已成交不可改（40991）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /mp/listings/{listingId}/offline:
    post:
      tags: [mp]
      operationId: mpOfflineListing
      summary: 下架我的挂牌
      description: |
        业主自己不想租了/不租了，**不需要填理由** —— 后台下架要理由是因为那是
        平台处置，业主下架是自己的东西。硬要理由的结果是有人填"1"。

        「待审核」的也能撤（撤自己的提交），「已成交」不能下架。
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 60, description: 选填 }
      responses:
        '200':
          description: 成功（`status=已下架`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已成交 / 已下架（40992）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/listings/{listingId}/renew:
    post:
      tags: [mp]
      operationId: mpRenewListing
      summary: 续挂（内容未改免审）
      description: |
        「已下架 / 已过期 / 已驳回」都能续挂，但走两条路：

        - `contentVersion === auditedVersion`（内容没改过）→ 直接「已发布」，**不再送审**。
          挂了 60 天没人问，续一下就完事，再审一遍是纯浪费；
        - 内容改过 → 「待审核」。

        「已驳回」的续挂一定要业主先改：驳回理由还在，原样再挂一次必然再驳一次。
        服务端对这种情况返回 409 并带上理由，不要静默通过。
      parameters:
        - $ref: '#/components/parameters/listingId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已驳回未修改 / 仍在架（40993）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /mp/listings/{listingId}/deal:
    post:
      tags: [mp]
      operationId: mpDealListing
      summary: 标记已成交（业主自助）
      description: |
        业主自己租出去了/卖掉了，标一下，房源从对外开放列表里消失。

        只改状态，**不收成交价、不收佣金**：这是物业服务里的信息发布，
        不是房地产经纪。一旦开始记成交价与佣金，性质就变了（要《房地产经纪机构备案表》）。

        后台审核与这里改的是同一个 `status`，所以两侧看到的结果一致。
      parameters:
        - $ref: '#/components/parameters/listingId'
      responses:
        '200':
          description: 成功（`status=已成交`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 非「已发布」不能标记成交（40994）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ================= 开票设置（2026-11-06 · 第 61 批） =================
  # 三块内容三个资源：抬头档案 / 费用项目 / 票据模板。
  # 与「发票与收据」分开：那边是开票动作，这边是开票前的口径。
  /invoice-items:
    get:
      tags: [invoice-settings]
      operationId: queryInvoiceItems
      summary: 费用项目（全量，不分页）
      description: |
        票据上「项目名称」的词条。**开票时不受这张表限制** —— 项目名可以直接手打，
        控制不了的临时收费不该被字典卡住；字典解决的是"常用的少打几遍"。

        默认五项：摆摊费 6% / 场地租用 9% / 赔偿款 0% / 押金 0% / 其他 6%。
        **押金与赔偿款税率 0 不是漏填**：前者是代收款项（退还时冲回，确认收入会重复计税），
        后者不属于增值税应税行为。

        全量返回不分页：字典量级是几十条，分页只会让下拉选择变复杂。
        `usageCount` 按票据的 `itemName` 统计（改名不回写历史票据）。
      parameters:
        - name: kw
          in: query
          schema: { type: string }
        - name: includeDisabled
          in: query
          description: 维护页要 true（默认），下拉选择传 false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvoiceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [invoice-settings]
      operationId: createInvoiceItem
      summary: 新增费用项目
      description: 名称唯一（含已停用的也算占用，否则会出现两个「摆摊费」）。税率只接受 0/3/5/6/9/13。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceItemInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/InvoiceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict', description: 同名项目已存在（40902） }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /invoice-items/options:
    get:
      tags: [invoice-settings]
      operationId: invoiceItemOptions
      summary: 费用项目下拉（只回启用中的）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        taxRate: { type: number }
                        taxClass: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-items/name-options:
    get:
      tags: [invoice-settings]
      operationId: invoiceItemNameOptions
      summary: 开票项目名的全部候选（收费科目 + 费用项目）
      description: |
        账单开票的项目名是「物业服务费 / 水费」这类**收费科目**，
        而费用项目字典里是「摆摊费 / 场地租用」这类**临时收费**。
        开票下拉要把两者合起来，否则物业费开票时默认值"物业服务费"不在选项里，看着像数据错了。

        去重按名称（同名取收费科目那条，税率以科目为准）。
        **顺序固定**：科目在前、临时收费项目在后。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        taxRate: { type: number }
                        taxClass: { type: string }
                        from:
                          type: string
                          enum: [fee, item]
                          description: fee = 收费科目；item = 临时收费的费用项目
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-items/{itemId}:
    patch:
      tags: [invoice-settings]
      operationId: updateInvoiceItem
      summary: 修改费用项目
      description: 内置项可以改名，但已用过的不能停用 —— 历史票据靠名称追溯。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceItemInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /invoice-items/{itemId}/toggle:
    post:
      tags: [invoice-settings]
      operationId: toggleInvoiceItem
      summary: 启用 / 停用费用项目
      description: 停用不删除 —— 历史票据上写的是名称，删了就说不清"当时这个项目还在不在字典里"。
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoice-profiles:
    get:
      tags: [invoice-settings]
      operationId: queryInvoiceProfiles
      summary: 开票信息（抬头档案，全量）
      description: |
        票据抬头、税号、开户行、地址电话、联系人。**手填是常态**，
        能从业主 / 租户带出来只是省事。

        档案存的是**抬头快照**：业主后来改名不回写 —— 票据一旦开出，抬头就不能变（税务要求）。
        要跟着改走 `POST /invoice-profiles/{profileId}/refresh`，显式覆盖并留痕。

        量级是百级（常用抬头几十条），因此不分页；超过 500 条应改分页。
      parameters:
        - name: kw
          in: query
          schema: { type: string }
        - name: titleType
          in: query
          schema: { $ref: '#/components/schemas/InvoiceTitleType' }
        - name: sourceType
          in: query
          schema: { $ref: '#/components/schemas/InvoiceSource' }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvoiceProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [invoice-settings]
      operationId: createInvoiceProfile
      summary: 新增开票信息
      description: |
        企业抬头**必须**带纳税人识别号（开票要用）；个人抬头可不填 ——
        个人开票凭姓名即可，身份证号不当税号用。

        同一「抬头 + 税号」不可重复（409/40902）。`isDefault=true` 会把其他条置为 false。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceProfileInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /invoice-profiles/stats:
    get:
      tags: [invoice-settings]
      operationId: invoiceProfileStats
      summary: 抬头档案统计（个人 / 企业 / 各来源条数）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      personal: { type: integer }
                      company: { type: integer }
                      manual: { type: integer }
                      fromOwner: { type: integer }
                      fromTenant: { type: integer }
                      disabled: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-profiles/owner-options:
    get:
      tags: [invoice-settings]
      operationId: invoiceOwnerOptions
      summary: 带入用的人选（业主，最多 50 条）
      parameters:
        - name: kw
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        phone: { type: string }
                        houseName: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-profiles/tenant-options:
    get:
      tags: [invoice-settings]
      operationId: invoiceTenantOptions
      summary: 带入用的人选（在住租户，最多 50 条）
      description: 只回在住 —— 搬走的人不会再开票。
      parameters:
        - name: kw
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        tenantType: { type: string }
                        creditCode: { type: string }
                        phone: { type: string }
                        houseName: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-profiles/from-owner/{ownerId}:
    get:
      tags: [invoice-settings]
      operationId: invoiceProfileFromOwner
      summary: 从业主带入（返回草稿，不落库）
      description: |
        **带入 ≠ 建档**。682 个业主如果都自动建档，真正的常用抬头会被淹没。
        个人抬头只带姓名与手机，税号留空 —— 让人自己决定要不要填。
      parameters:
        - name: ownerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfileDraft' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoice-profiles/from-tenant/{tenantId}:
    get:
      tags: [invoice-settings]
      operationId: invoiceProfileFromTenant
      summary: 从租户带入（返回草稿，不落库）
      description: 企业租户会把名称、统一社会信用代码、注册地址一起带出来 —— 这些字段租户档案里本来就有。
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfileDraft' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoice-profiles/of-house/{houseId}:
    get:
      tags: [invoice-settings]
      operationId: invoiceProfilesOfHouse
      summary: 某房屋的可选抬头（房主在前、在住租户在后）
      description: |
        「默认开给房主，有租户信息时可切」——**顺序就是优先级**，前端取第一条即默认值。
        一条都没有时返回一条 `_adhoc: true` 的临时抬头（抬头取业主姓名），不拦人。
      parameters:
        - name: houseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/InvoiceProfile'
                        - type: object
                          properties:
                            roleLabel: { type: string, enum: [房主, 租户] }
                            _adhoc: { type: boolean, description: 临时抬头，未建档 }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoice-profiles/{profileId}:
    get:
      tags: [invoice-settings]
      operationId: getInvoiceProfile
      summary: 开票信息详情
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [invoice-settings]
      operationId: updateInvoiceProfile
      summary: 修改开票信息
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceProfileInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /invoice-profiles/{profileId}/default:
    post:
      tags: [invoice-settings]
      operationId: setDefaultInvoiceProfile
      summary: 设为默认抬头
      description: 全库唯一 —— 收银台「默认开给房主」要的是确定的一条，不能并列。已停用的不能设为默认（409/40927）。
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoice-profiles/{profileId}/toggle:
    post:
      tags: [invoice-settings]
      operationId: toggleInvoiceProfile
      summary: 启用 / 停用开票信息
      description: 停用不影响历史票据（票据上是当时的快照）。停用后若原为默认，默认位清空。
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoice-profiles/{profileId}/refresh:
    post:
      tags: [invoice-settings]
      operationId: refreshInvoiceProfileFromSource
      summary: 从来源重新带入（显式覆盖）
      description: |
        业主 / 租户改了名字之后，让档案跟上。**必须是显式动作**，不做自动同步 ——
        自动同步会让已经开出去的票据"跟着变"，那才是真说不清。

        手工填写的档案没有来源，调用返回 409/40928。
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/InvoiceProfile'
                      - type: object
                        properties:
                          _before: { type: string, description: 覆盖前的抬头，便于提示「从 A 改成 B」 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 手工档案没有来源（40928） }

  /invoice-template:
    get:
      tags: [invoice-settings]
      operationId: getInvoiceTemplate
      summary: 票据模板（单例）
      description: |
        只有 **1 套**。多套的代价是每张票据都要选版式，而现在只有一种纸（241×140 连续纸）。

        针打是**套打**：纸上已经印好框线，机器只负责把字打进去。
        所以 `offset`（整体偏移）比字号重要 —— 打歪 2mm 就压到预印线上了。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [invoice-settings]
      operationId: saveInvoiceTemplate
      summary: 保存票据模板
      description: |
        参数校验不通过**整单拒绝**（422/42213）—— 打歪的模板一旦落库，
        每一张票都会歪，而且是"现场打出来才发现"。

        校验包含组合约束：左右边距之和不能吃掉内容区（至少留 40mm），上下同理（至少 30mm）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceTemplateInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /invoice-template/reset:
    post:
      tags: [invoice-settings]
      operationId: resetInvoiceTemplate
      summary: 恢复出厂模板
      description: 回到 241×140 三联、宋体 10pt、偏移 0。改坏了用它兜底。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/InvoiceTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoice-template/check:
    post:
      tags: [invoice-settings]
      operationId: checkInvoiceTemplate
      summary: 校验模板参数（不落库）
      description: 页面边改边校验用。**返回错误清单而不是抛错** —— 要一次把所有问题列出来，改一处试一次太慢。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceTemplateInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      errs:
                        type: array
                        items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ================= 临时收费（2026-11-06 · 第 63 批） =================
  # 摆摊费、场地租用这类「与业务无关联」的收费。
  # **独立成表**：不写 bills、不生成应收 → 所以不进收缴率，但要计入营业收入。
  /temp-charges:
    get:
      tags: [temp-charges]
      operationId: queryTempCharges
      summary: 临时收费台账
      description: |
        按建单时间倒序。**这部分钱不进收缴率** —— 收缴率的定义是「应收 vs 实收」，
        临时收费压根没有"应收"这一步，进了分母只会让收缴率凭空下降、没人能解释。

        但**要计入营业收入**：见 `/temp-charges/income`。
        每行都带 `countsInCollectionRate: false`，防止后来人顺手把它加进分母。
      parameters:
        - name: kw
          in: query
          schema: { type: string }
        - name: communityId
          in: query
          schema: { type: string }
        - name: partyType
          in: query
          schema: { $ref: '#/components/schemas/TempChargeParty' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TempChargeStatus' }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          rows:
                            type: array
                            items: { $ref: '#/components/schemas/TempCharge' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [temp-charges]
      operationId: createTempCharge
      summary: 新建收费单（只登记，不动钱）
      description: |
        **建单 ≠ 收款**。建单只落单据，要收钱走 `/temp-charges/{chargeId}/pay`，
        那时才写缴费流水。如果建单就写流水，「待收款」的单会在日结里凭空多出一笔钱。

        校验：付款方类型必填、外部类型必须有名称、**所属项目必填**（收入要按项目入账）、
        金额 > 0 且不超过 100 万。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TempChargeInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/TempCharge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /temp-charges/stats:
    get:
      tags: [temp-charges]
      operationId: tempChargeStats
      summary: 台账统计（待收 / 本月已收 / 累计已收 / 作废）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      pending: { type: integer }
                      pendingAmount: { type: number }
                      paidCount: { type: integer }
                      paidAmount: { type: number }
                      monthAmount: { type: number }
                      voided: { type: integer }
                      external: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /temp-charges/income:
    get:
      tags: [temp-charges]
      operationId: tempChargeIncome
      summary: 临时收费收入（只算已收款）
      description: |
        「计入收入」的唯一取数口：公司收入结构与营业报表都从这里拿，
        **不收第二遍** —— 两处各算一次，迟早会差几分钱，然后没人说得清谁对。

        返回里固定带 `countsInCollectionRate: false`：有实收、没有应收，进制分母是错的。
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: string, example: '2026' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      total: { type: number }
                      byItem:
                        type: array
                        items:
                          type: object
                          properties:
                            itemName: { type: string }
                            count: { type: integer }
                            amount: { type: number }
                      countsInCollectionRate: { type: boolean, enum: [false] }
        '403': { $ref: '#/components/responses/Forbidden' }

  /temp-charges/reason-options:
    get:
      tags: [temp-charges]
      operationId: tempChargeReasonOptions
      summary: 收费事由下拉（与开票「费用项目」同源）
      description: |
        预设只是省打字，**不是白名单** —— 事由可以自由填写。
        与开票的费用项目同源：发票上写的项目名就是收费事由，两套字典迟早会打架。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /temp-charges/{chargeId}:
    get:
      tags: [temp-charges]
      operationId: getTempCharge
      summary: 收费单详情（带关联流水）
      parameters:
        - name: chargeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/TempCharge'
                      - type: object
                        properties:
                          payment: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [temp-charges]
      operationId: updateTempCharge
      summary: 修改收费单（仅「待收款」）
      description: |
        **只有「待收款」能改**：收了钱再改金额，等于让流水与单据对不上，
        而流水已经进了日结。要改只能作废重开（409/40927）。
      parameters:
        - name: chargeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TempChargeInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/TempCharge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /temp-charges/{chargeId}/pay:
    post:
      tags: [temp-charges]
      operationId: payTempCharge
      summary: 收款（写一条缴费流水）
      description: |
        收款写一条 `payments`：`billId` 为空、`tempChargeId` 指回单据、`channel='临时收费'`。
        日结按方式汇总时能看到这笔钱，开票池也能拿它开票。

        **预存抵扣已下线**：预存账户挂在房屋上，而临时收费的对象可以是外来摊贩 ——
        根本没有房屋可扣；何况预存体系本身在 2026-11 已整体停用。收款方式里不再出现它，
        硬传按 422/42212 拒。
      parameters:
        - name: chargeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [splits]
              properties:
                splits:
                  type: array
                  description: 组合支付明细，1–3 项，合计须等于单据金额
                  items:
                    type: object
                    properties:
                      method: { $ref: '#/components/schemas/PayMethod' }
                      amount: { type: number }
                remark: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      charge: { $ref: '#/components/schemas/TempCharge' }
                      payment: { $ref: '#/components/schemas/Payment' }
                      methodText: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /temp-charges/{chargeId}/void:
    post:
      tags: [temp-charges]
      operationId: voidTempCharge
      summary: 作废（仅「待收款」，必须写原因）
      description: |
        **只有「待收款」能作废**：已收款的要走退款（本期不做），直接作废会让日结里
        那笔钱凭空消失，而且找不到凭据。

        作废**必须写原因** —— 台账事后要能解释这张单为什么没收钱。
      parameters:
        - name: chargeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/TempCharge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ================= 通讯录（2026-11-06 · 第 66 批） =================
  # 与员工档案是两件事：档案有薪资/证件/紧急联系人（HR 用），
  # 通讯录只回答"这个人在哪个部门、怎么联系"（所有人用）。
  /contacts:
    get:
      tags: [contacts]
      operationId: queryContacts
      summary: 通讯录（在职，手机号不脱敏）
      description: |
        三条硬口径：

        1. **只取在职**（含试用，排除离职）—— 给离职的人打电话是这类工具最常见的错误；
        2. **手机号不脱敏**：同事之间看全号。与员工档案的「脱敏 + 揭示留痕」刻意相反 ——
           在档案里看手机是"查个人信息"，在通讯录里看手机就是它的用途本身；
        3. **字段白名单在服务端**：只回 6 个字段，薪资、证件、银行卡、紧急联系人
           **根本不在返回里**（不是页面不显示）。

        返回同时带 `groups`（按部门分组），页面直接渲染卡片墙，不用自己再分一次。
      parameters:
        - name: orgId
          in: query
          schema: { type: string }
        - name: kw
          in: query
          description: 姓名 / 岗位 / 部门 / 手机号；**长度 ≥4 时按号码后 4 位匹配**
          schema: { type: string }
        - name: includeSub
          in: query
          description: 是否含下级部门，默认 true
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/Contact' }
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            orgId: { type: string }
                            orgName: { type: string }
                            rows:
                              type: array
                              items: { $ref: '#/components/schemas/Contact' }
                      total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/tree:
    get:
      tags: [contacts]
      operationId: contactTree
      summary: 部门树（只列有人的节点）
      description: |
        `totalCount` 含下级。**0 人节点不返回** —— 组织树是按管理口径建的，
        班组层面不一定有直属员工，把二十多个空节点铺出来，找一个部门要点开三层还全是空的。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContactOrgNode' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contacts/stats:
    get:
      tags: [contacts]
      operationId: contactStats
      summary: 通讯录统计（在职人数 / 有人部门数 / 有手机号人数）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      orgCount: { type: integer, description: '有直属员工的组织数（班组不单独计）' }
                      withPhone: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ---------------- 租售信息（A 域 · 第 69 批） ----------------
  /public/listings:
    get:
      tags: [listings, mp]
      operationId: queryPublicListings
      summary: 房源列表（游客可见，免登录）
      description: |
        想租房的人基本不是本小区业主，登录墙会把客源挡光，所以这一组**免登录**。

        边界不靠登录态，靠**字段白名单**：只回小区 / 楼栋 / 户型 / 面积 / 朝向 / 楼层 /
        租金 / 押付 / 装修 / 配套 / 描述 / 图片 / 责任楼管姓名与微信。
        **不回**房号（`room`）、`houseShort`、业主与楼管的手机号 —— 房号线上不给，
        看房由楼管带过去；给了等于把"这户空着"公示出去。
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: houseType
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: integer }
        - name: maxPrice
          in: query
          schema: { type: integer }
        - name: kw
          in: query
          schema: { type: string }
        - name: sort
          in: query
          description: 默认按编号；priceAsc / priceDesc
          schema: { type: string, enum: [priceAsc, priceDesc] }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPublicListEnvelope' }

  /public/listings/{listingId}:
    get:
      tags: [listings, mp]
      operationId: getPublicListing
      summary: 房源详情（游客可见，免登录）
      description: 已下架 / 已过期 / 待审核的挂牌对外一律 404 —— 不区分"没这条"和"不给你看"。
      parameters:
        - $ref: '#/components/parameters/listingId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPublicEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/listings/{listingId}/viewing:
    post:
      tags: [listings, mp]
      operationId: createListingViewing
      summary: 我要看房（留联系方式，免登录）
      description: |
        **不是注册**：只留一个号码，不建账号、不校验短信、不进客户池。

        三条硬约束：
        - 同一手机号 + 同一房源 **24 小时内只能提交一次**（409）；
        - 手机号必须是 11 位（422）；
        - 返回里带 `promise`（"楼管会在 24 小时内联系你"）与 `privacy`（号码用途与保留期限），
          前端**必须原样展示** —— 不展示楼管电话之后，访客唯一的出路就是等。
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingViewingInput' }
      responses:
        '200':
          description: 已收到
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingViewingEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同一号码同一房源 24 小时内重复提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 称呼或手机号不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /listings:
    get:
      tags: [listings]
      operationId: queryListings
      summary: 租售信息列表（后台）
      description: |
        数据范围按角色收敛：总经理全部项目、项目经理本项目、楼管责任范围（按 `houseIds`）。
        待审核永远排最前，按等待时长正序 —— 这页看的就是"谁在等"。

        `ownerPhone` **列表脱敏**，完整号码在详情里给（审核要打给业主）。
      x-permission: a.listings.view
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [待审核, 已发布, 已驳回, 已下架, 已过期, 已成交] }
        - name: stewardEmpId
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          description: 只看超 24 小时未审（已升级）
          schema: { type: boolean }
        - name: kw
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /listings/stats:
    get:
      tags: [listings]
      operationId: listingStats
      summary: 租售看板（待审 / 已升级 / 已发布 / 看房待联系）
      x-permission: a.listings.view
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /listings/viewings:
    get:
      tags: [listings]
      operationId: queryListingViewings
      summary: 看房请求列表
      description: 列表 `phone` 脱敏；完整号码在详情里给 —— 这一页会被投屏，全号摆一屏迟早出事。
      x-permission: a.listings.viewing
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [待联系, 已联系, 已带看, 已关闭] }
        - name: listingId
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: kw
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingViewingListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /listings/viewings/stats:
    get:
      tags: [listings]
      operationId: listingViewingStats
      summary: 看房请求看板
      x-permission: a.listings.viewing
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingViewingStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /listings/viewings/{viewingId}:
    get:
      tags: [listings]
      operationId: getListingViewing
      summary: 看房请求详情（回完整号码）
      x-permission: a.listings.viewing
      parameters:
        - $ref: '#/components/parameters/viewingId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingViewingEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /listings/viewings/{viewingId}/contact:
    post:
      tags: [listings]
      operationId: markListingViewingContacted
      summary: 标记看房请求已联系 / 已关闭（必写结果）
      description: |
        移动端的核心动作：PC 只做「谁超时了」的监控页，真正回电话的是手机上的人。

        **结果必须写**（422）—— 下一个人接手时要能知道上次聊到哪；
        不写结果的话同一个访客会被三个人各打一遍，访客记住的是"物业老打电话"。

        只能从「待联系」转出（409）：已联系过的不再重复标记，否则时间线会被覆盖成最后一次。
        转成「已带看」不在这里做 —— 带看是另一件事，由 PC 的看房记录维护。
      x-permission: a.listings.viewing
      parameters:
        - $ref: '#/components/parameters/viewingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                status:
                  type: string
                  enum: [已联系, 已关闭]
                  default: 已联系
                  description: 已关闭 = 打不通 / 客户不需要了
                note: { type: string, maxLength: 100, description: 联系结果，必填 }
                operator: { type: string, description: 经办人（移动端传登录人姓名） }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingViewingEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 不是「待联系」状态（40942）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 没写结果 / 状态不在允许范围
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /listings/my-contact:
    get:
      tags: [listings, mobile]
      operationId: getMyListingContact
      summary: 我的对外联系方式
      description: |
        租售信息页展示给看房者的联系方式：微信号 + 二维码。
        手机号**不在**这里 —— 它只在内部通讯录里，不对外展示。
      parameters:
        - name: empId
          in: query
          description: 不传 = 登录人本人；查他人需要 e.org.edit
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyContactEnvelope' }
    patch:
      tags: [listings, mobile]
      operationId: updateMyListingContact
      summary: 维护我的对外联系方式（本人自助，无权限码）
      description: |
        不设「是否公开」开关：填了就是愿意展示，没填就不显示 ——
        加开关只会多出"填了但关着"这种没人说得清的状态。

        改他人需要 `e.org.edit`（403）—— 那是 HR 的活。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                empId: { type: string, description: 不传 = 本人 }
                wechatId: { type: string, maxLength: 30, description: 可空；空 = 清除 }
                contactQrUrl: { type: string, description: 二维码图片地址，可空 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyContactEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /listings/{listingId}:
    get:
      tags: [listings]
      operationId: getListing
      summary: 挂牌详情（审核用，回业主完整号码）
      description: 详情是操作场景 —— 审核要看、楼管要打给业主，所以这里给全号。
      x-permission: a.listings.view
      parameters:
        - $ref: '#/components/parameters/listingId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /listings/{listingId}/audit:
    post:
      tags: [listings]
      operationId: auditListing
      summary: 审核（通过 / 驳回）
      description: |
        **审核人是该房的责任楼管**（`house.stewardEmpId`），不是"审核员"角色。
        超 24 小时未审升直属上级（按 orgLeaders 解析，不写死角色名）。

        驳回必填理由（422）—— 业主看得到这句，也会拿着它来问。
        只有「待审核」能审（409）。
      x-permission: a.listings.audit
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pass: { type: boolean, description: 'true=通过并公开，false=驳回' }
                reason: { type: string, description: 驳回必填，业主可见 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 状态不是待审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 驳回未写理由
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /listings/{listingId}/offline:
    post:
      tags: [listings]
      operationId: offlineListing
      summary: 强制下架（必须写原因）
      x-permission: a.listings.audit
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60, description: 会记录在挂牌上，业主看得到 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingEnvelope' }
        '409':
          description: 只有已发布能下架
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 未写原因
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /listings/{listingId}/steward:
    patch:
      tags: [listings]
      operationId: reassignListingSteward
      summary: 改派责任楼管
      description: |
        改的是**房源**的责任楼管，不是单条看房请求 ——
        审核权、对外展示的微信号、后续请求都挂在这一个人身上，
        只改请求会造成"审核归 A、微信是 B"。
      x-permission: a.listings.audit
      parameters:
        - $ref: '#/components/parameters/listingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empId]
              properties:
                empId: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingEnvelope' }
        '422':
          description: 员工不存在或已离职
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------- 系统参数（后台 · 2026-11-11） ----------------
  /system/params:
    get:
      tags: [system]
      operationId: querySystemParams
      summary: 系统参数（按分组）
      description: |
        运营能在后台调、客户端只读的那一类阈值。`park.plateChangeLimit`
        以前写死在业主端常量里，改一次要发一次版 —— 这类值一旦下发，客户端就只负责展示与校验。

        **不再有第二个写入口**：业主端读到的上限、后台换绑记录里的「本月上限」，
        都来自这一张表。
      parameters:
        - name: group
          in: query
          description: 计费 / 催缴 / 现场 / 押金 / 导出 / 安全 / 车位
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemParamListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /system/params/{key}:
    patch:
      tags: [system]
      operationId: updateSystemParam
      summary: 改一个参数值
      description: |
        **值不得为空**（422）—— 空值会让下游退回默认值，而默认值是什么没人记得。

        `key` 不可改：它是客户端读参数时用的标识，改了等于让老版本读不到，
        而老版本还在线上跑（小程序做不到强更）。要换语义就新增一个 key。
      parameters:
        - name: key
          in: path
          required: true
          description: 参数键，形如 park.plateChangeLimit
          schema: { type: string, example: park.plateChangeLimit }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, description: 一律按字符串存，数值由客户端自行解析 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemParamEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------- 车位换绑记录（H2 · 2026-11-11） ----------------
  /parkings/{parkId}/changes:
    get:
      tags: [parking]
      operationId: queryParkingChanges
      summary: 某个车位的换绑记录 + 本月次数
      description: |
        以前这条记录是**按车位当前状态现算**的，提交换绑只在前端塞一条，**刷新即丢**。
        业主端已经能自助换绑，后台看不见记录 = 出纠纷时无法举证。

        `monthChanges` 以**最后一次重置**为界：重置之前的记录不计入，
        否则重置完数字不变，客服会以为没生效。
      x-permission: a.vehicles.view
      parameters:
        - $ref: '#/components/parameters/parkId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingChangesEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [parking]
      operationId: createParkingChange
      summary: 物业代操作换绑 / 解绑
      description: |
        `toPlate` 为空表示解绑。**原因必填** —— 出纠纷时要能举证是谁、为什么改的。

        写记录的同时会改车位本体与车辆表：日志是唯一真源，车位上的 `plateNo` 只是它的投影。
        只写日志不改车位，详情页就会显示"记录写着换成 A，车辆还是 B"。
      x-permission: a.vehicles.edit
      parameters:
        - $ref: '#/components/parameters/parkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                toPlate: { type: string, description: 留空 = 解绑 }
                reason: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingChangesEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该车位没有车牌，无需解绑
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /parkings/{parkId}/changes/reset:
    post:
      tags: [parking]
      operationId: resetParkingChanges
      summary: 重置本月换绑次数（客服兜底）
      description: |
        业主当月额度用完但确有换车，客服可以清零。**必须写原因**，并留一条「物业重置」记录 ——
        不写原因的重置等于无声改数，出事时没人认。

        本月本来就没有记录时返回 409：这个按钮按下去应该是"确实有用"的，
        按了没反应与按坏了看起来一样。
      x-permission: a.vehicles.edit
      parameters:
        - $ref: '#/components/parameters/parkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingChangesEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 本月没有换绑记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------- 人脸核验（H4 / H5 · 2026-11-11） ----------------
  /access/faces:
    get:
      tags: [faces]
      operationId: queryFaceRequests
      summary: 人脸核验队列（业主 / 家庭成员 / 租客同一入口）
      description: |
        业主端提交人脸走 `/mp/access/faces`，状态恒为「待核验」；**这一组是受理侧**。
        没有它，业主提交完就一直停在待核验 —— 流程是断的。

        按 `subjectType` 分两段：`业主`（含家庭成员）与 `租客`。同一件事开两个入口，
        客服第一句话一定是"到底在哪审"。

        待核验恒排最前，等得久的更靠前 —— 这页看的就是"谁在等"。
      x-permission: a.owners.view
      parameters:
        - name: subjectType
          in: query
          schema: { type: string, enum: [业主, 租客] }
        - name: status
          in: query
          schema: { type: string, enum: [待核验, 已生效, 已驳回, 已冻结] }
        - name: overdue
          in: query
          description: 只要超过 24 小时未处理的
          schema: { type: boolean }
        - name: kw
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceRequestListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /access/faces/stats:
    get:
      tags: [faces]
      operationId: faceRequestStats
      summary: 人脸核验看板
      x-permission: a.owners.view
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceRequestStatsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /access/faces/{faceId}/audit:
    post:
      tags: [faces]
      operationId: auditFaceRequest
      summary: 核验（通过 / 驳回）
      description: |
        **业主端不允许自助生效**，生效只能走这里 —— 否则谁都能给自己开门。

        驳回必填原因（422），业主端会原样展示；只写"不合格"等于让业主猜。
        只有「待核验」能审（409）。

        通过时回写主体：业主写 `owners`、家庭成员写 `members`、租客写 `tenants` ——
        申请单是唯一真相，那几个布尔只是它的投影。
        **驳回不动已有的人脸**：重新采集期间原人脸继续有效，否则业主会以为自己这会儿刷不了门。
      x-permission: a.owners.edit
      parameters:
        - name: faceId
          in: path
          required: true
          schema: { type: string, example: FC00003 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass]
              properties:
                pass: { type: boolean, description: 'true=通过并下发门禁，false=驳回' }
                reason: { type: string, description: 驳回必填，业主可见 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaceRequestEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该申请已处理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ================= 费用体系（批 1~6，2026-11-13） =================
  # 这一组对应用户侧的"费用与财务体系"改造：三率报表、收支分项、手工补录、公共收益、抄表推单。
  # 口径随响应一起返回（identity / estimated / mode），前端不要自己再算一遍 —— 两处算一定漂移。
  /reports/three-rate:
    get:
      tags: [reports]
      operationId: getThreeRate
      summary: 三率报表（收缴率 / 欠费率 / 预缴率）
      description: |
        一次返回**同一套数的三种切法**：
        应收按账期铺（不看有没有开单）、已收与减免来自同一张矩阵、未收 = 应收 − 已收 − 减免（**不减到 0**，超额收款为负）。
        `identity.ok=false` 时说明矩阵有孤儿流水或某期应收算错，此时 `collectionRate` 不可用。
      parameters:
        - name: from
          in: query
          required: true
          description: 起始账期（YYYY-MM）
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: to
          in: query
          required: true
          description: 结束账期（YYYY-MM，含）
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/communityId'
        - name: itemId
          in: query
          description: 收费项。只有「按面积 / 按车位 / 按户 + 月」的项有月度应收，水电走账单不算三率
          schema: { type: string, default: FI01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreeRateEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/income-expense:
    get:
      tags: [reports]
      operationId: getIncomeExpense
      summary: 收支分项与结余（区间）
      description: |
        收入侧来源：账单实收（按科目）+ 合同收入（按期间摊）+ 临时收费 + 手工补录收入。
        支出侧来源：报销 + 工资 + 合同摊 + 手工补录。
        两侧来源不同，**不能套同一套模板**；`byMonth` 用于看单月亏损。
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: to
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomeExpenseEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/waive-analysis:
    get:
      tags: [reports]
      operationId: getWaiveAnalysis
      summary: 减免分析（按原因汇总）
      description: |
        回答一个经营问题：**让出去的钱，是政策性让的，还是差错改出来的？**

        口径：
        - 金额取自**减免流水**，不是账单的 `discount` 累计值 —— 一张账单可能分两次减免，
          按账单汇总会把两笔算成一笔；
        - 早年没有登记原因的老账单列「未填原因（历史数据）」，**不并进「其他」**：
          并进去就把"没登记"洗成了"登记了其他"；
        - `overLimit` = 单笔超过该原因免审额度的笔数，用来发现超权减免。

        > 契约数据集没有灌减免原因（账单 `discount` 全为 0），返回空表是正常现象；
        > 正式环境由收银台写入。
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: to
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiveAnalysisEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/aging-live:
    get:
      tags: [reports]
      operationId: getAgingLive
      summary: 欠费账龄（实时口径）
      description: |
        与 `/reports/arrears`（读跑批快照）**分档边界一致、取数方式不同**：
        这个实时算，`asOf` 缺省取服务端当日；报表中心那张同一个 `statDate` 反复看数字不变，能对账。
        两个页面的数在"当天刚发生收款/核销"时会差一点，这是设计如此，不是错。

        分档：未到期 / 1-30天 / 31-60天 / 61-90天 / 91-180天 / 180天以上。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: asOf
          in: query
          description: 统计日（缺省当日）。账龄 = asOf − dueDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingLiveEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/deposit-ledger:
    get:
      tags: [reports]
      operationId: getDepositLedgerReport
      summary: 押金在账（期间发生额 + 时点余额）
      description: |
        押金是**负债**（LIA_DEPOSIT）：收进来不是收入、退出去不是支出，只有扣款转收入。
        所以这张表分两段：
        - **期间发生额**：区间内收 / 退 / 扣转收入（各按自己的日期归期：paidDate / refundDate / checkDate）；
        - **时点在账**：截至 `to` 账上还有多少钱是别人的。

        恒等式 `收 = 退 + 扣 + 在账` 在**全量**上必须成立；区间截断后四个数不必相等，
        所以 `identity` 用全量算，不要拿区间数去对。
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositLedgerEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /manual-entries:
    get:
      tags: [expenses]
      operationId: queryManualEntries
      summary: 手工补录列表
      description: 只有 `allowSources` 含 `manual` 的二级分类能进来；税费只能走这里。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/communityId'
        - name: direction
          in: query
          schema: { type: string, enum: [income, expense] }
        - name: categoryCode
          in: query
          schema: { type: string }
        - name: period
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualEntryPageEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [expenses]
      operationId: createManualEntry
      summary: 新建手工补录
      description: |
        三条硬规则：只能挂二级分类、方向必须与分类一致、分类的 `allowSources` 必须含 `manual`。
        校验不过返回 42204（分类不接受补录）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualEntryInput' }
      responses:
        '201':
          description: 已入账
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualEntryEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /manual-entries/{entryId}/void:
    post:
      tags: [expenses]
      operationId: voidManualEntry
      summary: 作废补录（不删除）
      description: 补录是"没有单据流"的钱，作废后保留原记录并置 `status=已作废`，`reason` 必填。
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 已作废
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualEntryEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /public-revenue:
    get:
      tags: [contracts]
      operationId: queryPublicRevenue
      summary: 公共收益台账
      description: |
        公共收益归全体业主，物业只能按合同分成拿服务费。
        三个数必须同时给：合同额 = 归业主 + 归物业；只给合同额会被当成公司收入。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: year
          in: query
          description: 覆盖该年度的合同
          schema: { type: string, pattern: '^\d{4}$' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRevenueEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meter-bills/preview:
    get:
      tags: [meters]
      operationId: previewMeterBills
      summary: 抄表推单预览
      description: |
        逐表返回"能不能出账、出多少钱、为什么不能出"。
        只对 `communityUtility` 里配置为 `meter` 的表计出账；`card`（插卡买量）与 `none`（国网自缴）不出账。
        `blocking` 非空的整批不能推（除非显式 `allowPartial`）。
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeterBillPreviewEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meter-bills:
    post:
      tags: [meters]
      operationId: generateMeterBills
      summary: 抄表推单（生成水电账单，幂等）
      description: |
        读数复核后按「用量 × 业态单价」生成水电账单。已推过的（readingId 已回填 billId）不重复生成。
        `allowPartial=true` 时允许在有未抄/待复核的情况下只推已抄完的，响应里带 `skipped` 说明跳过了多少户。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, pattern: '^\d{4}-\d{2}$' }
                communityId: { type: string }
                allowPartial:
                  type: boolean
                  default: false
                  description: 抄表分批进行时用；必须由操作人显式确认
      responses:
        '201':
          description: 已生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeterBillResultEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ================= 第 83 批（2026-11-13）：押金 / 减免原因 / 工单评价 / 报销明细 =================
  /waive-reasons:
    get:
      tags: [fees]
      operationId: listWaiveReasons
      summary: 减免原因字典
      description: |
        收银台减免必须选一条。字段里 **approveAbove** 是免审额度：
        减免金额超过它时，收银台必须填写依据（审批单号 / 会议纪要），否则 42218。
        **scope** 为「指定项目」时，只对 `communityIds` 里的项目可选 ——
        政策性减免常常只针对一个小区，让它到处可选，前台会拿不适用的依据去减免。
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/communityId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WaiveReason' }
    post:
      tags: [fees]
      operationId: createWaiveReason
      summary: 新增减免原因
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaiveReasonInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaiveReason' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /waive-reasons/{reasonId}:
    patch:
      tags: [fees]
      operationId: updateWaiveReason
      summary: 修改 / 启停减免原因（停用不删）
      parameters:
        - name: reasonId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaiveReasonInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WaiveReason' }

  /deposit-types:
    get:
      tags: [deposits]
      operationId: listDepositTypes
      summary: 押金类型字典
      description: |
        押金不止装修一种：门禁卡、车牌、履约保证金、租约押金都进同一张台账。
        类型决定四件事：**needDates** 要不要工期、**needCheck** 要不要验收、
        **standardAmount** 金额是否固定（0 = 按合同约定）、**allowPartial** 能否部分退。
      parameters:
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DepositType' }
    post:
      tags: [deposits]
      operationId: createDepositType
      summary: 新增押金类型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositTypeInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DepositType' }

  /deposit-types/{typeId}:
    patch:
      tags: [deposits]
      operationId: updateDepositType
      summary: 修改 / 启停押金类型
      description: 停用只是不给新收，**已收的仍可退款**（押金是负债，钱必须能还回去）。
      parameters:
        - name: typeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositTypeInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DepositType' }

  /deposits:
    get:
      tags: [deposits]
      operationId: queryDeposits
      summary: 押金台账
      description: 口径 `收 = 退 + 扣 + 在账`。押金是负债（LIA_DEPOSIT），只有扣款部分转收入。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/communityId'
        - name: type
          in: query
          description: 押金类型（来自 /deposit-types）
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [在押, 装修中, 已逾期, 待退款, 已退还, 部分扣除, 已没收]
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositPageEnvelope' }
    post:
      tags: [deposits]
      operationId: createDeposit
      summary: 登记押金
      description: |
        按类型校验：`needDates` 的类型必须给开工与计划完工；
        `standardAmount = 0` 的类型必须给 amount（按合同/租约）。
        收银台收取也走这里，不另开接口 —— 两个入口两套校验必然漂移。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositInput' }
      responses:
        '201':
          description: 已登记
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deposit' }

  /deposits/{depositId}/check:
    post:
      tags: [deposits]
      operationId: checkDeposit
      summary: 押金验收（扣款在此登记）
      description: 只有 `needCheck=true` 的类型能验收；门禁卡、车牌退卡即退，不应出现这一步。
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkDate]
              properties:
                checkDate: { type: string, format: date }
                deductAmount: { type: number, minimum: 0 }
                deductReason: { type: string, maxLength: 60, description: 有扣款时必填 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deposit' }

  /deposits/{depositId}/refund:
    post:
      tags: [deposits]
      operationId: refundDeposit
      summary: 押金退款
      description: 需验收的类型必须先验收；`allowPartial=false` 的类型必须一次退清。
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refundAmount: { type: number, description: 不传则退全部余额 }
                refundDate: { type: string, format: date }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Deposit' }

  /work-orders/{woId}/evaluate:
    post:
      tags: [work-orders]
      operationId: evaluateWorkOrder
      summary: 业主评价工单（1~5 星 + 固定五项标签）
      description: |
        评价写回 workOrders 的 `score / evalTags / evaluate / evaluateAt`。
        标签固定五项（准时上门 / 讲解清楚 / 收拾干净 / 收费透明 / 态度好），三端同一份。
        **未评价时 score=0**，满意度统计必须排除 0，否则均值被"没评"的单拉垮。
      parameters:
        - name: woId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  maxItems: 5
                  items: { type: string, enum: [准时上门, 讲解清楚, 收拾干净, 收费透明, 态度好] }
                text: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrderSatisfaction' }
        '409':
          $ref: '#/components/responses/Conflict'

  /work-orders/satisfaction:
    get:
      tags: [work-orders]
      operationId: getWorkOrderSatisfaction
      summary: 工单满意度
      description: |
        三条口径：① 未评价（score=0）不参与均值；② 参评率分母 = 已完工 + 已评价 + 已关闭；
        ③ 差评（≤2 星）单独给名单，用于回访。
      parameters:
        - $ref: '#/components/parameters/communityId'
        - name: from
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        - name: to
          in: query
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrderSatisfaction' }

  /expenses/pending:
    get:
      tags: [expenses]
      operationId: listPendingExpenses
      summary: 已批未付的报销单
      description: 审批通过 ≠ 已付款。付款日才确认支出，批了没付不算成本。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Expense' }

  /expenses/{expenseId}/pay:
    post:
      tags: [expenses]
      operationId: payExpense
      summary: 确认付款（付款日决定归属账期）
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payDate: { type: string, format: date }
                remark: { type: string, maxLength: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Expense' }
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 只带身份与角色，**不带数据范围**；范围在查询时算。

  parameters:
    pageNo:
      name: pageNo
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    size:
      name: size
      in: query
      description: 每页条数，1..100（超限 400）
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    kw:
      name: kw
      in: query
      description: 关键字（各域命中的字段见接口说明）
      schema: { type: string }
    communityId:
      name: communityId
      in: query
      description: 项目 ID；不在数据范围内 → 403
      schema: { type: string, example: P01 }
    buildingId:
      name: buildingId
      in: query
      schema: { type: string, example: B0101 }
    unitId:
      name: unitId
      in: query
      schema: { type: string, example: U01101 }
    ownerId:
      name: ownerId
      in: path
      required: true
      schema: { type: string, example: OW00001 }
    houseId:
      name: houseId
      in: path
      required: true
      schema: { type: string, example: H010110101 }
    parkId:
      name: parkId
      in: path
      required: true
      description: 车位编号（`parkings.json` 的主键，如 PK00115）
      schema: { type: string, example: PK00115 }
    billId:
      name: billId
      in: path
      required: true
      schema: { type: string, example: BL000001 }
    payId:
      name: payId
      in: path
      required: true
      schema: { type: string, example: PM000001 }
    woId:
      name: woId
      in: path
      required: true
      schema: { type: string, example: WO000001 }
    approvalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, example: AP00097 }
    listingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, example: LS00001 }
    viewingId:
      name: viewingId
      in: path
      required: true
      schema: { type: string, example: VW00001 }
    neighborItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, example: SH0101 }
    neighborActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, example: AC0016 }
    neighborEnrollId:
      name: enrollId
      in: path
      required: true
      schema: { type: string, example: AE0301 }

    neighborVoteId:
      name: voteId
      in: path
      required: true
      schema: { type: string, example: SV0004 }
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, example: TN00001 }
    serviceItemCode:
      name: code
      in: path
      required: true
      description: 服务项目编号（RP- 开头的沿用原价目代号，新建为 SI 前缀）
      schema: { type: string, example: RP-W01 }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, example: IT00001 }
    rectifyId:
      name: rectifyId
      in: path
      required: true
      schema: { type: string, example: RC0001 }
    checkId:
      name: checkId
      in: path
      required: true
      schema: { type: string, example: QC0001 }
    month:
      name: month
      in: query
      description: |
        按月看时点（仅时点型报表）：取该月最后一天 24:00 的余额。
        未月结的月份 `statDate` 落在今天并标 `provisional`。
      schema: { type: string, example: '2026-09' }
    year:
      name: year
      in: query
      description: 按年看时点（仅时点型报表）：取该年 12-31 的余额；当年未结束则算到今天并标 `provisional`。
      schema: { type: string, example: '2026' }
    periodType:
      name: periodType
      in: query
      description: 期次粒度（期间型报表）。缺省按日——向后兼容老的 `statDate` 调用。
      schema: { $ref: '#/components/schemas/ReportPeriodType' }
    period:
      name: period
      in: query
      description: 期次值。日=2026-10-21 / 月=2026-10 / 年=2026。与 `statDate` 互斥。
      schema: { type: string, example: '2026-10' }
    statDate:
      name: statDate
      in: query
      description: |
        报表统计日（YYYY-MM-DD）。缺省取**最新成功批次**；
        指定日期但该日没有成功批次 → 404 / 40402（不是回空表：空表和「没跑过」必须能区分）。
      schema: { type: string, format: date, example: '2026-10-21' }

  responses:
    BadRequest:
      description: 参数错误（分页越界、枚举非法、必填缺失）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40001, message: 'size 必须在 1..100 之间' }
    ValidationError:
      description: 业务校验未通过（驳回没写理由、状态不允许、重复提交等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 42201, message: '驳回必须写理由 —— 业主看得到这句' }
    Unauthorized:
      description: 未登录 / 令牌过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40101, message: '登录已过期，请重新登录' }
    Forbidden:
      description: 无权限 / 超出数据范围（**不是空列表**）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40301, message: '无权查看「星光天地」的数据：超出当前数据范围' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 40401, message: '业主不存在' }
    Conflict:
      description: |
        状态冲突。二十八类，靠业务码区分——**处置方式完全不同，不能合并成一种提示**：

        | 码 | 含义 | 处置 |
        |---|---|---|
        | 40901 | 版本冲突（乐观锁） | 刷新重取 |
        | 40902 | 唯一约束冲突 | 改值 |
        | 40903 | 该期间已月结，数据只读 | 先反结（需更高权限） |
        | 40904 | 该期间已月结，不能重复提交 | 去看已有记录 |
        | 40905 | 该记录已反结，不能重复反结 | 无需处理 |
        | 40906 | 该合同已有变更在审批中 | 先处理那一单 |
        | 40907 | 已发布的公告不能修改 | 先撤回 |
        | 40908 | 当前状态不允许发布 | 看状态机 |
        | 40909 | 当前状态不允许撤回 | 看状态机 |
        | 40910 | 离职员工不能调角色 | 先恢复在职 |
        | 40911 | 该员工已是这个角色 | 无需处理 |
        | 40912 | 该期工资表已存在 | 重算需 overwrite=true |
        | 40913 | 已锁定（已核算 / 已发放），不能重算 | 先冲正 |
        | 40914 | 当前状态不允许该动作 | 看状态机 |
        | 40915 | 提交人不能审批自己提交的发放单 | 换人审批 |
        | 40916 | 同一角色已有相同内容的提权申请在审批中 | 等那条 |
        | 40917 | 提交人不能审批自己提交的权限申请 | 换人审批 |
        | 40919 | 标签已停用，不能再打 | 换一个启用中的词条；已打过的不受影响 |
        | 40920 | 该业主已有这个标签 | 无需处理 |
        | 40918 | 申请状态不允许该动作 | 看状态 |
        | 40921 | 已是该租客类型，无需转换 | 无需处理 |
        | 40922 | 该影像件已上传过 | 无需处理 |
        | 40923 | 同一分类下服务项目重名 | 改名 |
        | 40924 | 服务项目还有在途工单，不能停用 | 先结单或换项目 |
        | 40925 | 所属分类已停用，不能新增项目 | 换个分类或先启用 |
        | 40926 | 工单未完工，不能记工时积分 | 完工后再记 |
        | 40927 | 该期间积分已结算，不能再改 | 走冲正 |
        | 40928 | 审批单已受理，不能撤回 | 让审批人驳回 |
        | 40929 | 本车位本月自助换绑次数已用完 | 下月 1 日恢复；填错了找客服重置 |
        | 40930 | 车位管理费已到期，不能换绑 | 先续费（续费后自动恢复） |
        | 40931 | 该车牌已绑在本人其他车位 | 先解绑那一个，或直接换另一个 |
        | 40932 | 人脸正在核验，不能重复提交 | 等核验结果，或先撤回再重传 |
        | 40933 | 24 小时内人脸提交次数超限 | 明天再试 |
        | 40934 | 家庭成员资料未核验，不能代录人脸 | 先等成员登记核验通过 |
        | 40935 | 当前状态不能撤回人脸 | 看状态（已冻结就是已经撤过了） |
        | 40936 | 该单不参与抢单（抢单池只收商业服务单） | 走派单而不是抢单 |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            version:
              value: { code: 40901, message: '该记录已被他人修改，请刷新后重试' }
            unique:
              value: { code: 40902, message: '手机号「13800138001」已存在，不能重复录入' }
            closedPeriod:
              value: { code: 40903, message: '2026-09 已月结（YJ-202609-01），该期间数据只读，请先反结' }
            alreadyClosed:
              value: { code: 40904, message: '2026-09 已月结（YJ-202609-01），不能重复提交' }
            alreadyReopened:
              value: { code: 40905, message: '2026-09 已于 2026-10-30 反结，不能重复反结' }
    Unprocessable:
      description: |
        业务校验失败（原因必填、金额超限、必备信息缺失等）。按业务码区分：

        | 码 | 含义 | 处置 |
        |---|---|---|
        | 42201 | 通用业务校验失败（原因太短、金额超限、状态不允许） | 按消息改 |
        | 42202 | 核验门槛缺项（`details` 里逐项列出） | 补全后重试 |
        | 42203 | 换承租主体时目标类型必备信息缺失 / 公司核验缺营业执照影像件 | 按提示补齐 |
        | 42204 | 影像件不合规（格式 / 大小 / 张数 / 重复） | 按提示重传 |
        | 42205 | 服务价格分解不自洽（材料成本 > 材料费 / 合计为 0） | 改数值 |
        | 42206 | 成本价不低于服务价格（启用即亏本） | 调价 |
        | 42207 | 商业服务未选项目 / 公共区域维修未选设施部位 | 选一项 |
        | 42208 | 合同金额与公共收益不自洽（公共收益 > 合同金额 / 非经营合同填了公共收益） | 改数值 |
        | 42210 | 工时积分不适用（非公共区域维修 / 未派单 / 工时越界） | 按提示改 |
        | 42211 | OA 表单校验失败（必填缺、数值越界、结束早于开始） | 按提示改 |
        | 42212 | 审批流配置不合法（无节点 / 超额流程阈值为 0） | 改配置 |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: 42201, message: '退款金额不能超过可退金额 120' }

  schemas:
    # ============ 票据（2026-11-06 · 第 64 批） ============
    Ticket:
      type: object
      description: |
        一张收据或发票。`isReceipt` 决定它落在哪个状态上
        （`receiptStatus` 或 `invoiceStatus`），两者互不影响。
      properties:
        ticketId: { type: string, example: TK000001 }
        ticketNo:
          type: string
          description: 收据 `SJ` 开头；发票 `0264` 开头
          example: SJ10000001
        type: { type: string, enum: [收据, 电子发票, 增值税普通发票] }
        isReceipt: { type: boolean }
        payId: { type: string }
        tempChargeId: { type: string, description: 临时收费开出的票据会指回单据 }
        amount: { type: number }
        taxAmount: { type: number, description: 收据恒 0（不是扣税凭证） }
        buyerTitle: { type: string, description: '手填 > 档案 > 房主' }
        buyerTaxNo: { type: string }
        itemName: { type: string, description: 取这一笔的实际科目 }
        communityId: { type: string }
        issueTime: { type: string }
        issuer: { type: string }
        status: { type: string, enum: [已开具, 已红冲, 开具失败] }

    # ============ 临时收费（2026-11-06 · 第 63 批） ============
    TempChargeParty:
      type: string
      enum: [业主, 租户, 外部]
      description: |
        付款方类型。`外部` = 单位或个人，**不要求有业主/租户档案** ——
        外面摆摊的摊贩没有档案，硬要建档会把业主表撑成"业主 + 摊贩 + 一次性的赔偿对象"。

    TempChargeStatus:
      type: string
      enum: [待收款, 已收款, 已作废]

    TempCharge:
      type: object
      description: |
        一张临时收费单。**与账单的关系是零**：没有 `billId`、不改 `bills`、不生成应收。

        因此它**不进收缴率**（收缴率 = 应收 vs 实收，它没有应收这一步），
        但**计入营业收入**（见 `/temp-charges/income`）。
      properties:
        chargeId: { type: string, example: TC00001 }
        chargeNo:
          type: string
          description: 单号 `LSF{日期}-{当日序号}`。不是主键，`chargeId` 才是
          example: LSF20260912-001
        partyType: { $ref: '#/components/schemas/TempChargeParty' }
        partyName: { type: string, maxLength: 40, example: 陈记糖油果子 }
        partyPhone: { type: string, description: 选填 }
        ownerId: { type: string, description: partyType=业主 时有值 }
        tenantId: { type: string, description: partyType=租户 时有值 }
        houseId: { type: string, description: 业主/租户单能带出房屋；外部单为空 }
        communityId: { type: string, description: '**必填**：收入要按项目入账' }
        communityName: { type: string }
        houseName: { type: string }
        reason: { type: string, maxLength: 40, example: 摆摊费 }
        itemName: { type: string, description: 收入科目。默认等于事由（发票上的项目名就是它） }
        amount: { type: number }
        status: { $ref: '#/components/schemas/TempChargeStatus' }
        method: { type: string, description: 已收款时有值，存金额最大的一笔 }
        splits:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PayMethodLegacy' }
              amount: { type: number }
        payTime: { type: string }
        payId: { type: string, description: 收款后写的流水号 }
        batchNo: { type: string }
        operator: { type: string }
        remark: { type: string }
        createdAt: { type: string }
        createdBy: { type: string }
        voidReason: { type: string, description: 作废必填 —— 台账要能解释这张单为什么没收钱 }
        voidAt: { type: string }
        voidBy: { type: string }
        countsInCollectionRate:
          type: boolean
          enum: [false]
          description: 恒为 false。显式声明，防止后来人顺手把它加进收缴率的分母
        countsInIncome:
          type: boolean
          description: 派生：status=已收款 时为 true

    TempChargeInput:
      type: object
      required: [partyType, partyName, communityId, reason, amount]
      properties:
        partyType: { $ref: '#/components/schemas/TempChargeParty' }
        partyName: { type: string, maxLength: 40 }
        partyPhone: { type: string }
        ownerId: { type: string }
        tenantId: { type: string }
        houseId: { type: string }
        communityId: { type: string, description: '**必填**：没有项目的收入只能进「集团」，事后查不出来源' }
        reason: { type: string, maxLength: 40 }
        itemName: { type: string, maxLength: 20, description: 不传则等于 reason }
        amount: { type: number, description: 大于 0、不超过 100 万 }
        remark: { type: string, maxLength: 120 }

    # ============ 通讯录（2026-11-06 · 第 66 批） ============
    Contact:
      type: object
      description: |
        通讯录的一行。**只有这 6 个字段**（+ `orgName` 派生）——
        薪资、身份证、银行卡、紧急联系人**根本不在返回里**，不是"页面不显示"。

        `phone` 是**明文**：同事之间看全号。这与员工档案的「脱敏 + 揭示留痕」刻意相反 ——
        在档案里看手机是"查个人信息"，在通讯录里看手机就是它的用途本身。
      properties:
        empId: { type: string, example: EM0001 }
        name: { type: string, example: 雷志强 }
        position: { type: string, example: 总经理 }
        orgId: { type: string }
        orgName: { type: string, description: 派生：部门名 }
        phone: { type: string, description: '**明文 11 位**，不脱敏' }
        gender: { type: string, enum: [男, 女] }

    ContactOrgNode:
      type: object
      description: |
        部门树节点。`totalCount` 含下级。**0 人节点不返回**（服务端已 prune）。
      properties:
        orgId: { type: string }
        name: { type: string }
        type: { type: string, enum: [集团, 部门, 项目, 班组] }
        directCount: { type: integer, description: 本部门直属人数 }
        totalCount: { type: integer, description: 含下级的人数；恒 > 0 }
        children:
          type: array
          items: { $ref: '#/components/schemas/ContactOrgNode' }

    # ============ 开票设置（2026-11-06） ============
    InvoiceTitleType:
      type: string
      enum: [个人, 企业]

    InvoiceSource:
      type: string
      enum: [手动, 业主, 租户]
      description: 档案的来源。手动 = 业主表里没有的单位（摆摊、场地租用），带入 = 从业主/租户档案取一次

    InvoiceItem:
      type: object
      description: |
        费用项目。**票据上的项目名称不受它限制** —— 可以手打任意文字，
        字典解决的是"常用的少打几遍"。
      properties:
        itemId: { type: string, example: II01 }
        name: { type: string, maxLength: 20, example: 摆摊费 }
        taxRate:
          type: number
          description: 默认税率（%）。**只能取 0 / 3 / 5 / 6 / 9 / 13**。开票时可按这一笔单独覆盖
          enum: [0, 3, 5, 6, 9, 13]
        taxClass: { type: string, example: 现代服务 · 其他现代服务 }
        builtin: { type: boolean, description: 内置项可改名、已用过的不能停用 }
        enabled: { type: boolean }
        sort: { type: integer }
        remark: { type: string }
        usageCount: { type: integer, description: 派生：被多少张票据用过（按 itemName 统计） }
        createdAt: { type: string }
        updatedAt: { type: string }

    InvoiceItemInput:
      type: object
      required: [name, taxRate]
      properties:
        name: { type: string, maxLength: 20 }
        taxRate: { type: number, enum: [0, 3, 5, 6, 9, 13] }
        taxClass: { type: string, maxLength: 30 }
        remark: { type: string, maxLength: 60 }
        enabled: { type: boolean, default: true }

    InvoiceProfile:
      type: object
      description: |
        开票信息（抬头档案）。存的是**抬头快照**：业主改名不回写 ——
        票据一旦开出，抬头就不能变（税务要求）；改了档案会让"当时开的什么"说不清。

        企业抬头必须带 `taxNo`；个人抬头可不填（个人开票凭姓名即可，身份证号不当税号用）。
      properties:
        profileId: { type: string, example: IP0001 }
        titleType: { $ref: '#/components/schemas/InvoiceTitleType' }
        title: { type: string, maxLength: 60, description: 发票抬头，与证件 / 营业执照完全一致 }
        taxNo:
          type: string
          description: 纳税人识别号，15–20 位数字或大写字母。企业必填，个人可空
        bankName: { type: string }
        bankAccount: { type: string }
        regAddress: { type: string }
        regPhone: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string, description: 电子发票发送地址 }
        sourceType: { $ref: '#/components/schemas/InvoiceSource' }
        sourceId: { type: string, description: 来源主体 id（业主 / 租户），手动为空 }
        sourceName: { type: string, description: 来源主体名称快照 }
        houseId: { type: string }
        isDefault: { type: boolean, description: 全库唯一 }
        enabled: { type: boolean }
        remark: { type: string }
        usageCount: { type: integer, description: 派生：被多少张票据用过 }
        createdAt: { type: string }
        updatedAt: { type: string }
        createdBy: { type: string }

    InvoiceProfileInput:
      type: object
      required: [title]
      properties:
        titleType: { $ref: '#/components/schemas/InvoiceTitleType' }
        title: { type: string, maxLength: 60 }
        taxNo: { type: string, description: titleType=企业 时必填 }
        bankName: { type: string }
        bankAccount: { type: string }
        regAddress: { type: string }
        regPhone: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        sourceType: { $ref: '#/components/schemas/InvoiceSource' }
        sourceId: { type: string }
        sourceName: { type: string }
        houseId: { type: string }
        isDefault: { type: boolean }
        enabled: { type: boolean, default: true }
        remark: { type: string }

    InvoiceProfileDraft:
      type: object
      description: |
        带入返回的**草稿**，结构与 InvoiceProfile 一致的子集，但 `profileId` 为空字符串 ——
        意思是"还没建档"。前端拿它预填表单，人确认无误后再 `POST /invoice-profiles`。
      properties:
        profileId: { type: string, enum: [''], description: 恒为空：草稿尚未建档 }
        titleType: { $ref: '#/components/schemas/InvoiceTitleType' }
        title: { type: string }
        taxNo: { type: string }
        bankName: { type: string }
        bankAccount: { type: string }
        regAddress: { type: string }
        regPhone: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        sourceType: { $ref: '#/components/schemas/InvoiceSource' }
        sourceId: { type: string }
        sourceName: { type: string }
        houseId: { type: string }
        remark: { type: string }

    InvoiceTemplate:
      type: object
      description: |
        票据模板（单例）。尺寸单位一律 **mm**，字号是 **pt** —— 针打按物理尺寸走纸，
        用 px 描述会随显示器缩放跑偏。
      properties:
        tplId: { type: string, example: IT01 }
        name: { type: string }
        title: { type: string, description: 票据标题，如「收 款 收 据」 }
        paper:
          type: object
          required: [width, height]
          properties:
            width: { type: number, description: 100–420mm；241 是针打连续纸标准宽 }
            height: { type: number, description: 60–297mm }
        margin:
          type: object
          description: 四边距（mm），0–60；左右之和须给内容区留够 40mm
          properties:
            top: { type: number }
            right: { type: number }
            bottom: { type: number }
            left: { type: number }
        offset:
          type: object
          description: 套打对位微调（mm），正数向右 / 向下。**比字号重要**
          properties:
            x: { type: number }
            y: { type: number }
        font:
          type: object
          properties:
            family: { type: string, enum: [宋体, 仿宋, 黑体, 楷体], description: 针打自带字库就这几套 }
            size: { type: number, description: 6–16pt }
            lineHeight: { type: number, description: 1.0–3.0 倍 }
        copies: { type: integer, description: 1–4 联 }
        copyTitles:
          type: array
          items: { type: string }
          description: 联次名称，如 存根联 / 客户联 / 财务联
        showStub: { type: boolean, description: 是否打印存根联 }
        showQr: { type: boolean, description: 右下角二维码（接税控后启用） }
        footerLeft: { type: string }
        footerRight: { type: string }
        note: { type: string }
        updatedAt: { type: string }
        updatedBy: { type: string }

    InvoiceTemplateInput:
      type: object
      description: 整单提交（不传的字段沿用当前值，paper/margin/offset/font 是逐层合并而非整体替换）
      properties:
        title: { type: string }
        paper:
          type: object
          properties:
            width: { type: number }
            height: { type: number }
        margin:
          type: object
          properties:
            top: { type: number }
            right: { type: number }
            bottom: { type: number }
            left: { type: number }
        offset:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
        font:
          type: object
          properties:
            family: { type: string, enum: [宋体, 仿宋, 黑体, 楷体] }
            size: { type: number }
            lineHeight: { type: number }
        copies: { type: integer }
        copyTitles:
          type: array
          items: { type: string }
        showStub: { type: boolean }
        showQr: { type: boolean }
        footerLeft: { type: string }
        footerRight: { type: string }
        note: { type: string }

    # ---------------- 通用 ----------------
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 五位业务码，见 info.description 的错误码表
        message: { type: string }
        details:
          type: array
          description: 逐条失败明细（批量操作）
          items:
            type: object
            properties:
              id: { type: string }
              reason: { type: string }
        traceId: { type: string }
    Page:
      type: object
      required: [rows, total, pageNo, size]
      properties:
        rows: { type: array, items: {} }
        total: { type: integer }
        pageNo: { type: integer }
        size: { type: integer }
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, description: 0 = 成功 }
        message: { type: string }
        data: {}
    BatchResult:
      type: object
      required: [ok, failed, total]
      properties:
        ok: { type: integer, description: 成功条数 }
        failed:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string, example: '该账单没有欠费，无需催缴' }
        total: { type: integer }
        batchNo: { type: string, example: CJ2610187 }

    # ---------------- 枚举（与 enums.json 同源） ----------------
    BillStatus:
      type: string
      enum: [未缴, 部分缴, 已缴, 逾期, 已减免, 已作废]
    PaymentBatchInput:
      type: object
      required: [billIds, splits]
      properties:
        billIds:
          type: array
          items: { type: string }
          description: 要收款的账单，必须属于同一位业主、且当前是欠费状态
        splits:
          type: array
          description: 组合支付明细，1–3 项，合计须等于「应缴 − 减免」
          items:
            type: object
            required: [method, amount]
            properties:
              method: { $ref: '#/components/schemas/PayMethod' }
              amount: { type: number, description: 大于 0，最多两位小数 }
        discount:
          type: number
          description: 本单减免，按各账单应缴比例分摊；不得超过应缴合计
        remark: { type: string }

    PayMethod:
      type: string
      description: |
        收款方式（**可写入的集合**）。2026-11 起 `预存抵扣` 已下线：业主端预存账户
        体系整体取消、PC 收银台也去掉了这一项，收款接口不再接受，传了按 422/42212 拒。
      enum: [现金, 微信支付, 支付宝, POS刷卡, 银行代扣]
    PayMethodLegacy:
      type: string
      description: |
        历史流水的收款方式，比可写入的多一个 `预存抵扣`。
        **只用于读**：2026-11 之前产生的流水里有这个值，不能因为下线就查不出来。
        新收款不要用它做校验，用 `PayMethod`。
      enum: [现金, 微信支付, 支付宝, POS刷卡, 银行代扣, 预存抵扣]
    InvoiceStatus:
      type: string
      enum: [未开票, 已开票, 已冲红]
    WoStatus:
      type: string
      enum: [待派单, 已派单, 处理中, 待确认, 已完工, 已关闭, 已评价, 已取消]
    WoPointsStatus:
      type: string
      enum: [待结算, 已结算, 已作废]
      description: |
        工时积分的结算状态。

        · `待结算` —— 已记录，等月度绩效核算推进；
        · `已结算` —— 该期间已核算，积分不能再改（要改走冲正）；
        · `已作废` —— 同一张单重新记录后，旧流水标为此状态而不是删除，绩效争议时要能看见改过几次。

    LaborPointLedgerEntry:
      type: object
      description: |
        工时积分流水。**这是绩效侧的唯一数据来源**：按 `empId + period` 聚合。

        绩效折算（积分 → 绩效分）本期**未实现**，折算系数与基准分待考核办法确定；
        但流水已经带上 `ruleVersion` 与 `status`，接的时候不用改数据模型。
      required: [ledgerId, empId, empName, woId, woNo, category, hours, weight, points, period, ruleVersion, status]
      properties:
        ledgerId: { type: string, example: PL00001 }
        empId: { type: string, description: 工号（绩效按它汇总；工单上只有姓名，服务端反查） }
        empName: { type: string }
        woId: { type: string }
        woNo: { type: string }
        communityId: { type: string }
        category: { type: string, description: 设施部位（决定权重） }
        hours: { type: number, description: 实际工时 }
        weight: { type: number, description: 记分时的部位权重（快照） }
        points: { type: number, description: 积分 = hours × 10 × weight }
        period: { type: string, description: 归属期间 YYYY-MM }
        ruleVersion: { type: string, example: POINT-2026-11-01 }
        status: { $ref: '#/components/schemas/WoPointsStatus' }
        beforePoints: { type: number, description: 重记前的积分（看改动幅度） }
        at: { type: string, description: 记录时间 }
        by: { type: string, description: 记入人 }
        remark: { type: string }

    WoType:
      type: string
      enum: [公共区域维修, 商业服务, 报事, 投诉建议, 咨询, 其他]
      description: |
        工单类型。前两条是**维修线**，也是唯一会产生费用的两条：

        · `公共区域维修` —— 免费。分类按**设施部位**（电梯 / 给排水 / 公区照明 / 配电 / 土建 /
          门窗五金 / 公共设备 / 道闸门禁 / 环境其他），不生成账单；
        · `商业服务` —— 收费。**必须**绑定一个服务项目（`/service-items`），价格与服务范围都写在项目里，
          金额按下单时的快照写入工单，字典改价不回溯。

        「入户维修」已废弃（2026-11-02 拆分为「商业服务」）：它原本既是类型、又和公共区域共用同一套
        「维修品类」分类，导致「电梯异常」（部位）与「下水道堵塞」（工种）并列在同一个下拉里。
    WoPriority:
      type: string
      enum: [特急, 紧急, 普通, 低]
      description: 缺省 SLA：特急 2h / 紧急 4h / 普通 24h / 低 48h（按工作日历，非自然小时）

    TenantVerifyStatus:
      type: string
      enum: [待核验, 已核验, 信息不全]
    TenantSource:
      type: string
      enum: [业主自助, 物业补录]
    InspectStatus:
      type: string
      enum: [待执行, 执行中, 已完成, 逾期, 已转工单]
    InspectPost:
      type: string
      enum: [环境, 安保, 工程, 客服, 保洁, 保安]
      description: 环境/安保/工程/客服为新称；保洁/保安为历史数据里的旧称，仅兼容
    RectifyStatus:
      type: string
      enum: [待整改, 待复核, 已闭环, 已退回]
    RectifyLevel:
      type: string
      enum: [轻微, 一般, 重大]

    # ---------------- 鉴权 ----------------
    LoginResult:
      type: object
      required: [token, refreshToken, expiresIn, user]
      properties:
        token: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: 秒 }
        user:
          type: object
          required: [empId, name, roleId, roleName, permissions, dataScope]
          properties:
            empId: { type: string, example: EM0001 }
            name: { type: string, example: 雷志强 }
            roleId: { type: string, example: R-PM }
            roleName: { type: string, example: 项目经理 }
            permissions:
              type: array
              items: { type: string }
              description: 权限码，如 ['a.owners.view','b.bills.edit']
            dataScope:
              type: string
              enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
            communities:
              type: array
              items: { type: string }
              description: 数据范围为「指定项目 / 本项目」时的项目清单

    # ---------------- 业主 ----------------
    OwnerTag:
      type: object
      required: [tagId, name, category, enabled, ownerCount]
      properties:
        tagId:
          type: string
          description: 字典键，**不可修改**（业主表引用它）
          example: OT05
        name: { type: string, example: 长期欠费 }
        category:
          type: string
          enum: [关怀, 风险, 价值, 行为]
          description: |
            四档分类，决定页面上的分组与配色：
            · 关怀 —— 要主动去找的人（独居、高龄、有婴幼儿）
            · 风险 —— 要盯住的事（欠费、投诉、违规装修、涉诉）
            · 价值 —— 能带动的资源（意见领袖、优质业主、志愿者）
            · 行为 —— 画像补充（活跃 APP、养宠）
        color: { type: string, enum: [red, orange, green, blue, cyan, gray] }
        builtin:
          type: boolean
          description: 系统内置。内置词条可改名/停用，但**不可删除**（删了历史标签成孤儿）
        enabled:
          type: boolean
          description: 停用后不能再新打；已打上去的保留
        sort: { type: integer }
        desc: { type: string, description: 口径说明——写清"这个标签什么情况下打"，避免各人理解不同 }
        ownerCount:
          type: integer
          description: |
            当前打了该标签的业主数（**全库**口径）。停用前先看它：
            不为 0 的停用要告知会影响多少人，而不是悄悄停掉
    OwnerTagIdsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [ownerId, tagIds]
              properties:
                ownerId: { type: string }
                tagIds:
                  type: array
                  items: { type: string }
                  description: 变更后该业主的完整标签集（前端据此整体刷新，不用自己加减）
                tag: { $ref: '#/components/schemas/OwnerTag' }

    Owner:
      type: object
      required: [ownerId, name, phone, houseCount]
      properties:
        ownerId: { type: string }
        name: { type: string }
        phone: { type: string, description: 列表接口回掩码，详情接口回明文 }
        idCard: { type: string }
        gender: { type: string, enum: [男, 女] }
        ownerType: { type: string, example: 个人 }
        certified: { type: boolean, description: 实名认证 }
        faceRegistered: { type: boolean, description: 人脸录入 }
        appRegistered: { type: boolean }
        creditLevel: { type: string, example: 'A' }
        registerDate: { type: string, format: date }
        tagIds:
          type: array
          description: |
            业主标签，存**字典键**不存名称（`OT05` 而不是"长期欠费"）。
            存名称的话，改一个词条要刷 682 条业主；停用一个词条，历史标签就成孤儿。
            取值必须是 `GET /owner-tags` 里存在的 tagId；停用的词条**允许保留**在已有业主身上
            （历史事实不因词条停用而消失），但不允许新打。
          items: { type: string, example: OT05 }
        houseCount: { type: integer }
        houseNames:
          type: array
          items: { type: string }
        debtAmount: { type: number, description: 名下房屋未收合计 }
        phoneRedacted: { type: boolean, description: true 表示 phone 是掩码 }
        idCardRedacted: { type: boolean }
        _ver: { type: integer, description: 乐观锁版本，PATCH 时回传 }

        # ---------- 客户画像（2026-11-02 · 对齐《客户画像细分表模板》25 列） ----------
        ownerCategory:
          type: string
          enum: [常住, 候鸟, 投资, 出租业主]
          description: 业主分类。区分"住在这里的人"和"把房子当资产的人"——催缴话术与关怀策略都不同
        economicLevel:
          description: |
            家庭经济状况 · **个人敏感信息**。列表回 `***`（掩码），详情回枚举值且要 `a.sensitive.view`。
            它决定减免审批时的判断，但也最容易被拿去做差别对待，所以不给全量下发。

            枚举与掩码用 `oneOf` 而不是把 `***` 混进枚举——前者能同时校验"真实取值合法"和
            "掩码是唯一的掩码形态"，后者会让 `***` 看起来像一个合法选项。
          oneOf:
            - { type: string, enum: [优渥, 良好, 一般, 困难] }
            - { type: string, enum: ['***'] }
        politicalStatus:
          description: 政治面貌 · **个人敏感信息**（同 economicLevel 的管控口径与掩码形态）
          oneOf:
            - { type: string, enum: [中共党员, 共青团员, 群众, 民主党派] }
            - { type: string, enum: ['***'] }
        weddingDate:
          type: [string, 'null']
          description: 结婚纪念日（YYYY-MM-DD）；未登记为 null，**不要给假日期**
        employer: { type: string, description: 单位名称 }
        jobTitle: { type: string, description: 职务 }
        occupation: { type: string, description: 职业 }
        workAddress: { type: string, description: 工作地址 }
        hobbies: { type: string, description: 兴趣爱好，顿号分隔（原型不做多选结构化） }
        pets: { type: string, description: 宠物信息 }
        positiveNotes: { type: string, description: 正面信息（表扬、配合度高一类） }
        negativeNotes:
          type: string
          description: 负面信息 · **个人敏感信息**。写进来就要能被申诉，所以只给有权限的人看

    # ---------------- 房屋 ----------------
    House:
      type: object
      required: [houseId, communityId, buildingId, fullName]
      properties:
        houseId: { type: string }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        room: { type: string }
        floor: { type: integer }
        fullName: { type: string, example: '翡翠城 1栋1单元0101' }
        shortName: { type: string }
        usage:
          type: string
          enum: [住宅, 公寓, 商业]
          description: |
            用途。**公寓是 2026-11-02 新增**（旧改公寓，按住宅标准计费）。
            用途与使用状态是两个维度：公寓既可能"已入住"，也可能"未交房"。
        houseType: { type: string, example: 两室一厅 }
        area: { type: number }
        innerArea: { type: number }
        deliverStatus:
          type: string
          enum: [已交付, 未交房]
          description: 交付状态。未交房 = 还没到交付日，**不计物业费、不可出租**
        useStatus:
          type: string
          enum: [已入住, 装修未入住, 正在装修, 已交房未装修, 未交房, 空置房]
          description: |
            使用状态（六态，按现场《房屋状态》看板统一）。
            旧枚举「自住 / 出租 / 空置 / 装修中 / 限制使用」已废弃：
            它把**居住关系**（自住/出租）和**装修进度**混在一个字段里，两件事永远没法同时表达。

            - `已入住`：有业主自住，或有在住租户（居住关系看 `tenantId`，不看这个字段）
            - `装修未入住`：装修完工、业主尚未搬入
            - `正在装修`：施工中
            - `已交房未装修`：已拿钥匙、还是毛坯
            - `未交房`：未到交付日，不计费、不可出租
            - `空置房`：可住但长期无人（旧「限制使用」并入此档）

            口径约束：`已入住` 必须是装修过的房子（毛坯不可入住）；非 `已入住` 不应有 `checkinDate`。
        propertyStatus: { type: string }
        ownerId: { type: [string, 'null'] }
        tenantId:
          type: [string, 'null']
          description: 在住租户；null / 空串 = 无
        stewardEmpId: { type: string, description: 责任楼管（数据范围的依据） }
        stewardName: { type: string }

        # ---------- 客户画像补充（2026-11-02） ----------
        deliverDate:
          type: [string, 'null']
          description: 交房日期（YYYY-MM-DD）。`deliverStatus` 只是状态，算不了"交付多久了"
        decorationViolation:
          type: string
          enum: [无, 疑似, 已认定, 已整改]
          description: |
            是否违规装修 · **挂在房屋上**，不挂业主。一个业主可能同时拥有多套房，
            违规是某套房的事；挂到人身上，卖房之后这个标记还跟着人走
        decorationResult:
          type: string
          description: 违规处理结果；`decorationViolation=无` 时为空串

    # ---------------- 账单 ----------------
    Bill:
      type: object
      required: [billId, period, status, payable, paidAmount, unpaid]
      properties:
        billId: { type: string }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        houseId: { type: string, description: 车位账单为空 }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        period: { type: string, example: '2026-10' }
        status: { $ref: '#/components/schemas/BillStatus' }
        itemId: { type: string }
        itemName: { type: string }
        unit: { type: string }
        quantity: { type: number }
        price: { type: number }
        amount: { type: number, description: 应收金额（未计减免） }
        discount: { type: number }
        lateFee: { type: number }
        payable: { type: number, description: 应收 = 已收 + 未收 }
        paidAmount: { type: number }
        unpaid: { type: number }
        overdueDays: { type: integer }
        dueDate: { type: string, format: date }
        payTime: { type: string }
        createTime: { type: string }
        subjectType: { type: string, enum: [house, park] }
        _ver: { type: integer }
    BillSummary:
      type: object
      required: [count, payable, unpaid, debtCount, overdueCount]
      properties:
        count: { type: integer, description: 账单张数 }
        payable: { type: number }
        unpaid: { type: number }
        debtCount: { type: integer, description: 有欠费的张数 }
        overdueCount: { type: integer }

    # ---------------- 缴费 ----------------
    Payment:
      type: object
      description: |
        **一条流水对一张账单**。收银台一次收款覆盖多张账单时会写成多条（共用 `batchNo`）——
        开票、催缴、账单详情都按「账单 → 流水」查，合成一条会让这些地方全都查不到。

        组合支付用 `splits` 记录每一项方式；`method` 保留为**金额最大的一笔**，
        只为兼容还在读它的老报表与导出，**不要用它统计方法金额**。
      required: [payId, billId, amount, method, payTime]
      properties:
        payId: { type: string }
        billId: { type: string }
        houseId: { type: string }
        splits:
          type: array
          description: |
            组合支付明细。老数据没有这个字段，按 `method` + `amount` 当成单元素处理
            （**这是唯一的分支点**，别在页面里再判断一次）。
            日结按它拆开汇总，不是按 `method` —— 否则「现金 200 + 微信 122」里的现金会漏掉。
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PayMethodLegacy' }
              amount: { type: number }
        splitCount: { type: integer, description: 派生：有几种方式 }
        batchNo: { type: string, description: 收款批次号，一次收款的多条流水共用 }
        receiptStatus:
          type: string
          enum: [未开具, 已开具, 已作废]
          description: |
            **收据状态，与发票状态并列而不是合一**（第 64 批）。

            只开收据的笔数不少（个人业主现场缴费大多只要一张收据），
            合成一个「已开票」之后，待开票池就查不出"哪些还差一张发票" ——
            而补开发票正是财务月结前要做的事。

            所以待开票池的口径是 `invoiceStatus !== '已开票'`：
            **只开了收据的流水仍然留在池子里**。
        receiptNo: { type: string, description: 收据号，`SJ` 开头 }
        tempChargeId: { type: string, description: 临时收费产生的流水会指回单据（此时 `billId` 为空） }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        subjectType:
          type: string
          enum: [house, park]
          description: 承载对象类型；车位费没有 houseId，列表要能区分
        communityName: { type: string }
        communityId: { type: string }
        amount: { type: number }
        method: { $ref: '#/components/schemas/PayMethodLegacy' }
        channel: { type: string }
        transNo: { type: string }
        operator: { type: string }
        payTime: { type: string, example: '2026-10-21 10:20' }
        invoiceStatus: { $ref: '#/components/schemas/InvoiceStatus' }
        invoiceNo: { type: string }
        subject: { type: string, description: 承载对象（房屋全名 / 车位编号） }
        itemName: { type: string }
        period: { type: string }
        refundAmount: { type: number, description: 已退款合计 }
        refundStatus: { type: string, enum: ['', 部分退款, 已全额退款] }
      example:
        payId: PM000001
        billId: BL000001
        amount: 322.39
        method: 支付宝
        payTime: '2026-08-30'
        invoiceStatus: 已开票
    Refund:
      type: object
      required: [refundId, refundNo, payId, amount, kind, reason, at]
      properties:
        refundId: { type: string, example: RF00001 }
        refundNo: { type: string, example: TK-2026-10-30-001 }
        payId: { type: string }
        billId: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        houseName: { type: string }
        amount: { type: number }
        kind: { type: string, enum: [全额, 部分] }
        reason: { type: string }
        operator: { type: string }
        at: { type: string }
        invoiceRedFlushed: { type: boolean, description: 是否同时红冲了发票 }

    # ---------------- 工单 ----------------
    ServiceItem:
      type: object
      description: |
        商业服务项目（价目字典的一行）。

        `price` 与 `cost` 是**冗余的合计列**：列表、排序、报表都直接用它们。
        每次由 material + labor 现算，迟早出现「这个页面 125、那个页面 124.99」。
        写入时强制 `price = material + labor`、`cost = materialCost + laborCost`。
      required: [code, category, name, price, material, labor, cost, materialCost, laborCost, unit, minutes, enabled]
      properties:
        code: { type: string, example: RP-W01, description: 编号（业主端 / 员工端按它索引，改名会断链） }
        category: { type: string, example: 水管漏水, description: 项目分类（维修品类维度） }
        name: { type: string, example: 角阀/软管更换（含材料） }
        trade: { type: string, example: 水暖, description: 工种：水暖 / 电工 / 木工 / 空调 / 泥瓦 / 综合 }
        material: { type: number, description: 材料费（对业主报价构成） }
        labor: { type: number, description: 人工费（对业主报价构成，也是师傅提成基数） }
        price: { type: number, description: 服务价格 = material + labor }
        materialCost: { type: number, description: 材料成本（材料按成本价过账，通常等于 material） }
        laborCost: { type: number, description: 人工成本 = 工时 × 小时成本 }
        cost: { type: number, description: 成本价 = materialCost + laborCost }
        unit: { type: string, example: 次 }
        minutes: { type: integer, description: 标准工时（分钟），用于排期与人工成本折算 }
        enabled: { type: boolean, description: 在售 / 停用。停用不删，历史工单仍引用 }
        sort: { type: integer }
        desc: { type: string, description: 服务范围说明（包含什么、不包含什么，避免现场加价争议） }
        usedCount: { type: integer, description: 引用该项目的工单数（派生态） }
        inFlight: { type: integer, description: 其中未完工的单数；>0 时不允许停用 }
    ServiceItemInput:
      type: object
      description: 新增 / 修改服务项目的入参。`price / cost` **不接受**（由服务端按分解项算）。
      required: [category, name, material, labor, materialCost, laborCost]
      properties:
        category: { type: string }
        name: { type: string, minLength: 2, maxLength: 30 }
        trade: { type: string }
        material: { type: number, minimum: 0 }
        labor: { type: number, minimum: 0 }
        materialCost: { type: number, minimum: 0 }
        laborCost: { type: number, minimum: 0 }
        unit: { type: string }
        minutes: { type: integer, minimum: 0 }
        sort: { type: integer }
        desc: { type: string }
    ServiceItemSummary:
      type: object
      description: 维护页 KPI。收入只算「已完工且已结清（已支付 / 已挂账）」的工单，金额取快照。
      properties:
        total: { type: integer }
        enabled: { type: integer }
        disabled: { type: integer }
        categories: { type: integer }
        used: { type: integer, description: 被引用过的项目数 }
        orders: { type: integer, description: 引用工单总数 }
        settled: { type: integer, description: 已结清单数 }
        income: { type: number }
        cost: { type: number }
        profit: { type: number }
        margin: { type: number, description: 毛利率百分比 }
    ServiceItemEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/ServiceItem' }
    ServiceItemPageEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/ServiceItem' }
            total: { type: integer }
            pageNo: { type: integer }
            size: { type: integer }

    WorkOrder:
      type: object
      required: [woId, woNo, communityId, type, priority, status, title, createTime, slaDueAt, slaBreached]
      properties:
        woId: { type: string }
        woNo: { type: string, example: BX202600001 }
        communityId: { type: string }
        buildingId: { type: string }
        unitId: { type: string }
        houseId: { type: string }
        houseName: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        type: { $ref: '#/components/schemas/WoType' }
        category: { type: string, example: 水管漏水 }
        source: { type: string, enum: [小程序, 前台, 电话, 巡检转单] }
        priority: { $ref: '#/components/schemas/WoPriority' }
        status: { $ref: '#/components/schemas/WoStatus' }
        title: { type: string }
        description: { type: string }
        dispatchMode: { type: string, example: 自动派单 }
        assignee: { type: string }
        createTime: { type: string }
        acceptTime: { type: string }
        arriveTime: { type: string }
        finishTime: { type: string }
        slaHours: { type: integer }
        slaDueAt:
          type: string
          description: SLA 到期时间，**由服务端按工作日历算好下发**（前端不算，避免两边算法不一致）
        slaUsedHours: { type: number }
        slaBreached: { type: boolean, description: 停表（待确认）期间不计超时 }
        serviceItemCode:
          type: string
          description: |
            关联的服务项目编号（仅 `type=商业服务`）。与 `priceCode` 是同一个值 ——
            `priceCode` 是旧名字，保留是为了业主端 / 员工端按它索引价目不断链。
        serviceName: { type: string, description: 下单时的服务项目名称（快照，字典改名不回溯） }
        feeType: { type: string, enum: [收费, 免费] }
        materialFee: { type: number, description: 材料费（对业主报价构成，按成本价过账） }
        laborFee: { type: number, description: 人工费（对业主报价构成，也是师傅提成的基数） }
        totalFee: { type: number, description: 服务价格 = 材料费 + 人工费（下单时快照） }
        serviceCost:
          type: number
          description: |
            下单时的成本价快照 = 材料成本 + 人工成本。**只在后台可见**，用于算毛利；
            不给业主端返回（业主端拿到的 totalFee 就够）。
        payStatus: { type: string, enum: [未支付, 已支付, 已挂账, 无需支付] }
        laborHours:
          type: number
          description: 实际工时（小时）。**仅公共区域维修**记录 —— 商业服务有提成，再叠积分等于同一件事发两次奖
        laborPoints:
          type: number
          description: 工时积分 = 工时 × 基准分/时（10）× 部位权重
        laborPointWeight:
          type: number
          description: 部位权重（电梯 1.5 / 公共设备 1.4 / 配电 1.3 / 给排水与道闸 1.2 / 土建 1.1 / 照明门窗 1.0 / 环境 0.8）
        pointRuleVersion:
          type: string
          description: 记分时的规则版本。调权重不影响已记录的积分（与工单金额快照同理）
        pointsPeriod:
          type: string
          description: 归属期间 YYYY-MM（按完工月）。绩效按自然月核算，积分必须能按期间聚合
        pointsStatus:
          $ref: '#/components/schemas/WoPointsStatus'
        score: { type: integer, description: 满意度评分 0..5 }
        isPublic: { type: boolean, description: 是否公共区域工单（无房屋归属） }
        _ver: { type: integer }
    WorkOrderSummary:
      type: object
      required: [total, open, overdue, pending]
      properties:
        total: { type: integer }
        open: { type: integer, description: 未闭环（不含已取消） }
        overdue: { type: integer, description: 未闭环且 SLA 已超时（停表不计） }
        pending: { type: integer, description: 待派单 }
        urgent: { type: integer, description: 剩余不足 SLA 20% }
        paused: { type: integer, description: 停表（待确认） }

    QualityGrade:
      type: string
      enum: [优秀, 良好, 合格, 不合格]
      description: ≥90 优秀 / ≥80 良好 / ≥70 合格 / <70 不合格
    QualityStatus:
      type: string
      enum: [已闭环, 整改中, 待复核, 已超时]

    # ---------------- 品质 ----------------
    QualityCheck:
      type: object
      required: [checkId, checkNo, communityId, area, checkDate, score, grade, status]
      properties:
        checkId: { type: string }
        checkNo: { type: string, example: QZ-2026-10-0001 }
        communityName: { type: string, description: 服务端带出项目名，列表直接显示（别让前端拿 id 猜） }
        communityId: { type: string }
        area: { type: string, example: 安保 }
        type: { type: string, description: 检查类型（日常巡检 / 专项检查 / 交叉检查） }
        checker: { type: string }
        checkDate: { type: string, format: date }
        period: { type: string, example: '2026-10' }
        score: { type: number }
        grade: { $ref: '#/components/schemas/QualityGrade' }
        deductCount: { type: integer, description: 扣分项数 }
        veto: { type: boolean, description: 一票否决 }
        rectifyCount: { type: integer, description: 应整改项数 }
        rectifyDone: { type: integer, description: 已整改项数 }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/QualityStatus' }
        recheck: { type: boolean, description: 是否已复查 }
        sourceType: { type: string, enum: [现场抽查, 任务评价] }
        _ver: { type: integer }

    # ---------------- 租户 ----------------
    TenantCompleteness:
      description: |
        完整度**按租客类型分两套口径**（各 8 项）：
        · 个人：姓名 / 手机 / 证件 / 实名 / 人脸 / 与业主关系 / 居住人数 / 紧急联系人
        · 公司：公司名 / 信用代码 / 法人 / 法人电话 / 经办人 / 经办人手机 / 经营类目 / 注册地址

        拿个人那套去量公司租户，公司永远补不满（它没有"与业主关系""居住人数"）；
        反过来也是一样。两套口径都在服务端算，前端不要各算一套。
      type: object
      required: [total, filled, missing, rate, basicTotal, basicFilled, missingBasic]
      properties:
        total: { type: integer, description: 完整度总项数（8 项） }
        filled: { type: integer }
        missing:
          type: array
          items: { type: string }
        rate: { type: number, description: 完整度百分比 }
        basicTotal: { type: integer, description: 核验门槛项数（5 项） }
        basicFilled: { type: integer }
        missingBasic:
          type: array
          items: { type: string }
          description: 核验门槛缺项；非空时 verify 会 422
        licenseRequired:
          type: boolean
          description: 该公司是否受"必须有营业执照影像件"约束（个人恒 false）
        licenseCount: { type: integer, description: 已上传影像件张数 }
        licenseReady:
          type: boolean
          description: |
            核验依据是否齐备。**不计入 8 项分母**：完整度量的是"信息填全没有"，
            影像是"能不能核验"，混在一起会让所有公司的完整度同时漂移。
            为 false 时 verify 会 422/42203。
    Tenant:
      type: object
      required: [tenantId, name, phone, status, verifyStatus, source]
      properties:
        tenantId: { type: string }
        tenantType:
          type: string
          enum: [个人, 公司]
          description: |
            租客类型。个人与公司是**两套字段、两套校验、两套完整度口径**：
            公司的身份凭证是统一社会信用代码而不是身份证，核验核的是营业执照而不是人脸，
            门禁人脸录的是**经办人**而不是"公司"。

            类型在建立时确定，`PATCH` 不允许顺手改；真要换主体走
            `POST /tenants/{tenantId}/change-type` —— 那条接口会同步撤销人脸、
            复位核验、清理另一套字段并留痕，不是改一个字符串。
        name:
          type: string
          description: |
            承租主体名称：个人 = 姓名，公司 = **公司名称**（与 `companyName` 相同）。
            保留这个字段是为了列表/详情主标题不用按类型分支。
        phone: { type: string, description: 个人手机 / 公司对外联系电话。列表回掩码，详情回明文 }
        idCard:
          type: string
          description: 个人证件号。**公司主体为空**——公司不押个人身份证，主体凭证是 `creditCode`

        # ---------- 公司租户（2026-11-02）· 仅 tenantType=公司 时有效 ----------
        companyName: { type: string, description: 公司名称（与 name 相同，便于显式读取） }
        creditCode:
          type: string
          description: |
            统一社会信用代码（18 位，GB 32100-2015）。服务端做**校验位**校验，
            不只是查长度：抄错一位的代码看起来完全正常，只有算校验位才能发现。
        legalPerson: { type: string, description: 法定代表人 }
        legalPersonPhone: { type: string, description: 法定代表人电话（紧急联络用） }
        agentName:
          type: string
          description: 经办人。**门禁人脸与日常对接都落在这人身上**，不是法定代表人
        agentPhone: { type: string, description: 经办人手机（11 位） }
        agentIdCard: { type: string, description: 经办人证件号（敏感字段，按 idCard 同样脱敏） }
        businessCategory:
          type: string
          enum: ['', 餐饮, 零售, 教育培训, 生活服务, 办公, 医疗健康, 其他]
          description: |
            经营类目。**个人租户为空串**（这个字段只对公司有意义）。
            商铺承租必填——它决定消防与排污的管理要求。
        leasePurpose:
          type: string
          enum: ['', 经营, 办公, 仓储, 宿舍]
          description: |
            承租用途。**个人租户为空串**。与房屋用途不同：同一套商业房可以租来经营，也可以租来当仓库存货。
        regAddress: { type: string, description: 注册地址 }
        establishDate:
          type: [string, 'null']
          description: 成立日期（YYYY-MM-DD）。**不能晚于今天**——写未来日期说明执照信息填错了
        employeeCount: { type: integer, description: 员工人数（办公/经营场所的日常在场人数） }
        licenseFiles:
          type: array
          description: |
            营业执照影像件（公司租户的核验依据）。个人租户恒为空数组。
            **至少 1 张才能核验**——没看过原件就盖"已核验"，等于核验没发生。
          items: { $ref: '#/components/schemas/TenantFile' }
        houseId: { type: string }
        houseName: { type: string }
        communityId: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        ownerPhone: { type: string }
        leaseStart: { type: string, format: date }
        leaseEnd: { type: string, format: date }
        relation: { type: string, example: 承租人 }
        residents: { type: integer }
        source: { $ref: '#/components/schemas/TenantSource' }
        verifyStatus: { $ref: '#/components/schemas/TenantVerifyStatus' }
        certified: { type: boolean }
        faceRegistered: { type: boolean }
        status: { type: string, enum: [在住, 已搬离] }
        emergencyContact: { type: string }
        verifiedBy: { type: string }
        verifiedAt: { type: string }
        moveOutAt: { type: string }
        moveOutReason: { type: string }
        completeness: { $ref: '#/components/schemas/TenantCompleteness' }
        phoneRedacted: { type: boolean }
        idCardRedacted: { type: boolean }
        _ver: { type: integer }

    TenantFile:
      type: object
      description: |
        营业执照影像件的**元数据**。原型没有对象存储，只登记"传了什么、多大、谁传的"；
        预览由页面用本地文件生成的临时地址渲染，刷新即失效（真接口换成对象存储的 fileKey）。
      required: [fileId, name, size, type, uploadedAt, uploadedBy]
      properties:
        fileId: { type: string }
        name: { type: string, description: 原始文件名（含扩展名，用于判断是正本还是副本） }
        size: { type: integer, description: 字节数 }
        type:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
          description: 白名单只收这四种：执照要能看清国徽与二维码，压缩过的 webp 之外不放开
        uploadedAt: { type: string }
        uploadedBy: { type: string }

    TenantTypeChange:
      type: object
      description: 换承租主体（个人 ↔ 公司）的请求体
      required: [toType, reason]
      properties:
        toType: { type: string, enum: [个人, 公司] }
        reason:
          type: string
          minLength: 4
          description: 换主体是有实质后果的动作（人脸撤销 + 重新核验），原因必填且要能看懂
        operator: { type: string }
        patch:
          type: object
          additionalProperties: true
          description: |
            目标类型的字段，与换类型**同一次事务**提交：公司要带 companyName / creditCode /
            法人 / 经办人；个人要带 name / phone。分开提交会出现"类型换了但主体是空的"的中间态。

    # ---------------- 巡检 ----------------
    InspectIssueItem:
      type: object
      required: [item]
      properties:
        item: { type: string, description: 问题项名称 }
        deduct: { type: number }
        responsibleName: { type: string }
        responsibleEmpId: { type: string, description: 监督任务的 NG 项必须有人，否则考核归不到人 }
    InspectResult:
      type: object
      required: [item, result]
      properties:
        item: { type: string }
        result: { type: string, enum: [合格, 不合格] }
        deduct: { type: number }
        responsibleEmpId: { type: string }
        responsibleName: { type: string }
        memo: { type: string }
    InspectTask:
      type: object
      required: [taskId, planName, taskType, status, scheduledDate, executor]
      properties:
        taskId: { type: string }
        planId: { type: string }
        planName: { type: string }
        post: { $ref: '#/components/schemas/InspectPost' }
        communityId: { type: string }
        executor: { type: string }
        executorOrgId: { type: string }
        templateId: { type: string }
        taskType: { type: string, enum: [执行, 监督] }
        targetPost: { type: string }
        targetDept: { type: string }
        scheduledDate: { type: string, format: date }
        scheduledTime: { type: string }
        status: { $ref: '#/components/schemas/InspectStatus' }
        doneTime: { type: string }
        duration: { type: integer }
        itemCount: { type: integer }
        normalCount: { type: integer }
        issueCount: { type: integer }
        photos: { type: integer }
        checkinType: { type: string, example: GPS围栏 }
        checkedIn: { type: boolean }
        score: { type: number }
        refWoId: { type: string }
        conflictFlag: { type: boolean, description: 下属当日报零异常却被查出问题（申报不实） }
        issueItems:
          type: array
          items: { $ref: '#/components/schemas/InspectIssueItem' }
        _ver: { type: integer }

    # ---------------- 整改 ----------------
    RectifyItem:
      type: object
      required: [no, desc, done]
      properties:
        no: { type: integer }
        desc: { type: string }
        done: { type: boolean }
    RectifyOrder:
      type: object
      required: [rectifyId, rectifyNo, status, level, items, dueDate]
      properties:
        rectifyId: { type: string }
        rectifyNo: { type: string, example: ZG-2026-10-0001 }
        checkId: { type: string }
        checkNo: { type: string }
        communityId: { type: string }
        deptName: { type: string }
        area: { type: string }
        level: { $ref: '#/components/schemas/RectifyLevel' }
        status: { $ref: '#/components/schemas/RectifyStatus' }
        sourceType: { type: string, example: 现场抽查 }
        items:
          type: array
          items: { $ref: '#/components/schemas/RectifyItem' }
        issueDesc: { type: string }
        createdAt: { type: string }
        dueDate: { type: string, format: date }
        submitAt: { type: string }
        recheckAt: { type: string }
        recheckResult: { type: string }
        overdue: { type: boolean, description: 超期未整改（派生字段） }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
        _ver: { type: integer }

    QualityEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/QualityCheck' }
    QualityPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/QualityCheck' }
    QualityDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [check]
              properties:
                check: { $ref: '#/components/schemas/QualityCheck' }
                rectifies:
                  type: array
                  description: 由这次检查开出的整改单（可能为空）
                  items: { $ref: '#/components/schemas/RectifyOrder' }

    # ---------------- 汇总（列表页 KPI / 范围小计） ----------------
    PaymentSummary:
      type: object
      required: [count, amount]
      properties:
        count: { type: integer, description: 筛选后的流水笔数 }
        amount: { type: number, description: 筛选后的收款合计 }
        cashCount: { type: integer }
        cashAmount: { type: number, description: 现金实点要跟这个数对 }
        uninvoicedCount: { type: integer }
        refundAmount: { type: number, description: 已退金额（含部分退） }
        todayCount: { type: integer }
        todayAmount: { type: number }
        monthCount: { type: integer }
        monthAmount: { type: number }
        invoiced: { type: integer }
        byMethod:
          type: array
          description: 按收款方式分组（日结对账用）
          items:
            type: object
            required: [method, count, amount]
            properties:
              method: { type: string }
              count: { type: integer }
              amount: { type: number }
        byChannel:
          type: array
          description: 按渠道分组
          items:
            type: object
            required: [channel, count, amount]
            properties:
              channel: { type: string }
              count: { type: integer }
              amount: { type: number }
    QualitySummary:
      type: object
      required: [count, avgScore]
      properties:
        count: { type: integer }
        avgScore: { type: number, description: 筛选集平均分（一位小数） }
        qualified: { type: integer }
        unqualified: { type: integer, description: 不合格数，**含一票否决** }
        rectifying: { type: integer }
        overdue: { type: integer }
        recheck: { type: integer }
        veto: { type: integer }

    # ---------------- 保留与清理 ----------------
    ReportRetentionType:
      type: object
      required: [periodType, total, expired, protectedClosed]
      properties:
        periodType: { $ref: '#/components/schemas/ReportPeriodType' }
        keep:
          type: string
          description: 保留策略的人话说明（日 90 天 / 月 24 期 / 年永久）
        total: { type: integer, description: 当前该粒度的成功批次总数（含作废） }
        oldest: { type: string, description: 最早期间 }
        newest: { type: string, description: 最新期间 }
        expired: { type: integer, description: 已过期、下次清理会删的批次数 }
        protectedClosed:
          type: integer
          description: 已过期但**受保护**（该期间已月结）的批次数。这部分不会删，别让它混进 expired
    ReportRetention:
      type: object
      required: [keepDays, keepMonths, byType]
      properties:
        keepDays: { type: integer, example: 90 }
        keepMonths: { type: integer, example: 24 }
        byType:
          type: array
          items: { $ref: '#/components/schemas/ReportRetentionType' }
    ReportPurge:
      type: object
      required: [removed, keptProtected, dryRun]
      properties:
        removed: { type: integer, description: 删除的批次数（dryRun 时为"将删除"） }
        keptProtected: { type: integer, description: 因已月结而保住的批次数 }
        dryRun: { type: boolean }
        batches:
          type: array
          description: 被清理（或将要清理）的批次号，最多回 50 条，便于核对
          items: { type: string }

    # ---------------- 员工 ----------------
    EmploymentStatus:
      type: string
      enum: [在职, 试用, 离职]
      description: |
        `离职` 是**终态**：不可指派、不可调角色、不再计入任何"在岗"口径。
        转正只是 `试用 → 在职`，走档案修改，不产生新记录。
    EmpType:
      type: string
      enum: [正式, 试用, 劳务, 实习]
      description: 用工形式。与 `status` 正交——劳务也可以是「在职」，实习也可以已经「离职」
    RoleSource:
      type: string
      enum: [position, override]
      description: |
        角色从哪来：`position` = 由岗位反推；`override` = 人工调整过。
        前端凭它能决定要不要显示「恢复按岗位」——没有来源标记，用户不知道该恢复成什么。
    Employee:
      type: object
      required: [empId, empNo, name, orgId, position, status, assignable]
      properties:
        empId: { type: string, example: EM0001 }
        empNo:
          type: string
          description: 工号，服务端生成且**不可改**（考勤机、工资代发、社保申报都按工号对账）
          example: J240001
        name: { type: string }
        gender: { type: string, enum: [男, 女] }
        phone:
          type: string
          description: 手机号，**列表恒为掩码**（`195****7588`）；明文走 reveal 接口
        phoneRedacted: { type: boolean, description: true = 当前是掩码值 }
        idCard:
          type: string
          description: 证件号，**列表恒为掩码**（前 4 后 4）；明文走 reveal 接口
        idCardRedacted: { type: boolean }
        emergencyContact:
          type: string
          description: 紧急联系人姓名。与本人关系靠 `emergencyRelation` 区分
          example: 付艳
        emergencyRelation:
          type: string
          enum: ['', 配偶, 父亲, 母亲, 子女, 兄弟姐妹, 其他]
          description: |
            与本人关系。**枚举而非自由文本** —— 突发情况先找谁，靠这一栏判断。
            空字符串 = 未填（三项都空是合法状态：新人还没录）。
        emergencyPhone:
          type: string
          description: 紧急联系电话，**列表恒为掩码**（`188****7048`）；明文走 reveal 接口
          example: 188****7048
        emergencyPhoneRedacted: { type: boolean, description: true = 当前是掩码值 }
        homeOrgId:
          type: string
          description: |
            人事档案上的组织（员工表里存的那个，人挂到项目部这一级）。
            与 `orgId` 分开是因为「档案归属」和「实际排班归属」不是一回事：
            合并成一个字段的结果是——班组调整会把人事档案的归属也改掉，人力对不上花名册。
        orgId:
          type: string
          description: 实际归属（岗位反推出的班组 / 职能部门）。筛选、树计数都用这个
        orgName: { type: string }
        orgPath:
          type: string
          description: 组织全路径，服务端拼（`集团 / 翡翠城项目部 / 工程组`）
        teamId:
          type: string
          description: 班组 / 部门 ID（`O-P01-T2`）；总部职能岗为空
        projName: { type: string, description: 所属项目名；总部员工为「总部职能」 }
        position: { type: string, example: 客服专员 }
        level: { type: string, description: 职级，如 P5 / M2 }
        empType: { $ref: '#/components/schemas/EmpType' }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        entryDate: { type: string, format: date }
        regularDate:
          type: [string, 'null']
          description: 转正日期；试用期员工为空
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        contractDaysLeft:
          type: [integer, 'null']
          description: |
            距合同到期天数；**已过期为负数**（不给 0——0 天和"今天到期"分不清）。
            未签合同（刚入职）为 null。
        contractExpired: { type: boolean }
        contractExpiring:
          type: boolean
          description: 30 天内到期且未离职。续签提醒按这个字段筛，不按天数现算
        managerName: { type: string, description: 上级姓名（样例数据里只存姓名） }
        managerEmpId:
          type: [string, 'null']
          description: 上级的工号，服务端按姓名解析；解析不到给 null（不猜）
        roleId:
          type: [string, 'null']
          description: 角色 ID；离职或未匹配到岗位时为空
        roleName: { type: string, description: 未分配时为「未分配」 }
        roleSource:
          oneOf:
            - { $ref: '#/components/schemas/RoleSource' }
            - { type: 'null' }
        dataScope: { type: [string, 'null'], description: 角色带来的数据范围（六档） }
        permCount: { type: integer, description: 角色的权限位数 }
        socialSecurity: { type: boolean, description: 社保是否已缴 }
        attendance:
          type: object
          description: 本月考勤汇总（明细在考勤域）
          properties:
            late: { type: integer }
            leaveDays: { type: number }
            overtimeHours: { type: number }
        score: { type: integer, description: 绩效分（0–100） }
        assignable:
          type: boolean
          description: 是否可被指派（在职 = true）。任务派给离职员工的后果是没人接单
        roleRecalculated:
          type: object
          description: 本次修改导致的角色重算结果（只有 PATCH 出现；没发生变化则不返回）
          properties:
            from: { type: string }
            to: { type: string }
            reason: { type: string, example: '岗位变更，已清除角色覆盖并按新岗位重算' }
        _ver: { type: integer, description: 乐观锁版本号，修改时回传 }
    EmployeeSummary:
      type: object
      required: [total, onjob, probation, left, noRole, contractExpiring, contractExpired]
      properties:
        total: { type: integer }
        onjob: { type: integer }
        probation: { type: integer }
        left: { type: integer }
        noRole: { type: integer, description: 没有角色的员工数——权限治理要先看这个数 }
        contractExpiring: { type: integer, description: 30 天内到期（在职） }
        contractExpired: { type: integer, description: 合同已过期仍在职（该续签了） }
        orgCount: { type: integer }
        teamCount: { type: integer }
        roleCount: { type: integer }
        permCount: { type: integer, description: 权限位总数（分母） }
        selfOnly: { type: integer, description: 数据范围为「仅本人」的员工数 }
        deptOnly: { type: integer }
        groupAll: { type: integer, description: 可见全部项目的员工数——越小越安全 }
    OrgNode:
      type: object
      required: [orgId, name, type, headcount, selfHeadcount]
      properties:
        orgId: { type: string, example: O-P01 }
        name: { type: string }
        parentId: { type: string, description: 上级组织；集团节点为空串（建树要用） }
        sort: { type: integer, description: 同级排序，小的在前 }
        type: { type: string, enum: [集团, 部门, 项目, 班组] }
        leader:
          type: string
          description: 展示快照 = 当前审批人（在期正职，正职空缺时是在期代理）。**不要用它判断权限**
        leaders:
          type: array
          description: 完整负责关系（含已结束 / 未生效）；改负责人走 PUT /orgs/{orgId}/leaders
          items: { $ref: '#/components/schemas/OrgLeader' }
        headcount: { type: integer, description: 含全部下级的人数（树上的数字） }
        selfHeadcount: { type: integer, description: 只算直接挂在本节点上的人 }
        children:
          type: array
          items: { $ref: '#/components/schemas/OrgNode' }
    EmployeeOptionsItem:
      type: object
      required: [empId, name, assignable]
      properties:
        empId: { type: string }
        name: { type: string }
        label: { type: string, description: '姓名 · 岗位，前端直接渲染' }
        position: { type: string }
        teamId: { type: string }
        orgName: { type: string }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        assignable: { type: boolean }
    EmployeeDetail:
      type: object
      required: [employee, org, contract]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        role:
          type: object
          description: 角色的权限摘要；未分配角色时为空对象
          properties:
            roleId: { type: string }
            name: { type: string }
            scope: { type: string }
            dataScope: { type: string }
            permCount: { type: integer }
            domains:
              type: array
              items: { type: string }
              description: 覆盖的业务域名称（「主要管哪几块」）
        org:
          type: object
          required: [name, path]
          properties:
            name: { type: string }
            path: { type: string }
            leader: { type: string }
            teamId: { type: string }
        contract:
          type: object
          required: [start, end, daysLeft, expired]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
            daysLeft: { type: integer, description: 负数为已过期 }
            expired: { type: boolean }
        attendance: { type: object }
        certificates:
          type: array
          items: { type: string }
        related:
          type: object
          description: |
            关联单据概览。薪酬只给「有几条」，不给「多少钱」——
            给了金额，员工域就成了绕过工资域权限的后门。
          properties:
            contracts: { type: integer, description: 劳动合同份数 }
            payrollRecords:
              type: [integer, 'null']
              description: |
                工资条条数。**员工域恒为 null**——这个数属工资域统计。
                不返回 0：0 会被读成「有工资条但一条都没生成」，与「本域不管这事」是两码事。
        roleRecalculated:
          type: object
          description: 本次改岗位导致的角色重算结果（只有 PATCH 时出现）
          properties:
            from: { type: string }
            to: { type: string }
            reason: { type: string, example: '岗位变更，已清除角色覆盖并按新岗位重算' }
    EmployeeRoleChange:
      type: object
      required: [employee, from, to, affected]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        from:
          type: object
          properties:
            roleId: { type: [string, 'null'] }
            roleName: { type: string }
        to:
          type: object
          properties:
            roleId: { type: string }
            roleName: { type: string }
            permCount: { type: integer }
            dataScope: { type: string }
        affected:
          type: array
          description: 受影响角色的最新人数（两个角色），前端据此刷新角色树
          items:
            type: object
            properties:
              roleId: { type: string }
              roleName: { type: string }
              userCount: { type: integer }
    SensitiveReveal:
      type: object
      required: [empId, fields, reason, accessLogId]
      properties:
        empId: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [phone, idCard] }
              label: { type: string }
              value: { type: string, description: 明文 }
        reason: { type: string }
        operator: { type: string }
        shownAt: { type: string }
        accessLogId:
          type: string
          description: 访问日志 ID。**没有它这次揭示就是没留痕**，等于没发生

    # ---------------- 工资 ----------------
    PayrollStatus:
      type: string
      enum: [草稿, 已核算, 待发放审批, 已发放, 已冲正]
      description: |
        单向状态机，冲正是终态：

        草稿 →（核算锁定）已核算 →（提交发放）待发放审批 →（审批通过）已发放 →（冲正）已冲正
        驳回：待发放审批 → 已核算

        任何一步都不能跳。没核算就发，等于按草稿数字打钱；已核算还能改金额，
        等于发一次钱记两本账。
    Payroll:
      type: object
      required: [payrollId, period, empId, empName, grossPay, netPay, status]
      properties:
        payrollId: { type: string, example: PR2610-0001 }
        period: { type: string, description: 账期 YYYY-MM, example: '2026-10' }
        batchNo:
          type: string
          description: 代发批次号；未提交发放时为空
          example: GZ-2026-10-01
        empId: { type: string }
        empNo: { type: string }
        empName: { type: string }
        orgId: { type: string }
        orgName: { type: string }
        position: { type: string }
        level: { type: string }
        empType: { $ref: '#/components/schemas/EmpType' }
        base: { type: number, description: 基本工资 }
        performance: { type: number, description: 绩效（月度应发 - 基本工资） }
        overtime: { type: number, description: 加班费 }
        allowance: { type: number, description: 补贴 }
        grossPay:
          type: number
          description: 应发 = base + performance + overtime + allowance（服务端算，别前端加）
        socialInsurance: { type: number, description: 社保个人部分 }
        housingFund: { type: number, description: 公积金个人部分 }
        tax: { type: number, description: 个税 }
        otherDeduction: { type: number, description: 其他扣款（宿舍费 / 工装等） }
        deductionTotal: { type: number, description: 代扣合计 }
        netPay: { type: number, description: 实发 = grossPay - deductionTotal }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        paidAt: { type: string, description: 发放时间；未发放为空 }
        paidBy: { type: string }
        submittedBy: { type: string, description: 提交发放的人（审批时用来判双人原则） }
        reversedAt: { type: string }
        reverseReason: { type: string }
        bankCardMasked:
          type: string
          description: 银行卡掩码（只到后四位）。完整卡号走 reveal 接口
          example: '**** **** **** 9381'
        bankCardTail: { type: string, example: '9381' }
        formulaVersion:
          type: string
          description: 核算公式版本。税率表换了版本要能说清"这批是按哪版算的"
        _ver: { type: integer }
    PayrollSummary:
      type: object
      required: [period, employeeCount, grossTotal, deductionTotal, netTotal]
      properties:
        period: { type: string }
        batchNo: { type: string }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        employeeCount: { type: integer, description: 核算人数（含已冲正，人数不因冲正减少） }
        grossTotal: { type: number }
        deductionTotal: { type: number }
        netTotal:
          type: number
          description: 实发合计，**不含已冲正**（钱已经退回去了）
        reversedCount: { type: integer }
        reversedAmount: { type: number, description: 已冲正的实发金额（单列，不混进 netTotal） }
        byStatus:
          type: object
          description: '各状态人数，如 { 草稿: 80 }'
          additionalProperties: { type: integer }
    PayrollPeriod:
      type: object
      required: [period, status, employeeCount, netTotal]
      properties:
        period: { type: string, example: '2026-10' }
        status: { $ref: '#/components/schemas/PayrollStatus' }
        employeeCount: { type: integer }
        netTotal: { type: number }
        batchNo: { type: string }
        generatedAt: { type: string }
        paidAt: { type: string }
    PayrollCalcItem:
      type: object
      required: [label, amount]
      properties:
        label: { type: string, example: 基本工资 }
        amount: { type: number }
        note: { type: string, description: 口径说明（如「基本工资 × 10.5%」） }
    PayrollDetail:
      type: object
      required: [payroll, calc]
      properties:
        payroll: { $ref: '#/components/schemas/Payroll' }
        calc:
          type: object
          description: 服务端算好的分解项。前端各拼一遍 = 列表一个口径、工资条一个口径
          required: [gross, deductions, netPay]
          properties:
            gross:
              type: array
              items: { $ref: '#/components/schemas/PayrollCalcItem' }
            deductions:
              type: array
              items: { $ref: '#/components/schemas/PayrollCalcItem' }
            netPay: { type: number }
        bankCard:
          type: object
          properties:
            masked: { type: string }
            tail: { type: string }
            revealable: { type: boolean, description: 当前角色是否具备揭示权限 }
        timeline:
          type: array
          description: 生成 / 核算 / 提交 / 审批 / 发放 / 冲正 的时间线，用来回答「这个月为什么晚发三天」
          items:
            type: object
            properties:
              at: { type: string }
              action: { type: string, example: 核算锁定 }
              operator: { type: string }
              note: { type: string }
    BankCardReveal:
      type: object
      required: [payrollId, empName, bankCard, reason, accessLogId]
      properties:
        payrollId: { type: string }
        empName: { type: string }
        bankCard: { type: string, description: 完整卡号（仅本次返回） }
        reason: { type: string }
        operator: { type: string }
        shownAt: { type: string }
        accessLogId: { type: string }

    # ---------------- 组织与权限 ----------------
    PermRequestStatus:
      type: string
      enum: [待审批, 已通过, 已驳回, 已撤回]
      description: 撤回后单据留档；重新提交会产生新单据，不复用旧号（否则审批史会串）
    RoleSummary:
      type: object
      required: [roleId, name, scope, dataScope, userCount, permCount]
      properties:
        roleId: { type: string, example: R-PM }
        name: { type: string }
        scope: { type: string, enum: [集团, 项目] }
        dataScope:
          type: string
          enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人]
        communities:
          type: array
          description: 「指定项目」档下具体授权的项目
          items: { type: string }
        positions:
          type: array
          description: 适用的岗位（员工按岗位反推角色，见员工域）
          items: { type: string }
        userCount: { type: integer, description: 实际使用人数（按员工岗位反推，不是角色表里的数） }
        permCount: { type: integer }
        coverage: { type: number, description: 已授权 / 全部权限位，百分比取整 }
        domains:
          type: array
          items: { type: string }
        builtin: { type: boolean, description: 内置角色不可删除 }
    PermOp:
      type: object
      required: [code, opName, on]
      properties:
        code: { type: string, example: a.owners.view }
        opName: { type: string, example: 查看 }
        on: { type: boolean, description: 该角色是否已授权 }
    PermFunc:
      type: object
      required: [func, funcName, ops]
      properties:
        func: { type: string, example: owners }
        funcName: { type: string, example: 业主档案 }
        route: { type: string, example: /a/owners }
        ops:
          type: array
          items: { $ref: '#/components/schemas/PermOp' }
    PermGroup:
      type: object
      required: [domain, domainName, funcs]
      properties:
        domain: { type: string, example: a }
        domainName: { type: string, example: A 房产与业主 }
        funcs:
          type: array
          items: { $ref: '#/components/schemas/PermFunc' }
    PermMatrix:
      type: object
      required: [groups, total, granted, coverage]
      properties:
        groups:
          type: array
          description: 域 → 功能 → 操作 三层，前端拿一份就能画权限树
          items: { $ref: '#/components/schemas/PermGroup' }
        total: { type: integer, description: 权限位总数（分母） }
        granted: { type: integer }
        coverage: { type: number }
    RoleDetail:
      type: object
      required: [role, matrix]
      properties:
        role: { $ref: '#/components/schemas/RoleSummary' }
        matrix: { $ref: '#/components/schemas/PermMatrix' }
        members:
          type: array
          description: 成员样本（最多 6 个），列全部成员去员工域按 roleId 筛
          items:
            type: object
            properties:
              empId: { type: string }
              name: { type: string }
              position: { type: string }
              orgName: { type: string }
        visible:
          type: string
          description: 可见范围的文字说明（「指定项目」会列出具体项目名）
          example: 全部 3 个项目
        byDomain:
          type: array
          description: 按域统计已授权数，一眼看出这个角色主要管哪几块
          items:
            type: object
            properties:
              domainName: { type: string }
              granted: { type: integer }
              total: { type: integer }
        posture:
          type: object
          description: 治理视图：这个角色手里有哪些"一旦拿到就能自己扩权或掩盖问题"的权限
          properties:
            sensitive:
              type: array
              description: 持有的高敏权限码
              items: { type: string }
            wideScope: { type: boolean, description: 是否可跨项目查看 }
    PermRequest:
      type: object
      required: [reqId, roleId, added, status, submitBy, submitAt]
      properties:
        reqId: { type: string, example: REQ0001 }
        roleId: { type: string }
        roleName: { type: string }
        added:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        addedCount: { type: integer }
        removedCount: { type: integer }
        risks:
          type: array
          description: 新增项里命中的高敏规则（这是它需要审批的原因）
          items:
            type: object
            properties:
              code: { type: string }
              why: { type: string }
        reason: { type: string }
        submitBy: { type: string }
        submitRoleId: { type: string, description: 用来判双人原则 }
        submitAt: { type: string }
        status: { $ref: '#/components/schemas/PermRequestStatus' }
        approver: { type: string }
        approvedAt: { type: string }
        approveNote: { type: string }
        changeId: { type: string, description: 通过后落库的权限变更记录 ID }
        kind:
          type: string
          enum: [perm, scope]
          description: |
            申请类型。`perm` = 权限码变更；`scope` = 数据范围变更
            （改「全部项目」也是扩权，只是扩的是"能看多少行"而不是"能点哪个按钮"）。
        scope:
          type: object
          description: kind=scope 时的前后值
          properties:
            from: { type: string }
            to: { type: string }
            communities:
              type: array
              items: { type: string }
    PermLog:
      type: object
      required: [logId, at, roleId, action, added, removed]
      properties:
        logId: { type: string, example: PL0001 }
        at: { type: string }
        operator: { type: string }
        operatorRole: { type: string }
        roleId: { type: string }
        roleName: { type: string }
        action: { type: string, enum: [直接保存, 提交审批, 审批通过, 审批驳回] }
        added:
          type: array
          description: 记的是具体权限码，不是"改过权限"四个字
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        reason: { type: string }
        source: { type: string, description: 来源页面，便于回溯 }
    AccessLog:
      type: object
      required: [logId, at, action, result]
      properties:
        logId: { type: string }
        at: { type: string }
        operator: { type: string }
        roleName: { type: string }
        orgName: { type: string }
        scopeMode: { type: string }
        action: { type: string, enum: [查看明文, 导出数据] }
        entityType: { type: string, example: 业主 }
        entityId: { type: string }
        entityName: { type: string }
        field: { type: string, example: idCard }
        fieldLabel: { type: string, example: 证件号 }
        source: { type: string, description: 来源页面 }
        rows: { type: integer }
        result: { type: string, enum: [成功, 脱敏, 拦截] }
        memo: { type: string, description: 揭示原因 / 拦截原因 }
        hash: { type: string, description: 本条记录的哈希 }
        prevHash: { type: string, description: 上一条的哈希——任何一条被改，链上后面全对不上 }
    ExportLog:
      type: object
      required: [logId, at, name, rows, result]
      properties:
        logId: { type: string }
        at: { type: string }
        operator: { type: string }
        roleName: { type: string }
        orgName: { type: string }
        scopeMode: { type: string }
        name: { type: string, description: 导出文件名 }
        format: { type: string, example: xlsx }
        rows: { type: integer }
        result: { type: string, enum: [成功, 脱敏, 拦截] }
        memo: { type: string }
        hash: { type: string }
        prevHash: { type: string }
    AccessLogSummary:
      type: object
      required: [reveals, operators, exports, masked, blocked, rows]
      properties:
        reveals: { type: integer, description: 查看明文次数 }
        owners:
          type: integer
          description: 被查看过的不同对象数（不是次数——同一个人看 20 次同一条只算 1）
        operators: { type: integer, description: 涉及的操作人数 }
        exports: { type: integer, description: 导出次数 }
        masked: { type: integer, description: 因无权限被脱敏的次数 }
        blocked: { type: integer, description: 被拦截次数——被拦的才最值得看 }
        rows: { type: integer, description: 总记录数 }
    DataScopeStat:
      type: object
      required: [dataScope, roleCount, userCount, roles]
      properties:
        dataScope: { type: string, enum: [全部项目, 指定项目, 本项目, 本部门, 责任范围, 仅本人] }
        roleCount: { type: integer }
        userCount: { type: integer }
        roles:
          type: array
          items:
            type: object
            properties:
              roleId: { type: string }
              name: { type: string }
              userCount: { type: integer }
    PermSaveResult:
      type: object
      required: [roleId, applied, diff]
      properties:
        roleId: { type: string }
        applied: { type: boolean, description: false = 已提交审批，权限还没生效 }
        noChange: { type: boolean, description: true = 与保存前一致，没写日志 }
        diff:
          type: object
          properties:
            added:
              type: array
              items: { type: string }
            removed:
              type: array
              items: { type: string }
        log: { $ref: '#/components/schemas/PermLog' }
        request:
          oneOf:
            - { $ref: '#/components/schemas/PermRequest' }
            - { type: 'null' }
        effectiveAt:
          type: string
          description: 生效时间；未生效时为空（审批通过才有）

    # ---------------- 合同 ----------------
    ContractStatus:
      type: string
      enum: [待审批, 待生效, 履行中, 即将到期, 已到期, 已终止]
      description: |
        `即将到期` 是**派生态**（30 天内到期且仍在履行中），由跑批或查询时计算，不是人工设的。
        台账里不该出现"人工标成即将到期"这种数据——那会让续签提醒变成玄学。
    OaFieldDef:
      type: object
      description: |
        表单字段的**描述**（不是取值）。页面按它渲染控件，所以加字段不用改页面。
        `role` 是语义标记：`amount` 参与金额条件分支，`periodEnd` 要校验晚于开始时间。
      required: [key, label, type]
      properties:
        key: { type: string, example: amount }
        label: { type: string, example: 报销金额 }
        type: { type: string, enum: [text, textarea, number, money, date, datetime, select, file, items] }
        required: { type: boolean }
        derived:
          type: string
          description: 派生来源。`items` = 取明细行合计（报销金额即此类，只读）
        columns:
          type: array
          description: type=items 时的列定义
          items:
            type: object
            required: [key, label, type]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, number, money, computed] }
              required: { type: boolean }
              width: { type: integer }

        maxlength: { type: integer }
        min: { type: number }
        max: { type: number }
        unit: { type: string, example: 小时 }
        options:
          type: array
          items: { type: string }
          description: select 的候选值
        opts:
          type: string
          description: 特殊候选来源（如 community = 项目列表）
        default: {}
        hint: { type: string }
        role:
          type: string
          enum: [amount, periodEnd]
          description: amount = 参与金额分支；periodEnd = 需晚于 after 指定字段
        after: { type: string }

    OaFormDef:
      type: object
      required: [bizType, code, fields]
      properties:
        bizType: { type: string, example: 费用报销 }
        code: { type: string, example: EXP }
        icon: { type: string }
        desc: { type: string }
        urgentDefault: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/OaFieldDef' }
        summaryKeys:
          type: array
          items: { type: string }
          description: 列表/待办里摘要显示的字段（不能把 8 个字段全冲上来）

    OaFlowNode:
      type: object
      description: |
        审批节点。`assigneeType` 是**规则**不是人名 —— 写死"张经理"之后，人一调岗审批就断。
      required: [name, assigneeType]
      properties:
        key: { type: string }
        name: { type: string, example: 财务复核 }
        assigneeType:
          type: string
          enum: [orgLeader, projectManager, directSuperior, role, deptHead]
          description: |
            部门负责人 / 项目经理 / 直属上级 / 指定岗位 / 指定部门负责人。
            `role` 需同时给 `roleCode`（admin / finance / contract / legal / gm）。
        roleCode: { type: string }
        orgId: { type: string }
        signMode:
          type: string
          enum: [single, all, any]
          description: |
            签署方式。**只对 `orgLeader` 生效**：
            - `single` 单人（默认）：一个负责人签完即过；
            - `all` 会签：本部门正职 + 副职全部同意才过，任一人驳回即整单驳回；
            - `any` 或签：任一负责人同意即通过（抢办）。

            其他来源（项目经理 / 指定岗位 / 直属上级）天然只有一个对象，配了也等价于单人。
        limitHours: { type: integer, description: 时限（小时），超时在待办里标红 }
        allowReject: { type: boolean }

    OaFlowDef:
      type: object
      required: [bizType, baseNodes]
      properties:
        bizType: { type: string }
        amountThreshold:
          type: integer
          description: |
            金额阈值。`≤ 阈值`走 `baseNodes`，`> 阈值`走 `overNodes`；
            阈值为 0 表示不做金额分支。合同审批的「≥30 万三级」就在这里。
        baseNodes:
          type: array
          items: { $ref: '#/components/schemas/OaFlowNode' }
        overNodes:
          type: array
          items: { $ref: '#/components/schemas/OaFlowNode' }
        note: { type: string, description: 为什么这么配 —— 半年后没人记得 }
        inFlight: { type: integer, description: 该类型当前在途单数（改配置时要让人知道影响面） }

    OaRequest:
      type: object
      description: |
        OA 审批单。**没有业务实体**：`bizId` 为空，内容全在 `formData`。
        合同审批等业务单据也有审批单，但那些的 `bizId` 指向合同/工单，不走这个模型。
      required: [approvalId, approvalNo, bizType, status, applicant, applyTime, flow]
      properties:
        approvalId: { type: string }
        approvalNo: { type: string, example: SP-2026-0097 }
        bizType: { type: string }
        bizId: { type: string, description: OA 单据恒为空 }
        title: { type: string, description: 类型 + 摘要，如「费用报销 · 办公费 · ¥8,000」 }
        formData:
          type: object
          additionalProperties: true
          description: 表单快照（按 OaFormDef 的 key）
        files:
          type: array
          items: { type: object }
        amount: { type: number, description: 表单里 role=amount 的字段值，没有则为 0 }
        communityId: { type: string }
        communityName: { type: string }
        applicant: { type: string }
        applicantRole: { type: string }
        applicantEmpId: { type: string }
        applicantOrgId: { type: string }
        applicantOrgName: { type: string }
        applyTime: { type: string }
        status: { type: string, enum: [待审批, 审批中, 已通过, 已驳回, 已撤回] }
        currentNode: { type: string }
        urgency: { type: string }
        waitHours: { type: integer }
        flow:
          type: array
          items:
            type: object
            properties:
              node: { type: string }
              handler: { type: string, description: 解析不出来时为空，页面显示「待指派」；会签时是当前待签的那个人 }
              signMode: { type: string, enum: [single, all, any] }
              approvers:
                type: array
                description: |
                  会签 / 或签的完整名单，单人节点长度为 1。
                  **一次「同意」只签掉一个人**，全部签完节点才通过；任一人驳回即整单驳回，
                  其余人标「已跳过」而不是直接消失。
                items: { $ref: '#/components/schemas/OaApprover' }
              action: { type: string, enum: [待处理, 同意, 驳回, 转办, 撤回] }
              time: { type: string }
              comment: { type: string }
              limitHours: { type: integer }

    OaApprover:
      type: object
      description: 会签名单里的一个人。`duty` 来自组织负责人关系（正职 / 副职 / 代理）。
      required: [name, action]
      properties:
        name: { type: string }
        empId: { type: string }
        duty: { type: string, enum: ['', 正职, 副职, 代理] }
        action:
          type: string
          enum: [待处理, 同意, 驳回, 已跳过, 撤回]
          description: 已跳过 = 或签时他人已同意，或同节点已有人驳回
        time: { type: string }
        comment: { type: string }

    OaRequestEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/OaRequest' }
    OaRequestPageEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/OaRequest' }
            total: { type: integer }
            pageNo: { type: integer }
            size: { type: integer }

    ContractIncomeCategory:
      type: string
      enum: [主营业务, 多种经营, 不计入]
      description: |
        这份合同的钱算到公司收入的哪一类。**三值而不是"收入/支出"两值**，
        因为「物业服务合同」这个类型本身就横跨两种情况：

        | 取值 | 含义 | 样例 |
        |---|---|---|
        | `主营业务` | 物业费口径的主营收入，**不进多种经营** | 前期物业服务合同（住宅物业费） |
        | `多种经营` | 经营性收入，进「商业合作收入」，扣公共收益 | 广告位 / 商铺 / 公共车位 / 场地 / 快递柜租赁 |
        | `不计入` | 支出合同，只进成本不进收入 | 采购 20 / 外包 30 / 劳动 12 / 顾问服务 |

        为什么不能按 `type` 推：85 份样例里 7 份「物业服务」合同的乙方是外包供应商
        （嘉合智联机电、兴洁美服务…），实际是支出；而同类型的「前期物业服务合同」是收入。
        同类型两向，只能逐份标。

    Contract:
      type: object
      required: [contractId, contractNo, name, type, partyB, amount, status]
      properties:
        contractId: { type: string, example: CT0001 }
        contractNo: { type: string, description: 服务端生成，前端传了也忽略, example: HT-2026-0001 }
        name: { type: string }
        type:
          type: string
          description: 一级主项（6 类，决定收支方向）
          enum: [劳动合同, 物业服务协议, 运维服务, 多种经营, 租赁协议, 采购协议]
          example: 运维服务
        subtype:
          type: string
          description: 子类（21 个，由一级主项决定可选范围；服务外包走「采购协议 / 服务采购」）
          example: 电梯维保
        communityId: { type: string, description: 空 = 集团层面（不挂项目） }
        communityName: { type: string, description: 服务端带出，别让前端拿 id 猜 }
        orgId: { type: string }
        partyB: { type: string, description: 相对方（供应商 / 业主 / 员工姓名） }
        contact: { type: string }
        phone:
          type: string
          description: |
            联系电话。**列表与详情都掩码**（`175****1790`）——合同相对方是个人时就是个人信息；
            要看明文走 `a.sensitive.view` 的揭示接口，并写访问日志。
        amount:
          type: number
          description: |
            合同金额 = **期间总额**（整个合同期），不是年额。85 份样例里期间为 6 / 12 / 24 / 36 个月，
            直接计入「全年收益」会让 36 个月的合同在一年里虚高 3 倍，所以报表一律用 `annualRevenue`。
        incomeCategory:
          $ref: '#/components/schemas/ContractIncomeCategory'
        publicRevenue:
          type: number
          description: |
            公共收益金额 = 这份合同里**归全体业主**的那部分（民法典 282 条：扣除合理成本后属业主共有）。

            例：电梯广告位 3 年 30 万，合同约定物业提取 30% 管理费 → `publicRevenue = 21 万`，
            物业实得 9 万。所以「合同金额 − 公共收益 = 物业商业合作收入」这个减法方向是成立的。

            **仅 `incomeCategory=多种经营` 可填**：采购 / 外包 / 劳动是支出合同，填公共收益没有意义；
            物业服务合同是主营业务收入，也不走公共收益（那不是经营共有部位）。
        contractMonths:
          type: integer
          description: 期间月数（派生，用于年化；不要让前端自己按日期算，两端算法迟早不一样）
        annualRevenue:
          type: number
          description: |
            年化的**商业合作收入** = `(amount − publicRevenue) ÷ contractMonths × 12`。

            只读派生值。`incomeCategory ≠ 多种经营` 时恒为 0 —— 支出合同不是收入，
            这一点由字段而不是由调用方判断，避免各页面自己写 if。
        payCycle: { type: string, example: 月付 }
        signDate: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        restDays: { type: integer, description: 距到期天数；已到期为负数 }
        status: { $ref: '#/components/schemas/ContractStatus' }
        owner: { type: string, description: 合同负责人 }
        ownerEmpId: { type: string }
        attachments: { type: integer }
        refType: { type: string, enum: [house, parking, employee] }
        refId: { type: string }
        remark: { type: string }
        changePending: { type: boolean, description: 有变更在审批中——此时不能再发起变更 }
    ContractSummary:
      type: object
      required: [total, amount, running, expiring, expired, pending]
      properties:
        total: { type: integer }
        amount: { type: number, description: 合同总金额（含已到期，用于规模口径） }
        operationCount:
          type: integer
          description: 计入多种经营的合同数（`incomeCategory=多种经营`）
        operationAmount:
          type: number
          description: 这些合同的**年化商业合作收入**合计（已扣公共收益）
        publicRevenue:
          type: number
          description: 其中归业主的公共收益（年化），用于向业主公示时对账
        expenseCount:
          type: integer
          description: '`incomeCategory=不计入` 的合同数（支出类：采购 / 外包 / 劳动 / 顾问服务）'
        running: { type: integer }
        expiring: { type: integer, description: 状态为「即将到期」的合同数（派生态，由跑批刷新） }
        expired: { type: integer }
        pending: { type: integer, description: 待审批 + 待生效 }
    ContractChange:
      type: object
      required: [changeId, changeNo, contractId, changeType, before, after, status]
      properties:
        changeId: { type: string, example: CH0001 }
        changeNo: { type: string, example: BG-2026-001 }
        contractId: { type: string }
        contractName: { type: string }
        changeType: { type: string, example: 金额调整 }
        before:
          type: object
          description: 发起时的快照；事后合同再变也不影响这张单子查得到"当时改了什么"
        after: { type: object }
        reason: { type: string }
        applicant: { type: string }
        applyTime: { type: string }
        status: { type: string, enum: [待审批, 已通过, 已驳回, 已撤销] }
        approvalId: { type: string }

    ContractAttachment:
      type: object
      required: [fileId, name, size]
      properties:
        fileId: { type: string, example: CT0001-F1 }
        name: { type: string, example: 物业服务合同_2026_扫描件.pdf }
        size: { type: integer, description: 字节数 }
        mime: { type: string, example: application/pdf }
        uploadedAt: { type: string }
        uploader: { type: string }
    AttachmentDownload:
      type: object
      required: [fileId, url, expiresAt]
      properties:
        fileId: { type: string }
        url:
          type: string
          description: 临时签名链接；过期后必须重新申请，不要缓存
        expiresAt: { type: string }
        size: { type: integer }
        accessLogId: { type: string, description: 导出日志号（文件外发要查得到） }

    # ---------------- 公告 ----------------
    NoticeStatus:
      type: string
      enum: [草稿, 待审核, 已发布, 已撤回, 已过期]
      description: 单向状态机：草稿 → 待审核 → 已发布 → 已过期；已发布可撤回，撤回后要重新提交审核
    Notice:
      type: object
      required: [noticeId, title, type, status, channels]
      properties:
        noticeId: { type: string, example: NT0001 }
        title: { type: string }
        type: { type: string, example: 停水停电 }
        communityId: { type: string, description: 空 = 全部项目 }
        communityName: { type: string, description: 服务端带出，空值渲染为「全部项目」 }
        channels:
          type: array
          description: 推送渠道，至少一个——没有渠道的公告等于没发
          items: { type: string }
        channelText:
          type: string
          description: |
            渠道的展示串（`App 推送 / 公告栏 / 短信`）。服务端带出，避免每个页面各拼一遍——
            前端各拼的结果是列表用「/」、详情用「、」，看着像两个功能。
          example: App 推送 / 公告栏 / 短信
        publisher: { type: string }
        publisherEmpId: { type: string }
        publishTime: { type: string }
        status: { $ref: '#/components/schemas/NoticeStatus' }
        targetHouses: { type: integer, description: 覆盖户数 }
        readCount: { type: integer, description: 已读户数；撤回后不清零（业主确实看过） }
        readRate:
          type: number
          description: 阅读率（百分比，一位小数）。分母为 0 时为 0，不返回 null——列表要能排序
        top: { type: boolean, description: 置顶 }
        auditBy: { type: string }
        auditTime: { type: string }
        attachments: { type: integer }
        content: { type: string }
    NoticeSummary:
      type: object
      required: [total, published, pending, expired, avgReadRate]
      properties:
        total: { type: integer }
        published: { type: integer }
        pending: { type: integer, description: 待审核 + 草稿 }
        expired: { type: integer }
        avgReadRate: { type: number, description: 只统计已发布；草稿与撤回没有阅读率，混进去会把平均拉低 }
        lowRead: { type: integer, description: 阅读率低于 60% 的已发布公告数（阈值与列表同一份定义） }

    # ---------------- 月结（期间关账） ----------------
    MonthCloseStatus:
      type: string
      enum: [已结账, 已反结]
      description: |
        关账状态只有两态。**反结不是删除**：记录留着、`status` 转「已反结」，
        该期间恢复可写，报表回到试算。
    MonthCloseMethodRow:
      type: object
      description: 按收款方式的当月汇总（现金要实点，非现金对流水）
      required: [method, count, amount, refund, net]
      properties:
        method: { type: string, example: 现金 }
        count: { type: integer, description: 收款笔数 }
        amount: { type: number, description: 收款金额 }
        refundCount: { type: integer }
        refund: { type: number }
        net: { type: number, description: 净额 = 收款 − 退款 }
        mode:
          type: string
          enum: [实点, 对流水]
          description: 现金要实点（点钞数与系统数必须对上）；非现金对流水
    MonthClose:
      type: object
      required: [closeId, closeNo, period, status, count, net, operator, at]
      properties:
        closeId: { type: string, example: MC202610 }
        closeNo: { type: string, description: 结账单号；同期间第 N 次结账序号递增（-01/-02），反结重结不覆盖旧号, example: YJ-202610-01 }
        period: { type: string, example: '2026-10' }
        scope:
          type: string
          enum: [group, community]
          description: group = 全公司结账；community = 单个项目结账
        communityId: { type: string, description: scope=community 时的项目 ID；全公司为空 }
        communityName: { type: string, description: 服务端带出，省得前端拿 id 猜 }
        status: { $ref: '#/components/schemas/MonthCloseStatus' }
        count: { type: integer, description: 当月收款笔数 }
        income: { type: number }
        refund: { type: number }
        net: { type: number, description: 净额 = 收款 − 退款 }
        receivable: { type: number, description: 当月账期应收 }
        received: { type: number, description: 当月账期已收 }
        debt: { type: number, description: 当月账期欠费（结账不清零，但要能解释） }
        uninvoiced: { type: integer, description: 未开票笔数 }
        debtBills: { type: integer, description: 有欠费的账单数 }
        memo:
          type: string
          description: 处理说明。有未开票或欠费时必填——写「留到下月催」还是「已确认坏账」，决定后续怎么跟
        operator: { type: string }
        at: { type: string, example: '2026-11-02 09:30' }
        locked: { type: boolean, description: 锁账后该期间只读 }
        reopenedAt: { type: string, description: 反结时间；未反结为空 }
        reopenReason: { type: string }
        reopenCount: { type: integer, description: 被反结次数。反复反结本身就是要被看见的信号 }
        reversalNo:
          type: string
          description: |
            反结的红冲凭证号（如 `HC-202609-01`）。**反结不进退款流水**——
            反结不是退款，混进退款表会让「退款金额」统计失真；凭证挂在月结记录上，对账时以它为准
    MonthClosePreview:
      type: object
      description: |
        结账前一屏看全。**预览与提交必须同源**（同一段计算），否则会出现
        「预览 1002 笔、结完记录写 998 笔」这种说不清的差。
      required: [period, closable, count, income, net, receivable, received, debt]
      properties:
        period: { type: string, example: '2026-10' }
        scope: { type: string, enum: [group, community] }
        communityId: { type: string }
        communityName: { type: string }
        unclosedCommunities:
          type: array
          description: |
            全公司口径下"有业务但还没结"的项目；项目级预览为空数组。
            前端据此提示"先去把这几个项目结了"，不要自己再算一遍。
          items:
            type: object
            properties:
              communityId: { type: string }
              name: { type: string }
        closable:
          type: boolean
          description: 能不能结（未来期间 / 已结账都是 false）。前端直接用这个控制按钮，不要自己再判一遍
        rows:
          type: array
          items: { $ref: '#/components/schemas/MonthCloseMethodRow' }
        count: { type: integer }
        income: { type: number }
        refund: { type: number }
        net: { type: number }
        receivable: { type: number }
        received: { type: number }
        debt: { type: number }
        uninvoiced: { type: integer }
        debtBills: { type: integer }
        prevPeriod: { type: string, description: 上一个月（用于环比）, example: '2026-09' }
        prevNet:
          type: [number, 'null']
          description: 上月净额。上月没结账就是 null——**不要给 0**，0 会被读成"上月净额为 0"
        closed:
          allOf:
            - $ref: '#/components/schemas/MonthClose'
          description: 该期间已有的结账记录（未结账时不返回）

    # ---------------- 报表快照 ----------------
    ReportCode:
      type: string
      enum: [arrears, collection-rate, dept-target]
      description: |
        `arrears` 欠费账龄 / `collection-rate` 收缴率 / `dept-target` 部门达标率。
        用英文短代码做路由与批次号，业务名称由前端字典渲染——中文名改一次要动数据类型，不值。
    ReportBatchStatus:
      type: string
      enum: [成功, 运行中, 失败]
      description: 失败批次保留（能查失败原因），但不参与「最新成功批次」的选取
    AgingBucket:
      type: string
      enum: [未到期, 0-30天, 31-90天, 91-180天, 180天以上]
    ReportPeriodType:
      type: string
      enum: [日, 月, 年]
      description: 期次粒度。日=按天快照；月/年=整期快照（时点型则是期末那一天）
    ReportCompare:
      type: object
      description: 环比 / 同比（只对期间型有值；时点型与日粒度返回 null）
      properties:
        prevPeriod: { type: string, example: '2026-09' }
        prevValue: { type: [number, 'null'], description: 上一期的主指标（收缴率 / 平均达标率） }
        yoyPeriod: { type: string, example: '2025-10' }
        yoyValue: { type: [number, 'null'], description: 去年同期；没有同比意义时为空 }
    ReportMeta:
      type: object
      required: [reportCode, statDate, periodType, period, batchNo, calcAt, formulaVersion, rowCount]
      description: |
        每次响应都带 `meta`：这一份数字是**哪个批次、什么时候算的、按哪版公式**。
        没有 meta 的报表接口不算交付——出了数说不清来源，等于没数。
      properties:
        reportCode: { $ref: '#/components/schemas/ReportCode' }
        reportName: { type: string, example: 欠费账龄报表 }
        statDate:
          type: string
          format: date
          description: 数据时点。未结账的期次这里落在今天，而不是期末——页头要显示「试算 · 截至 X 日」
          example: '2026-10-21'
        periodType: { $ref: '#/components/schemas/ReportPeriodType' }
        period:
          type: string
          description: 期次值（日=YYYY-MM-DD / 月=YYYY-MM / 年=YYYY）
          example: '2026-10'
        provisional:
          type: boolean
          description: 试算值（该期未月结）。为 true 时页面必须打标，否则下个月数字变了会被当成 bug
        voided:
          type: boolean
          description: 该批次已被反结作废。**作废不删除**——审计要能查到「当时出过什么数」，只是不再作为最新批次
        compare: { $ref: '#/components/schemas/ReportCompare' }
        periodValue:
          type: [number, 'null']
          description: |
            本期主指标（收缴率 / 平均达标率 / 欠费余额），环比同比比的就是这一个数。
            **失败批次为 null**——它没有数，给 0 会被读成"这一期收缴率为 0"。
          example: 91.27
        batchNo:
          type: string
          description: 日 RPT-20261021-01 / 月 RPT-202610-M01 / 年 RPT-2026-Y01
          example: RPT-20261021-01
        calcAt: { type: string, description: 批次生成时间, example: '2026-10-21 02:12' }
        dataCutoff: { type: string, description: 数据截止时间, example: '2026-10-21 23:59' }
        durationMs: { type: integer, description: 跑批耗时（毫秒） }
        formulaVersion: { type: string, description: 口径版本；口径改了必须升版本，否则历史批次无法复现, example: v1.0 }
        rowCount: { type: integer }
        partial:
          type: boolean
          description: 部分成功（个别项目跑批失败）。为 true 时前端必须在页头提示，不能当全量
        stale:
          type: boolean
          description: 快照落后最新成功批次超过 1 天
    ReportSnapshot:
      allOf:
        - $ref: '#/components/schemas/ReportMeta'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/ReportBatchStatus' }
            message: { type: string, description: 失败原因 / 备注 }
    ArrearsRow:
      type: object
      required: [communityId, buildingId, aging, billCount, houseCount, payable, unpaid]
      properties:
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        buildingId: { type: string, example: B0101 }
        buildingName: { type: string, example: 1栋 }
        aging: { $ref: '#/components/schemas/AgingBucket' }
        billCount: { type: integer, description: 欠费账单数 }
        houseCount: { type: integer, description: 涉及房屋数 }
        ownerCount: { type: integer, description: 涉及业主数 }
        payable: { type: number, description: 涉及应收 }
        unpaid: { type: number, description: 欠费金额（= 应收 − 已收） }
        avgOverdueDays: { type: number, description: 平均逾期天数（未到期行固定 0） }
        topItem: { type: string, description: 该档里金额最大的科目, example: 物业服务费 }
    ArrearsSummary:
      type: object
      required: [billCount, payable, unpaid]
      description: |
        合计行**只做行级加总**，不提供 `houseCount`：房屋在「楼栋 × 账龄」粒度上会重复计数
        （同一套房可能既有未到期又有逾期），给一个错数比不给更糟。
      properties:
        billCount: { type: integer }
        payable: { type: number }
        unpaid: { type: number }
        overdueUnpaid: { type: number, description: 其中已逾期部分的欠费（不含未到期） }
    CollectionRateRow:
      type: object
      required: [communityId, period, itemId, payable, paid, rate]
      properties:
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        period: { type: string, example: '2026-10' }
        itemId: { type: string, example: FI01 }
        itemName: { type: string, example: 物业服务费 }
        billCount: { type: integer }
        payable: { type: number, description: 应收（已剔除作废与减免） }
        paid: { type: number }
        unpaid: { type: number }
        reduction: { type: number, description: 本期减免金额（不计入分母，但要露面） }
        voided: { type: number, description: 本期作废金额 }
        rate:
          type: [number, 'null']
          description: 收缴率百分比（两位小数）；应收为 0 时为 null，不要回 0
          example: 91.27
    CollectionRateSummary:
      type: object
      required: [payable, paid, rate]
      properties:
        payable: { type: number }
        paid: { type: number }
        unpaid: { type: number }
        reduction: { type: number }
        rate: { type: [number, 'null'], description: 合计口径的收缴率 }
    DeptTargetRow:
      type: object
      required: [orgId, deptName, post, period, planned, finished, doneRate, passRate, weighted, score, grade]
      properties:
        orgId: { type: string, example: O-P01-T2 }
        deptName: { type: string, example: 工程班 }
        post: { $ref: '#/components/schemas/InspectPost' }
        communityId: { type: string, example: P01 }
        communityName: { type: string, example: 翡翠城 }
        period: { type: string, example: '2026-10' }
        planned: { type: integer, description: 执行任务总数（不含监督任务） }
        finished: { type: integer }
        doneRate: { type: number, description: 完成率百分比（两位小数） }
        itemTotal: { type: integer, description: 检查项总数（仅已完成任务） }
        itemOk: { type: integer }
        passRate: { type: number, description: 合格率百分比（两位小数） }
        weightPass: { type: number, description: 合格率权重, example: 0.8 }
        weightDone: { type: number, description: 完成率权重, example: 0.2 }
        weighted: { type: number, description: 加权达标率百分比（两位小数） }
        selfIssues: { type: integer, description: 自查发现问题（监督任务查出） }
        crossIssues: { type: integer, description: 抽查发现问题（品质抽查） }
        score: { type: number, description: 得分（一位小数） }
        grade: { $ref: '#/components/schemas/QualityGrade' }
        evaluated: { type: boolean, description: 本期是否已生成任务评价记录 }
