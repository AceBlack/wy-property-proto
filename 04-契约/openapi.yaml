  # -------------------------------------------------------------- payments
  /payments:
    get:
      tags: [payments]
      operationId: queryPayments
      summary: 缴费流水（分页）
      description: 按收款时间倒序。`startDate` / `endDate` 为闭区间。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PayMethodLegacy' }
        - name: channel
          in: query
          schema: { type: string }
        - name: invoiceStatus
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: subjectType
          in: query
          description: 承载对象（房屋 / 车位）；车位费没有 houseId，需要单列
          schema: { type: string, enum: [house, park] }
        - name: vf
          in: query
          description: 快捷视图（与左侧虚拟节点同源，服务端算，前端不自己 filter）
          schema: { type: string, enum: ['', parkonly, cash, uninvoiced, red, deposit] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payments/{payId}:
    get:
      tags: [payments]
      operationId: getPayment
      summary: 流水详情（含对应账单与退款记录）
      parameters:
        - $ref: '#/components/parameters/payId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDetailEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/batch:
    post:
      tags: [payments]
      operationId: payBills
      summary: 收银台收款（含组合支付）
      description: |
        **一个事务两件事**：写流水（每条账单一条，带 `splits`）→ 账单销账。
        后端别拆开做 —— 拆开就会出现「销了账但日结查不到这笔钱」。

        > 2026-11 起**物业预存账户整体下线**（业主端取消充值、PC 收银台去掉「预存抵扣」），
        > 这一笔事务里不再有「扣预存余额 / 记预存流水」。历史流水照常可查，
        > 读接口用 `PayMethodLegacy`，写接口只认 `PayMethod`。

        规则：
        - 一次收款只能针对**同一位业主**，不同业主请分开收；
        - 最多 **3 种**收款方式，同一种方式只能一行；
        - 各方式金额合计必须等于 `应缴 − 减免`，差一分都返回 422/42212；
        - 账单已不是欠费状态返回 409/40926；
        - 收款方式只接受 现金 / 微信支付 / 支付宝 / POS刷卡 / 银行代扣（`预存抵扣` 已下线，传了 422/42212）；
        - 减免按各账单应缴比例分摊，记在账单的 `discount` 上（不并进 `paidAmount`，
          否则「减免了多少」事后查不出来）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentBatchInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      batchNo: { type: string, example: SK20261021-001 }
                      count: { type: integer, description: 写了几条流水（= 几张账单） }
                      payable: { type: number, description: 应缴合计 }
                      discount: { type: number }
                      received: { type: number, description: 实收合计 }
                      splits:
                        type: array
                        items:
                          type: object
                          properties:
                            method: { $ref: '#/components/schemas/PayMethodLegacy' }
                            amount: { type: number }
                      payments:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 账单已不是欠费 / 预存账户异常 }
        '422': { $ref: '#/components/responses/Unprocessable', description: 金额不闭合 / 方式超限 / 余额不足 }

  /payments/{payId}/tickets:
    post:
      tags: [payments, invoices]
      operationId: issuePaymentTickets
      summary: 开票 / 开收据（收据与发票是两个独立状态）
      description: |
        **一次可以两种都开**：`types: ['收据', '电子发票']`。
        分两次调用会出现"收据开成功、发票失败"的半截状态，而用户只看到一句"开票失败"。

        两个状态各自独立判重：已经开过收据的流水，发票仍然可以开；
        同一种票据重复开返回 409（全部跳过时）。

        项目名取**这一笔的实际科目**（`itemName` 入参 > 账单科目 > 临时收费科目 > 物业服务费），
        不写死「物业服务费」—— 临时收费开出来写"物业服务费"是错的，水费写也是错的。

        **收据税额恒 0**：它不是增值税扣税凭证。
      parameters:
        - name: payId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  items: { type: string, enum: [收据, 电子发票, 增值税普通发票] }
                buyerTitle:
                  type: string
                  description: |
                    购买方抬头。**三档回落：手填 > 档案 > 房主**。
                    外来缴费人（临时收费）没有档案也没有房主，只能手填 ——
                    这一档不做，摆摊费永远开不出票。
                buyerTaxNo: { type: string }
                itemName: { type: string, description: 不传则取这一笔的实际科目 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
                      skipped:
                        type: array
                        description: 已经开过的票据类型
                        items: { type: string }
                      count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict', description: 所选票据都已开具过（40926） }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /payments/{payId}/refund:
    post:
      tags: [payments]
      operationId: refundPayment
      summary: 退款 / 冲红
      description: |
        **一次事务里做三件事**（只做第一件就是错的）：

        1. 写退款单，流水累计 `refundAmount`，状态转「部分退款 / 已全额退款」；
        2. **冲回账单**：`paidAmount` 减、`unpaid` 加、状态重算（已缴 → 部分缴 / 未缴）；
           不冲回账单，欠费报表会少一笔，且账单永远显示已缴；
        3. 已开票的流水把 `invoiceStatus` 转「已冲红」，财务据此红冲。

        约束：`amount` 为空 = 全额退；`amount > 可退金额` → 422；重复全额退 → 422；`reason` ≥ 4 字。

        **期间已月结的流水不能直接退** → 409 / 40903。退款会改上月已封存的收款与欠费，
        必须走「反结 → 退款 → 重结」，否则月结报表与明细对不上，且没人说得清是哪一步错的。
      parameters:
        - $ref: '#/components/parameters/payId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: number, description: 不传 = 全额退款 }
                reason: { type: string, minLength: 4 }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ----------------------------------------------------------- work-orders
  # --------------------------------------------------------------- service-items
  /service-items:
    get:
      tags: [service-items]
      operationId: queryServiceItems
      summary: 商业服务项目列表（价目字典）
      description: |
        商业服务的项目目录，也是**工单收费的唯一价源**：业主端下单页、员工端现场增项、
        提成核算、后台工单计费四处共用同一份。

        口径：`price = material + labor`（服务价格）、`cost = materialCost + laborCost`（成本价，
        材料按成本价过账 + 工时折算）。两个合计**由服务端算**，请求里传了也忽略 ——
        否则迟早出现「列表 125 / 详情 124.99」。

        默认只回在售（`enabled` 不传时按 true 过滤），维护页要显式传 `enabled=all`。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - name: category
          in: query
          schema: { type: string }
          description: 项目分类名（水管漏水 / 下水道堵塞 / …）
        - name: enabled
          in: query
          schema: { type: string, enum: [true, false, all] }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceItemPageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [service-items]
      operationId: createServiceItem
      summary: 新增服务项目
      description: 编号由服务端生成（SI 前缀）；`price/cost` 不接受入参，按分解项计算。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceItemInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /service-items/summary:
    get:
      tags: [service-items]
      operationId: serviceItemSummary
      summary: 维护页 KPI（与列表同源）
      description: 项目数 / 在售 / 停用 / 已产生工单 / 商业服务收入 / 成本 / 毛利。收入只算已完工且已结清的单。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ServiceItemSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /service-items/{code}:
    get:
      tags: [service-items]
      operationId: getServiceItem
      summary: 服务项目详情（含引用单数与改价留痕）
      parameters:
        - $ref: '#/components/parameters/serviceItemCode'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [service-items]
      operationId: updateServiceItem
      summary: 修改服务项目（改价留痕，不回溯已完工工单）
      description: |
        `code` 不可改（业主端 / 员工端按它索引）。价格四项任一变化都会写一条「改价」留痕，
        并**只影响新单**：已完工工单按当时的快照结算。
      parameters:
        - $ref: '#/components/parameters/serviceItemCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceItemInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /service-items/{code}/toggle:
    post:
      tags: [service-items]
      operationId: toggleServiceItem
      summary: 启用 / 停用服务项目
      description: |
        停用**不删除**：历史工单还引着它，删了「这条单当时收的是什么」就查不到了。
        有在途工单（未完工）时不给停用（409/40924），否则那几张单的价格来源就断了。
      parameters:
        - $ref: '#/components/parameters/serviceItemCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                operator: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # --------------------------------------------------------------- OA 审批
  /oa/forms:
    get:
      tags: [oa]
      operationId: listOaForms
      summary: OA 单据类型与表单字段定义
      description: |
        六类单据（用车 / 费用报销 / 请假 / 加班 / 用印 / 采购）的**字段描述**。
        页面按这份描述渲染表单，不给每种单据写一个页面 —— 加第七种只加一条定义。

        字段类型：`text / textarea / number / money / date / datetime / select / file / items`。
        `role: amount` 的字段参与金额条件分支（决定走基础流程还是超额流程）。
        `items` 是**明细表**（2026-11-13）：按 `columns` 逐行填写，总价 = 单价 × 本次采购数量；
        带 `derived: items` 的金额字段由明细合计派生，客户端不传值（传了也会被重算）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OaFormDef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile/approvals:
    get:
      tags: [mobile]
      operationId: mobileApprovalList
      summary: 员工端审批列表（待我处理 / 我发起 / 我办过）
      description: |
        不能用 `/oa/requests` 代替：那是**「我的申请」**视角，而员工端第一个页签是
        「待我处理」，要按**节点审批人**判，跟申请人无关。

        判定规则（与 `05/src/api/oa.js` 的 `canHandle` 必须一致，否则会出现
        "页面说待你审批、点进去服务端说不是你"）：

        1. 节点名 → 组织 → 负责人关系表的**在期正职**；正职空缺落**代理**；**副职不参与单签**
        2. 会签看名单里有没有我
        3. 不能审自己提交的单
        4. 只看本项目
      x-permission: f.approval.handle
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [todo, applied, done], default: todo }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileApprovalListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /mobile/approvals/{approvalId}:
    get:
      tags: [mobile]
      operationId: mobileApprovalDetail
      summary: 员工端审批详情（当前节点 / 会签进度 / 时间线）
      description: |
        `target` 是「这一单该谁办」的结论，页面据此决定底部按钮显示什么：

        - `kind=leader` 单人节点，看 `signer`（关系表解出的在期正职或代理）
        - `kind=sign` 会签节点，看 `approvers` 与 `progress`
        - `kind=unsupported` 移动端不办（如合同初审），`why` 直接显示给用户
        - `kind=done` 已结束

        `canHandle` 是服务端对**当前登录人**的判定，页面不要自己再算一遍。
      x-permission: f.approval.handle
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileApprovalDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /oa/requests:
    get:
      tags: [oa]
      operationId: queryOaRequests
      summary: 我的申请（OA 单据）
      description: |
        只回 OA 单据（bizId 为空、内容存在 formData），不含合同审批等业务单据 ——
        那些有各自的业务列表页。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - name: status
          in: query
          schema: { type: string, enum: [待审批, 审批中, 已通过, 已驳回, 已撤回] }
        - name: bizType
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/kw'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OaRequestPageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [oa]
      operationId: createOaRequest
      summary: 发起 OA 申请
      description: |
        一次完成两件事：校验表单 + 生成审批单。OA 单据没有业务实体，
        `bizId` 留空、内容存 `formData` —— 所以"发起"就是"建一张审批单"，没有第二步。

        审批节点按 `bizType` 的流程配置生成，审批人按**规则**解析（部门负责人 / 直属上级 / 指定岗位），
        解析不出来的节点 `handler` 为空，由审批页显示"待指派"。

        **本期批准即结束**：通过后不生成付款单、不写考勤、不建采购单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bizType, formData]
              properties:
                bizType: { type: string, example: 费用报销 }
                formData:
                  type: object
                  additionalProperties: true
                  description: 按表单定义提交的键值对
                urgency: { type: string, enum: [普通, 紧急, 重要] }
                files:
                  type: array
                  items: { type: object }
                  description: 只登记元数据（文件名/大小/类型），原型不存文件本体
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OaRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /oa/requests/{approvalId}/action:
    post:
      tags: [oa]
      operationId: oaApprovalAction
      summary: 审批动作（同意 / 驳回）
      description: |
        会签节点**一次「同意」只签掉一个人**：名单里还有人待签时，单据仍停在当前节点，
        `currentNode` 变成「节点名（会签 1/2）」；全部签完才推进下一级。

        - 任一人驳回 → 整单驳回，其余人标 `已跳过`（不是直接删掉 —— 要能看见"谁没签上"）；
        - 或签（`signMode=any`）：任一人同意即通过，其余人标 `已跳过`；
        - 单人节点（没有 `approvers`）：行为与以前一致，签完即推进。

        实现提醒：服务端必须按**登录人**匹配名单里的那一份，不能一律签第一个人。
        本假服务在身份对不上时按第一份代签并在意见里注明「代 XXX 处理」，
        这是为了原型演示能走通，真实系统应该拒绝并提示"你不是本节点审批人"。
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, example: AP00097 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [同意, 驳回] }
                comment: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 成功（返回处理后的审批单）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OaRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 单据已结束（40928）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /oa/requests/{approvalId}/withdraw:
    post:
      tags: [oa]
      operationId: withdrawOaRequest
      summary: 撤回申请
      description: |
        **只有「待审批」（还没人处理）能撤回**。一旦有人受理（审批中）就撤不回 ——
        要作废只能让审批人驳回，否则"批到一半申请人抽单"会让流程与数据都失真。
      parameters:
        - $ref: '#/components/parameters/approvalId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OaRequestEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /oa/flows:
    get:
      tags: [oa]
      operationId: listOaFlows
      summary: 审批流配置（7 种：6 类 OA + 合同审批）
      description: |
        每种单据的节点列表 + 金额阈值。合同审批也在这里 ——
        它的「≥30 万三级」以前硬编码在代码里，收进配置后可以改。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OaFlowDef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /oa/flows/{bizType}:
    put:
      tags: [oa]
      operationId: updateOaFlow
      summary: 修改审批流配置
      description: |
        **只影响新提交的单**：在途单的 `flow` 是发起时的快照，回头改配置会让
        "批到一半换规则"，说不清谁批的算数。

        `overNodes` 非空但阈值为 0 时直接拦（422/42212）—— 那套节点永远走不到，
        配了等于没配，不如报错。
      parameters:
        - name: bizType
          in: path
          required: true
          schema: { type: string, example: 费用报销 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseNodes:
                  type: array
                  items: { $ref: '#/components/schemas/OaFlowNode' }
                overNodes:
                  type: array
                  items: { $ref: '#/components/schemas/OaFlowNode' }
                amountThreshold: { type: integer, minimum: 0 }
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/OaFlowDef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ------------------------------------------------------------ org-leaders
  /orgs/{orgId}/leaders:
    get:
      tags: [orgs]
      operationId: listOrgLeaders
      summary: 某组织的负责人列表
      description: |
        一个部门可以有多个负责人：**正职唯一、副职可多个、代理必须带结束日期**。
        返回**全部**关系（含已结束 / 未生效，`state` 字段区分），历史要能看见 ——
        删掉的话，"这个部门去年谁负责"就永远查不到了。

        `active` 与 `state` 由服务端按当天算，不落库：落库会出现"到期了但没人改"。
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string, example: O-P01-T3 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrgLeader' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [orgs]
      operationId: saveOrgLeaders
      summary: 整组替换某组织的负责人
      description: |
        用整组替换而不是逐条增删：编辑弹窗是一次保存的，逐条提交会出现
        "删了旧的、新的没加上"的中间态。

        三条校验：
        - **正职唯一**（409/40927）：一个部门两个在期正职，不知道谁签字；
        - **代理必须填结束日期**（422/42213）：没有到期的代理等于第二个正职；
        - **离职员工不能设为负责人**（422/42213）：关系还在但审批会落到查无此人。

        保存成功后服务端回写 `orgs.leader` 展示快照 —— 组织树、被检班组读的是它，
        不回写就会出现"审批走代理、页面显示离任正职"的两套人名。
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaders]
              properties:
                leaders:
                  type: array
                  items: { $ref: '#/components/schemas/OrgLeaderInput' }
      responses:
        '200':
          description: 成功（返回替换后的完整列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrgLeader' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同一部门多个在期正职（40927）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /employees/leader-options:
    get:
      tags: [employees]
      operationId: orgLeaderOptions
      summary: 负责人候选（在职员工全量）
      description: |
        不按「主管及以上」过滤：班组负责人可能就是资深师傅，按岗位卡会把人挡在外面。
        真正的约束是「一个部门只能有一个正职」，不是「谁能当负责人」。

        路径放在员工域而不是 `/orgs/leader-options` —— 后者会被 `/orgs/{orgId}`
        先匹配掉，orgId 收到字符串 `leader-options`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        empId: { type: string }
                        name: { type: string }
                        position: { type: string }
                        orgId: { type: string }
                        orgName: { type: string }
                        status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ---------------------------------------------------------- plan-templates
  /plan-templates:
    get:
      tags: [plan-templates]
      operationId: queryPlanTpls
      summary: 计划模板列表
      description: |
        考核项的唯一源：项目经理 + 四个班组 + 职能兜底。

        **模板里没有权重**（2026-11-05 第 60 批）：模板只定「考什么、怎么算分」，
        「每项占多少」由提报人在新建计划时逐项填，运营管理部审核时可调。

        返回里带派生字段 `qCount / mCount / kCount` 与 `checkOk`（内容是否完整），
        不要前端再算一遍。
      parameters:
        - name: kw
          in: query
          schema: { type: string }
          description: 搜模板名 / 考核项名称
        - name: onlyEnabled
          in: query
          schema: { type: boolean, default: false }
          description: 只返回启用中的（提报表单选模板时用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateListEnvelope' }
    post:
      tags: [plan-templates]
      operationId: createPlanTpl
      summary: 新增模板
      description: |
        校验不通过**整单拒绝**（422/42214），不做部分保存 ——
        一份缺了量化段或重点段的模板落库之后，用它提报出来的计划没有可评分的内容，而且是隐性的。

        校验只看内容：名称、适用类型、适用班组、量化段与重点段至少各一条、条目名称非空且不超过 40 字。
        **不校验权重** —— 模板里没有权重。

        同一类部门只能有一个模板（项目 / T1 / T2 / T3 / T4 / 职能），重复了返回 409/40929。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanTemplateInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateEnvelope' }
        '409':
          description: 同一类已有模板
        '422':
          description: 字段校验不通过（内容不完整）

  /plan-templates/match:
    get:
      tags: [plan-templates]
      operationId: matchPlanTpl
      summary: 按组织自动匹配模板
      description: |
        项目部 → 项目经理模板；班组按 `-T1~-T4` 对应客服 / 工程 / 秩序 / 环境；
        总部部门落到「职能通用」兜底。匹配不到返回空值，页面提示去配，
        **不要静默给一个空模板**（那会提报出一张没有考核项的计划）。

        运营管理部可以在提报页改选模板，所以这是「默认值」不是「锁定值」。
      parameters:
        - name: orgId
          in: query
          required: true
          schema: { type: string, example: O-P01-T1 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateEnvelope' }

  /plan-templates/stats:
    get:
      tags: [plan-templates]
      operationId: planTplStats
      summary: 模板汇总
      description: 列表页 KPI：模板数、考核项总数、**校验不通过的模板数**（`broken`）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlanTemplateStats' }

  /plan-templates/{tplId}:
    get:
      tags: [plan-templates]
      operationId: getPlanTpl
      summary: 模板详情（含全部条目）
      parameters:
        - name: tplId
          in: path
          required: true
          schema: { type: string, example: PT01 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateEnvelope' }
        '404':
          description: 模板不存在
    patch:
      tags: [plan-templates]
      operationId: updatePlanTpl
      summary: 修改模板
      description: |
        整单提交：`items` 传全量（增删改都在里面），不做增量合并。
        保存成功后 `version` 自增 —— 计划提报时记下版本号，
        半年后能说清「当时用的是哪一版考核标准」。

        模板里**没有权重字段**：权重在计划上，由提报人填、审核阶段可调。

        **不影响已经提报的计划**：提报时整份拷贝成快照。
      parameters:
        - name: tplId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanTemplateInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateEnvelope' }
        '422':
          description: 字段校验不通过（内容不完整）

  /plan-templates/{tplId}/enabled:
    patch:
      tags: [plan-templates]
      operationId: togglePlanTpl
      summary: 启用 / 停用模板
      description: |
        停用**不删除**：历史计划还引着它，删了追溯就断。
        停用后新建计划不会再匹配到它，已提报的不受影响。
      parameters:
        - name: tplId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTemplateEnvelope' }

  # ------------------------------------------------------------- assets（办公资产）
  /asset-categories/tree:
    get:
      tags: [assets]
      operationId: assetCategoryTree
      summary: 资产分类树（两级，节点带「本级 / 含下级」资产数）
      description: |
        **与 D 域「设备台账」不是一回事**：那边管门禁 / 摄像头这类 IoT 设备（看「在不在线」），
        这里管电脑 / 桌椅 / 工具这类可被个人领用的办公物品（看「值多少、在哪个部门」）。
        分类最多两级；停用的分类也返回（`enabled: false`），历史资产还挂在上面。
      responses:
        '200':
          description: 成功（数组，不是信封）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetCategoryNode' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /asset-categories:
    get:
      tags: [assets]
      operationId: listAssetCategories
      summary: 分类扁平列表（含 path / depth / 资产数）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetCategory' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [assets]
      operationId: createAssetCategory
      summary: 新建分类
      description: |
        三条硬规则（都是 422）：
        ① 最多两级 —— 三级分类在录入时选不出来；
        ② 同级不能重名 —— 同一层两个「电脑」，录入时选哪个都是错；
        ③ 改上级不能挂到自己的子孙下（成环）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCategoryInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AssetCategory' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /asset-categories/options:
    get:
      tags: [assets]
      operationId: assetCategoryOptions
      summary: 分类下拉选项（带缩进，停用的禁用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string, example: AC0002 }
                        label: { type: string, example: '　电脑' }
                        depth: { type: integer, example: 1 }
                        disabled: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /asset-categories/{catId}:
    get:
      tags: [assets]
      operationId: getAssetCategory
      summary: 分类详情
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: string, example: AC0002 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AssetCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [assets]
      operationId: updateAssetCategory
      summary: 修改分类（改名 / 改上级 / 排序）
      description: |
        **改名不回写资产**：资产上存的是 `catName` / `catPath` 快照，
        所以「电脑」改叫「笔记本电脑」之后，历史资产仍显示当时的名字。
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: string, example: AC0002 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCategoryInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AssetCategory' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-categories/{catId}/toggle:
    post:
      tags: [assets]
      operationId: toggleAssetCategory
      summary: 启用 / 停用分类
      description: 停用后**不能再往里新增资产**，已有资产保留 —— 停用不删，历史还要能读。
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: string, example: AC0002 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AssetCategory' }
        '404': { $ref: '#/components/responses/NotFound' }

  /asset-categories/{catId}/remove:
    post:
      tags: [assets]
      operationId: removeAssetCategory
      summary: 删除分类（有子分类或有资产 → 409）
      description: |
        用 POST 而不是 DELETE：DELETE 没有请求体，「为什么删」这个理由无处可放。
        有子分类或有资产时返回 **409 / 40927**，并说清是几件资产 —— 删掉等于让已有资产指向空分类。
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: string, example: AC0002 }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      catId: { type: string }
                      removed: { type: boolean }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: 资产列表（按分类含下级 / 状态 / 部门 / 关键字筛选）
      parameters:
        - name: catId
          in: query
          schema: { type: string }
          description: 选一级分类时**包含其全部下级**
        - name: status
          in: query
          schema: { type: string, enum: [闲置, 在用, 报废] }
        - name: orgId
          in: query
          schema: { type: string }
        - name: kw
          in: query
          schema: { type: string }
          description: 匹配名称 / 编号 / 编码 / 序列号 / 品牌 / 型号 / 使用人 / 位置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }
                      total: { type: integer }
                      pageNo: { type: integer }
                      size: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [assets]
      operationId: createAsset
      summary: 新增资产（编号与 token 由服务端生成）
      description: |
        `assetNo` 形如 `ZC20260001`：**服务端生成、按当年流水递增、永不可改**。
        原因很直接——标签已经贴在实物上，改号等于让报修记录和纸质标签全部对不上。

        `qrToken` 是 16 位随机串，与编号无关：编号能顺序推，token 不能，
        否则改一个字符就能枚举出全公司的资产。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '200':
          description: 成功（返回带 assetNo / qrToken 的完整资产）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Asset' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assets/summary:
    get:
      tags: [assets]
      operationId: assetSummary
      summary: 资产 KPI（总数 / 购置总值 / 状态分布 / 保修临期）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      totalValue: { type: number, description: 按录入原值合计，**不含折旧**（本期不做净值） }
                      idle: { type: integer }
                      inUse: { type: integer }
                      scrapped: { type: integer }
                      warrantySoon: { type: integer, description: 30 天内到期 }
                      warrantyExpired: { type: integer }
                      catCount: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assets/by-category:
    get:
      tags: [assets]
      operationId: assetByCategory
      summary: 按最末级分类汇总（件数 + 原值）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        catId: { type: string }
                        name: { type: string }
                        catPath: { type: string }
                        count: { type: integer }
                        value: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assets/labels:
    post:
      tags: [assets]
      operationId: assetLabels
      summary: 批量打印标签的数据（含扫码链接）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetIds]
              properties:
                assetIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        assetId: { type: string }
                        assetNo: { type: string }
                        name: { type: string }
                        catName: { type: string }
                        qrToken: { type: string }
                        scanUrl: { type: string, example: '/scan/Kyz67CdiKyreXUvS' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assets/{assetId}:
    get:
      tags: [assets]
      operationId: getAsset
      summary: 资产详情（含变更记录）
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, example: AS0001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Asset' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [assets]
      operationId: updateAsset
      summary: 修改资产（逐字段写变更记录）
      description: |
        **`assetNo` 不可改**（422）：标签已贴在实物上。
        `status` 是**描述性字段**，本期没有领用 / 归还单据，改它只是改描述，不代表流程推进。
        改动会逐字段写进变更记录（`logs`）—— 没有领用单，这一层就是唯一的「谁在什么时候改了什么」。
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, example: AS0001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetInput'
                - type: object
                  properties:
                    ver:
                      type: integer
                      description: 乐观锁版本号（详情里的 `_ver`）；不一致 → 409 / 40901
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Asset' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- 扫码公开接口（免登录）
  /public/assets/{token}:
    get:
      tags: [public]
      operationId: publicAssetView
      security: []
      summary: 扫码查看资产（**免登录**，只回白名单字段）
      description: |
        这个接口**不校验登录态**：扫码的人可能是访客、供应商，或者手机上根本没装这个系统。
        要求登录等于把这个功能做废。

        边界不靠登录，靠**字段白名单**：

        | 返回 | 不返回 |
        |---|---|
        | 名称、编号、分类、状态、**使用部门**、存放位置、保修到期 | 使用人姓名、购置原值、供应商、发票、序列号、备注、变更记录 |

        判断依据是「这个字段暴露出去会不会被利用」：序列号能被拿去伪造保修，
        原值泄露采购价，供应商暴露商务关系。

        token 无效返回 **404 / 40410**，但不区分「格式错」与「不存在」——
        区分了就等于告诉别人怎么猜。
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, example: Kyz67CdiKyreXUvS }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/AssetPublicView' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- dept-plans
  /dept-plans:
    get:
      tags: [dept-plans]
      operationId: queryDeptPlans
      summary: 部门计划列表
      description: |
        一个部门一个月**一份**计划：`(planMonth, orgId)` 唯一，已驳回的不占位（可以重提）。

        计划的 `items` 是**模板铺开的考核项**（提报时整份拷贝成快照），模板之后怎么改都不影响它。
        三个派生口径（服务端算，前端不要重算）：
        - `weightTotal`：各项权重合计，**提交审核时必须正好 100**；草稿允许不闭合（写到一半要能存）；
          每一项的 `weight` 必须是 **5 的倍数**；
        - `finishRate`：按自评加权折算（合计满分 5 分），不是条目完成数占比；
        - `totalScore`：只有已结案才有值，= 自评合计 × 20% + 复评合计 × 80%，**5 分制**。
      parameters:
        - name: planMonth
          in: query
          schema: { type: string, example: '2026-10' }
          description: 计划月份（YYYY-MM）
        - name: orgId
          in: query
          schema: { type: string, example: O-P01-T4 }
          description: 提报部门（组织树节点，班组或项目部都可）
        - name: projectId
          in: query
          schema: { type: string, example: O-P01 }
          description: 按所属项目筛（总部职能部门的计划不挂在任何项目上）
        - name: status
          in: query
          schema: { type: string, enum: [草稿, 审批中, 已批准, 已驳回, 执行中, 待复评, 已结案] }
        - name: kw
          in: query
          schema: { type: string }
          description: 搜部门 / 提报人 / 计划号 / 考核项名称
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanPageEnvelope' }
    post:
      tags: [dept-plans]
      operationId: createDeptPlan
      summary: 新建计划（草稿）
      description: |
        服务端必须重新校验 `leadsOfUser(empId)` 是否包含 `orgId`，不能只信前端下拉 ——
        提报主体错了，整张单都是错的。

        **草稿不强制权重闭合**：写到一半就存是正常动作；提报（`/submit`）时才卡 100。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptPlanInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '403':
          description: 不是该部门负责人
        '409':
          description: 该部门本月已有计划（40925）

  /dept-plans/stats:
    get:
      tags: [dept-plans]
      operationId: deptPlanStats
      summary: 计划统计
      description: |
        「平均得分」只算已归档的（未归档没分，算进去会把均值拉低）；
        「完成率」按自评加权折算；总部职能部门的计划单列一组，不硬塞进项目。
      parameters:
        - name: planMonth
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeptPlanStats' }

  /dept-plans/exists:
    get:
      tags: [dept-plans]
      operationId: planOfMonth
      summary: 某部门某月是否已有计划
      description: 提报表单打开时先查一次，别让人填完才发现重复。没有则返回空值。
      parameters:
        - name: planMonth
          in: query
          required: true
          schema: { type: string }
        - name: orgId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf: [{ $ref: '#/components/schemas/DeptPlan' }]

  /dept-plans/{planId}:
    get:
      tags: [dept-plans]
      operationId: getDeptPlan
      summary: 计划详情
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, example: PL202610001 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
    patch:
      tags: [dept-plans]
      operationId: updateDeptPlan
      summary: 改草稿
      description: 只有「草稿 / 已驳回」能改。已批准的内容不能被事后修改（要改用审核直改口）。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptPlanInput' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '409':
          description: 当前状态不能改（40926）

  /dept-plans/{planId}/submit:
    post:
      tags: [dept-plans]
      operationId: submitDeptPlan
      summary: 提报审批
      description: |
        卡三件事：权重闭合、量化项都填了目标值、每条都有完成时间。
        然后生成 OA 单（`bizType='计划审批'`），审批链**按提报部门解析**，不按人事归属 ——
        一人管两个部门时，两个部门的项目经理不是同一个人。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tplId: { type: string, description: 运营管理部可以改选模板后提报 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '422':
          description: 权重或必填项不通过（42212）

  /dept-plans/{planId}/withdraw:
    post:
      tags: [dept-plans]
      operationId: withdrawDeptPlan
      summary: 撤回
      description: 只有审批中的能撤，撤回后回到草稿可继续改。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }

  /dept-plans/{planId}/items/{taskId}:
    patch:
      tags: [dept-plans]
      operationId: savePlanProgress
      summary: 执行阶段填一条的实际完成情况
      description: |
        三段填法不同：
        - 量化：`actual` 填数值，自评由服务端按公式算（**不接受手填分数**，否则等于自己定分）；
        - 监控：`actual` 填情况说明，`selfWeighted` 直接填扣分（负数，本期不做上限校验）；
        - 重点：`actual` 填文字，`selfScore` 填 1–5。

        只有「已批准 / 执行中」能填；第一次填就把状态推到「执行中」。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string, example: PL202610002-I01 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actual:
                  oneOf:
                    - type: number
                    - type: string
                  description: 量化填数值，监控/重点填文字
                actualNote: { type: string }
                selfScore: { type: number, description: 仅重点项手填 1–5 }
                selfWeighted: { type: number, description: 仅监控项，填扣分（负数） }
                remark: { type: string }
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '409':
          description: 当前状态不能填（40926）

  /dept-plans/{planId}/items:
    patch:
      tags: [dept-plans]
      operationId: revisePlanItems
      summary: 审核阶段直改考核项（运营管理部）
      description: |
        **不走驳回再重提**：审核人发现问题当场改，改完直接下发。
        每一处改动（名称 / 目标值 / 权重 / 评价标准 / 新增删除）记进 `reviseLog`，
        带改前值、改后值、操作人和时间 —— 半年后有人问"这个月的目标为什么和申报的不一样"，
        得能答上来。

        直改**不整单拒绝**（可以带着半截改动保存），但 `/approve` 会卡权重闭合。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: 全量提交（增删改都在里面），不做增量合并
                  items: { $ref: '#/components/schemas/DeptPlanItem' }
      responses:
        '200':
          description: 成功，返回带 reviseLog 的计划
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '409':
          description: 不在审批中（40926）

  /dept-plans/{planId}/approve:
    post:
      tags: [dept-plans]
      operationId: approvePlanToRun
      summary: 审核通过并下发
      description: |
        改完直接进执行，不需要再走一轮审批。会把关联的 OA 单一并收口，
        否则待办里会一直挂着那张计划审批单。

        下发前**再校验一次权重闭合** —— 直改允许中间状态，下发不允许。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '422':
          description: 权重不闭合（42212）

  /dept-plans/{planId}/result:
    post:
      tags: [dept-plans]
      operationId: submitPlanResult
      summary: 提交完成情况 → 待复评
      description: |
        填报人月底把实际完成情况填完后调这个。**复评必须等这一步**：
        服务端按状态卡（不是「待复评」就拒绝复评），不靠调用方自觉。

        还有量化项没填实际值、或重点项没打分，一律 422 并列出是哪几项。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '422':
          description: 还有项没填（42212）

  /dept-plans/{planId}/review:
    post:
      tags: [dept-plans]
      operationId: reviewDeptPlan
      summary: 复评 + 归档
      description: |
        逐项打分（1–5），监控项填扣分。**不接收单一总分**：总分说不清哪一项出了问题，
        也没法回看"这项为什么只有 3 分"。

        归档后 `totalScore = 自评合计 × 20% + 复评合计 × 80%`（5 分制），
        同时落档位 A ≥4.5 / B ≥3.75 / C ≥3.0 / D <3.0。

        本期只记录得分，**不换算绩效工资**。
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scores:
                  type: object
                  description: '{ taskId: 1–5 分 }，监控项不用给'
                  additionalProperties: { type: number }
                deductions:
                  type: object
                  description: '{ taskId: 扣分 }，只对监控项'
                  additionalProperties: { type: number }
                summary: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeptPlanEnvelope' }
        '409':
          description: 未提交完成情况 / 已归档（40926）
        '422':
          description: 缺项或分数越界（42212）

  # --------------------------------------------------------------- labor-points
  /work-orders/{woId}/labor-points:
    get:
      tags: [work-orders]
      operationId: listLaborPoints
      summary: 某张工单的积分流水
      description: 含「已作废」的历史记录 —— 绩效争议时要能看见改过几次、改成什么。
      parameters:
        - $ref: '#/components/parameters/woId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LaborPointLedgerEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [work-orders]
      operationId: saveLaborPoints
      summary: 记录工时积分（仅公共区域维修）
      description: |
        本期**只记录积分，不做绩效折算**。折算系数与基准分待考核办法确定，
        但流水已带 `ruleVersion` 与 `status`，绩效侧按 `empId + period` 聚合即可。

        为什么只有公共区域：商业服务按人工费提成，已经直接给钱；再叠积分等于同一件事发两次奖，
        师傅会挑单。公共区域免费、无提成，积分是这块活唯一的激励入口。

        积分 = 工时 × 10 分/时 × 部位权重（电梯 1.5 / 公共设备 1.4 / 配电 1.3 / 给排水与道闸 1.2 /
        土建 1.1 / 照明门窗 1.0 / 环境 0.8）。权重在记分时快照，后续调权重不回溯。
      parameters:
        - $ref: '#/components/parameters/woId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: number
                  minimum: 0.1
                  maximum: 24
                  description: 实际工时（小时）。超过 24 小时的请拆单——一张单挂 3 天多半是没及时结单
                operator: { type: string, description: 记入人（工程主管） }
                remark: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      workOrder: { $ref: '#/components/schemas/WorkOrder' }
                      ledger: { $ref: '#/components/schemas/LaborPointLedgerEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /labor-points/summary:
    get:
      tags: [work-orders]
      operationId: laborPointSummary
      summary: 期间积分汇总（绩效侧读取口）
      description: |
        按 `empId + period` 聚合有效流水（排除已作废）。**本期的绩效功能不会调用它**，
        但接口先定下来：将来接入绩效时，绩效模块只读这一个口，不再各自遍历工单。

        积分 → 绩效分的折算**未实现**（`PERF_CONVERSION.implemented = false`），
        折算系数与基准分由考核办法决定，不由接口层拍。
      parameters:
        - name: empId
          in: query
          schema: { type: string }
          description: 按人过滤；不传为全公司
        - name: period
          in: query
          schema: { type: string, example: '2026-10' }
          description: 归属期间 YYYY-MM；不传为全部期间
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            empId: { type: string }
                            empName: { type: string }
                            period: { type: string }
                            orders: { type: integer }
                            hours: { type: number }
                            points: { type: number }
                      perfConversion:
                        type: object
                        description: 折算规则状态；本期恒为未实现
                        properties:
                          implemented: { type: boolean }
                          ruleVersion: { type: string }
                          note: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # --------------------------------------------------------------- 多种经营报表
  /reports/multi-revenue:
    get:
      tags: [reports]
      operationId: multiRevenueReport
      summary: 多种经营收入汇总（商业服务 + 商业合作）
      description: |
        公司收入结构里「多种经营」一大类的汇总，与 `主营业务（物业费）` 并列。

        两个分项的时间口径**不同**，所以不能合成一张明细：
        · 商业服务 —— **完工确认制**：工单完工才算收入，没做完不产生应收；
        · 商业合作 —— **合同年化**：(合同金额 − 归业主的公共收益) ÷ 期间月数 × 12，
          再乘「当年覆盖月数 ÷ 12」，跨年合同不会把整年收入挤进签约当年。

        `publicRevenue` 是归全体业主的部分（民法典 282 条），已在收入中扣除；
        它单列出来是为了向业主公示时对得上账，不是从收入里再减一次。
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer, example: 2026 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      total: { type: number, description: 多种经营收入合计 }
                      service:
                        type: object
                        properties:
                          count: { type: integer }
                          income: { type: number }
                          cost: { type: number }
                          profit: { type: number }
                      cooperation:
                        type: object
                        properties:
                          count: { type: integer }
                          income: { type: number }
                          publicRevenue: { type: number }
                          annualTotal: { type: number }
                      share:
                        type: object
                        properties:
                          service: { type: number }
                          cooperation: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/multi-revenue/monthly:
    get:
      tags: [reports]
      operationId: multiRevenueMonthly
      summary: 多种经营收入月度趋势
      description: |
        商业服务按**完工月**入账；商业合作按**合同期内每月摊**（年化 ÷ 12）。
        所以一份 3 年广告合同会在 36 个月里各出现一次 —— 这才是"收入"而不是"签约额"。
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: months
          in: query
          schema: { type: integer, default: 12 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string }
                        key: { type: string }
                        service: { type: number }
                        cooperation: { type: number }
                        total: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/multi-revenue/by-project:
    get:
      tags: [reports]
      operationId: multiRevenueByProject
      summary: 多种经营收入项目排行
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        communityId: { type: string }
                        communityName: { type: string }
                        service: { type: number }
                        cooperation: { type: number }
                        total: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/multi-revenue/contracts:
    get:
      tags: [reports]
      operationId: multiRevenueContracts
      summary: 商业合作收入明细（合同口径）
      description: 只回 `incomeCategory=多种经营` 且计入当年的合同；`income` 已按覆盖月数折算。
      parameters:
        - name: communityId
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        contractId: { type: string }
                        contractNo: { type: string }
                        name: { type: string }
                        subtype: { type: string }
                        partyB: { type: string }
                        communityName: { type: string }
                        amount: { type: number }
                        publicRevenue: { type: number }
                        contractMonths: { type: integer }
                        annualRevenue: { type: number }
                        coverMonths: { type: number }
                        income: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /work-orders:
    get:
      tags: [work-orders]
      operationId: queryWorkOrders
      summary: 工单列表（分页）
      description: |
        `nohouse=true` 只返回无房屋归属的工单（公共区域 / 投诉 / 咨询），承接原左树的「公共 / 非入户」分支。
      parameters:
        - $ref: '#/components/parameters/pageNo'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/communityId'
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
        - $ref: '#/components/parameters/kw'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WoStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/WoType' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/WoPriority' }
        - name: nohouse
          in: query
          schema: { type: boolean }
        - name: vf
          in: query
          schema: { type: string, enum: ['', pending, overdue, urgent, open] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderPageEnvelope' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [work-orders]
      operationId: createWorkOrder
      summary: 新建工单（前台 / 客服受理）
      description: |
        五种来源类型：公共区域维修 / 商业服务 / 报事 / 投诉建议 / 咨询 / 其他。
        建出来是「待派单」，不直接指派 —— 派单是独立动作，由有派单权的角色做。

        三条业务校验：
        1. **商业服务必须选服务项目**：价格与服务范围都写在项目里，
           让前台手填金额的结果是同一个"空调加氟"报出三种价；
        2. **公共区域维修必须选设施部位**（电梯 / 给排水 / 土建…）。没有部位，
           维修工到场先要问一遍，SLA 从出门就开始烧；
        3. 金额按**项目快照**写死（`materialFee` / `laborFee` / `totalFee` / `priceCode`），
           字典改价不回溯历史工单 —— 改价只影响之后创建的。

        SLA 按优先级定：特急 4 小时 / 紧急 8 小时 / 普通 24 小时。
        这个数在创建时落到工单上，改配置不影响已经建出来的单。
      x-permission: w.wo.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                type:
                  type: string
                  enum: [公共区域维修, 商业服务, 报事, 投诉建议, 咨询, 其他]
                title: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 500 }
                communityId: { type: string, description: 空则按登录人默认项目 }
                houseId: { type: string, description: 入户类工单必填 }
                houseName: { type: string }
                ownerId: { type: string }
                ownerName: { type: string }
                category: { type: string, description: 公共区域维修必填：设施部位 }
                serviceItemCode: { type: string, description: 商业服务必填：服务项目编码 }
                priority: { type: string, enum: [普通, 紧急, 特急] }
                source: { type: string, example: 前台 }
      responses:
        '200':
          description: 已创建（`status=待派单`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderEnvelope' }
        '409':
          description: 选的服务项目已停用（40924）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: 类型越界 / 缺服务项目 / 缺设施部位 / 缺标题（42207）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

