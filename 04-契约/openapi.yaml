              required: [rows]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/DataScopeStat' }

    # ---------------- 响应包装（合同 / 公告） ----------------
    ContractEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Contract' }
    ContractPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/Contract' }
    ContractSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ContractSummary' }
    ContractDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [contract]
              properties:
                contract: { $ref: '#/components/schemas/Contract' }
                ref:
                  type: [object, 'null']
                  description: 按 refType 带出的关联对象；查不到为 null，别让详情页因此报错
                changes:
                  type: array
                  items: { $ref: '#/components/schemas/ContractChange' }
    ContractChangeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [change]
              properties:
                change: { $ref: '#/components/schemas/ContractChange' }
                approval: { type: object, description: 同步生成的审批单 }
    ContractAttachmentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/ContractAttachment' }
    AttachmentDownloadEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AttachmentDownload' }
    NoticeEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Notice' }
    NoticePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/Notice' }
    NoticeSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NoticeSummary' }
    NoticeDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [notice]
              properties:
                notice: { $ref: '#/components/schemas/Notice' }
                unreached: { type: integer }
                timeline:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      memo: { type: string }
                      done: { type: boolean }

    MobileDebtsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [summary, buildings, rows, total]
              properties:
                summary:
                  type: object
                  description: 按**全范围**统计，不随筛选变化
                  properties:
                    buildingCount: { type: integer }
                    houseCount: { type: integer }
                    billCount: { type: integer }
                    payable: { type: number, description: 应收合计 }
                    paid: { type: number, description: 已收合计 }
                    rate: { type: number, description: '收缴率（百分数）；缺了页面 toFixed 会白屏' }
                    debtHouseCount: { type: integer }
                    debtHouses: { type: integer, description: 与 debtHouseCount 同值（旧字段名） }
                    debtCount: { type: integer, description: 欠费账单条数（一户可能多张） }
                    debtAmount: { type: number }
                buildings:
                  type: array
                  items:
                    type: object
                    properties:
                      buildingId: { type: string }
                      name: { type: string }
                      floors: { type: integer }
                      houses: { type: integer }
                      houseCount: { type: integer }
                      debtHouseCount: { type: integer }
                      debtAmount: { type: number }
                rows:
                  type: array
                  description: 一户一行（不是一账一行）
                  items:
                    type: object
                    properties:
                      houseId: { type: string }
                      houseName: { type: string }
                      buildingId: { type: string }
                      ownerId: { type: string }
                      ownerName: { type: string }
                      phone: { type: string, description: 前端按岗位决定是否脱敏 }
                      debt: { type: number, description: 该户欠费合计 = items 之和 }
                      maxOverdue: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            billId: { type: string }
                            itemName: { type: string }
                            period: { type: string }
                            unpaid: { type: number }
                            overdueDays: { type: integer }
                      lastCollect:
                        type: object
                        nullable: true
                        description: 最近一次催缴；从没催过是 null（不是空对象）
                        properties:
                          at: { type: string }
                          method: { type: string }
                          status: { type: string }
                          round: { type: integer }
                          operator: { type: string }
                      gapDays: { type: integer, description: '距上次催缴的天数；从未催过是 999' }
                total: { type: integer }

    MobileApprovalListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [tabs, tab, rows]
              properties:
                tabs:
                  type: array
                  items:
                    type: object
                    required: [key, label, count]
                    properties:
                      key: { type: string, enum: [todo, applied, done] }
                      label: { type: string }
                      count: { type: integer }
                tab: { type: string, enum: [todo, applied, done] }
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/OaRequest' }

    MobileApprovalDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [approval, actor, target, sign, canHandle, timeline]
              properties:
                approval: { $ref: '#/components/schemas/OaRequest' }
                actor:
                  type: object
                  description: 当前节点摘要（页面顶部显示"卡在谁那里"）
                  properties:
                    label: { type: string }
                    kind: { type: string }
                    signer: { type: object, nullable: true }
                    orgId: { type: string }
                target:
                  type: object
                  description: |
                    「这一单该谁办」。kind 决定底部按钮：leader（等某人）/ sign（会签）/
                    unsupported（移动端不办）/ done（已结束）/ none（不存在）。
                  properties:
                    kind: { type: string, enum: [leader, sign, unsupported, done, none, role] }
                    label: { type: string }
                    why: { type: string }
                    orgId: { type: string }
                    signer: { type: object, nullable: true }
                    approvers: { type: array, items: { type: object } }
                    signMode: { type: string }
                    progress:
                      type: object
                      properties:
                        done: { type: integer }
                        total: { type: integer }
                sign:
                  type: object
                  nullable: true
                  description: 只有会签节点才给，单人节点是 null（不显示空壳）
                  properties:
                    mode: { type: string }
                    progress:
                      type: object
                      properties:
                        done: { type: integer }
                        total: { type: integer }
                    approvers: { type: array, items: { type: object } }
                canHandle:
                  type: boolean
                  description: 服务端对当前登录人的判定，页面不要自己再算
                timeline:
                  type: array
                  items:
                    type: object
                    properties:
                      index: { type: integer }
                      node: { type: string }
                      handler: { type: string }
                      action: { type: string }
                      time: { type: string }
                      comment: { type: string }
                      done: { type: boolean }
                      signMode: { type: string }
                      approvers: { type: array, items: { type: object } }

    MobileWorkOrderListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [tabs, tab, rows]
              properties:
                tabs:
                  type: array
                  description: 当前身份真有的页签（一线没有"待派"）；计数与 rows 来自同一次快照
                  items:
                    type: object
                    required: [key, label, count]
                    properties:
                      key: { type: string, enum: [grab, dispatch, mine, done] }
                      label: { type: string }
                      count: { type: integer }
                tab: { type: string, enum: [grab, dispatch, mine, done] }
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/WorkOrder' }

    MobileWorkOrderDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [workOrder, price, fee, addons, pays, addonSum, commission, settled, timeline]
              properties:
                workOrder: { $ref: '#/components/schemas/WorkOrder' }
                price:
                  type: object
                  description: 下单时的价目快照。`dictPrice` 与 `total` 不同说明后台调过价
                  properties:
                    code: { type: string }
                    name: { type: string }
                    material: { type: number }
                    labor: { type: number }
                    total: { type: number }
                    dictPrice: { type: number }
                fee:
                  type: object
                  description: |
                    金额口径：`total` = 单额 + **已确认**的增项。
                    未确认的增项不能算进应收 —— 否则师傅会去要一笔业主没认的钱。
                  properties:
                    type: { type: string }
                    material: { type: number }
                    labor: { type: number }
                    total: { type: number }
                    baseTotal: { type: number }
                    prepaid: { type: boolean }
                    payStatus: { type: string }
                    paid: { type: number }
                    due: { type: number }
                    payMethod: { type: string }
                    hangReason: { type: string }
                addons:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      name: { type: string }
                      qty: { type: number }
                      material: { type: number }
                      labor: { type: number }
                      total: { type: number }
                      at: { type: string }
                      by: { type: string }
                      confirmed: { type: boolean }
                pays:
                  type: array
                  description: |
                    收款流水。移动端收款是**现场动作**（扫码 / 现金 / 挂账），
                    事后对账全靠这张表 —— 只给 `paidAmount` 汇总是不够的。
                    没记流水就说不清"这笔钱谁收的、什么时候收的"。
                  items:
                    type: object
                    properties:
                      at: { type: string }
                      amount: { type: number }
                      method: { type: string, description: '微信支付 / 支付宝 / POS刷卡 / 现金 / 挂账' }
                      by: { type: string, description: '收款人（员工姓名）' }
                      transNo: { type: string }
                      reason: { type: string, description: '挂账时必填' }
                addonSum:
                  type: object
                  description: |
                    金额只汇总已确认的（调用方按需取）；`pending` 数**全部**未确认的 ——
                    它回答"还有几笔等业主点头"，不是金额。
                  properties:
                    material: { type: number }
                    labor: { type: number }
                    total: { type: number }
                    pending: { type: integer }
                    count: { type: integer }
                commission: { type: number, description: '按人工费 × 项目比例；材料费不参与' }
                settled: { type: boolean, description: '已收款才结提成；完工未收款算在途' }
                ownerEval:
                  type: object
                  nullable: true
                  properties:
                    score: { type: number }
                    tags: { type: array, items: { type: string } }
                    text: { type: string }
                staffEval: { type: object, nullable: true }
                timeline:
                  type: array
                  items:
                    type: object
                    properties:
                      at: { type: string }
                      action: { type: string }
                      by: { type: string }
                      memo: { type: string }

    MobileExecEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [task, template, plan, community]
              properties:
                task: { $ref: '#/components/schemas/InspectTask' }
                template:
                  type: object
                  properties:
                    templateId: { type: string }
                    name: { type: string }
                    type: { type: string, enum: [执行, 监督] }
                    version: { type: string }
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          label: { type: string }
                          type: { type: string, description: '拍照 / 单选 / 评分 / 扫码 / 文本' }
                          required: { type: boolean }
                          standard: { type: string }
                          options:
                            type: array
                            items: { type: string }
                plan:
                  type: object
                  nullable: true
                  description: |
                    来源巡检计划。详情页要显示「来源计划 · 周期」。

                    计划被删除（或任务来自临时计划）时给 **null**，不要给空对象 ——
                    前端 `p ? `, p.name : '—'` 的判断依赖 null，空对象会渲染成「— · undefined」。
                  properties:
                    planId: { type: string }
                    name: { type: string }
                    cycle: { type: string, description: '每日 / 每周 / 每月 / 每季' }
                    post: { type: string }
                community:
                  type: object
                  nullable: true
                  description: |
                    所属项目。详情页要显示项目名与地址（"去哪儿干活"是这个页面第二重要的信息）。

                    与 `communityName` 并存是**有意的**：执行页只显示项目名、不需要请求第二个接口，
                    详情页要地址。两个字段都由服务端给，前端不拼。
                  properties:
                    communityId: { type: string }
                    name: { type: string }
                    address: { type: string }
                communityName: { type: string }
                workers:
                  type: array
                  description: 责任员工候选（仅监督任务有值；按被检班组在职员工，排除组长本人）
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      label: { type: string }

    InspectWorkOrderRequest:
      type: object
      required: [itemLabel, type, priority, title, description]
      properties:
        itemLabel: { type: string, description: '巡检检查项名称，用于回连与描述' }
        reason: { type: string, description: '问题类型，落到工单 category' }
        type: { type: string, enum: [公共区域维修, 报事, 投诉建议, 其他] }
        priority: { $ref: '#/components/schemas/WoPriority' }
        title: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 160, description: '现象 + 位置；工程组不再二次电话确认' }
        place: { type: string, description: '点位描述，缺省用「岗位责任区 · 巡检点位」' }
        photos: { type: integer, minimum: 0 }
      description: |
        注意：`source` 不由客户端指定，服务端固定写「巡检转单」；
        SLA 按 priority 推导（特急 4h / 紧急 8h / 普通 24h），与工单域一致。

    StaffEvalRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5, description: 业主配合度 }
        tags:
          type: array
          items:
            type: string
            enum: [业主配合, 家中无人, 需二次上门, 现场无法进入, 非本专业问题]
        note: { type: string, maxLength: 80 }
      description: |
        只做内部参考：不对外展示、不进业主考核、不参与员工绩效。
        与业主对员工的 `score` / `evalTags` 是两套数据，不要合并统计。

    WorkOrderCommission:
      type: object
      description: 单笔工单的提成（基数只含人工费，材料费不计提）
      properties:
        woId: { type: string }
        woNo: { type: string }
        category: { type: string }
        total: { type: number, description: 含增项的实收金额 }
        labor: { type: number, description: 提成基数 }
        commission: { type: number }
        settled: { type: boolean, description: 'true=已收款（已结），false=在途' }
        payStatus: { type: string, enum: [未支付, 已支付, 已挂账, 无需支付] }

    RepairPriceItem:
      type: object
      description: 维修价目 / 增项价目。业主端下单、现场加项、提成核算共用同一份
      required: [code, name, trade, material, labor]
      properties:
        code: { type: string, example: RP-W01 }
        category: { type: string, description: 对应工单的 category（增项无此字段） }
        name: { type: string }
        trade: { type: string, enum: [水暖, 电工, 木工, 空调, 泥瓦, 电梯, 综合] }
        material: { type: number }
        labor: { type: number }
        unit: { type: string, example: 次 }
        minutes: { type: integer, description: 标准工时，用于排单与超时判断 }

    TenantBrief:
      type: object
      description: 在住租户（不含租金与身份证）
      properties:
        name: { type: string }
        phone: { type: string, description: 脱敏 }
        relation: { type: string }
        leaseStart: { type: string }
        leaseEnd: { type: string }
        residents: { type: integer }
        verifyStatus: { type: string, enum: [已核验, 待核验, 信息不全] }
        certified: { type: boolean }
        faceRegistered: { type: boolean }
        source: { type: string }

    MemberBrief:
      type: object
      description: 共住家庭成员（不含身份证）
      properties:
        name: { type: string }
        relation: { type: string, enum: [配偶, 子女, 父母, 其他] }
        phone: { type: string, description: 脱敏 }
        certified: { type: boolean }
        faceRegistered: { type: boolean }
        appUser: { type: boolean }

    # ==================== 业主小程序（mp） ====================
    MpSession:
      type: object
      description: 业主端会话（**不返回完整证件号**，只回后四位）
      required: [phoneMasked, realnameStatus]
      properties:
        phoneMasked: { type: string, example: 138****8001 }
        realnameStatus: { type: string, enum: [未实名, 已实名] }
        name: { type: string, description: 已实名时返回 }
        idCard4: { type: string, description: 证件后四位（回显用） }
        boundCount: { type: integer, description: 已绑房产套数 }
        token: { type: string, description: 会话 token（只带身份，不带数据范围） }

    MpSessionEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpSession' }

    MpCommunity:
      type: object
      description: |
        选房 1/3。与后台同一张项目表，只同步「在管」。
        `houseCount` 按房号表实算：项目表那个数是"合同上写着多少户"。
      required: [communityId, name, address, houseCount]
      properties:
        communityId: { type: string, example: P01 }
        name: { type: string, example: 翡翠城 }
        bizType:
          type: string
          enum: [住宅, 商业]
          description: 商业项目里"房间"其实是铺位，选房页的措辞要跟着变
        address: { type: string, example: 成都市高新区天府大道南段 1288 号 }
        houseCount: { type: integer, description: 已建档房号数（按 houses 实算） }

    MpCommunityListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpCommunity' }

    MpBuilding:
      type: object
      description: 选房 2/3。单元数与户数都按单元表 / 房号表实算
      required: [buildingId, name, unitCount, floorCount, houseCount]
      properties:
        buildingId: { type: string, example: B0101 }
        name: { type: string, example: 1栋 }
        buildingNo: { type: string, example: '01' }
        usage: { type: string, enum: [住宅, 公寓, 商业] }
        unitCount: { type: integer, description: 几个单元 }
        floorCount: { type: integer }
        houseCount: { type: integer, description: 房号数 }
        hasElevator: { type: boolean, description: 无梯楼栋的搬运费要按它算，选房页暂不显示 }

    MpBuildingListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [communityId, rows]
          properties:
            communityId: { type: string, example: P01 }
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpBuilding' }

    MpRoom:
      type: object
      description: |
        选房 3/3 的最小单元：只回答"这是哪一间"。
        业主 / 家属 / 租客 / 门牌人一概不下发 —— 选房时系统还不知道你是谁，
        这一步多给的每个字段，都是给陌生人做的一次业主信息试探。
      required: [houseId, room, floor, fullName, area, houseType]
      properties:
        houseId: { type: string, example: H010110501 }
        room: { type: string, example: '0501' }
        floor: { type: integer, example: 5 }
        fullName: { type: string, example: 翡翠城 1栋1单元0501 }
        area: { type: number, description: 建筑面积 ㎡ }
        houseType:
          type: string
          description: 来自房屋档案。住宅与商业两套枚举（商业：配套 / 零售铺 / 餐饮铺 / 办公）

    MpRoomGroup:
      type: object
      description: 按单元分组的房号，组内按「楼层 → 房号」排序
      required: [unitId, unitName, rooms]
      properties:
        unitId: { type: string, example: U01101 }
        unitName: { type: string, example: 1单元 }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/MpRoom' }

    MpRoomGroupListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [buildingId, buildingName, groups]
          properties:
            buildingId: { type: string, example: B0101 }
            buildingName: { type: string, example: 1栋 }
            groups:
              type: array
              items: { $ref: '#/components/schemas/MpRoomGroup' }

    MpParking:
      type: object
      description: |
        我的车位。`expireDate` 是**管理费已缴至的账期末**，到期日只有这一份真相 ——
        手填的那天起，续费、可换绑条件、逾期提醒三处就会各说各话。
      required: [parkId, parkNo, status, category, feeStandard, expireDate, usedThisMonth]
      properties:
        parkId: { type: string, example: PK00115 }
        parkNo: { type: string, example: B1-115 }
        zone: { type: string, example: B1, description: 区域（B1 / B2 / G 地面 …） }
        parkType: { type: string, enum: [地下, 地上] }
        category:
          type: string
          description: 产权车位 / 充电车位 / 人防车位 …（来自档案，不在这里枚举硬编码）
        area: { type: number, description: 车位面积 ㎡ }
        status: { type: string, enum: [已售, 已租, 闲置], description: 车位的处置状态，与"我能不能用"无关 }
        plateNo: { type: string, example: 川B·SFV7D, description: 当前主车牌 }
        bindStatus: { type: string, enum: [已绑定, 未绑定, 待审核] }
        feeStandard: { type: number, description: 管理费单价（元/位·月） }
        expireDate: { type: string, example: '2026-10-26', description: 管理费已缴至（YYYY-MM-DD） }
        chargePile: { type: boolean }
        vehicleCount: { type: integer, description: 绑定车辆数（一车位可多车） }
        usedThisMonth: { type: integer, description: 该车位**本自然月**已自助换绑次数（以最后一次物业重置为界） }

    MpParkingListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [rows, limit]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpParking' }
            limit:
              type: integer
              example: 1
              description: 每车位每自然月可自助换绑次数（系统参数 `park.plateChangeLimit`）
            period: { type: string, example: '2026-10' }
            resetAt: { type: string, example: '2026-11-01', description: 额度重置日（下月 1 日） }

    MpVehicle:
      type: object
      description: |
        绑在某个车位上的车。**不给完整 IC 卡号** —— 业主端只显示后四位，
        而完整卡号是可以复制去开闸的凭证。
      required: [vehicleId, plateNo, vehicleType]
      properties:
        vehicleId: { type: string, example: VH00001 }
        plateNo: { type: string, example: 川B·SFV7D }
        vehicleType: { type: string, example: 小型车 }
        brand: { type: string, example: 吉利 }
        color: { type: string, example: 黑 }
        cardNoTail: { type: string, example: '2192', description: IC 卡后四位；完整卡号不下发 }
        authStatus: { type: string, enum: [正常, 黑名单], description: 道闸授权状态 }
        inOutType: { type: string, enum: [月卡, 产权] }

    MpParkingDetail:
      type: object
      required: [parking, vehicles]
      properties:
        parking: { $ref: '#/components/schemas/MpParking' }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/MpVehicle' }

    MpParkingDetailEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpParkingDetail' }

    MpPlateChangeRequest:
      type: object
      required: [plateNo]
      properties:
        plateNo:
          type: string
          example: 川B·SFV7D
          description: 新车牌。**替换主车牌**，不是追加第二辆
        reason:
          type: string
          maxLength: 100
          description: 可选备注，写进换绑记录（客服复核时看这句）

    MpParkingChangeLog:
      type: object
      description: |
        一条换绑 / 解绑 / 重置记录。业主端只读，`source` 区分是谁做的 ——
        售后争议时这一行就是证据。
      required: [logId, parkId, parkNo, source, vendorStatus, at]
      properties:
        logId: { type: string, example: PL00002 }
        parkId: { type: string, example: PK00121 }
        parkNo: { type: string, example: B1-121 }
        fromPlate: { type: string, example: 川B·OLD11 }
        toPlate: { type: string, example: 粤B·YK1Q6 }
        source: { type: string, enum: [业主自助, 物业代操作, 物业重置] }
        operatorName: { type: string, example: 王浩然, description: 谁做的；业主自助时就是业主本人 }
        vendorStatus:
          type: string
          enum: [待同步, 已同步, 失败]
          description: 车牌识别系统（第三方）的下发状态。原型阶段新记录一律「待同步」
        at: { type: string, example: '2026-09-12 19:41' }
        reason: { type: string }

    MpParkingChangeLogListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpParkingChangeLog' }

    MpPlateChangeEnvelope:
      type: object
      description: 换绑成功。返回新的 `parking` 与配额，客户端不用再拉一次列表
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [log, parking, limit]
          properties:
            log: { $ref: '#/components/schemas/MpParkingChangeLog' }
            parking: { $ref: '#/components/schemas/MpParking' }
            limit: { type: integer, example: 1 }
            period: { type: string, example: '2026-10' }
            resetAt: { type: string, example: '2026-11-01' }

    MpFaceStatus:
      type: string
      enum: [未采集, 待核验, 已生效, 已驳回, 已冻结]
      description: |
        五态。顺序就是流程顺序（未采集 → 待核验 → 已生效）；
        已驳回与已冻结是旁支：驳回按原因重拍即可，冻结要先确认是"租约结束"还是"本人撤回"。

    MpFaceSubject:
      type: object
      description: 一个主体的人脸状态（本人与成员共用的那部分）
      required: [status, name, canSubmit]
      properties:
        faceId:
          type: string
          description: 申请单号；**未采集时是空串**（没有申请单就是没采集，不造一条空记录）
        name: { type: string, example: 张建国 }
        status: { $ref: '#/components/schemas/MpFaceStatus' }
        submittedAt: { type: string, example: '2026-03-11 10:20' }
        updatedAt: { type: string, description: 最近一次状态变化（审计时间优先于提交时间） }
        note:
          type: string
          description: 给业主看的一句话。重新采集时是"新照片核验期间，原人脸继续有效"
        canSubmit: { type: boolean, description: 现在能不能提交采集 }
        why: { type: string, description: 不能提交的原因；能提交时是空串 }
        remain24h: { type: integer, description: 24 小时内还能提交几次 }
        guardian: { type: string, example: 张建国（配偶，代同意）, description: 代录留痕 }

    MpFaceSelf:
      type: object
      description: 本人这一条。`readOnly` 是租客：人脸由物业在租约核验时录，业主端只读
      required: [status, name, canSubmit, role, readOnly]
      properties:
        faceId: { type: string }
        name: { type: string, example: 张建国 }
        role: { type: string, enum: [业主, 家属, 租客] }
        status: { $ref: '#/components/schemas/MpFaceStatus' }
        submittedAt: { type: string }
        updatedAt: { type: string }
        note: { type: string }
        canSubmit: { type: boolean }
        why: { type: string }
        readOnly: { type: boolean }
        readOnlyWhy: { type: string }
        remain24h: { type: integer }
        guardian: { type: string }

    MpFaceMember:
      type: object
      description: 本房成员这一条。`canEnroll=false` 时 `why` 说明原因（通常是资料未核验）
      required: [memberId, name, certified, status, canEnroll]
      properties:
        faceId: { type: string }
        memberId: { type: string, example: MB00001 }
        name: { type: string, example: 陈静 }
        relation: { type: string, example: 配偶 }
        certified: { type: boolean, description: 成员资料是否已核验 —— 没核验不能代录人脸 }
        status: { $ref: '#/components/schemas/MpFaceStatus' }
        submittedAt: { type: string }
        updatedAt: { type: string }
        note: { type: string }
        canSubmit: { type: boolean }
        canEnroll: { type: boolean }
        why: { type: string }
        remain24h: { type: integer }
        guardian: { type: string }

    MpFaceSubmitRequest:
      type: object
      properties:
        guardian:
          type: boolean
          description: |
            代家人录入时的**监护人代同意**。不传等于不同意 —— 不存在默认同意。
            本人提交时不需要这个字段。
        consent:
          type: boolean
          description: 单独同意（敏感个人信息处理）。原型阶段只记录有这个动作，不落文本

    MpAccessFaceListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [self, members]
          properties:
            self: { $ref: '#/components/schemas/MpFaceSelf' }
            members:
              type: array
              description: 家属登录时恒为空数组 —— 家属只能看自己
              items: { $ref: '#/components/schemas/MpFaceMember' }

    MpFaceSelfEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpFaceSelf' }

    MpFaceMemberEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpFaceMember' }

    MpFaceSubjectEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpFaceSubject' }

    MpUtilityAccount:
      type: object
      description: |
        一块表。`mode` 是**项目配置**，不是这张账单的属性 ——
        同一个业主换到别的项目，同一块表可能从"可缴"变成"到物业买量"。
      required: [meterType, itemId, itemName, mode, modeLabel, canPay]
      properties:
        meterType: { type: string, enum: [水表, 电表] }
        meterNo:
          type: string
          description: 户号。项目是 `card` / `none` 且没登记远传表时为空串
        itemId: { type: string, example: FI05 }
        itemName: { type: string, example: 水费 }
        mode: { type: string, enum: [meter, card, none] }
        modeLabel: { type: string, example: 抄表出账 }
        unit:
          type: string
          example: 吨
          description: 计价单位（由账单「元/吨」剥出）；没有账单时取表具单位
        price: { type: number, description: 单价。**只有 `meter` 且有待缴账单时才出现** }
        usage: { type: number, description: 本期用量。同上，没有账单就没有这个字段 }
        amount:
          type: number
          description: |
            本期应缴 = 最早那笔未缴账单的 `unpaid`。
            `card` / `none` 模式下**不出现这个字段**（不是 null —— 系统里根本没有这个数）。
        period: { type: string, example: '2026-10', description: 账期；没有账单时不出现 }
        billId: { type: string, example: BL004101, description: 没有账单时不出现 }
        billStatus: { type: string, enum: [未缴, 部分缴, 逾期], description: 没有账单时不出现 }
        prevReading: { type: number, description: 上期读数（业主质疑用量时用）；账单没带读数时不出现 }
        currReading: { type: number, description: 本期读数；账单没带读数时不出现 }
        unpaidCount:
          type: integer
          description: |
            该表还有几笔未缴。**只统计 `meter` 模式** ——
            `card` / `none` 下的历史账单不是物业能收的钱，端上不摆出来。
        unpaidTotal: { type: number }
        canPay:
          type: boolean
          description: |
            `mode === 'meter' && 有未缴账单`。两个条件缺一不可 ——
            只看账单会让插卡表的单出现支付按钮，只看模式会给"已结清"也出按钮。

    MpUtilityEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          required: [houseId, communityId, dueTotal, accounts]
          properties:
            houseId: { type: string, example: H010110501 }
            houseName: { type: string, example: 翡翠城 1栋1单元0501 }
            communityId: { type: string, example: P01 }
            dueTotal: { type: number, description: 可缴合计（只算 canPay 的表） }
            payableCount: { type: integer, description: 几块表有待缴 }
            accounts:
              type: array
              items: { $ref: '#/components/schemas/MpUtilityAccount' }

    MpCommerceCoupon:
      type: object
      description: 商业平台的券。**领取与核销都在商业平台**，这里只展示与引导
      required: [couponId, title, type, status]
      properties:
        couponId: { type: string, example: CP001 }
        title: { type: string, example: 邻里中心通用券 }
        type: { type: string, enum: [满减, 折扣, 免邮, 礼品] }
        faceValue: { type: number, description: 面额；折扣券为 0，看 title }
        threshold: { type: number, description: 门槛，0 表示无门槛 }
        scope: { type: string, example: 邻里中心 · 生活服务 }
        validFrom: { type: string }
        validTo: { type: string }
        status: { type: string, enum: [可领取, 已领取, 已过期] }
        claimUrl: { type: string, description: 去商业平台领取的落地页 }

    MpCommerceAccount:
      type: object
      description: |
        商业平台账户的**只读镜像**。

        **没有 `balance`**：商业平台储值与物业预存是两笔钱，
        放一起业主会问"能不能交物业费"，而这个问题的答案是"不能"。
        本期也不支持拿它抵扣任何账单。
      required: [memberName, syncedAt, points, coupons]
      properties:
        memberName: { type: string, example: 张建国 }
        syncedAt: { type: string, example: '2026-10-21 07:00', description: 镜像的时间点 }
        points: { type: integer, example: 1280 }
        pointsExpiring: { type: integer, description: 即将过期的积分 }
        pointsExpireAt: { type: string, example: '2026-12-31' }
        level: { type: string, example: 银卡会员 }
        levelNext: { type: string, example: 金卡会员 }
        levelProgress:
          type: object
          properties:
            current: { type: integer }
            next: { type: integer }
        coupons:
          type: array
          items: { $ref: '#/components/schemas/MpCommerceCoupon' }

    MpCommerceAccountEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpCommerceAccount' }

    MpBindingMatch:
      type: object
      description: |
        逐项结论（业主端用它渲染"哪一项对不上"）。
        **`house` 单独一位**：三项全对但房不在名下，是"人工审核"里最常见的一类
        （买了房还没过户、档案漏录），和"名字填错"要给完全不同的提示。
      required: [phone, name, cert, house]
      properties:
        phone: { type: boolean, description: true = 这一项对不上 }
        name: { type: boolean }
        cert: { type: boolean }
        house: { type: boolean, description: true = 三项都对，但房不在这人名下 }

    MpMyHouse:
      type: object
      description: 业主端房产（含只读基础信息与管家）
      required: [houseId, fullName]
      properties:
        houseId: { type: string }
        fullName: { type: string, example: 翡翠城 1栋1单元0501 }
        communityId:
          type: string
          description: 所属项目。业主端拿它调 `/mp/pricing?communityId=` 与生活服务，缺了就只能猜
        communityName: { type: string }
        houseType:
          type: string
          description: 从房屋档案派生。住宅有 一室一厅 / 两室一厅 / 三室两厅 / 四室两厅 / 跃层 / 公寓（大开间），
            商业有 配套 / 零售铺 / 餐饮铺 / 办公 —— 业主名下可能真有商铺，别用住宅枚举把它挡掉
        area: { type: number, description: 建筑面积 ㎡ }
        deliverStatus: { type: string, enum: [已交付, 未交房] }
        useStatus:
          type: string
          enum: [已入住, 正在装修, 装修未入住, 空置房, 已交房未装修, 未交房]
          description: 取房屋档案原值。**不要**简化成"自住/出租/空置"：装修中的房既不是空置也不是自住
        bound: { type: boolean, description: 当前会话是否已绑 }
        steward:
          type: object
          description: 楼栋管家（无命中时告诉业主找谁核验）
          properties:
            empId: { type: string }
            name: { type: string }
            position: { type: string }
            phone: { type: string, description: 脱敏 }

    MpBindingCandidates:
      type: object
      required: [level, mismatch]
      properties:
        level: { type: string, enum: [one, many, none], description: 命中 1 套 / 多套 / 无命中 }
        identity:
          type: string
          enum: [业主, 家属, 租客]
          description: |
            以**档案**为准，不取用户自选的那个 —— 选了"业主"但档案是家属，按家属生效并提示。
            业主端要在确认页把这句话说出来，否则家属会以为自己拿到了业主权限。
        ownerId:
          type: string
          description: |
            该身份对应的业主档案号（家属与租客也有：家属挂在业主上，租客记着业主）。
            业主端"还有 N 套可绑定"靠它反查，缺了就只能再发一次请求。
        verifyStatus:
          type: string
          description: 租客的核验状态（如「信息不全」）。空 = 无需核验
        reason: { type: string, description: level=none 时必填，说明哪一项对不上 }
        mismatch: { $ref: '#/components/schemas/MpBindingMatch' }
        houses:
          type: array
          items: { $ref: '#/components/schemas/MpMyHouse' }
        steward:
          type: object
          description: 该房楼栋管家（可能为空：手机号未登记时无法定位房）
          properties:
            empId: { type: string }
            name: { type: string }
            position: { type: string }
            phone: { type: string }

    MpBindingCandidatesEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpBindingCandidates' }

    MpBindingEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            boundHouseIds:
              type: array
              items: { type: string }
            houses:
              type: array
              items: { $ref: '#/components/schemas/MpMyHouse' }

    MpHomeCounts:
      type: object
      description: 首页三个待办数（口径见 GET /mp/me）
      required: [debtAmount, doingOrders, pendingAddons]
      properties:
        debtAmount: { type: number, description: 待缴合计（已绑房产 + 本人不挂房的车位费） }
        debtBills: { type: integer }
        maxOverdueDays: { type: integer }
        doingOrders: { type: integer, description: 待派单 / 已派单 / 处理中 / 待确认 }
        pendingAddons: { type: integer, description: addons 里 confirmed=false 的条数 }
        pendingAddonAmount: { type: number }
        toEvaluate: { type: integer }

    MpMe:
      type: object
      required: [owner, houses, counts]
      properties:
        owner:
          type: object
          properties:
            ownerId: { type: string }
            name: { type: string }
            phoneMasked: { type: string }
            idCard4: { type: string }
            certified: { type: boolean }
        houses:
          type: array
          items: { $ref: '#/components/schemas/MpMyHouse' }
        counts: { $ref: '#/components/schemas/MpHomeCounts' }

    MpMeEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpMe' }

    MpHouseEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpMyHouse' }

    MpResidents:
      type: object
      description: 本住在住人。**业主可见租金**（与楼管相反），身份证只回后四位
      properties:
        owner:
          type: object
          description: 产权人。家属 / 租客自查时这里是**档案上的业主**，不是本人
          properties:
            name: { type: string }
            phone: { type: string, description: 脱敏 }
            relation: { type: string, example: 业主 }
        tenants:
          type: array
          items:
            type: object
            properties:
              tenantId: { type: string }
              name: { type: string }
              phone: { type: string, description: 脱敏 }
              idCard4: { type: string }
              leaseStart: { type: string, format: date }
              leaseEnd: { type: string, format: date }
              rent: { type: number, description: 月租金，业主可见 }
              residents: { type: integer }
              verifyStatus: { type: string, enum: [已核验, 待核验, 信息不全] }
              source: { type: string, enum: [业主自助, 物业登记, 中介报备] }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberBrief' }

    MpResidentsEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpResidents' }

    MpBillListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/Bill' }
            summary: { $ref: '#/components/schemas/BillSummary' }
            periods:
              type: array
              description: 涉及的账期（升序），账单页按它分组
              items: { type: string, example: '2026-10' }

    MpPricingEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            chargeMode:
              type: object
              properties:
                prepayWhenOrder: { type: boolean, description: true = 下单即预付 }
                addonPaidOnSite: { type: boolean, description: true = 增项确认后补付 }
            tradeOpts:
              type: array
              description: 工种枚举（下单页按工种筛选用），与员工端派单用的是同一份
              items: { type: string, example: 水暖 }
            items:
              type: array
              items: { $ref: '#/components/schemas/RepairPriceItem' }
            addons:
              type: array
              items: { $ref: '#/components/schemas/RepairPriceItem' }

    MpAddon:
      type: object
      description: |
        现场增项。**全系统唯一形状**（`workOrders[].addons[]`）：
        员工端加项、业主端确认、提成核算都读这一份，不允许各端另存一份。
      required: [code, name, qty, material, labor, total, confirmed]
      properties:
        code: { type: string, example: AD-D01 }
        name: { type: string, example: 拆旧 / 清运 }
        qty: { type: integer, minimum: 1 }
        material: { type: number }
        labor: { type: number }
        total: { type: number, description: material + labor }
        at: { type: string, description: 加项时间 }
        by: { type: string, description: 加项的师傅 }
        confirmed: { type: boolean, description: false = 等业主确认 }
        confirmedAt: { type: string }
        confirmedBy: { type: string, description: 业主确认时记「业主（小程序）」 }

    MpPayOrder:
      type: object
      description: 待支付订单。**不是支付流水**（流水在 payments），只是"待付款单"
      required: [payId, type, amount, status, expireAt]
      properties:
        payId: { type: string, example: PY202610200001 }
        type: { type: string, enum: [bill, wo, activity] }
        refId: { type: string, description: bill=首张账单 id；wo=工单 id；activity=报名号 enrollId }
        billIds:
          type: array
          items: { type: string }
        title: { type: string }
        sub: { type: string }
        amount: { type: number, description: 由服务端计算，前端传值忽略 }
        status: { type: string, enum: [待支付, 已支付, 已过期, 已取消] }
        createdAt: { type: string }
        expireAt: { type: string, description: 待支付有效期 }
        paidAt: { type: string }
        payMethod: { type: string, enum: [微信支付（模拟）, 微信支付, 支付宝] }
        lines:
          type: array
          description: 账单缴费的金额快照（支付后账单 unpaid 会归零，明细只能靠它）
          items:
            type: object
            properties:
              billId: { type: string }
              itemName: { type: string }
              period: { type: string }
              amount: { type: number }

    # ---------------- 邻里公共内容（业主视角 · 第 76 批） ----------------
    # 四个投影与运营侧同名 schema（NeighborItem / NeighborActivity / NeighborVote）
    # **分开写**，不是"少几个字段"：运营侧的 `auditBy` `reportCount` `createdBy`
    # `paidAmount` 都是内部数据，业主侧一个都不能有。
    MpNeighborNotice:
      type: object
      description: 公告（业主视角）。与 PC 后台同一张表，只同步「已发布」
      required: [noticeId, title, type, publishTime, readCount]
      properties:
        noticeId: { type: string, example: NT0090 }
        title: { type: string }
        type:
          type: string
          description: 停水停电 / 收费通知 / 安全提示 / 维修施工 / 政策公告 / 社区活动
        communityId: { type: string, description: 空 = 全公司公告 }
        communityName: { type: string, example: 全公司 }
        publisher: { type: string, description: 发布人姓名（对外可见，物业署名） }
        publishTime: { type: string, example: '2026-09-12 19:13' }
        top: { type: boolean, description: 置顶的排最前 }
        readCount:
          type: integer
          description: 阅读数，**已含自己这一次**。客户端不要再加 1
        targetHouses: { type: integer, description: 应读户数（公告自带，不另算） }
        attachments: { type: integer, description: 附件**数量**。没有文件名，所以客户端只说"不提供下载" }
        content: { type: string }
        signRequired:
          type: boolean
          description: 是否需要签收。只有停水停电与安全提示为 true
        read: { type: boolean }
        signed: { type: boolean }
        signedAt: { type: string, description: 未签收为空串 }

    MpNeighborVote:
      type: object
      description: 投票（意见征询）。**不产生《民法典》278 条的效力，结果里不给"是否通过"**
      required: [voteId, title, status, options, canSeeResult]
      properties:
        voteId: { type: string, example: SV0003, description: 主键在接口层叫 voteId（值仍是 SV0004 这种） }
        title: { type: string }
        type: { type: string, description: 意见征询 / 满意度调查 }
        desc: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        status: { type: string, enum: [进行中, 已结束] }
        startAt: { type: string }
        endAt: { type: string }
        multi: { type: boolean }
        maxPick: { type: integer, description: 单选恒 1 }
        anonymous: { type: boolean }
        resultVisibility: { type: string, enum: [投票后可见, 公开] }
        options:
          type: array
          items: { $ref: '#/components/schemas/MpNeighborVoteOption' }
        target:
          type: integer
          description: |
            应投户数，取 `max(项目内业主数, 票数)`。
            样例的 houses 是裁剪版，不兜底会出现「282 票 / 16 户」；
            真实环境两边同源，兜底不会生效。
        totalVotes: { type: integer, description: 不可见结果时为 0 }
        canSeeResult:
          type: boolean
          description: 已投 / 已结束 / 结果公开。false 时 `options[].votes` 全为 0
        voted: { type: boolean }
        myVote:
          type: array
          description: 自己的选择（对自己不是秘密）。别人的选择在任何字段里都不出现
          items: { type: string }

    MpNeighborVoteOption:
      type: object
      required: [key, label, votes]
      properties:
        key: { type: string, example: A1 }
        label: { type: string, example: 支持人脸识别 }
        votes: { type: integer, description: 已含自己那一票；不可见结果时恒 0 }

    MpNeighborActivity:
      type: object
      description: |
        活动（业主视角）。**不给阶段 phase** —— 阶段依赖"今天"，演示时钟在客户端
        （06/05 是 2026-10-20，服务端数据日是 10-21），两边各算一份必然在临界那天打架。
        客户端用 `activity-rule.mjs` 现算，`enrolled` 用服务端这个真数。
      required: [activityId, title, category, startAt, fee, capacity, enrolled]
      properties:
        activityId: { type: string, example: AC0009 }
        title: { type: string }
        category: { type: string, enum: [敬老, 亲子, 文体, 出游, 公益] }
        cover: { type: integer }
        desc: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        place: { type: string }
        enrollDeadline: { type: string, description: 报名截止日。阶段判定的分界线 }
        capacity: { type: integer }
        minCapacity: { type: integer, description: 成团下限；0 = 无下限（公益场次） }
        fee: { type: number, description: 0 = 免费；> 0 = 收费（成本分摊） }
        needInsurance: { type: boolean, description: true 才收证件号 }
        attendeeLimit: { type: integer, description: 每户最多报几人（含本人） }
        feeInclude: { type: string }
        feeExclude: { type: string }
        refundPolicy:
          type: array
          description: 退款分档，比例随提前天数递减
          items:
            type: object
            properties:
              days: { type: integer }
              ratio: { type: integer }
        organizer: { type: string }
        status: { type: string, description: 已发布 / 已结束（草稿不会出现在列表里） }
        flowedAt: { type: string, description: 非空 = 已流团。阶段判定**先看它再看 status** }
        enrolled: { type: integer, description: 已报名人数（含同行人，不含已取消 / 已退款） }
        mine: { type: boolean }
        myEnroll:
          type: object
          description: |
            本人报名记录（含出行人姓名手机号 —— 那是自己的数据）。
            **未报名时这个键不出现**，不要回 null：客户端 `v-if` 用真值就够。
          properties:
            enrollId: { type: string }
            people: { type: integer }
            amount: { type: number }
            payStatus: { type: string }
            status: { type: string }
            at: { type: string }
            source: { type: string }

    MpNeighborItem:
      type: object
      description: |
        闲置（业主视角）。**只到楼栋**：`sellerHouse` 是完整房号串，
        `sellerPhone` / `wechat` 是联系方式，这三样永远不出现在响应里。
      required: [itemId, title, category, price, status]
      properties:
        itemId: { type: string, example: SH0019 }
        communityId: { type: string }
        communityName: { type: string }
        title: { type: string }
        category: { type: string, example: 家具 }
        price: { type: number, description: 0 = 免费送 }
        originPrice: { type: number }
        condition: { type: string, description: 全新 / 九成新 / 八成新 … }
        cover: { type: integer }
        images: { type: integer }
        desc: { type: string }
        sellerName: { type: string, description: 已脱敏（「林**」） }
        buildingName:
          type: string
          example: 7栋
          description: 只到楼栋。解析不出时为空串，客户端回退成「同小区」
        publishAt: { type: string }
        status: { type: string, enum: [已上架, 待审核, 已驳回, 已下架, 已过期] }
        views: { type: integer }
        wants: { type: integer }
        contactMode: { type: string, enum: [站内私信, 公开] }
        wanted: { type: boolean, description: 我有没有点过"想要" }
        wantCount: { type: integer, description: 已含自己那一次，客户端不要再加 1 }

    MpNeighborNoticeListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpNeighborNotice' }
            total: { type: integer }
            unread: { type: integer, description: 按**全部可见公告**算，不跟 type 筛选走 }

    MpNeighborNoticeEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpNeighborNotice' }

    MpNeighborVoteListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpNeighborVote' }
            total: { type: integer }

    MpNeighborVoteEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpNeighborVote' }

    MpNeighborActivityListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpNeighborActivity' }
            total: { type: integer }

    MpNeighborActivityEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpNeighborActivity' }

    MpNeighborItemListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpNeighborItem' }
            total: { type: integer }
            categories:
              type: array
              description: 从已有内容扫出来的分类，只适合筛选；发布表单的分类写死在前端
              items: { type: string }

    MpNeighborItemEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpNeighborItem' }

    MpNeighborMineEnvelope:
      type: object
      description: 我的邻里内容。六块"我的状态"，公共列表仍由客户端本地渲染
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            noticeReads:
              type: object
              description: '{ noticeId: 首次阅读时间 }。重复已读不刷新时间'
              additionalProperties: { type: string }
            noticeSigns:
              type: object
              description: '{ noticeId: 签收时间 }'
              additionalProperties: { type: string }
            votes:
              type: object
              description: '{ voteId: [选项 key] }，改票覆盖旧值'
              additionalProperties:
                type: array
                items: { type: string }
            wants:
              type: array
              description: 我"想要"的闲置 id
              items: { type: string }
            enrolls:
              type: array
              description: 我的报名（含活动摘要与可否取消），按时间倒序
              items: { $ref: '#/components/schemas/NeighborEnroll' }
            items:
              type: array
              description: 我发布的闲置，按发布时间倒序
              items: { $ref: '#/components/schemas/NeighborItem' }
            unread: { type: integer, description: 未读公告数（本社区已发布 − 已读） }
            counts:
              type: object
              description: 邻里页三个角标
              properties:
                enroll: { type: integer }
                vote: { type: integer }
                item: { type: integer }
                want: { type: integer }

    MpEnrollEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/NeighborEnroll' }

    MpItemEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/NeighborItem' }

    MpOrderListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/MpOrderDetail' }
            total: { type: integer }
            summary:
              type: object
              description: 首页三个角标的来源；与 `/mp/me` 的 counts 同源，别各写一份
              properties:
                doing: { type: integer, description: 待派单 / 已派单 / 处理中 / 待确认 }
                toEvaluate: { type: integer, description: 已完工但还没评价 }
                pendingAddons: { type: integer, description: 有待确认增项的单数 }

    MpPayOrderEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpPayOrder' }

    MpOrderDetail:
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
        - type: object
          description: 业主端在工单基础上补的字段（费用三段 + 增项 + 待付）
          properties:
            priceCode: { type: string }
            priceName: { type: string }
            priceQty: { type: integer }
            appointAt: { type: string, description: 预约上门时间 }
            appointSlot: { type: string, description: 上门时段，1 小时粒度，见 `POST /mp/orders` 的说明 }
            originFee: { type: number, description: 材料 + 人工（未含增项） }
            addonFee: { type: number, description: 已确认增项合计 }
            totalFee: { type: number, description: 合计 = originFee + addonFee }
            paidAmount: { type: number, description: 已预付 }
            dueFee: { type: number, description: 待付 = totalFee - paidAmount }
            paidAt: { type: string }
            addons:
              type: array
              items: { $ref: '#/components/schemas/MpAddon' }
            timeline:
              type: array
              description: 进度节点（由字段推导，不另存节点表）
              items:
                type: object
                properties:
                  key: { type: string, enum: [create, accept, arrive, addon, finish, eval] }
                  label: { type: string }
                  at: { type: string }
                  done: { type: boolean }
                  note: { type: string }
            payOrder: { $ref: '#/components/schemas/MpPayOrder' }

    MpOrderDetailEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/MpOrderDetail' }

    MpOrderCreatedEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            order: { $ref: '#/components/schemas/MpOrderDetail' }
            payOrder: { $ref: '#/components/schemas/MpPayOrder' }

    MpSimulateEnvelope:
      type: object
      description: 模拟支付成功。真实接入时这里换成"查询支付结果"，且只在服务端收到渠道回调后才可能为已支付
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            payOrder: { $ref: '#/components/schemas/MpPayOrder' }
            order: { $ref: '#/components/schemas/MpOrderDetail', description: type=wo 时返回 }
            bills:
              type: array
              description: type=bill 时返回冲账后的账单
              items: { $ref: '#/components/schemas/Bill' }
    DeptPlanItem:
      type: object
      description: |
        一条考核项。三段共用这个结构，靠 `section` 区分 —— 不同段用到的字段不同：

        | 字段 | 量化 q | 监控 m | 重点 k |
        |---|---|---|---|
        | `weight` | 提报人填 | **恒为 0** | 提报人填 |
        | `target` | 目标值 | — | — |
        | `direction` | 正/逆向 | — | — |
        | `actual` | 实际数值 | 情况说明 | 完成情况 |
        | `selfScore` | 服务端算 | — | 人工 1–5 |
        | `selfWeighted` | 派生 | 手填扣分 | 派生 |

        提报时整份拷贝自模板，之后模板改动不回写。
        **权重不是模板带出来的**：新建计划时按条目数平均预填 100%，
        提报人再按本月重点调整；审核阶段运营管理部也可以改。
      required: [section, name, weight]
      properties:
        taskId: { type: string, example: PL202610002-I01 }
        itemId: { type: string, description: 来源模板条目，便于追溯 }
        section:
          type: string
          enum: [q, m, k]
          description: 量化 / 监控 / 重点
        name: { type: string, maxLength: 40 }
        content: { type: string, description: 计划内容（重点项提报时填） }
        standard: { type: string, description: 完成标准 / 监控项的扣分规则文字 }
        weight:
          type: number
          description: |
            权重（0–100 的百分数）。**必须是 5 的倍数**（10 / 15 / 20…），
            且**所有计分项合计必须正好 100%**，监控项恒 0。
            不符合时提交审核与审核下发都会被拒（422/42212）；草稿不卡（写到一半要能存）。
        direction:
          type: integer
          enum: [1, -1]
          description: 1 正向（越高越好）；-1 逆向（成本能耗类，越低越好）
        unit: { type: string, example: 元 }
        target:
          oneOf:
            - type: number
            - type: string
          description: 目标值。为 0 或空时自评公式失效，退回人工打分
        dueDate: { type: string, example: '2026-10-31' }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
        actual:
          oneOf:
            - type: number
            - type: string
          description: 实际完成。量化是数值，监控/重点是文字
        actualNote: { type: string }
        selfScore:
          type: number
          description: 自评分。量化项由服务端算（夹 1–5），重点项人工填，监控项为空
        selfWeighted:
          type: number
          description: 自评加权 = 分 × 权重/100；监控项是手填的扣分（负数）
        reviewScore:
          type: number
          description: 复评分 1–5，复评后才有
        reviewWeighted:
          type: number
          description: 复评加权
        remark: { type: string }
        execStatus:
          type: string
          enum: [未开始, 进行中, 已完成, 延期]
          description: 派生，不让用户手选（手选必然与实际完成打架）

    DeptPlan:
      type: object
      description: |
        一份部门月度计划。`items` 是提报时从模板拷贝的快照，**权重也在快照里** ——
        之后模板改条目、运营管理部改权重，都不回写这一份。

        **总分是 5 分制**（各项权重合计 100，所以自评合计满分就是 5 分），不是百分制。
        权重只有一个约束：**各项合计正好 100%**，没有"段权重"这一层了。
      properties:
        planId: { type: string, example: PL202610001 }
        planMonth: { type: string, example: '2026-10' }
        orgId: { type: string }
        orgName: { type: string }
        orgPath: { type: string }
        orgType: { type: string }
        projectId: { type: string }
        tplId: { type: string }
        tplName: { type: string }
        tplVersion: { type: integer }
        submitterName: { type: string }
        submitterDuty:
          type: string
          enum: [正职, 副职, 代理]
          description: 提报时的身份，落库是为了以后能解释"当时凭什么提的"
        status:
          type: string
          enum: [草稿, 审批中, 已批准, 已驳回, 执行中, 待复评, 已结案]
        items:
          type: array
          items: { $ref: '#/components/schemas/DeptPlanItem' }
        weightTotal: { type: number, description: 派生：本计划各项权重合计，应为 100 }
        weightQs: { type: number, description: 派生：量化段合计（列表上显示"量 x% / 重 y%"用） }
        weightKs: { type: number, description: 派生：重点段合计 }
        weightDiff: { type: number, description: 派生：100 − weightTotal；正数=还差、负数=超出 }
        weightOk: { type: boolean, description: 派生：是否正好 100% }
        weightMsg: { type: string, description: 派生：不闭合时的原因（页面直接展示） }
        finishRate: { type: number, description: 派生：按自评加权折算的完成率（%） }
        selfTotal: { type: number, description: 派生：自评加权合计（满分 5） }
        reviewTotal: { type: number, description: 派生：复评加权合计（满分 5） }
        totalScore:
          type: number
          description: 派生：只有已结案有值，= 自评合计×20% + 复评合计×80%
        grade:
          type: string
          enum: ['', A, B, C, D]
        reviseLog:
          type: array
          description: 审核阶段运营管理部的直改记录，逐条留痕
          items:
            type: object
            properties:
              field: { type: string, example: 目标值 }
              item: { type: string, description: 哪一条考核项 }
              before: {}
              after: {}
              at: { type: string }
              by: { type: string }

    DeptPlanInput:
      type: object
      required: [planMonth, orgId, items]
      properties:
        planMonth: { type: string, example: '2026-10' }
        orgId: { type: string, example: O-P01-T4 }
        tplId: { type: string }
        tplName: { type: string }
        tplVersion: { type: integer }
        summary: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DeptPlanItem' }

    DeptPlanStats:
      type: object
      description: |
        三个维度：按项目部门、按计划状态、按条目执行情况/得分档位。
        注意「计划状态」和「条目执行情况」是两个维度 —— 一份计划里可以有 3 项完成、2 项延期。
      properties:
        total: { type: integer }
        totalItems: { type: integer }
        closed: { type: integer, description: 已归档份数 }
        pendingReview: { type: integer, description: 待复评份数 }
        avgScore: { type: number, description: 只算已归档，5 分制 }
        avgFinish: { type: number }
        byOrg:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
              plans: { type: integer }
              tasks: { type: integer }
              closed: { type: integer }
              avgScore: { type: number }
              avgFinish: { type: number }
              lateTasks: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
        byExec:
          type: array
          description: 条目维度的执行分布
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
        byGrade:
          type: array
          items:
            type: object
            properties:
              grade: { type: string }
              label: { type: string }
              min: { type: number }
              max: { type: number }
              count: { type: integer }

    DeptPlanEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/DeptPlan' }
    DeptPlanPageEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: object
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/DeptPlan' }
            total: { type: integer }
            pageNo: { type: integer }
            size: { type: integer }
    OrgLeader:
      type: object
      description: |
        组织负责人关系。一个部门可以有多个：正职唯一、副职可多个、代理必须带结束日期。

        **审批只认正职**（正职空缺才落到在期代理），副职是分工不是授权。
        `orgs.leader` 只是展示快照，判断"谁是审批人"必须读这张表。
      properties:
        id: { type: string, example: OL0001 }
        orgId: { type: string }
        empId: { type: string }
        name: { type: string, description: 由服务端按 empId 补全，不落库 }
        position: { type: string }
        duty:
          type: string
          enum: [正职, 副职, 代理]
        startDate: { type: string, description: 空 = 一直在任；填了就到那天才生效 }
        endDate: { type: string, description: 代理必填；过了这天自动失效 }
        note: { type: string }
        state:
          type: string
          enum: [在期, 已结束, 未生效]
          description: 按当天算的派生字段
        active: { type: boolean }
        empStatus: { type: string, description: 员工状态；离职员工留着关系会显示 warn }
    OrgLeaderInput:
      type: object
      required: [empId, duty]
      properties:
        id: { type: string, description: 空 = 新增 }
        empId: { type: string }
        duty: { type: string, enum: [正职, 副职, 代理] }
        startDate: { type: string }
        endDate: { type: string, description: 代理必填 }
        note: { type: string }
    PlanTemplateItem:
      type: object
      description: |
        一个考核项。三段共用这个结构，靠 `section` 区分，不同段用到的字段不同——

        | 字段 | 量化 q | 监控 m | 重点 k |
        |---|---|---|---|
        | `direction` | 正/逆向 | 不用 | 不用 |
        | `targetDefault` | 目标值默认 | 不用 | 不用 |
        | `standard` | 空（由目标值算） | 扣分规则文字 | 空 |

        **模板条目没有 `weight`**（第 60 批）：权重属于计划，不属于模板。
        同一套考核项，不同项目当月的重点本来就不同；写死在模板里，要么所有人按同一比例，
        要么每个月改一遍模板，还会把历史版本的分数搅乱。

        `standard` 里的「最高扣 0.2 分」这类上限**本期不做解析、不做校验**，
        系统只存文字、只展示；扣多少分由人填。要真做封顶得先定清楚
        「降一档」这种非数值规则怎么表达。
      required: [section, name]
      properties:
        itemId: { type: string, example: PT01-01 }
        section:
          type: string
          enum: [q, m, k]
          description: 量化 / 监控 / 重点
        name: { type: string, maxLength: 40, example: 物业费清欠 }
        standard:
          type: string
          description: 评价标准。量化和重点留空，监控写扣分规则
        direction:
          type: integer
          enum: [1, -1]
          description: 1 正向（越高越好，收入类）；-1 逆向（越低越好，成本能耗类）
        targetDefault:
          oneOf:
            - type: number
            - type: string
          description: 目标值默认值，提报时带出；可留空让填报人自己填
        unit: { type: string, example: 元 }
        enabled: { type: boolean, default: true }

    PlanTemplate:
      type: object
      description: |
        一套计划模板。**模板里没有权重**（第 60 批）：它只定「考什么、怎么算分」，
        「每项占多少」由提报人在新建计划时逐项填，审核阶段运营管理部可调。

        模板改动**不影响已经提报的计划** —— 提报时整份拷贝成快照（条目 + 权重），
        否则调一次考核项，历史上已归档的分数会跟着变。
      properties:
        tplId: { type: string, example: PT01 }
        name: { type: string, example: 项目经理月度计划 }
        desc: { type: string }
        matchType:
          type: string
          enum: [项目, 班组, 职能]
          description: 自动匹配用。职能是兜底，管总部职能部门
        matchSuffix:
          type: string
          enum: ['', '1', '2', '3', '4']
          description: matchType=班组时必填，对应 T1 客服 / T2 工程 / T3 秩序 / T4 环境
        enabled: { type: boolean, description: 停用不影响已提报的计划 }
        version: { type: integer, description: 每保存一次 +1，提报时记进计划 }
        updatedAt: { type: string }
        updatedBy: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlanTemplateItem' }
        qCount: { type: integer, description: 派生：量化条目数 }
        mCount: { type: integer, description: 派生：监控条目数 }
        kCount: { type: integer, description: 派生：重点条目数 }
        checkOk: { type: boolean, description: 派生：内容校验是否通过（名称/类型/两段非空） }
        checkErrs:
          type: array
          description: 派生：不通过时的原因清单（页面直接展示，不在前端重算）
          items: { type: string }

    PlanTemplateInput:
      type: object
      description: 模板输入。**没有 wq / wk / weight** —— 权重在计划上填。
      required: [name, matchType, items]
      properties:
        name: { type: string, maxLength: 20 }
        desc: { type: string, maxLength: 60 }
        matchType: { type: string, enum: [项目, 班组, 职能] }
        matchSuffix: { type: string, enum: ['', '1', '2', '3', '4'] }
        items:
          type: array
          description: 全量提交，不传则是空模板（会被校验拦下）
          items: { $ref: '#/components/schemas/PlanTemplateItem' }

    PlanTemplateStats:
      type: object
      properties:
        total: { type: integer, example: 6 }
        enabled: { type: integer }
        disabled: { type: integer }
        items: { type: integer, description: 全部模板的考核项总数 }
        broken: { type: integer, description: 权重校验不通过的模板数，正常应为 0 }

    PlanTemplateEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: { $ref: '#/components/schemas/PlanTemplate' }

    PlanTemplateListEnvelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/PlanTemplate' }

    AssetCategory:
      type: object
      description: |
        资产分类（树，`parentId` 自引用）。**最多两级** —— 三级在录入时选不出来，实际也用不到。
      properties:
        catId: { type: string, example: AC0002 }
        name: { type: string, maxLength: 12, example: 电脑 }
        parentId: { type: string, description: 空 = 一级分类 }
        prefix: { type: string, description: 编码前缀，新增资产时用来建议资产编码，如 BG-01 }
        sort: { type: integer, example: 10 }
        note: { type: string }
        enabled: { type: boolean, description: 停用后不能再往里新增资产，已有资产保留 }
        catPath: { type: string, example: 办公设备 / 电脑 }
        depth: { type: integer, description: 1 = 一级，2 = 二级 }
        leaf: { type: boolean }
        childCount: { type: integer }
        assetCount: { type: integer, description: 本级资产数 }
        assetCountAll: { type: integer, description: 含全部下级的资产数 }
        canDelete:
          type: boolean
          description: 有子分类或有资产时为 false（删除会返回 409/40927）
    AssetCategoryNode:
      allOf:
        - $ref: '#/components/schemas/AssetCategory'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/AssetCategoryNode' }
    AssetCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 12 }
        parentId: { type: string, description: 空 = 一级分类；指向二级会被拒（最多两级） }
        prefix: { type: string }
        sort: { type: integer }
        note: { type: string }

    Asset:
      type: object
      description: |
        一件办公资产。注意这是**办公物品**（电脑 / 桌椅 / 工具），
        不是 D 域的 IoT 设备（门禁 / 摄像头）。
      required: [assetId, assetNo, name, catId, status]
      properties:
        assetId: { type: string, example: AS0001 }
        assetNo:
          type: string
          description: 资产编号，`ZC{年}{4位流水}`。**服务端生成、永不可改**（标签已贴在实物上）
          example: ZC20260001
        name: { type: string, maxLength: 40 }
        catId: { type: string }
        catName: { type: string, description: 分类名**快照**，分类改名不回写 }
        catPath: { type: string, description: 分类全路径快照 }
        assetCode: { type: string, description: 资产编码，可自定义（如 BG-PC-001）；与 assetNo 不是一回事 }
        brand: { type: string }
        model: { type: string }
        sn: { type: string, description: 序列号。**不出现在扫码公开接口里**（可被拿去伪造保修） }
        buyDate: { type: string, example: '2024-03-15' }
        price:
          type: number
          nullable: true
          description: 购置原值。本期**不做折旧**，没有净值字段
        vendor: { type: string }
        warrantyEnd: { type: string, example: '2027-03-15' }
        holderEmpId: { type: string, description: 使用人；空 = 未分配 }
        holderName: { type: string, description: 服务端按 empId 补全 }
        orgId: { type: string, description: 使用部门（成本归属），可以不是使用人所在部门 }
        orgName: { type: string }
        location: { type: string }
        status:
          type: string
          enum: [闲置, 在用, 报废]
          description: |
            **描述性字段，不是流程状态**。本期没有领用 / 归还 / 报废单据，
            所以不能拿它推断「资产在谁手上」—— 要看就看 `holderEmpId`。
        remark: { type: string }
        files:
          type: array
          description: |
            **设备图片**（图片附件）。存在资产上，不单独开表 —— 图片脱离资产没有意义。

            三条限制：最多 **6 张**、单张 ≤ **5MB**、只收 jpeg / png / webp / gif。
            超过任一条返回 422；真实实现应存对象存储的 URL，**不要**把 base64 塞进数据库行里。

            **不在扫码公开视图里**：照片是现场随手拍的，背景里常有工位、白板、同事，
            公开出去不是"设备长什么样"的问题。
          items:
            type: object
            properties:
              fileId: { type: string, example: AF0001 }
              kind: { type: string, enum: [image], description: 预留：以后要放说明书 PDF 时扩枚举 }
              name: { type: string, example: 联想 E14 正面.jpg }
              url: { type: string, description: 图片地址；原型里是 data URL，生产是对象存储 URL }
              size: { type: integer, description: 字节数 }
              mime: { type: string, example: image/jpeg }
              at: { type: string }
              by: { type: string, description: 上传人 }
        qrToken: { type: string, description: 16 位随机串，与编号无关；扫码页按它取数 }
        createdAt: { type: string }
        createdBy: { type: string }
        logs:
          type: array
          description: 变更记录（详情返回；列表不返回）
          items: { $ref: '#/components/schemas/AssetLog' }
        _ver: { type: integer, description: 乐观锁版本号 }
    AssetInput:
      type: object
      required: [name, catId]
      properties:
        name: { type: string, maxLength: 40 }
        catId: { type: string }
        assetCode: { type: string }
        brand: { type: string }
        model: { type: string }
        sn: { type: string }
        buyDate: { type: string }
        price: { type: number, nullable: true }
        vendor: { type: string }
        warrantyEnd: { type: string }
        holderEmpId: { type: string }
        orgId: { type: string }
        location: { type: string }
        status: { type: string, enum: [闲置, 在用, 报废], default: 闲置 }
        remark: { type: string }
        files:
          type: array
          description: |
            设备图片，整单提交（增删都在里面，按 fileId + 名称 + url 比对，只换顺序不算改动）。
            超过 6 张 / 非图片 / 单张超 5MB 一律 422。
          items:
            type: object
            properties:
              fileId: { type: string }
              kind: { type: string, enum: [image] }
              name: { type: string }
              url: { type: string }
              size: { type: integer }
              mime: { type: string }
    AssetLog:
      type: object
      description: |
        变更记录的一条。没有领用单，这一层就是唯一的「谁在什么时候改了什么」。
      properties:
        logId: { type: string, example: AL00001 }
        assetId: { type: string }
        at: { type: string }
        by: { type: string }
        field: { type: string, example: status }
        fieldLabel: { type: string, example: 状态 }
        # 图片也走这张表：field='files'、fieldLabel='设备图片'，before/after 只写「3 张：a.jpg、b.jpg」；
        # 把 base64 写进日志会让变更记录几秒钟就变成一屏乱码
        before: { type: string, example: 闲置 }
        after: { type: string, example: 在用 }
    AssetPublicView:
      type: object
      description: |
        扫码公开视图。**只有这 7 个字段**，与 `Asset` 是两套结构，不是「少给几个的 Asset」。
        设备图片（`files`）**也不给**：照片背景里常有工位和同事，扫码页是免登录的。
      properties:
        ok: { type: boolean }
        scrapped: { type: boolean, description: 已报废仍可查，页面顶部加灰条 —— 历史要能追溯 }
        asset:
          type: object
          properties:
            name: { type: string }
            assetNo: { type: string }
            catPath: { type: string }
            status: { type: string, enum: [闲置, 在用, 报废] }
            orgName: { type: string, description: 使用部门（**不返回使用人姓名**） }
            location: { type: string }
            warrantyEnd: { type: string }
            warrantyExpired: { type: boolean }

    NeighborTodoEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, reports, total]
              properties:
                items: { type: integer, description: 本项目待审核闲置数 }
                reports: { type: integer, description: 本项目待处理举报数 }
                total: { type: integer }

    NeighborItem:
      type: object
      required: [itemId, title, status, price]
      properties:
        itemId: { type: string, example: SH0101 }
        title: { type: string }
        category: { type: string, example: 家具 }
        price: { type: number, description: 0 = 免费赠送 }
        originPrice: { type: number }
        freeGive: { type: boolean }
        condition: { type: string, example: 九成新 }
        images: { type: integer, description: 图片张数（原型不存图） }
        desc: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        sellerName: { type: string, description: 已脱敏展示名 }
        sellerType: { type: string, enum: [业主, 租户] }
        sellerHouse: { type: string, description: 'P01-003-0602；移动端只展示楼栋' }
        contactMode: { type: string }
        publishAt: { type: string }
        status: { type: string, enum: [待审核, 已上架, 已驳回, 已下架, 已售出, 已过期] }
        rejectReason: { type: string }
        auditBy: { type: string, description: 审核经办人（移动端传登录人） }
        auditAt: { type: string }
        reportCount: { type: integer }

    NeighborItemEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NeighborItem' }

    NeighborItemListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/NeighborItem' }
                total: { type: integer }

    NeighborReport:
      type: object
      required: [reportId, itemId, reason, status]
      properties:
        reportId: { type: string, example: RP0101 }
        itemId: { type: string }
        itemTitle: { type: string }
        itemStatus: { type: string }
        communityId: { type: string, description: 取被举报内容的项目（举报记录本身没有） }
        communityName: { type: string }
        sellerName: { type: string }
        sellerHouse: { type: string }
        reason: { type: string, enum: [虚假信息, 违禁品, 骚扰辱骂, 疑似诈骗, 重复刷屏, 其他] }
        detail: { type: string }
        reporterName: { type: string }
        reporterHouse: { type: string }
        at: { type: string }
        status: { type: string, enum: [待处理, 已处理] }
        action: { type: string, enum: [忽略, 仅警告, 下架并警告, 封禁 7 天] }
        note: { type: string }
        handledBy: { type: string, description: 处理人（移动端传登录人） }
        handledAt: { type: string }

    NeighborReportEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NeighborReport' }

    NeighborReportListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/NeighborReport' }
                total: { type: integer }

    NeighborActivity:
      type: object
      required: [activityId, title, phase, fee]
      properties:
        activityId: { type: string, example: AC0016 }
        title: { type: string }
        category:
          type: string
          enum: [敬老, 亲子, 文体, 出游, 公益]
          description: |
            活动**类别**。与收费与否是两回事：敬老活动也可以收成本费。
            第 70 批从 `type` 里拆出来的 —— 之前两种含义挤在一个字段里，
            列表上会同时出现「亲子」和「收费」，按类型筛选等于筛了个寂寞。
        feeType:
          type: string
          enum: [免费, 收费]
          description: |
            由 `fee > 0` 派生，**不落库**。
            值用「免费 / 收费」而不是「公益 / 收费」：类别里已经有一个「公益」，
            两个维度同词必然有人填错。这两者正交：公益类别的活动也可以是收费的。
        fee: { type: number, description: 0 = 公益 }
        feeText: { type: string, example: ¥168/人 }
        communityId: { type: string }
        communityName: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        place: { type: string }
        capacity: { type: integer }
        minCapacity: { type: integer, description: 成团下限 }
        enrollDeadline: { type: string }
        enrolled: { type: integer }
        left: { type: integer }
        fillRate: { type: number, description: 进度条用，上限 100（超额单独给 over） }
        over: { type: integer, description: '超出名额的人数；种子里有 42/20 的活动' }
        gap: { type: integer, description: 距成团还差几人 }
        phase: { type: string, enum: [草稿, 报名中, 待成行, 已成行, 已流团, 已结束] }
        phaseType: { type: string, description: 阶段标签色（PC 用） }
        needInsurance: { type: boolean }
        attendeeLimit: { type: integer, description: 每户限报人数 }
        feeInclude: { type: string }
        feeExclude: { type: string }
        refundPolicy:
          type: array
          description: 退款分档；金额由服务端按它算，客户端不可手改
          items:
            type: object
            properties:
              days: { type: integer, description: 提前天数 }
              ratio: { type: number, description: 退款百分比 }
        paidAmount: { type: number }
        organizer: { type: string }
        desc: { type: string }
        createdBy: { type: string }
        flowedAt: { type: string, description: 确认流团的时间；有值即"已流团" }
        flowReason: { type: string, description: 流团原因，会发通知给报名人 }

    NeighborActivityEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NeighborActivity' }

    NeighborActivityListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/NeighborActivity' }
                total: { type: integer }

    NeighborEnroll:
      type: object
      required: [enrollId, activityId, name, people, status]
      properties:
        enrollId: { type: string, example: AE0301 }
        activityId: { type: string }
        activityTitle: { type: string }
        name: { type: string }
        phone: { type: string, description: 列表掩码、详情明文 }
        houseShort: { type: string }
        people: { type: integer }
        at: { type: string }
        status: { type: string, enum: [已报名, 已签到, 已取消, 已退款, 候补中] }
        fee: { type: number }
        amount: { type: number }
        payStatus: { type: string, enum: [已支付, 待支付, 已退款, 无需支付] }
        source: { type: string, enum: [前台代报, 业主自助] }
        operator: { type: string, description: 经办人（代报名时记录） }
        paymentMethod: { type: string, enum: ['', 现金, 扫码] }
        checkinBy: { type: string }
        checkinAt: { type: string }
        refundAmount: { type: number }
        refundBy: { type: string }
        cancelReason: { type: string }
        attendees:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              idType: { type: string }
              idNo: { type: string, description: 需投保时必填 }
              phone: { type: string }
              ageType: { type: string, enum: [成人, 儿童] }

    NeighborEnrollEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NeighborEnroll' }

    NeighborEnrollListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/NeighborEnroll' }
                total: { type: integer }

    NeighborEnrollRequest:
      type: object
      required: [name, phone, people]
      properties:
        name: { type: string, maxLength: 20 }
        phone: { type: string, pattern: '^1\\d{10}$' }
        houseShort: { type: string, description: 房号，对账用 }
        people: { type: integer, minimum: 1, description: 不超过 attendeeLimit }
        attendees:
          type: array
          description: needInsurance=true 时必须与 people 等长，且每人姓名 + 证件号
          items:
            type: object
            properties:
              name: { type: string }
              idType: { type: string }
              idNo: { type: string }
              ageType: { type: string }
        paid: { type: boolean, description: 'true=现场已收款' }
        paymentMethod: { type: string, enum: [现金, 扫码] }
        operator: { type: string, description: 经办人 }
        remark: { type: string, maxLength: 80 }

    # ---------------- 邻里 · 投票（意见征询） ----------------

    NeighborVoteOption:
      type: object
      required: [key, label, votes]
      properties:
        key: { type: string, example: A1, description: 服务端生成，票按它记 }
        label: { type: string, example: 很满意 }
        votes: { type: integer }

    NeighborVote:
      type: object
      required: [voteId, title, type, status, options, totalVotes, target, partRate]
      description: |
        一条投票。**没有 `passed` / `conclusion` 这类字段**，是刻意不设（见 `/result` 的说明）。

        `voteId` 的值就是问卷表的 `surveyId`（`SV0004` 这种），不新造编号：
        同一个东西两个编号，对账时永远差一条。
      properties:
        voteId: { type: string, example: SV0004 }
        title: { type: string }
        type:
          type: string
          enum: [满意度调查, 意见征询, 方案征询]
          description: 页面分组用；不决定能不能投票
        communityId: { type: string }
        communityName: { type: string }
        desc: { type: string }
        audience: { type: string, example: 全部业主, description: 征询范围（当前只有全部业主） }
        startAt: { type: string, description: 'YYYY-MM-DD；草稿为空，发布时置为当天' }
        endAt: { type: string, format: date }
        status: { type: string, enum: [草稿, 进行中, 已结束] }
        statusType: { type: string, description: 标签色（PC 列表用；业主端按 status 自己映射） }
        multi: { type: boolean, description: 多选 }
        maxPick: { type: integer, description: '多选上限；单选恒为 1' }
        anonymous: { type: boolean }
        optionCount: { type: integer, description: 列表页不展开选项时用 }
        options:
          type: array
          items: { $ref: '#/components/schemas/NeighborVoteOption' }
        totalVotes: { type: integer, description: 选项票数之和（不是种子里的同名字段） }
        target:
          type: integer
          description: |
            参与率的分母，取 `max(应投户数, 票数)`。
            应投户数 = 项目内去重业主数（租户不计）；票数兜底是为了让参与率不超 100%
            —— 种子的票数是独立随机生成的，出现过 310 票 / 189 户。
        partRate: { type: number, description: 参与率，恒 ≤100 }
        createdBy: { type: string }
        createdAt: { type: string }
        publishedAt: { type: string, description: 草稿为空 }
        endedAt: { type: string, description: 未结束为空 }

    NeighborVoteEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/NeighborVote' }

    NeighborVoteListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/NeighborVote' }
                total: { type: integer }

    NeighborVoteStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [total, running, draft, ended, runningPartRate, endedPartRate, votesTotal]
              properties:
                total: { type: integer }
                running: { type: integer, description: 进行中 }
                draft: { type: integer }
                ended: { type: integer }
                runningPartRate: { type: number, description: 进行中场次的平均参与率 }
                endedPartRate: { type: number, description: 已结束场次的平均参与率 }
                votesTotal:
                  type: integer
                  description: |
                    票数合计（多选一票勾两项算两票）。
                    要"参与户数"必须从投票记录表按 `ownerId` 去重 —— 别拿这个当户数用。

    NeighborVoteResultOption:
      allOf:
        - $ref: '#/components/schemas/NeighborVoteOption'
        - type: object
          required: [pct]
          properties:
            pct: { type: number, description: 按票数算的占比，合计 100% }

    NeighborVoteResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/NeighborVote'
                - type: object
                  required: [options, topOption, confidence, notVoted, target]
                  description: |
                    分布 + 参与率 + 样本提示。**没有结论字段，也不留空壳**。
                  properties:
                    options:
                      type: array
                      description: 按票数降序
                      items: { $ref: '#/components/schemas/NeighborVoteResultOption' }
                    topOption:
                      allOf:
                        - $ref: '#/components/schemas/NeighborVoteResultOption'
                      description: 票数最高的选项（用于列表页首行摘要）
                    confidence:
                      type: string
                      enum: [有效, 可参考, 偏低]
                      description: |
                        样本提示：参与率 ≥50% 有效 / ≥30% 可参考 / 否则偏低。
                        这是给人看的提醒（"只有 12% 的人投了"），不是表决结论。
                    notVoted: { type: integer, description: 'target − 票数，恒 ≥0' }

    NeighborVoteRequest:
      type: object
      required: [title, type, communityId, endAt, options]
      properties:
        title: { type: string, maxLength: 40 }
        type: { type: string, enum: [满意度调查, 意见征询, 方案征询] }
        desc: { type: string, maxLength: 300 }
        communityId: { type: string, description: 一期一项目，不跨项目发 }
        endAt: { type: string, format: date, description: 发布时不能早于当天 }
        multi: { type: boolean }
        maxPick: { type: integer, minimum: 1, description: 多选时必填，不超过选项数 }
        anonymous: { type: boolean, description: 默认 true }
        audience: { type: string, description: 默认「全部业主」 }
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: 只收 label；key 由服务端生成（A1/A2…），不收客户端 key。选项不许重复
          items:
            type: object
            required: [label]
            properties:
              label: { type: string, maxLength: 30 }
    # ---------------- 邻里 · 活动（运营侧） ----------------

    NeighborActivityRequest:
      type: object
      required: [title, category, communityId, startAt, endAt, place, capacity, enrollDeadline]
      properties:
        title: { type: string, maxLength: 40 }
        category:
          type: string
          enum: [敬老, 亲子, 文体, 出游, 公益]
          description: |
            活动**类别**，必填。收费与否不在这里 —— 看 `fee`。
            两者正交：敬老活动可以免费（茶话会），也可以收费（一日游）。
        desc: { type: string, maxLength: 500 }
        communityId: { type: string }
        startAt: { type: string, description: 'YYYY-MM-DD 或 YYYY-MM-DD HH:mm' }
        endAt: { type: string, description: 不能早于 startAt }
        place: { type: string, description: 必填 —— 业主报名后要知道去哪 }
        enrollDeadline:
          type: string
          format: date
          description: 必填，且不能晚于 startAt。活动开始了还在收人，车已经走了
        capacity: { type: integer, minimum: 1, description: 不能小于已报名人数 }
        minCapacity: { type: integer, description: '`fee > 0` 时必填，≥1 且 ≤ capacity' }
        fee:
          type: number
          minimum: 0
          description: |
            0 = 免费；> 0 = 收费。
            `fee > 0` 时**必须**同时给 `minCapacity` 与 `refundPolicy`，否则 422
            —— 收完钱团没成、又没有退款依据，是最难收拾的一类纠纷。
            注意：想办收费活动却忘填单价会静默变成免费活动，前端要在提交前拦一道。
        needInsurance: { type: boolean, description: 'true 时报名逐人收证件号' }
        attendeeLimit: { type: integer, minimum: 1, description: 每户限报人数 }
        feeInclude: { type: string }
        feeExclude: { type: string }
        refundPolicy:
          type: array
          description: |
            `fee > 0` 时必填。比例必须**随提前天数减少而降低**（提前越久退得越多，
            反过来就是在惩罚早取消的人），服务端会逐档校验。
          items:
            type: object
            required: [days, ratio]
            properties:
              days: { type: integer, minimum: 0, description: 提前天数 }
              ratio: { type: number, minimum: 0, maximum: 100, description: 退款百分比 }
        organizer: { type: string }

    NeighborActivityStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [total, running, waiting, odd, flowed, paidAmount, enrollPeople, gapTotal]
              properties:
                total: { type: integer, description: 全部活动数（含草稿与已结束） }
                running: { type: integer, description: 报名中 }
                waiting: { type: integer, description: 待成行 }
                odd: { type: integer, description: 已成行 }
                flowed: { type: integer, description: 已流团 }
                paidAmount: { type: number, description: 收费活动的已收金额（含同行人） }
                enrollPeople: { type: integer, description: 有效报名人次（不含已取消 / 已退款） }
                gapTotal:
                  type: integer
                  description: |
                    「待成行」场次一共还差多少人成团。
                    差 2 人的和三场各差 20 人的，动作完全不同 —— 这个数比场次数有用。

    NeighborRefundRatioEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: number
              description: |
                退款百分比（0~100）。**就是一个数字**，不是对象 ——
                档位表在活动详情的 `refundPolicy` 里，这里只回"按今天算能退几成"。
                没有退款档位的活动（公益）恒返回 100。

    NeighborEnrollStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [total, people, checkedIn, cancelled, refunded, paidAmount, refundAmount, capacity, gap, phase]
              properties:
                total: { type: integer, description: 全部报名记录数（含已取消 / 已退款） }
                people: { type: integer, description: 有效报名人数（含同行人） }
                checkedIn: { type: integer }
                cancelled: { type: integer }
                refunded: { type: integer }
                paidAmount: { type: number, description: 收费活动的已收金额 }
                refundAmount: { type: number, description: 已退金额合计 }
                capacity: { type: integer }
                minCapacity: { type: integer }
                gap: { type: integer, description: 距成团还差几人（已成行为 0） }
                phase: { type: string, enum: [草稿, 报名中, 待成行, 已成行, 已流团, 已结束] }

    # ---------------- 邻里 · 闲置与举报（统计） ----------------

    NeighborItemStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [total, pending, online, rejected, offline, expired]
              properties:
                total: { type: integer }
                pending: { type: integer, description: 待审核 }
                online: { type: integer, description: 已上架 }
                rejected: { type: integer }
                offline: { type: integer }
                expired: { type: integer }
                todayNew: { type: integer, description: 今天新发（含待审） }
                passRate: { type: number, description: '已审内容的通过率 = 已上架 /(已上架+已驳回)' }
                reported:
                  type: integer
                  description: |
                    内容上的举报次数**累计值**。注意它与"待处理举报数"不是一回事：
                    这个数只增不减，被处理过的举报仍然留在里面，拿它当待办角标会一直红。

    NeighborItemCategoriesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              description: |
                分类名数组（`["家电","家具",...]`），从**已有内容**里扫出来的，
                顺序不保证。所以它只适合筛选，不适合发布表单 ——
                发布时能选的分类要写死在前端（否则某个分类今天没人挂，
                明天就发不出去了）。

              items: { type: string, example: 家具 }


    # ---------------- 业主自助挂牌（mp 组） ----------------

    MpListing:
      type: object
      required: [listingId, status, price, contentType]
      description: |
        业主视角的一条挂牌。与后台 `Listing` 的区别：
        **可以带房号**（这是业主自己的房），但**不带** `ownerId` / `ownerPhone` /
        `stewardPhone` / `stewardEmpId` —— 业主不需要知道自己的档案号，更不需要知道楼管手机。

        标签色由前端按 `status` 映射，服务端不返回颜色值：
        同一状态在 PC 与小程序要两种色值，接口跟着端变是最难维护的一类耦合。
      properties:
        listingId: { type: string, example: LS00001 }
        houseId: { type: string }
        communityName: { type: string }
        buildingName: { type: string }
        unitName: { type: string }
        room: { type: string }
        houseShort: { type: string, example: P01-012-0602 }
        houseType: { type: string, description: 派生，不可改 }
        area: { type: number }
        orientation: { type: string }
        floor: { type: integer }
        contentType: { type: string, enum: [出租, 出售] }
        price: { type: number, description: 出租为元/月，出售为总价 }
        deposit: { type: number }
        payTerm: { type: string, enum: [押一付一, 押一付三, 押二付一, 半年付, 年付] }
        decorate: { type: string, enum: [毛坯, 简装, 精装, 豪装] }
        facilities:
          type: array
          items: { type: string }
        availableFrom: { type: string, format: date }
        desc: { type: string }
        images: { type: integer, description: 图片张数 }
        status: { type: string, enum: [待审核, 已发布, 已驳回, 已下架, 已过期, 已成交] }
        rejectReason: { type: string, description: 原样返回，不要概括 }
        offlineReason: { type: string }
        offlineAt: { type: string }
        auditAt: { type: string }
        createdAt: { type: string }
        expireAt: { type: string, description: 60 天到期 }
        daysLeft: { type: integer, description: '距到期天数；负数 = 已过期' }
        viewCount: { type: integer, description: 详情页浏览数（仅业主自己可见） }
        leadCount: { type: integer, description: 看房请求数（仅业主自己可见） }
        contentVersion: { type: integer }
        auditedVersion: { type: integer, description: '相等 = 内容未改，续挂免审' }
        canOffline: { type: boolean }
        canRenew: { type: boolean }
        canDeal: { type: boolean }

    MpListingEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MpListing' }

    MpListingListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/MpListing' }
                total: { type: integer }

    MpListingRequest:
      type: object
      required: [houseId, type, price]
      description: |
        只收这些。面积 / 户型 / 朝向 / 楼层**一律从房屋档案派生** ——
        收进来就会出现"业主把 89㎡ 写成 120㎡"的纠纷，而物业没有能力逐条核。
      properties:
        houseId: { type: string, description: 发布时必填；编辑时忽略（换房等于换一条挂牌） }
        type: { type: string, enum: [出租, 出售] }
        price: { type: number, minimum: 500, maximum: 100000, description: 明显异常的定价也会被驳回 }
        deposit: { type: number, description: 空则同 price }
        payTerm: { type: string, enum: [押一付一, 押一付三, 押二付一, 半年付, 年付] }
        decorate: { type: string, enum: [毛坯, 简装, 精装, 豪装] }
        facilities:
          type: array
          items: { type: string }
        availableFrom: { type: string, format: date }
        desc: { type: string, maxLength: 300 }
        images: { type: integer, minimum: 0, maximum: 9 }

    # ---------------- 租售信息（A 域 · 第 69 批） ----------------

    ListingPublic:
      type: object
      description: |
        **对外视图**。只有这些字段会出现在免登录接口里。
        刻意不含：`room`（房号）、`houseShort`、`ownerId/ownerName/ownerPhone`、
        `stewardPhone`、`stewardEmpId`。边界靠字段白名单，不靠前端不显示。
      required: [listingId, communityName, houseType, area, price, status]
      properties:
        listingId: { type: string, example: LS00001 }
        communityId: { type: string }
        communityName: { type: string, example: 翡翠城 }
        buildingName: { type: string, description: 只到楼栋，不含单元与门牌 }
        houseType: { type: string, description: 从房屋档案派生，业主改不了 }
        area: { type: number, description: 建筑面积，派生 }
        orientation: { type: string }
        floor: { type: integer }
        price: { type: number, description: 元/月 }
        deposit: { type: number }
        payTerm: { type: string, enum: [押一付一, 押一付三, 押二付一, 半年付, 年付] }
        decorate: { type: string, enum: [毛坯, 简装, 精装, 豪装] }
        facilities:
          type: array
          items: { type: string }
        availableFrom: { type: string, description: 可入住日期 }
        desc: { type: string }
        images: { type: integer, description: 图片张数（原型不存图） }
        status: { type: string, enum: [已发布] }
        stewardName: { type: string, description: 责任楼管姓名；对外只给姓名与微信 }
        stewardWechat: { type: string, description: 员工自维护，没填就是空串 }
        stewardQrUrl: { type: string, description: 二维码图片；没传就是空串 }

    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingPublic'
        - type: object
          description: 后台视图，多出房号、产权人与审核轨迹
          properties:
            status:
              type: string
              enum: [待审核, 已发布, 已驳回, 已下架, 已过期, 已成交]
            statusType: { type: string, description: 前端标签色 }
            houseId: { type: string }
            houseShort: { type: string, description: P01-011-0101，仅后台 }
            room: { type: string, description: 房号，仅后台 }
            ownerId: { type: string }
            ownerName: { type: string }
            ownerPhone:
              type: string
              description: '列表脱敏（138****8001）；详情回完整号码 —— 审核要打给业主'
            stewardEmpId: { type: string }
            stewardPosition: { type: string }
            contentVersion: { type: integer, description: 内容版本号，改价改图即 +1 }
            auditedVersion: { type: integer, description: 审核通过的版本；两者不等才需再审 }
            needAudit: { type: boolean }
            createdAt: { type: string }
            hoursWaiting: { type: integer, description: 距提交过的小时数 }
            overdue: { type: boolean, description: 待审核且超 24 小时 → 已升级 }
            escalated: { type: boolean, description: 超 48 小时 }
            expireAt: { type: string, description: 发布后 60 天 }
            dealAt: { type: string }
            auditBy: { type: string }
            auditAt: { type: string }
            rejectReason: { type: string, description: 驳回理由，业主可见 }
            offlineBy: { type: string }
            offlineAt: { type: string }
            offlineReason: { type: string }
            viewCount: { type: integer }
            leadCount: { type: integer, description: 看房请求条数 }
            viewings:
              type: array
              description: 仅详情返回
              items: { $ref: '#/components/schemas/ListingViewing' }

    ListingViewing:
      type: object
      description: |
        看房请求。**没有 `visitorUserId`** —— 不建账号，只留一个号码。
        对外承诺「24 小时内联系」；48 小时未联系升楼管的直属上级。
      required: [viewingId, listingId, name, phone, status]
      properties:
        viewingId: { type: string, example: VW00001 }
        listingId: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        buildingName: { type: string }
        houseType: { type: string }
        area: { type: number }
        price: { type: number }
        name: { type: string }
        phone:
          type: string
          description: '列表脱敏；详情回完整号码（楼管要打这个电话）'
        preferredTime: { type: string, enum: [工作日白天, 工作日晚上, 周末] }
        note: { type: string }
        status: { type: string, enum: [待联系, 已联系, 已带看, 已关闭] }
        statusType: { type: string }
        createdAt: { type: string }
        hoursWaiting: { type: integer }
        overdue: { type: boolean, description: 超 24 小时未回拨 }
        escalated: { type: boolean, description: 超 48 小时 }
        stewardEmpId: { type: string }
        stewardName: { type: string }
        handledBy: { type: string }
        handledAt: { type: string }
        resultNote: { type: string }
        promise: { type: string, description: 仅创建时返回，前端原样展示 }
        privacy: { type: string, description: 仅创建时返回，号码用途与保留期限 }

    ListingViewingInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 20 }
        phone: { type: string, pattern: '^1\d{10}$' }
        preferredTime: { type: string, enum: [工作日白天, 工作日晚上, 周末] }
        note: { type: string, maxLength: 100 }

    ListingStats:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        escalated: { type: integer }
        published: { type: integer }
        rejected: { type: integer }
        offline: { type: integer }
        expired: { type: integer }
        dealt: { type: integer }
        viewingPending: { type: integer }
        viewingOverdue: { type: integer }
        viewTotal: { type: integer }

    ListingViewingStats:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        overdue: { type: integer }
        contacted: { type: integer }
        visited: { type: integer }
        closed: { type: integer }

    ListingPublicEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListingPublic' }

    ListingPublicListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/ListingPublic' }
                total: { type: integer }

    ListingEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Listing' }

    ListingListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/Listing' }
                total: { type: integer }

    ListingViewingEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListingViewing' }

    ListingViewingListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/ListingViewing' }
                total: { type: integer }

    ListingStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListingStats' }

    ListingViewingStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ListingViewingStats' }

    MyContact:
      type: object
      required: [empId, name, wechatId, contactQrUrl]
      description: |
        对外联系方式（租售信息页展示给看房者）。
        **没有手机号字段** —— 手机号只在内部通讯录里，对外展示是另一回事。
      properties:
        empId: { type: string }
        name: { type: string }
        position: { type: string }
        wechatId: { type: string, description: 可空；空 = 不展示微信号 }
        contactQrUrl: { type: string, description: 可空；空 = 不展示二维码 }

    MyContactEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MyContact' }

    # ---------------- 系统参数 / 车位换绑 / 人脸核验（2026-11-11） ----------------

    SystemParam:
      type: object
      description: 一个可配置阈值。`key` 不可改，改了老版本客户端就读不到（小程序做不到强更）
      required: [key, name, value, group]
      properties:
        key: { type: string, example: park.plateChangeLimit }
        name: { type: string, example: 车牌换绑次数 }
        value: { type: string, description: 一律字符串，数值由客户端解析 }
        unit: { type: string, example: 次/月 }
        group: { type: string, enum: [计费, 催缴, 现场, 押金, 导出, 安全, 车位] }
        desc: { type: string }

    ParkingChangeLog:
      type: object
      description: |
        一条换绑留痕。`source` 三档里只有「物业重置」是**不改车牌**的计数操作，
        所以 `fromPlate` / `toPlate` 都为空 —— 客户端的渲染要按 `source` 分支，不能一律画成箭头。
      required: [logId, parkId, source, at]
      properties:
        logId: { type: string, example: PL00001 }
        parkId: { type: string, example: PK00115 }
        parkNo: { type: string, example: B1-115 }
        fromPlate: { type: string, description: 重置记录为空 }
        toPlate: { type: string, description: 解绑与重置记录为空 }
        source: { type: string, enum: [业主自助, 物业代操作, 物业重置] }
        sourceType: { type: string, description: 前端标签色 }
        operatorName: { type: string }
        vendorStatus: { type: string, enum: [待同步, 已同步, 失败], description: 车牌识别系统回执 }
        vendorType: { type: string, description: 前端标签色 }
        at: { type: string }
        reason: { type: string }

    ParkingChanges:
      type: object
      properties:
        parking:
          type: object
          properties:
            parkId: { type: string }
            parkNo: { type: string }
            plateNo: { type: string }
            bindStatus: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ParkingChangeLog' }
        monthChanges: { type: integer, description: 本月已换次数（以最后一次重置为界） }
        limit: { type: integer, description: 来自系统参数 park.plateChangeLimit }
        left: { type: integer, description: 本月还能换几次 }

    FaceRequest:
      type: object
      description: |
        人脸申请单，**唯一真相**。`owners.faceRegistered` / `members.faceStatus` /
        `tenants.faceRegistered` 都是它的投影 —— 派生值可以有，但不能有第二个写入口。
      required: [faceId, subjectType, name, status]
      properties:
        faceId: { type: string, example: FC00003 }
        subjectType: { type: string, enum: [业主, 租客], description: 家属归入「业主」段 }
        ownerId: { type: string }
        memberId: { type: string }
        tenantId: { type: string }
        houseId: { type: string }
        houseShort: { type: string }
        communityId: { type: string }
        communityName: { type: string }
        name: { type: string }
        relation: { type: string, description: 本人 / 配偶 / 子女 / 承租人 … }
        status: { type: string, enum: [待核验, 已生效, 已驳回, 已冻结] }
        statusType: { type: string }
        label: { type: string, description: 业主本人 / 家庭成员 · 配偶 / 租客 · 承租人 }
        submittedAt: { type: string }
        auditAt: { type: string }
        auditBy: { type: string }
        rejectReason: { type: string, description: 业主端原样展示 }
        frozenReason: { type: string }
        guardian: { type: string, description: 代家人录入时的监护人留痕 }
        images: { type: integer, description: 影像件张数（原型不存图） }
        source: { type: string, description: 业主端 / 员工端 / 物业前台 }
        hoursWaiting: { type: integer }
        overdue: { type: boolean, description: 待核验且超 24 小时 }

    FaceRequestStats:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        pendingOwner: { type: integer }
        pendingTenant: { type: integer }
        overdue: { type: integer }
        activated: { type: integer, description: 已生效 }
        rejected: { type: integer }

    SystemParamEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SystemParam' }

    SystemParamListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/SystemParam' }

    ParkingChangesEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ParkingChanges' }

    FaceRequestEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/FaceRequest' }

    FaceRequestListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [rows, total]
              properties:
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/FaceRequest' }
                total: { type: integer }

    FaceRequestStatsEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/FaceRequestStats' }

    # ---------- 费用体系（批 1~6，2026-11-13） ----------
    ThreeRate:
      type: object
      description: 三率报表。identity 不通过时 collectionRate / arrearsRate 不可用。
      required: [from, to, receivable, received, waived, unpaid, collectionRate, identity]
      properties:
        from: { type: string }
        to: { type: string }
        itemId: { type: string }
        itemName: { type: string }
        periods: { type: integer, description: 区间内的账期数 }
        houses: { type: integer }
        receivable: { type: number, description: 'Σ 面积 × 户级单价 × 期数' }
        received: { type: number }
        waived: { type: number }
        unpaid:
          type: number
          description: 应收 − 已收 − 减免。**不减到 0**：负数表示超额收款
        collectionRate: { type: number, description: 已收 ÷ (应收 − 减免)，百分数 }
        arrearsRate: { type: number, description: 1 − 收缴率 }
        prepayRate: { type: number, description: '归属期 > to 的已收 ÷ 应收' }
        prepayReceived: { type: number }
        prepayReceivable: { type: number }
        clearingAmount: { type: number, description: '归属期 < from 的已收（清欠），与预缴分开' }
        cashIncome: { type: number, description: '按收款日落在区间的现金收入' }
        overpaid: { type: integer, description: 未收为负的户数 }
        identity:
          type: object
          description: 自检线。ok=false 时说明矩阵有孤儿流水或某期应收算错了
          properties:
            ok: { type: boolean }
            diff: { type: number }
        byPeriod:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              receivable: { type: number }
              received: { type: number }
              waived: { type: number }
              unpaid: { type: number }
        topDebtors:
          type: array
          items:
            type: object
            properties:
              houseId: { type: string }
              houseName: { type: string }
              receivable: { type: number }
              received: { type: number }
              waived: { type: number }
              unpaid: { type: number }

    ThreeRateEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ThreeRate' }

    IncomeExpenseRow:
      type: object
      properties:
        code: { type: string, description: 分类字典二级编码 }
        name: { type: string }
        parentCode: { type: string }
        parentName: { type: string }
        amount: { type: number }

    IncomeExpense:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        periods: { type: integer }
        incomeTotal: { type: number }
        expenseTotal: { type: number }
        balance: { type: number, description: 收入 − 支出；不含押金（负债） }
        margin: { type: number, description: 结余率，百分数 }
        incomeRows:
          type: array
          items: { $ref: '#/components/schemas/IncomeExpenseRow' }
        expenseRows:
          type: array
          items: { $ref: '#/components/schemas/IncomeExpenseRow' }
        byMonth:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              income: { type: number }
              expense: { type: number }
              balance: { type: number }

    IncomeExpenseEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/IncomeExpense' }

    WaiveAnalysis:
      type: object
      description: 减免分析。金额来自减免流水，不取账单 discount 累计值。
      required: [from, to, total, count, reasons]
      properties:
        from: { type: string }
        to: { type: string }
        total: { type: number }
        count: { type: integer, description: 减免笔数（一张账单分两次减算两笔） }
        houses: { type: integer }
        avg: { type: number, description: 单笔均值 }
        overLimitCount: { type: integer, description: 超过该原因免审额度的笔数 }
        reasons:
          type: array
          items:
            type: object
            properties:
              reasonId: { type: string, description: 空 = 历史数据未登记原因 }
              name: { type: string }
              type: { type: string, description: 政策性 / 个案 / 差错 / 历史 }
              countInAssess: { type: boolean, description: 是否计入考核 }
              approveAbove: { type: number, description: 免审额度；0 表示没有额度线 }
              count: { type: integer }
              houses: { type: integer }
              amount: { type: number }
              share: { type: number, description: 占比，百分数 }
              overLimit: { type: integer }
        byPeriod:
          type: array
          items:
            type: object
            properties:
              period: { type: string }
              count: { type: integer }
              amount: { type: number }
        detail:
          type: array
          description: 金额最大的前 12 笔
          items:
            type: object
            properties:
              houseId: { type: string }
              houseName: { type: string }
              period: { type: string }
              itemName: { type: string }
              amount: { type: number }
              reasonId: { type: string }
              reasonName: { type: string }
              at: { type: string }

    WaiveAnalysisEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/WaiveAnalysis' }

    AgingLive:
      type: object
      description: 实时账龄。分档与 /reports/arrears 一致，但这里不读快照。
      required: [asOf, total, count, rows]
      properties:
        asOf: { type: string, format: date }
        total: { type: number }
        count: { type: integer, description: 欠费账单数 }
        houses: { type: integer }
        rows:
          type: array
          description: 固定 5 档（与 AgingBucket 枚举一致），顺序 未到期 → 0-30天 → 31-90天 → 91-180天 → 180天以上
          items:
            type: object
            properties:
              bucket: { type: string }
              count: { type: integer }
              houses: { type: integer }
              amount: { type: number }
              share: { type: number }
        byCommunity:
          type: array
          items:
            type: object
            properties:
              communityId: { type: string }
              name: { type: string }
              houses: { type: integer }
              amount: { type: number }
        oldest:
          type: array
          description: 欠得最久的 8 笔（催缴从这张表往下打）
          items:
            type: object
            properties:
              billId: { type: string }
              period: { type: string }
              dueDate: { type: string, format: date }
              aging: { $ref: '#/components/schemas/AgingBucket' }
              overdueDays: { type: integer }
              unpaid: { type: number }

    AgingLiveEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AgingLive' }

    DepositLedger:
      type: object
      description: 押金在账。收 = 退 + 扣 + 在账（identity 用全量算）。
      required: [from, to, received, refunded, deducted, balance, identity]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        received: { type: number, description: 期间收取（paidDate 在区间内） }
        refunded: { type: number, description: 期间退还（refundDate 在区间内） }
        deducted: { type: number, description: 期间扣转收入（checkDate 在区间内） }
        balance: { type: number, description: 截至 to 的在账余额 }
        byType:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              count: { type: integer }
              received: { type: number }
              refunded: { type: number }
              deducted: { type: number }
              balance: { type: number }
        identity:
          type: object
          description: 全量恒等式：收 = 退 + 扣 + 在账
          properties:
            received: { type: number }
            refunded: { type: number }
            deducted: { type: number }
            balance: { type: number }
            diff: { type: number }
            ok: { type: boolean }

    DepositLedgerEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DepositLedger' }

    ManualEntry:
      type: object
      properties:
        entryId: { type: string }
        entryNo: { type: string }
        direction: { type: string, enum: [income, expense] }
        categoryCode: { type: string }
        categoryName: { type: string }
        amount: { type: number }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        bizDate: { type: string, format: date }
        objectType: { type: string }
        objectName: { type: string }
        communityId: { type: string }
        source: { type: string, description: '如：增值税及附加 / 支付通道结算' }
        attachment: { type: string }
        reason: { type: string, description: 必填；没有它以后没人说得清这笔钱是哪来的 }
        operator: { type: string }
        status: { type: string, enum: [已入账, 已作废] }
        voidReason: { type: string }
        voidAt: { type: string }
        createdAt: { type: string }

    ManualEntryInput:
      type: object
      required: [direction, categoryCode, amount, period, reason]
      properties:
        direction: { type: string, enum: [income, expense] }
        categoryCode: { type: string, description: 必须是 allowSources 含 manual 的二级分类 }
        amount: { type: number, exclusiveMinimum: 0 }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        bizDate: { type: string, format: date }
        objectType: { type: string }
        objectName: { type: string }
        communityId: { type: string }
        source: { type: string }
        attachment: { type: string }
        reason: { type: string, maxLength: 120 }

    ManualEntryEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ManualEntry' }

    ManualEntryPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/ManualEntry' }
                    total: { type: integer }

    PublicRevenueRow:
      type: object
      description: 合同额 = ownerShare + companyShare，三个数缺一不可
      properties:
        contractId: { type: string }
        contractNo: { type: string }
        name: { type: string }
        communityName: { type: string }
        partyB: { type: string }
        subtype: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        amount: { type: number, description: 合同金额 }
        ownerShare: { type: number, description: 归全体业主的部分 }
        companyShare: { type: number, description: 归物业的服务费，这部分才是公司收入 }
        publicRate: { type: number, description: 归业主比例，百分数 }
        annualOwner: { type: number }
        status: { type: string }

    PublicRevenue:
      type: object
      properties:
        count: { type: integer }
        amount: { type: number }
        ownerShare: { type: number }
        companyShare: { type: number }
        annualOwner: { type: number }
        annualCompany: { type: number }
        avgRate: { type: number }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PublicRevenueRow' }
        byCommunity:
          type: array
          items:
            type: object
            properties:
              communityName: { type: string }
              count: { type: integer }
              amount: { type: number }
              ownerShare: { type: number }
              companyShare: { type: number }
              annualOwner: { type: number }

    PublicRevenueEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PublicRevenue' }

    MeterBillRow:
      type: object
      properties:
        readingId: { type: string }
        houseId: { type: string }
        houseName: { type: string }
        meterNo: { type: string }
        type: { type: string, enum: [水表, 电表] }
        usage: { type: number }
        price: { type: number, description: 按业态取自价目表，取不到则为 0 并进 blocking }
        amount: { type: number }
        mode: { type: string, enum: [meter, card, none] }
        billable: { type: boolean }
        blocking:
          type: array
          description: 必须解决才能出账（未抄表 / 待复核 / 无价）
          items: { type: string }
        info:
          type: array
          description: 说明为什么这行不出账（已推单 / 代充 / 自缴 / 用量为 0）
          items: { type: string }
        billId: { type: string }

    MeterBillPreview:
      type: object
      properties:
        period: { type: string }
        total: { type: integer }
        billableCount: { type: integer }
        amount: { type: number }
        waterUsage: { type: number }
        elecUsage: { type: number }
        billedCount: { type: integer }
        blockingCount: { type: integer }
        blockingTop:
          type: array
          items: { type: string }
        byMode:
          type: object
          properties:
            card: { type: integer }
            none: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/MeterBillRow' }

    MeterBillPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MeterBillPreview' }

    MeterBillResult:
      type: object
      properties:
        period: { type: string }
        count: { type: integer }
        amount: { type: number }
        waterCount: { type: integer }
        elecCount: { type: integer }
        skipped: { type: integer, description: 因未抄/待复核被跳过的户数 }

    MeterBillResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MeterBillResult' }

    # ---------- 第 83 批（2026-11-13） ----------
    WaiveReason:
      type: object
      properties:
        reasonId: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [政策性, 个案, 差错] }
        countInAssess: { type: boolean, description: 是否计入考核（差错纠正常开） }
        needProof: { type: boolean, description: 打开后收银台必须填写依据 }
        scope: { type: string, enum: [全部, 指定项目] }
        communityIds:
          type: array
          items: { type: string }
        approveAbove:
          type: number
          description: 免审额度（元）。超过必须填依据；0 = 不设上限
        enabled: { type: boolean }
        sort: { type: integer }
        desc: { type: string }

    WaiveReasonInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 2, maxLength: 12 }
        type: { type: string, enum: [政策性, 个案, 差错] }
        countInAssess: { type: boolean }
        needProof: { type: boolean }
        scope: { type: string, enum: [全部, 指定项目] }
        communityIds:
          type: array
          items: { type: string }
        approveAbove: { type: number, minimum: 0 }
        enabled: { type: boolean }
        sort: { type: integer }
        desc: { type: string, maxLength: 60 }

    DepositType:
      type: object
      properties:
        typeId: { type: string }
        name: { type: string }
        standardAmount:
          type: number
          description: 标准额。0 = 金额按合同/租约约定，收取时手填
        needDates: { type: boolean, description: 是否需要工期（装修类） }
        needCheck: { type: boolean, description: 是否需要验收（装修 / 履约 / 租约） }
        allowPartial: { type: boolean, description: 能否部分退；false = 一次退清 }
        byQuantity: { type: boolean, description: 按数量收（门禁卡 / 车牌） }
        enabled: { type: boolean }
        sort: { type: integer }
        desc: { type: string }

    DepositTypeInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 12 }
        standardAmount: { type: number, minimum: 0 }
        needDates: { type: boolean }
        needCheck: { type: boolean }
        allowPartial: { type: boolean }
        byQuantity: { type: boolean }
        enabled: { type: boolean }
        sort: { type: integer }
        desc: { type: string, maxLength: 80 }

    Deposit:
      type: object
      description: 押金是负债（LIA_DEPOSIT）；收 = 退 + 扣 + 在账
      properties:
        depositId: { type: string }
        applyNo: { type: string }
        type: { type: string }
        communityId: { type: string }
        houseId: { type: string }
        ownerId: { type: string }
        amount: { type: number }
        quantity: { type: integer }
        paidDate: { type: string, format: date }
        startDate: { type: string, description: 仅 needDates 类型有值 }
        planEndDate: { type: string }
        checkDate: { type: string, nullable: true }
        status:
          type: string
          enum: [在押, 装修中, 已逾期, 待退款, 已退还, 部分扣除, 已没收]
        deductAmount: { type: number }
        deductReason: { type: string }
        refundAmount: { type: number }
        refundDate: { type: string, nullable: true }
        balance: { type: number, description: amount − refundAmount − deductAmount }
        operator: { type: string }
        remark: { type: string }

    DepositInput:
      type: object
      required: [type, houseId, paidDate]
      properties:
        type: { type: string }
        houseId: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        amount:
          type: number
          description: standardAmount = 0 的类型必填；有标准额时按 标准额 × 数量
        paidDate: { type: string, format: date }
        startDate: { type: string, description: needDates 类型必填 }
        planEndDate: { type: string, description: needDates 类型必填 }
        remark: { type: string, maxLength: 120 }

    DepositPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    rows:
                      type: array
                      items: { $ref: '#/components/schemas/Deposit' }
                    total: { type: integer }
                    summary:
                      type: object
                      properties:
                        count: { type: integer }
                        payable: { type: number, description: 收 }
                        paid: { type: number, description: 退 }
                        deduct: { type: number, description: 扣 }
                        unpaid: { type: number, description: 在账 }
                        byType:
                          type: array
                          items:
                            type: object
                            properties:
                              type: { type: string }
                              count: { type: integer }
                              amount: { type: number }
                              balance: { type: number }

    WorkOrderSatisfaction:
      type: object
      description: 未评价（score=0）不计入均值；参评率分母 = 已完工 + 已评价 + 已关闭
      properties:
        total: { type: integer }
        rateable: { type: integer }
        ratedCount: { type: integer }
        unratedCount: { type: integer }
        evalRate: { type: number, description: 百分数 }
        avg: { type: number, description: 平均分，排除未评价 }
        lowCount: { type: integer, description: 1~2 星的单数 }
        dist:
          type: array
          items:
            type: object
            properties:
              score: { type: integer }
              n: { type: integer }
        tags:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              n: { type: integer }
        lowList:
          type: array
          items:
            type: object
            properties:
              woId: { type: string }
              woNo: { type: string }
              score: { type: integer }
              assignee: { type: string }
              evaluate: { type: string }

    Expense:
      type: object
      properties:
        expenseId: { type: string }
        applyNo: { type: string }
        expenseType: { type: string }
        categoryId: { type: string, description: 映射到费用分类字典二级 }
        amount: { type: number, description: 明细合计 }
        happenDate: { type: string, format: date }
        period: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        communityId: { type: string }
        applicant: { type: string }
        status: { type: string, enum: [待付款, 已付款, 审批中, 已驳回] }
        payDate: { type: string, description: 付款日决定归属账期 }
        approvalId: { type: string }
        items:
          type: array
          description: OA 报销明细行（总价 = 单价 × 本次采购数量）
          items:
            type: object
            properties:
              name: { type: string }
              spec: { type: string }
              unit: { type: string }
              needQty: { type: number }
              stockQty: { type: number }
              buyQty: { type: number }
              price: { type: number }
              total: { type: number, description: 服务端计算，不取客户端传值 }
              note: { type: string }

