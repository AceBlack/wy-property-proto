            application/json:
              schema: { $ref: '#/components/schemas/OwnerDetailEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [owners]
      operationId: updateOwnerField
      summary: 修改业主单个字段（内联编辑）
      description: |
        乐观锁：请求需带 `ver`（列表/详情返回的 `_ver`）；与当前版本不一致返回 **409 / 40901**。
        唯一约束：`phone` 在业主档案内不允许重复，冲突返回 **409 / 40902**。
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
